<!DOCTYPE html><html><head><meta charset="utf-8"><title>drive harness</title>
<style>body{background:#0b0e13;color:#e9eef6;font:13px/1.6 Consolas,monospace;padding:14px;white-space:pre}
.ok{color:#4ecdc4}.bad{color:#ff6b6b}</style></head><body><div id="o">running…</div>
<script>
/* ---- 场景常量，值必须和 _app3d.html 里一样 ---- */
const ROAD_W = 3.9;
const LANE = ROAD_W/4;
const T_MIN = -LANE - ROAD_W/2;
const T_MAX = -LANE + ROAD_W/2;
const V_MAX = 36;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

const S = {
  running:true, cruise:false, speed:15, target:15,
  km:0, tSec:0, steer:0, steerIn:0, yaw:0, lat:0, offRoad:0, sliderHold:false,
  capT:0, autoLat:0, autoSide:0
};
const keys = { up:false, down:false, left:false, right:false };
/* cruiseTick 也会用到这两个：车流和字幕出口。驾驶 harness 的 cruise 恒为
   false，但这两个变量必须在 —— 少了就是 ReferenceError，
   整页 58 条断言一条都跑不了，而生成器当时照样报 PASS。 */
let RIDERS = [];
const $ = () => ({ set innerHTML(v){} });

/* ---- 巡航代码（const + cruiseTick），一并切进来 ----
   驾驶块里那行是 `S.steerIn = S.cruise ? cruiseTick(dt) : (keys...)`，
   所以 cruiseTick 属于这段的依赖。顺带好处：手动路径在
   「巡航分支就在旁边」的真实条件下被测，而不是在一个假装没有巡航的页面上。 */
/*__CRUISE__*/

/* ---- 真实驾驶代码，原样抽出来（由 _mkdrive.ps1 从 _app3d.html 里切） ---- */
/*__DRIVE__*/

const L = [];
let bad = 0;
const ok = (c, m) => { L.push((c?'  PASS  ':'  FAIL  ') + m); if(!c) bad++; };
const run = (secs, dt=1/60) => { for (let t=0; t<secs; t+=dt) if (S.running) driveTick(dt); };
// ⚠️ run() 里那个 `if (S.running)` 不是装饰：产品里整段驾驶逻辑就包在这层里
//    （frame() 的 `if (S.running){ … }`）。少了它，「暂停时里程/速度都不动」
//    这类断言在 harness 里根本测不了 —— 而 harness 的结构不忠实于产品，
//    它测出来的东西就不能代表产品。
const reset = () => { S.speed=15; S.target=15; S.tSec=0; S.steer=0; S.steerIn=0; S.yaw=0; S.lat=0; S.offRoad=0;
                      S.cruise=false; S.sliderHold=false; for (const k in keys) keys[k]=false; };

L.push('路面边界：T_MIN=' + T_MIN.toFixed(3) + '  T_MAX=' + T_MAX.toFixed(3) +
       '  宽 ' + (T_MAX-T_MIN).toFixed(2) + 'm（应约等于 ROAD_W ' + ROAD_W + '）');
ok(Math.abs((T_MAX-T_MIN) - ROAD_W) < 0.001, '沥青宽度 = ROAD_W');
ok(T_MIN < 0 && T_MAX > 0, '车初始位置 0 落在沥青内');

L.push('');
L.push('油门 / 刹车（阈值按「速率×时间 − 滑行阻力」算，不是裸的 5.6·t）：');
reset(); keys.up = true;  run(3);
const acc = S.speed;
ok(acc > 26 && acc < 32, '踩 3 秒油门 → ' + acc.toFixed(2) + ' km/h（15+16.8 再减阻力）');
reset(); keys.up = true;  run(5);
ok(S.speed > 30 && S.speed <= V_MAX, '踩 5 秒 → ' + S.speed.toFixed(2) + '，接近上限 ' + V_MAX);
reset(); keys.up = true;  run(30);
ok(S.speed <= V_MAX + 0.001, '一直踩到顶 → ' + S.speed.toFixed(2) + '，不越 ' + V_MAX);
ok(S.speed === V_MAX, '顶速正好是 ' + V_MAX + '，和滑杆 max 一致');

reset(); S.speed = 20; keys.down = true; run(1);
const braked = S.speed;
ok(braked > 5 && braked < 8, '20 刹 1 秒 → ' + braked.toFixed(2) + '（-13 再减阻力）');
reset(); S.speed = 6; keys.down = true; run(3);
ok(S.speed === 0, '从 6 km/h 刹 3 秒 → 停在 ' + S.speed.toFixed(2) + '，不倒着走');

reset(); S.speed = 20; run(4);
ok(S.speed < 20 && S.speed > 15, '松手滑行 4 秒 → ' + S.speed.toFixed(2) + ' km/h（慢慢掉，不是立刻停）');
ok(S.speed < 19.9, '滑行衰减存在但很轻（滚阻+风阻）');

L.push('');
L.push('方向（路很宽，单侧余量约 1.5m 起步，1 秒就打到边了，');
L.push('所以转向手感要在「还在路上」的时候量，边界的另算）：');
reset(); S.speed = 8; keys.right = true; run(0.35);
ok(S.steer > 0.90, '按住右键 0.35 秒 → steer=' + S.steer.toFixed(3) + '（快速到位，不瞬移）');
ok(S.steer < 1.0, 'steer 收敛到 1 不越界');
ok(S.yaw < -0.01, '车头 yaw=' + S.yaw.toFixed(4) + ' 为负 = 往右打（右 = +z）');
ok(S.lat > 0, '横向位置 lat=' + S.lat.toFixed(3) + ' 为正 = 往右走');
ok(Math.abs(S.lat) < Math.abs(T_MAX) + 0.6, '0.35 秒还在路上，没顶边');

reset(); S.speed = 8; keys.left = true; run(0.35);
ok(S.steer < -0.90, '按住左键 → steer=' + S.steer.toFixed(3));
ok(S.yaw > 0.01, '车头 yaw=' + S.yaw.toFixed(4) + ' 为正 = 往左打');
ok(S.lat < 0, '横向位置 lat=' + S.lat.toFixed(3) + ' 为负 = 往左走');

reset(); S.speed = 10; keys.right = true; run(0.3);
keys.right = false; keys.left = true; run(0.6);
ok(S.lat < 0.3, '右打再左打 → lat 回到 ' + S.lat.toFixed(3) + '，能回正');

reset(); S.speed = 10; keys.right = true; run(0.5);
ok(Math.abs(S.lat) > 0.25, '低速 10km/h 打右 0.5 秒 → 横移 ' + S.lat.toFixed(3) + 'm（有实感，不是只动车把）');
reset(); S.speed = 10; keys.right = true; run(0.25);
ok(S.steer > 0.90, '0.25 秒就打满（' + S.steer.toFixed(2) + '），车把响应不迟钝');

reset(); S.speed = 9;  keys.right = true; run(0.2);
const rLow = Math.abs(S.yaw) / 0.2;
reset(); S.speed = 34; keys.right = true; run(0.2);
const rHigh = Math.abs(S.yaw) / 0.2;
L.push('  横摆率：9km/h=' + rLow.toFixed(3) + ' rad/s，34km/h=' + rHigh.toFixed(3) + ' rad/s');
ok(rLow > rHigh * 1.3, '高速横摆明显更沉（低速灵活、高速稳当）');
ok(rHigh < 1.2, '高速横摆 ' + rHigh.toFixed(2) + ' rad/s，不至于一碰就甩');

reset(); run(0.4);
ok(Math.abs(S.steer) < 0.01 && Math.abs(S.lat) < 1e-9, '不按方向 → 方向回正，车走直线');

reset(); S.speed = 0; keys.right = true; run(1.5);
ok(Math.abs(S.lat) < 1e-9, '停着打方向 → 不横移（' + S.lat.toFixed(4) + '）');
ok(S.speed < 0.5, '停着不会自己窜出去（' + S.speed.toFixed(3) + '）');
ok(Math.abs(S.yaw) < 0.01, '停着打方向 → yaw=' + S.yaw.toFixed(4) + '，不在原地打转');
ok(S.steer > 0.85, '停着车把照样能转（' + S.steer.toFixed(2) + '）—— 车把转和车头转是两回事');

reset(); S.speed = 10; keys.right = true; run(0.5); keys.down = true; run(4);
ok(S.speed === 0, '减速到停 → ' + S.speed.toFixed(2) + ' km/h');
const yawAtStop = S.yaw;
ok(Math.abs(yawAtStop) > 0.2, '滚动过程中确实转了（yaw=' + yawAtStop.toFixed(3) + '）');
run(5);
ok(Math.abs(S.yaw - yawAtStop) < 0.01,
   '停稳后 yaw 冻在 ' + S.yaw.toFixed(4) + '（停前 ' + yawAtStop.toFixed(4) + '），不再继续转');

L.push('');
L.push('边界：');
reset(); keys.right = true; run(20);
ok(S.lat <= T_MAX + 0.551, '一路右打 → 停在 lat=' + S.lat.toFixed(3) + '，不冲出（上限 ' + (T_MAX+0.55).toFixed(3) + '）');
ok(S.offRoad > 0.5, '冲出沥青 → offRoad=' + S.offRoad.toFixed(2) + '，确实判定为压草');
ok(S.speed < 20, '压草掉速 → ' + S.speed.toFixed(2) + ' km/h');
ok(S.steer > 0.85, '顶在路肩上仍按住右键 → steer=' + S.steer.toFixed(3) + '（车把保持打向，不弹直）');
ok(Math.abs(S.yaw) < 0.30, '顶边不会原地打转（yaw=' + S.yaw.toFixed(3) + '）');

reset(); keys.left = true; run(20);
ok(S.lat >= T_MIN - 0.551, '一路左打 → 停在 lat=' + S.lat.toFixed(3) + '（下限 ' + (T_MIN-0.55).toFixed(3) + '）');
ok(S.offRoad > 0.5, '左冲出同样判定为压草');
ok(S.steer < -0.85, '顶在另一侧仍按住左键 → steer=' + S.steer.toFixed(3));

reset(); S.lat = 0; run(6);
ok(S.offRoad === 0, '停在路中间 6 秒 → offRoad=0，不误判');

L.push('');
L.push('巡航仍然可用：');
reset(); S.cruise = true; run(20);
ok(S.speed > 6 && S.speed < 34, '开巡航 20 秒 → ' + S.speed.toFixed(2) + ' km/h，在巡航区间内');
ok(S.target === S.speed, '巡航时 target 跟随 speed');
reset(); S.cruise = true; S.speed = 20; run(1);
ok(S.speed > 19, '巡航把速度拉回曲线（' + S.speed.toFixed(2) + '）');

L.push('');
L.push('压草不能死锁（这曾经是最严重的一个 bug）：');
// 场景：车滑到草上、停住、然后踩油门/拖滑杆想重新起步
reset(); S.lat = T_MAX + 0.4; S.offRoad = 1; S.speed = 0;
keys.up = true; run(3);
ok(S.speed > 2, '草上停住后踩油门 3 秒 → ' + S.speed.toFixed(2) + ' km/h，能重新起步');
ok(S.speed > 0.5, '确实动了（不是原地不动）');
// 起步之后要能打方向回路上
reset(); S.lat = T_MAX + 0.4; S.offRoad = 1; S.speed = 0;
keys.up = true; run(3);
ok(S.speed > 3.5, '草上 3 秒后速度 ' + S.speed.toFixed(2) + ' > 3.5，grip 恢复，能打方向');
keys.up = false; keys.left = true; run(1.5);
ok(S.lat < T_MAX, '往左打 → lat 回到 ' + S.lat.toFixed(3) + '，能回沥青');
// 草的惩罚还在：高速压进去要明显掉速
reset(); S.lat = T_MAX + 0.3; S.offRoad = 1; S.speed = 34; run(2);
const onGrass = S.speed;
reset(); S.lat = 0; S.offRoad = 0; S.speed = 34; run(2);
const onTarmac = S.speed;
L.push('  34 km/h 滑行 2 秒：草上 ' + onGrass.toFixed(2) + ' vs 沥青 ' + onTarmac.toFixed(2));
ok(onGrass < onTarmac - 5, '压草明显更慢（' + onGrass.toFixed(2) + ' vs ' + onTarmac.toFixed(2) + '），草的惩罚还在');
ok(onTarmac > 30, '沥青上只掉滑行阻力（' + onTarmac.toFixed(2) + '）');
// 油门必须任何时候都压得住草阻
let worst = 0;
for (let sp = 0; sp <= V_MAX; sp += 2){
  reset(); S.lat = T_MAX + 0.4; S.offRoad = 1; S.speed = sp;
  keys.up = true; run(1);
  worst = Math.max(worst, S.speed - sp);
}
ok(worst > -0.01, '0~36 全速度区间，油门都能压过草阻（最差净变化 ' + worst.toFixed(3) + '）');

L.push('');
L.push('鼠标滑杆当油门：');
reset(); S.sliderHold = true; S.speed = 20; run(3);
ok(Math.abs(S.speed - 20) < 0.01, '按住滑杆 3 秒 → 速度稳在 ' + S.speed.toFixed(2) + '，不被滑行阻力拽下来');
reset(); S.sliderHold = false; S.speed = 20; run(3);
ok(S.speed < 20, '松开滑杆 → ' + S.speed.toFixed(2) + '，恢复滑行衰减');

/* ═══ 里程：S.km 必须真的随行驶累加，单位是 km ═══
   为什么单独加一节：2026-09-30 发现**七套 harness 没有一套检查过这个**。
   route harness 是直接给 S.km 赋值来测换段的，drive/cruise 只看速度和横向 ——
   于是 `S.km += v*dt/1000` 就算把单位写错（米当公里、忘了 /3.6），
   全部检查照样绿，症状只是屏幕上 DIST 那个数不对。
   那恰恰是骑车人一定会盯的那个数。 */
L.push('');
L.push('里程（S.km）：');
{
  const DT = 1/60, T = 30;
  reset(); S.km = 0; S.speed = 15;
  const k0 = S.km;
  let expect = 0;                       // 逐帧积分，不假设匀速
  for (let t = 0; t < T; t += DT){ driveTick(DT); expect += (S.speed/3.6) * DT / 1000; }
  const got = S.km - k0;
  ok(Math.abs(got - expect) < expect*0.01 + 1e-9,
     '滑行 ' + T + ' 秒：里程 +' + got.toFixed(5) + ' km，和逐帧积分 ' + expect.toFixed(5) + ' 对得上');
  // 量级：15 km/h 上下滑行 30 秒应该在 0.1 km 附近。
  // 漏了 /1000（米当公里）→ 大 1000 倍；忘了 /3.6（km/h 当 m/s）→ 小 3.6 倍。
  ok(got > 0.05 && got < 0.25, '绝对量级对（km 不是 m，km/h 不是 m/s）', got.toFixed(5) + ' km');
  // 把两种具体的单位错误代进去，判据必须都拒绝 —— 数值上把它们明确排除掉
  ok(!(Math.abs(got*1000 - expect) < expect*0.01), '排除：漏了 /1000 会得到 ' + (got*1000).toFixed(2) + ' km');
  ok(!(Math.abs(got/3.6 - expect) < expect*0.01), '排除：忘了 /3.6 会得到 ' + (got/3.6).toFixed(5) + ' km');
  // 停着不动，里程不能自己涨
  reset(); S.speed = 0; S.km = 1.234; driveTick(DT); driveTick(DT);
  ok(S.km === 1.234, '停着不动 → 里程一个字节都不涨', S.km.toFixed(5));
  // 暂停时不涨（km 的累加和 S.km 的其余部分一样挂在 S.running 上）
  reset(); S.speed = 20; S.running = false; const kp = S.km; run(2);
  ok(S.km === kp, '暂停 2 秒 → 里程不涨');
  S.running = true;
}

L.push('');
L.push(bad === 0 ? '全部通过 ✓' : bad + ' 项失败 ✗');
document.getElementById('o').textContent = L.join('\n');
</script></body></html>
