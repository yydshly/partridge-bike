<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover：让内容**铺到刘海/圆角下面**，配合下面 CSS 里的
     env(safe-area-inset-*) 把控件让开。没有它，真全屏时鸟会被刘海挡住、
     屏幕边缘的按钮点不到。
     ⚠️ user-scalable=no 留着：页面自带捏合缩放（_touchharness 量过），
        再叠加浏览器的整页缩放会变成双重缩放、手感全乱。
        它在 iOS 10 之后本来就被忽略，所以留着无害。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<!-- 「全屏运行」在手机上只能靠主屏（standalone）。没有这两组 meta，
     iOS 不会把页面当独立应用，状态栏和工具条永远压在上面。 -->
<meta name="theme-color" content="#0b0e13" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- black-translucent：内容铺到状态栏**下面**，配合 safe-area 留白 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="鹧鸪骑单车" />
<title>鹧鸪骑单车 3D v2 · Partridge on Wheels 3D</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#141922; --panel2:#1b222d; --line:#28303d;
    --fg:#e9eef6; --dim:#8a97a9; --accent:#ffc857; --accent2:#4ecdc4;
    /* 舞台高度算式里的「视口高」。⚠️ 原来写死 100vh，而 100vh 在移动端是
       **地址栏收起时**的最大视口高度：用户往下一滑、地址栏弹出来，
       算出来的舞台就比真正能看见的视口高 —— 于是底下被切掉一截。
       dvh（dynamic viewport height）才是「此刻真的能看见多少」。
       老浏览器不认 dvh，@supports 兜回 100vh。 */
    --appvh:100vh;
  }
  @supports (height:100dvh){ :root{ --appvh:100dvh } }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; padding:16px;
    /* 刘海屏 / 圆角屏：横过来时左右两边会被切掉一块。
       env() 在不支持的环境里算 0，max() 于是退化成原来那个 16px。 */
    padding-left:max(16px, env(safe-area-inset-left));
    padding-right:max(16px, env(safe-area-inset-right));
    background:radial-gradient(1100px 640px at 50% -12%, #1c2733, #080a0e 72%);
    color:var(--fg);
    font:14px/1.5 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  #wrap{width:100%}
  .stage{
    position:relative; margin:0 auto;
    width:min(1280px, 100%, calc((var(--appvh) - 236px) * 16 / 9));
    aspect-ratio:16/9; border-radius:16px; overflow:hidden;
    background:#0b0e12; border:1px solid var(--line);
    box-shadow:0 28px 70px -24px #000c, 0 0 0 1px #ffffff0a inset;
  }
  canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
  canvas.dragging{cursor:grabbing}
  .hud{
    position:absolute; top:12px; right:12px; display:flex; gap:8px;
    padding:8px 10px; border-radius:11px; background:#0b0f16a8; border:1px solid #ffffff1f;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    font-variant-numeric:tabular-nums; pointer-events:none;
  }
  .hud .it{min-width:60px; text-align:right}
  .hud .k{display:block; font-size:10px; color:#9fb0c6; letter-spacing:.14em}
  .hud .v{display:block; font-size:17px; font-weight:700; line-height:1.25}
  .hud .v small{font-size:10px; font-weight:500; color:#8a97a9; margin-left:2px}
  .hint{
    /* 放左上：HUD 在右上（加了 LEAN 之后更宽了），原来居中会跟它撞上 */
    position:absolute; left:14px; top:14px;
    padding:7px 16px; border-radius:999px; pointer-events:none;
    background:#0b0f16a8; border:1px solid #ffffff1a; backdrop-filter:blur(8px);
    font-size:12.5px; color:#cdd8e6; white-space:nowrap; transition:opacity .6s;
  }
  .hint b{color:var(--accent)} .hint.gone{opacity:0}
  .cap{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    max-width:80%; padding:7px 18px; border-radius:999px;
    background:#0b0f16b0; border:1px solid #ffffff1a;
    font-size:clamp(12px,1.3vw,16px); font-weight:700; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-shadow:0 2px 6px #000a; pointer-events:none;
  }
  .cap b{color:var(--accent)} .cap s{color:var(--accent2); text-decoration:none}
  /* 歌词字幕。压在鹧鸪台词上方，两者不重叠也不打架：
     台词是「谁在说话」，歌词是「歌在唱什么」，各自安静。 */
  .lyric{
    position:absolute; left:0; right:0; bottom:62px; padding:0 8%;
    text-align:center; pointer-events:none; opacity:0;
    transition:opacity .5s ease;
    font-size:clamp(15px,1.75vw,22px); font-weight:600; line-height:1.55;
    letter-spacing:.10em; color:#f2f6fc;
    text-shadow:0 2px 12px #000d, 0 0 34px #000a, 0 1px 2px #000;
  }
  .lyric.on{opacity:1}
  /* 侧边小框的**壳**。平时 display:contents —— 壳不进盒树，
     于是 .lyric 的包含块仍然是 .stage，上面那几条定位和窄屏覆盖一字不用改。
     真正变成盒子是在电影模式下面那几条（.cin .sidebox）。 */
  .sidebox{display:contents}
  .sb-t{display:none}
  .panel{
    width:min(1280px,100%); margin:12px auto 0; padding:12px 14px;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line); border-radius:14px;
    display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center;
  }
  .grp{display:flex; align-items:center; gap:8px}
  .grp > label{color:var(--dim); font-size:12px; letter-spacing:.06em; white-space:nowrap}
  button{
    font:inherit; font-weight:600; color:var(--fg); cursor:pointer;
    background:#232c39; border:1px solid #33404f; border-radius:9px;
    padding:7px 13px; transition:.14s;
  }
  button:hover{background:#2c3746; border-color:#46566a}
  button.on{background:linear-gradient(180deg,#ffd98a,#f5b942); color:#2a1e05; border-color:#f0bd55}
  button.icon{min-width:44px; font-size:15px; line-height:1}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:150px; height:4px; border-radius:99px;
    background:linear-gradient(90deg,var(--accent2),var(--accent)); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#fff; border:3px solid #223040; cursor:pointer; box-shadow:0 2px 6px #0008;
  }
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #223040;cursor:pointer}
  .val{color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; min-width:56px; font-size:13px}
  .spacer{flex:1}
  /* 压弯指示：一个小摆锤跟着车头倾角摆 */
  .hud .lean .bar{position:relative; display:block; width:34px; height:3px; border-radius:99px;
                  background:#ffffff2e; margin-top:7px; overflow:visible}
  .hud .lean .bar i{position:absolute; left:50%; top:-3px; width:9px; height:9px; margin-left:-4.5px;
                    border-radius:50%; background:var(--accent); box-shadow:0 0 6px #0009;
                    transition:transform .05s linear}
  .tip{color:#6d7a8c; font-size:12px; white-space:nowrap}
  kbd{background:#232c39;border:1px solid #3a4757;border-bottom-width:2px;border-radius:5px;
      padding:1px 6px; font:600 11px/1.6 ui-monospace,Consolas,monospace; color:#b9c6d6}
  #err{display:none; margin:10px auto 0; width:min(1280px,100%); padding:10px 14px;
       border:1px solid #7f2b2b; background:#2a1414; border-radius:10px; color:#ffb4b4; font-size:13px}

  /* ══════════════ 窄屏 / 触屏适配 ══════════════
     在这之前整个项目一条 @media 都没有：手机上那 24 个按钮照桌面排版挤成一团，
     而且提示语写的是鼠标（🖱 拖拽 / 滚轮 / 右键），触屏上这三样有两样根本不存在。
     「窄」和「矮」分开处理 —— 手机横屏是 852×390 又宽又矮，只卡 max-width 会整个漏掉。 */
  .h-mob{display:none}

  @media (max-width:820px){
    body{padding:8px}
    /* ⚠️ 这两行不能省。上面 body{} 里写的 padding-left/right:max(16px,env(...))
       是被这里的 `padding:8px` **shorthand 整个重置掉**的 —— 媒体查询不加优先级，
       后写的赢。而手机恰恰是 env(safe-area-inset-*) 真正非 0 的地方（刘海屏横过来
       两侧要留），只写桌面那一份等于在唯一用得上的场景里失效。
       顺带一提：桌面浏览器里 env() 恒为 0，所以**这个洞在桌面和 harness 上都测不出来**
       （_touchharness 的 390/852 视口是桌面 Chrome，env() 给 0，量的是 8px 而不是 inset）。 */
    body{padding-left:max(8px, env(safe-area-inset-left));
         padding-right:max(8px, env(safe-area-inset-right))}
    /* 去掉 (100vh - 236px) 那个桌面假设：236 是桌面面板的实测高度，
       手机上真实面板高得多，照抄会把舞台挤成一条线。窄屏改成整幅宽 + 页面滚动。 */
    .stage{width:100%}
    /* HUD 拉成整条横幅，提示条放到它**下面**，各自占满宽度。
       原来是 HUD 右上、提示条左上，两者在中间抢地方 —— 我第一版用
       max-width:calc(100% - 150px) 给 HUD 预留位置，可那个 150 是拍脑袋的：
       390px 屏刚好不撞，360 和 320 就压上了（实测 -6px）。
       改成上下分层之后，不管文案多长、屏幕多窄，都不可能重叠。 */
    .hud{left:8px; right:8px; top:8px; justify-content:space-between; padding:6px 10px}
    .hud .it{min-width:0}
    .hud .v{font-size:15px}
    .h-desk{display:none}
    .h-mob{display:inline}
    .hint{left:8px; right:8px; top:57px; max-width:none; white-space:normal;
          font-size:11.5px; padding:6px 11px; line-height:1.45}
    .cap{bottom:10px; max-width:92%; font-size:13px; padding:6px 13px}
    .lyric{bottom:48px; padding:0 6%; font-size:14px}
    .panel{padding:10px; gap:8px 10px}
    /* 这一条是「挤在一起」的病根：.grp 原来是 nowrap 的一行，
       镜头那 6 个按钮一行放不下就整个撑出面板。 */
    .grp{flex:1 1 auto; min-width:0; flex-wrap:wrap; gap:8px}
    .grp > label{flex:1 0 100%; letter-spacing:.04em}
    .spacer{display:none}
    .tip{display:none}                 /* 全是键盘键位，手机上没意义，也最容易撑破 */
    button{min-height:42px; min-width:44px; padding:9px 14px}   /* 触控目标从 ~30px 提到 42/44px */
    button.icon{min-width:46px; font-size:17px}
    /* 滑杆：把可点区域从 4px 撑到 24px，视觉上仍然只画中间那条 4px 的线 */
    input[type=range]{flex:1 1 110px; min-width:110px; width:auto; height:24px;
      background:linear-gradient(90deg,var(--accent2),var(--accent)) center/100% 4px no-repeat}
    input[type=range]::-webkit-slider-thumb{width:24px; height:24px; border-width:4px}
    input[type=range]::-moz-range-thumb{width:24px; height:24px; border-width:4px}
  }

  /* 矮屏（手机横屏 / 被压扁的桌面窗口）：舞台必须让出高度，
     否则 16:9 的宽度一算出来就把面板顶到屏幕外去了。
     ⚠️ 触控尺寸也必须在这里再写一遍：手机横屏是 852×390，宽度 852 > 820，
        压根进不了上面那段 max-width，只写一份的话横屏按钮还是 31px 高。 */
  @media (max-height:560px){
    body{padding:6px}
    /* 同上：shorthand 之后必须重写长写法。手机横屏（852×390）宽度 852 > 820，
       进不了上面那段，只能靠这里 —— 而横屏恰恰是两侧刘海/圆角最吃紧的姿态。 */
    body{padding-left:max(6px, env(safe-area-inset-left));
         padding-right:max(6px, env(safe-area-inset-right))}
    .stage{width:min(100%, calc((var(--appvh) - 108px) * 16 / 9))}
    .panel{padding:8px 10px; gap:6px 10px}
    .hint{display:none}                /* 横着本来就窄，提示条会和 HUD 抢地方 */
    button{min-height:42px; min-width:44px}
  }

  /* ══════════════ 电影模式 ══════════════
     全屏 + 藏起界面，只留画面；动一下鼠标/手指，界面淡回来，2.6 秒后再淡出。
     全屏和「藏界面」是**两件独立的事**：浏览器规定 requestFullscreen 只能
     在用户手势里调用，而 iframe（harness 就是）除非 allow="fullscreen"
     永远进不去全屏。所以电影模式不能挂在全屏成功与否上 ——
     全屏失败也要照样藏界面，否则一进 iframe 就整个功能失效。 */

  /* 淡出淡入要能看见，.hud 原来没有 transition */
  .hud{transition:opacity .45s ease}

  .cin body{padding:0}
  .cin #wrap{height:100%}
  .cin .panel, .cin #err{display:none}
  .cin .stage{
    width:100%; height:var(--appvh); max-width:none;
    aspect-ratio:auto; border-radius:0; border:0; box-shadow:none;
  }
  .cin .hud, .cin .hint{opacity:0}
  .cin.over .hud, .cin.over .hint{opacity:1}
  /* 隐藏时别再吃掉手势：hud/hint 本来就是 pointer-events:none，
     面板才是真正需要关掉点击目标的那些，已经 display:none 了。 */
  /* ⚠️ 台词(.cap)和歌词(.lyric)**故意留着** —— 它们是内容不是界面：
     藏掉它们画面就只剩一只鸟在骑，「鹧鸪」这个角色的性格全没了。
     想连它们一起藏，把上面两行加上 .cin .cap, .cin .lyric 即可。 */

  /* ── 电影模式下的极简控制条 ─────────────────────────────
     面板整个藏起来之后，切歌/自动循环/播放不能跟着一起没 ——
     沉浸不是把功能丢了，是把它们挪到一个不挡画面的地方。
     跟着 .over 一起淡入淡出：不动就自己藏起来，那才是「沉浸」。
     pointer-events 也跟着走：不然一条看不见的浮条会躺在画面正中下方，
     把「拖镜头」的手势全吃掉（它在 .stage 里，压在路面上）。 */
  .cinebar{
    display:none; position:absolute; left:20px; bottom:20px;
    gap:7px; align-items:center; padding:7px 11px;
    background:#0b0f16b8; border:1px solid #ffffff1a; border-radius:999px;
    backdrop-filter:blur(7px);
    opacity:0; transition:opacity .45s ease; pointer-events:none;
  }
  .cin .cinebar{display:flex}
  .cin.over .cinebar{opacity:1; pointer-events:auto}
  /* H —— 连浮条和侧边框一起藏，只剩画面和台词。 */
  .cin.bare .cinebar, .cin.bare .sidebox{display:none}
  .cb{min-width:38px; min-height:32px; padding:4px 10px; font-size:13px; line-height:1; border-radius:999px}
  .cb.wide{min-width:auto; padding:4px 12px}
  .cb.on{background:var(--accent); color:#08131f; border-color:transparent}

  /* ── 侧边小框：曲名 + 歌词 ──────────────────────────────
     面板藏了以后，这是唯一能看见「现在放的是哪首」的地方
     （曲名原来只写在面板的 #hBgm 上，面板一藏就没了）。
     .lyric 本身在里面被改成 position:static，位置完全交给这个壳。
     ⚠️ 放在**右下角**，不放在右侧正中：竖着摆在正中会横穿画面、
        一直挡着鹧鸪骑行的视线（第一次做就是这么放的，看一眼就发现挡）。
        浮条相应挪到左下角 —— 底部于是分成
        「左浮条 / 中台词 / 右侧边框」三块，谁也不压谁。 */
  .cin .sidebox{
    display:block; position:absolute;
    right:max(20px, env(safe-area-inset-right));
    bottom:20px;
    width:min(280px, 30vw); padding:12px 16px;
    background:#0b0f16a6; border:1px solid #ffffff1a; border-radius:14px;
    backdrop-filter:blur(7px); pointer-events:none;
  }
  .cin .sb-t{
    display:block; font-size:12.5px; font-weight:700; color:var(--accent);
    letter-spacing:.05em; margin-bottom:6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cin .lyric{
    position:static; left:auto; right:auto; bottom:auto; transform:none;
    padding:0; text-align:left; font-size:15px; line-height:1.7; letter-spacing:.04em;
  }
  /* 窄屏/矮屏：侧边框会吃掉半个画面，所以缩窄，字号跟着降。
     竖屏（≤820 宽）例外：390px 装不下「左浮条 + 右侧边框」并排
     （256 + 210 = 466 > 390），所以竖屏把侧边框放回**右上角**，底下留给浮条。
     横屏（852×390）放得下，仍在右下角。
     电影模式的规则写在媒体查询**之后**，所以这里必须重新写一遍 ——
     光靠前面那两条 max-width 覆盖不到它们。 */
  @media (max-width:820px){
    .cin .sidebox{ width:min(210px, 52vw); right:max(10px, env(safe-area-inset-right));
                   top:66px; bottom:auto; padding:9px 12px }
    .cin .lyric{font-size:13.5px; line-height:1.6}
    .cin .sb-t{font-size:11px; margin-bottom:4px}
    /* ⚠️ 竖屏上浮条（256px 宽，占 390 的三分之二）和居中台词**必然**撞上：
       实测台词 x 97–294、浮条 x 114–370，重叠 180×23px。
       台词是内容，被控件压住等于半藏不藏。所以竖屏把台词抬到浮条上面。
       横屏（852×390）不归这条管 —— 那里台词窄、浮条靠右，本来就错开。 */
    .cin .cap{bottom:78px}
  }
  @media (max-height:560px){
    .cin .sidebox{ bottom:10px; width:min(190px, 32vw); padding:7px 11px }
    .cin .lyric{font-size:12.5px; line-height:1.55}
    .cin .sb-t{font-size:10.5px; margin-bottom:3px}
    .cin .cinebar{left:12px; bottom:10px; padding:5px 8px; gap:5px}
    .cb{min-width:34px; min-height:28px; font-size:12px; padding:3px 8px}
  }
</style>
</head>
<body>
<div id="wrap">
  <div class="stage" id="stage">
    <canvas id="scene"></canvas>
    <div class="hud">
      <div class="it"><span class="k">SPEED</span><span class="v" id="hSpeed">15<small>km/h</small></span></div>
      <div class="it"><span class="k">CADENCE</span><span class="v" id="hCad">0<small>rpm</small></span></div>
      <div class="it"><span class="k">DIST</span><span class="v" id="hDist">0.00<small>km</small></span></div>
      <div class="it lean"><span class="k">LEAN</span><span class="bar"><i id="hLean"></i></span></div>
    </div>
    <div class="hint" id="hint"><span class="h-desk">🖱 <b>拖拽</b> 环绕 · <b>滚轮</b> 缩放 · <b>右键</b> 平移</span><span class="h-mob">👆 <b>拖</b>环绕 · <b>捏合</b>缩放 · <b>双指</b>平移</span></div>
    <!-- 侧边小框。平时 display:contents（壳在盒树里等于不存在），
         所以 .lyric 的包含块仍然是 .stage、位置和以前一模一样；
         只有电影模式才把这个壳变成右边那个真盒子。
         ⚠️ 里面放的是**原有的那个 .lyric**，不是新写一份 ——
         另开一个元素写同一句歌词，屏幕上就会同时出现两句。 -->
    <div class="sidebox" id="sidebox">
      <div class="sb-t" id="sbTitle">还没放歌</div>
      <div class="lyric" id="lyric"></div>
    </div>
    <!-- 电影模式专用。面板整个藏起来之后，切歌/自动循环/播放不能跟着一起没 ——
         沉浸不是把功能丢了，是把它们挪到一个不挡画面的地方。
         默认 display:none，只有 .cin 打开时才出现。 -->
    <div class="cinebar" id="cinebar">
      <button id="cPlay" class="cb" title="播放 / 暂停（M）">▶</button>
      <button id="cPrev" class="cb" title="上一首（B）">◀</button>
      <button id="cNext" class="cb" title="下一首（N）">▶</button>
      <button id="cAuto" class="cb wide" title="每 3 分钟自动换一首">自动</button>
      <button id="cBare" class="cb" title="H — 连这些也藏掉，只留画面">⤢</button>
    </div>
    <div class="cap" id="cap">鹧鸪：今天也是<strong>慢慢骑</strong>的一天</div>
  </div>

  <div class="panel">
    <div class="grp">
      <button class="icon" id="bPlay" title="空格">⏸</button>
      <button id="bReset">重置</button>
      <button id="bCinema" title="F — 全屏 + 藏起面板，只留画面；动一下鼠标界面就回来">⛶ 电影模式</button>
      <button id="bDir" title="按分镜表自动巡游六段：每镜自己配时段、天气和机位。按 Esc 退出">🎬 导演模式</button>
    </div>
    <div class="grp">
      <label>速度</label>
      <input type="range" id="rSpeed" min="0" max="36" step="0.5" value="15" />
      <span class="val" id="vSpeed">15.0 km/h</span>
    </div>
    <div class="grp"><button id="bCruise">自动巡航</button></div>
    <div class="grp">
      <label>镜头</label>
      <button class="on" id="bSpin">自动环绕</button>
      <button id="bFollow">锁定跟拍</button>
      <button id="bFront">正面</button>
      <button id="bBack">背面</button>
      <button id="bBird">鸟特写</button>
      <button id="bBike">车身特写</button>
    </div>
    <div class="grp">
      <label>时段</label>
      <button class="on" id="t_day">白天</button>
      <button id="t_dusk">黄昏</button>
      <button id="t_night">夜晚</button>
    </div>
    <div class="grp">
      <label>天气</label>
      <button class="on" id="w_clear">晴</button>
      <button id="w_rain">雨</button>
      <button id="w_snow">雪</button>
      <button id="w_fog">雾</button>
    </div>
    <div class="grp">
      <label>音乐</label>
      <button id="bPrev" title="上一首">◀</button>
      <button id="bBgm" title="播放 / 暂停">⏸</button>
      <button id="bNext" title="下一首">▶</button>
      <input type="range" id="rBgm" min="0" max="100" step="1" value="50" title="音乐音量" />
      <button id="bAuto" title="每 3 分钟自动换一首">自动</button>
      <span class="val" id="hBgm">点一下画面开始</span>
    </div>
    <div class="grp">
      <label>声音</label>
      <button id="bSound">🔇 静音</button>
      <button id="bVoice" title="鹧鸪叫声，默认关闭">🔇 鸟鸣</button>
    </div>
    <div class="spacer"></div>
    <button id="bRec" title="录 10 秒。出来的视频**没有声音** —— 音乐走的是另一条通道（&lt;audio&gt;），进不了录像；要带声音是另一件单独的活。切走标签页会自动收尾">● 录 10 秒</button>
    <button id="bShot">保存当前帧 PNG</button>
    <span class="tip"><b>拖速度滑杆</b> 加速 · <kbd>A</kbd><kbd>D</kbd> 打方向 · <kbd>W</kbd><kbd>S</kbd> 加速刹车 · <kbd>N</kbd><kbd>B</kbd> 切歌 · <kbd>空格</kbd> 播放 · <kbd>F</kbd> 电影模式 · <kbd>H</kbd> 纯画面</span>
  </div>
  <div id="err"></div>
</div>

<script>/*__THREE__*/</script>
<script>
(() => {
'use strict';

const errBox = document.getElementById('err');
function fatal(msg){
  errBox.style.display = 'block';
  errBox.textContent = '3D 初始化失败：' + msg;
  console.error(msg);
}
if (typeof THREE === 'undefined') return fatal('Three.js 未加载');

const stage = document.getElementById('stage');
const cv    = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(47, 16/9, 0.05, 600);

/* ══════════════════ procedural textures ══════════════════ */
function cvs(w,h,draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
let seed = 20260929;
const rnd = () => (seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296;
const rr  = (a,b) => a + rnd()*(b-a);

/* These three are used by the roadside-prop builder, which runs when BANDS
   fills the recycling list — so they have to exist before that, not after. */
const V = (x,y,z) => new THREE.Vector3(x,y,z);
function mesh(geo, mat, cast = true){
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast; m.receiveShadow = true;
  return m;
}
function tube(a, b, r, mat, seg = 10){
  const len = a.distanceTo(b);
  const m = mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  const d = new THREE.Vector3().subVectors(b, a);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(V(0,1,0), d.clone().normalize());
  return m;
}
function tubeTaper(a, b, r1, r2, mat, seg = 10){
  const len = a.distanceTo(b);
  const m = mesh(new THREE.CylinderGeometry(r2, r1, len, seg), mat);
  const d = new THREE.Vector3().subVectors(b, a);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(V(0,1,0), d.clone().normalize());
  return m;
}

/* ── road: aggregate, tar seams, patches, edge lines, dashed centre ── */
const roadTex = cvs(512,512,(g,w,h)=>{
  g.fillStyle = '#4a5058'; g.fillRect(0,0,w,h);
  for (let i=0;i<9000;i++){
    const v = 58+rnd()*56|0;
    g.fillStyle = `rgba(${v},${v+4},${v+10},${0.25+rnd()*0.4})`;
    g.fillRect(rnd()*w, rnd()*h, 1+rnd()*2, 1+rnd()*2);
  }
  // worn patches
  for (let i=0;i<7;i++){
    g.fillStyle = `rgba(${rnd()<0.5?40:96|0},${rnd()<0.5?44:100|0},${50|0},0.10)`;
    g.beginPath();
    g.ellipse(rnd()*w, rnd()*h, 40+rnd()*70, 26+rnd()*50, rnd()*3, 0, 7);
    g.fill();
  }
  // tar crack seams
  g.strokeStyle = 'rgba(28,30,34,0.55)'; g.lineWidth = 2.4;
  for (let i=0;i<5;i++){
    g.beginPath();
    let x = rnd()*w, y = rnd()*h;
    g.moveTo(x,y);
    for (let k=0;k<7;k++){ x += (rnd()-0.5)*70; y += (rnd()-0.5)*70; g.lineTo(x,y); }
    g.stroke();
  }
  // NOTE: no lane markings here. The paint lives in the geometry below, not in
  // this texture — paint baked into a tiling texture cannot move independently
  // of the tarmac, and a frozen centre line kills the whole sense of speed.
  // grime, wear and aggregate only
  for (let i=0;i<1400;i++){
    g.fillStyle = `rgba(60,64,70,${rnd()*0.30})`;
    g.fillRect(rnd()*w, rnd()*h, 1+rnd()*3, 1+rnd()*2);
  }
});
roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping;
roadTex.repeat.set(40, 1);

const grassTex = cvs(128,128,(g,w,h)=>{
  g.fillStyle = '#5f9a33'; g.fillRect(0,0,w,h);
  for (let i=0;i<4200;i++){
    g.fillStyle = `rgba(${74+rnd()*66|0},${118+rnd()*64|0},${40+rnd()*48|0},.5)`;
    g.fillRect(rnd()*w, rnd()*h, 1+rnd()*2, 1+rnd()*2);
  }
});
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
grassTex.repeat.set(150, 97);   // 跟着 GROUND_W 200→460 等比放大，保持草的密度

const roughTex = cvs(64,64,(g,w,h)=>{
  g.fillStyle='#c4c4c4'; g.fillRect(0,0,w,h);
  for(let i=0;i<1200;i++){ const v=150+rnd()*90|0; g.fillStyle=`rgba(${v},${v},${v},.5)`; g.fillRect(rnd()*w,rnd()*h,2,2); }
});
roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;
roughTex.repeat.set(40, 1);

/* 藤编车筐。原来就是一个裸 BoxGeometry(0.17,0.13,0.24)，从侧面看是一坨方疙瘩。
   改成底板 + 竖篾 + 三道横箍 + 四边沿条 + 提手，篾子之间留缝才是「编」的。 */
function wickerBasket(w, h, d){
  const g = new THREE.Group();
  const lite = am(0xc08a4c, 0.9), drk = am(0x8f6231, 0.92);
  const bt = mesh(new THREE.BoxGeometry(w, 0.013, d), drk);
  bt.position.y = -h/2; g.add(bt);
  const NV = 7, NH = 3;
  for (let i = 0; i < NV; i++){                    // 竖篾
    const x = -w/2 + w*i/(NV-1);
    for (const sz of [1,-1]){
      const v = mesh(new THREE.BoxGeometry(0.010, h, 0.010), lite);
      v.position.set(x, 0, sz*(d/2 - 0.005)); g.add(v);
    }
  }
  for (let j = 0; j < NH; j++){                    // 横箍，四面各一根
    const y = -h/2 + h*(j + 0.5)/NH;
    for (const [bw, bd, ox, oz] of [[w, 0.009, 0, d/2-0.005], [w, 0.009, 0, -d/2+0.005],
                                     [0.009, d, w/2-0.005, 0], [0.009, d, -w/2+0.005, 0]]){
      const b = mesh(new THREE.BoxGeometry(bw, 0.009, bd), lite);
      b.position.set(ox, y, oz); g.add(b);
    }
  }
  for (const [bw, bd, ox, oz] of [[w+0.018, 0.020, 0, d/2+0.004], [w+0.018, 0.020, 0, -d/2-0.004],
                                   [0.020, d+0.010, w/2+0.004, 0], [0.020, d+0.010, -w/2-0.004, 0]]){
    const r = mesh(new THREE.BoxGeometry(bw, 0.020, bd), drk);   // 边沿
    r.position.set(ox, h/2, oz); g.add(r);
  }
  const hd = new THREE.Mesh(new THREE.TorusGeometry(w*0.30, 0.009, 5, 12, Math.PI), drk);
  hd.position.set(0, h/2, 0); hd.rotation.y = Math.PI/2; g.add(hd);   // 提手
  return g;
}

/* 货运木箱。原来也是一块 BoxGeometry(0.52,0.36,0.40)。
   改成底板 + 三层围板 + 四角立柱 + 铁包角 + 两块盖板 + 一卷麻绳。 */
function cargoCrate(w, h, d){
  const g = new THREE.Group();
  const wood = am(0x7d6142, 0.95), wood2 = am(0x5f4a31, 0.95), iron = am(0x767c84, 0.5);
  const bt = mesh(new THREE.BoxGeometry(w, 0.018, d), wood2);
  bt.position.y = -h/2; g.add(bt);
  for (const [bw, bd, ox, oz] of [[w, 0.015, 0, d/2], [w, 0.015, 0, -d/2],
                                   [0.015, d, w/2, 0], [0.015, d, -w/2, 0]]){
    for (let j = 0; j < 3; j++){                   // 围板，层与层之间留缝
      const b = mesh(new THREE.BoxGeometry(bw, h*0.27, bd), wood);
      b.position.set(ox, -h/2 + h*(0.15 + j*0.33), oz);
      g.add(b);
    }
  }
  for (const sx of [1,-1]) for (const sz of [1,-1]){
    const p = mesh(new THREE.BoxGeometry(0.034, h + 0.024, 0.034), wood2);   // 立柱
    p.position.set(sx*(w/2 - 0.016), 0, sz*(d/2 - 0.016)); g.add(p);
    for (const y of [-h*0.32, h*0.32]){                                     // 铁包角
      const c = mesh(new THREE.BoxGeometry(0.044, 0.028, 0.044), iron);
      c.position.set(sx*(w/2 - 0.016), y, sz*(d/2 - 0.016)); g.add(c);
    }
  }
  for (let j = 0; j < 2; j++){                       // 盖板
    const l = mesh(new THREE.BoxGeometry(w*0.49, 0.015, d), wood);
    l.position.set((j - 0.5)*w*0.50, h/2, 0); g.add(l);
  }
  const rope = new THREE.Mesh(new THREE.TorusGeometry(0.032, 0.010, 5, 10), am(0xbfa86a, 1));
  rope.position.set(w*0.20, h/2 + 0.032, d*0.16); rope.rotation.x = Math.PI/2; g.add(rope);
  return g;
}


/* ══ 景片表面贴图 ══════════════════════════════════════════════
   景片原来全是纯色 MeshStandardMaterial，远看是一块块色斑 —— 房子就是个
   白盒子加个红顶。这些贴图**一律画成灰度**：色相继续由 M 里的 color 决定，
   贴图只提供明暗和纹理，这样一张墙皮能同时喂给 plaster / barnRed / cloth。
   另外 BoxGeometry 的六面共用一个 0~1 UV，一张贴图会同时糊在顶面和底面，
   所以每张都做成「四周有边框、中间是重复单元」的样子，糊到顶面也不难看。 */
const rep = (t, x, y) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(x, y); return t; };

/* 墙皮：抹灰的斑驳 + 雨痕 + 细裂纹 */
const wallTex = cvs(256,256,(g,w,h) => {
  g.fillStyle = '#cfcfcf'; g.fillRect(0,0,w,h);
  for (let i=0;i<2600;i++){ const v=176+rnd()*66|0; g.fillStyle=`rgba(${v},${v},${v},.32)`;
    g.beginPath(); g.arc(rnd()*w, rnd()*h, 1+rnd()*7, 0, 7); g.fill(); }
  for (let i=0;i<26;i++){                       // 往下淌的雨痕
    const x = rnd()*w, y0 = rnd()*h*0.7, L = 18+rnd()*70;
    g.fillStyle = `rgba(132,132,132,${0.05+rnd()*0.09})`;
    g.fillRect(x, y0, 1+rnd()*3, L);
  }
  g.strokeStyle='rgba(120,120,120,.34)'; g.lineWidth=1;
  for (let i=0;i<9;i++){ g.beginPath(); let x=rnd()*w,y=rnd()*h; g.moveTo(x,y);
    for(let k=0;k<5;k++){ x+=(rnd()-.5)*34; y+=(rnd()-.5)*34; g.lineTo(x,y);} g.stroke(); }
  g.fillStyle='rgba(110,110,110,.16)'; g.fillRect(0,h-7,w,7);   // 墙脚返潮
});
rep(wallTex, 2, 1.4);

/* 瓦：错缝的瓦垄，每片瓦明度不同，底下压一道阴缝 */
const roofTex = cvs(256,256,(g,w,h) => {
  g.fillStyle = '#8e8e8e'; g.fillRect(0,0,w,h);
  const RH = 26, CW = 34;
  for (let r=0; r*RH < h; r++){
    const off = (r % 2) ? CW/2 : 0;
    for (let c = -1; c*CW < w + CW; c++){
      const x = c*CW + off, y = r*RH, v = 158 + rnd()*74 | 0;
      g.fillStyle = `rgb(${v},${v},${v})`;
      g.beginPath();
      g.moveTo(x, y+RH); g.lineTo(x, y+4);
      g.quadraticCurveTo(x+CW/2, y-6, x+CW, y+4);
      g.lineTo(x+CW, y+RH); g.closePath(); g.fill();
      g.fillStyle = 'rgba(58,58,58,.42)'; g.fillRect(x, y+RH-3, CW, 3);
    }
  }
  for (let i=0;i<700;i++){ const v=140+rnd()*90|0; g.fillStyle=`rgba(${v},${v},${v},.20)`;
    g.fillRect(rnd()*w, rnd()*h, 2, 2); }
});
rep(roofTex, 2.2, 1.2);

/* 木板：竖缝 + 木纹 + 钉子 */
const plankTex = cvs(256,256,(g,w,h) => {
  g.fillStyle = '#c4c4c4'; g.fillRect(0,0,w,h);
  const PW = 42;
  for (let c=0; c*PW < w; c++){
    const v = 176 + rnd()*56 | 0;
    g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(c*PW, 0, PW, h);
    g.fillStyle = 'rgba(74,74,74,.55)'; g.fillRect(c*PW, 0, 2.4, h);   // 板缝
    g.fillStyle = 'rgba(232,232,232,.30)'; g.fillRect(c*PW+2.4, 0, 1.6, h);
    for (let i=0;i<9;i++){                                             // 木纹
      g.strokeStyle = `rgba(126,126,126,${0.10+rnd()*0.16})`; g.lineWidth = 0.8+rnd();
      g.beginPath(); let x = c*PW + 4 + rnd()*(PW-8), y = rnd()*h; g.moveTo(x,y);
      for (let k=0;k<4;k++){ x += (rnd()-.5)*4; y += 14+rnd()*26; g.lineTo(x,y); } g.stroke();
    }
    for (let k=0;k<4;k++){                                              // 钉头
      g.fillStyle = 'rgba(96,96,96,.6)';
      g.beginPath(); g.arc(c*PW+PW/2, 12+k*(h-24)/3, 2.1, 0, 7); g.fill();
    }
  }
});
rep(plankTex, 2, 1);

/* 石：错缝的块石 + 灰缝 */
const stoneTex = cvs(256,256,(g,w,h) => {
  g.fillStyle = '#6e6e6e'; g.fillRect(0,0,w,h);
  const RH = 32;
  for (let r=0; r*RH < h + RH; r++){
    let x = (r % 2) ? -26 : 0;
    while (x < w){
      const bw = 34 + rnd()*40, v = 158 + rnd()*80 | 0;
      g.fillStyle = `rgb(${v},${v},${v})`;
      g.fillRect(x+2, r*RH+2, bw-4, RH-4);
      g.fillStyle = `rgba(255,255,255,${0.05+rnd()*0.10})`;
      g.fillRect(x+2, r*RH+2, bw-4, 3);
      g.fillStyle = 'rgba(40,40,40,.22)';
      g.fillRect(x+2, r*RH+RH-6, bw-4, 4);
      x += bw;
    }
  }
  for (let i=0;i<1500;i++){ const v=120+rnd()*110|0; g.fillStyle=`rgba(${v},${v},${v},.18)`;
    g.fillRect(rnd()*w, rnd()*h, 2, 2); }
});
rep(stoneTex, 2, 1.2);

/* 草垛：交错的干草 */
const baleTex = cvs(128,128,(g,w,h) => {
  g.fillStyle = '#cdc7b4'; g.fillRect(0,0,w,h);
  for (let i=0;i<2600;i++){
    const v = 176 + rnd()*70 | 0;
    g.strokeStyle = `rgba(${v},${v-6},${v-26},.45)`; g.lineWidth = 0.9;
    const x = rnd()*w, y = rnd()*h, a = rr(-0.5,0.5);
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*11, y+Math.sin(a)*11); g.stroke();
  }
  g.strokeStyle='rgba(120,112,84,.5)'; g.lineWidth=3;    // 捆扎绳
  g.beginPath(); g.moveTo(0,h*0.3); g.lineTo(w,h*0.3); g.moveTo(0,h*0.72); g.lineTo(w,h*0.72); g.stroke();
});
rep(baleTex, 2, 1);

/* 筒仓：竖向波纹 + 锈流 */
const siloTex = cvs(256,256,(g,w,h) => {
  g.fillStyle = '#d2d2d2'; g.fillRect(0,0,w,h);
  for (let x=0; x<w; x+=16){
    g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(x, 0, 7, h);
    g.fillStyle = 'rgba(88,88,88,.24)'; g.fillRect(x+8, 0, 4, h);
  }
  for (let i=0;i<5;i++){                      // 环向箍带
    g.fillStyle = 'rgba(104,104,104,.40)'; g.fillRect(0, 20+i*52, w, 5);
  }
  for (let i=0;i<30;i++){                     // 锈流
    const x = rnd()*w, L = 20+rnd()*120;
    g.fillStyle = `rgba(${138+rnd()*30|0},${78+rnd()*24|0},${44+rnd()*20|0},${0.06+rnd()*0.12})`;

});
rep(siloTex, 3, 1);

/* 铁皮：轧花 + 划痕 */
const metalTex = cvs(128,128,(g,w,h) => {
  g.fillStyle = '#c0c0c0'; g.fillRect(0,0,w,h);

  }
  for (let i=0;i<40;i++){ g.strokeStyle=`rgba(120,120,120,${0.06+rnd()*0.12})`; g.lineWidth=0.8;
    g.beginPath(); const x=rnd()*w,y=rnd()*h; g.moveTo(x,y); g.lineTo(x+rr(-20,20), y+rr(-6,6)); g.stroke(); }
});
rep(metalTex, 2, 2);

/* 毛：短毛的成簇纹理。动物原来全是纯色球，贴上这层才不像塑料。 */
const furTex = cvs(256,256,(g,w,h) => {
  g.fillStyle = '#d6d6d6'; g.fillRect(0,0,w,h);
  for (let i=0;i<300;i++){                       // 成簇的毛，柔和的明暗块
    const x = rnd()*w, y = rnd()*h, r = 6 + rnd()*17, v = 186 + rnd()*66|0;
    g.fillStyle = `rgba(${v},${v},${v},.20)`;
    g.beginPath(); g.ellipse(x, y, r, r*0.60, rnd()*3, 0, 7); g.fill();
  }
  for (let i=0;i<5400;i++){                       // 一根根短毛
    const v = 116 + rnd()*140|0;
    g.strokeStyle = `rgba(${v},${v},${v},${0.10 + rnd()*0.22})`;
    g.lineWidth = 0.8 + rnd();
    const x = rnd()*w, y = rnd()*h, a = -1.25 + (rnd()-0.5)*1.5;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a)*3.4, y + Math.sin(a)*3.4); g.stroke();
  }
  for (let i=0;i<300;i++){                        // 零星深色杂毛
    g.fillStyle = `rgba(66,66,66,${0.05 + rnd()*0.10})`;

});

/* 毛料专用材质表。不能用 am() —— 那个按颜色缓存、和车架共用，

const FurMats = {};

/* ══════════════════ mood: 时段 × 天气 ══════════════════
   两张**正交**的表。时段管太阳/星星/路灯/曝光，天气管云/雾/地面/粒子 ——
   「黄昏 + 小雨」和「白天 + 雨」是两次不同的合成，不是三选一的一堆预设。
   天气那行只有权重 k 和「要往哪个方向压」，压在时段上的活儿由 composeMood 做。
   k=0（晴）时天气是彻底的空操作，所以「晴」永远严格等于原来的白天/夜晚。

   ⚠️ 下面每一个颜色和数字都是**照着物理直觉估的，不是调出来的**。
      雾浓度、粒子密度、湿路面的深浅我没法自己判断好不好看 ——
      要你在浏览器里过一眼，然后告诉我该往哪边推。 */
const TIMES = {
  day: {
    label:'白天',
    sky:['#1a63a8','#79bce6','#e2f0f0','#ffe4b4'],
    // fogFar 从 150 拉到 420：原来 150 m 以外直接糊成一片雾色，远山、树线、
    // 还有新加的地标全都看不见 —— 风景做出来也白做。30 m 以内照旧一点雾都没有，
    // 近处的速度感不受影响；拉到 420 是为了让 100~250 m 那段真正有层次。
    fog:0xc3e0ee, fogNear:30, fogFar:420,
    hemiSky:0xa8d4f0, hemiGround:0x5d6b2e, hemiI:0.55,
    dirCol:0xfff3dc, dirI:1.05, dirPos:[7,10,6],
    cloud:0xffffff, cloudOpacity:0.92, hill:0x63855e, hillFar:0x86a48f,
    stars:false, lamps:false, bikeLight:0, exposure:0.95
  },
  dusk: {
    label:'黄昏',
    // dirPos 的 y 只剩 1.6：太阳贴着地平线，影子被拉得老长。
    // 路灯在这一档就亮了（lamps:true），虫鸣也跟着进来了。
    // ⚠️ sky 四段的顺序是「下 → 中上 → 地平线 → (没用)」：
    //    天空球 SphereGeometry 的 v=0 在**下**极点，所以渐变是倒着的 ——
    //    写反了黄昏就变成「天顶是橙色、地平线是紫色」。实拍才发现的。
    sky:['#2a3a6a','#6b5a92','#e88b52','#ffcf7a'],
    fog:0xd9976f, fogNear:22, fogFar:320,
    hemiSky:0xd08a68, hemiGround:0x3a3a20, hemiI:0.40,
    dirCol:0xffb463, dirI:0.85, dirPos:[-6,1.6,-4],
    cloud:0xffab72, cloudOpacity:0.90, hill:0x4a5a4c, hillFar:0x7d7f90,
    stars:false, lamps:true, bikeLight:0.45, exposure:0.98
  },
  night: {
    label:'夜晚',
    sky:['#04081a','#101d40','#33325a','#6a4f66'],
    fog:0x101830, fogNear:12, fogFar:70,
    hemiSky:0x24345f, hemiGround:0x080e0a, hemiI:0.13,
    dirCol:0xa8bcff, dirI:0.10, dirPos:[-6,8,-5],
    cloud:0x46557c, cloudOpacity:0.34, hill:0x0f1724, hillFar:0x18213a,
    stars:true, lamps:true, bikeLight:1, exposure:1.0
  }
};

/* 天气表：只有「方向 + 权重」，没有绝对值。`k` 是这份天气压下去的力度，
   clear 的 k=0 表示什么都不用做 —— 于是晴天那条路径一个字节都不改变。

   ⚠️ 光的强度**不能**用绝对值（hemiI/dirI 直接写死），这是踩过的坑：
      k=1 会把时段整个盖掉，于是「夜晚 + 雾」渲染出来是白天 ——
      数据全对、按钮全对、12 个组合全能合成，只有画面是错的。
      现在改成「把该时段的灯压暗 dim，再加回一点雾/雪自己反出来的底光 floor」，
      天气就永远动不了时段的基线。 */
const WEATHER = {
  clear: { label:'晴', k:0 },
  rain: {
    label:'雨', k:1,
    sky:0x3d4854, fog:0x6b7883, fogNear:7,  fogFar:135,
    hemiSky:0x8d9aa6, hemiGround:0x2c3327,
    dirCol:0xc6d0da, hemiDim:0.72, hemiFloor:0.09, dirDim:0.70, dirY:9,
    cloud:0x59636d, cloudOpacity:0.97,
    hill:0x45554c, hillFar:0x5c6c6b,
    exposure:0.90,
    ground:0x53624c, groundK:0.50, road:0x232830, roadK:0.60, wet:1, rain:1
  },
  snow: {
    label:'雪', k:1,
    sky:0xa6b2c0, fog:0xc6d0da, fogNear:9,  fogFar:150,
    hemiSky:0xd6e2ee, hemiGround:0x8a94a0,
    dirCol:0xe8eef6, hemiDim:0.60, hemiFloor:0.26, dirDim:0.80, dirY:9,
    cloud:0xc6d0da, cloudOpacity:0.95,
    hill:0x98a6b2, hillFar:0xb2bec8,
    exposure:1.02,
    ground:0xeef4fa, groundK:0.88, road:0xc2ced8, roadK:0.72, wet:0.25, snow:1
  },
  fog: {
    // skyFlat：天不是「压暗」，是**整片糊成一个颜色**。雾里没有云的概念。
    label:'雾', k:1, skyFlat:true,
    sky:0xa9b2b6, fog:0xa9b2b6, fogNear:2,  fogFar:46,
    hemiSky:0xbcc4c6, hemiGround:0x6a6f66,
    dirCol:0xd6dbdb, hemiDim:0.78, hemiFloor:0.20, dirDim:0.85, dirY:9,
    cloud:0xa9b2b6, cloudOpacity:0.40,
    hill:0x8e9a96, hillFar:0x9da8a4,
    exposure:0.98,
    ground:0x8c968e, groundK:0.42, road:0x6e767a, roadK:0.45, wet:0.45
  }
};

/* 只有这几个字段参与「按 k 压过去」，色和数用各自的插值方式。
   注意 hemiI / dirI / dirPos **不在表里** —— 它们是按 dim/floor 算的，
   天气给不出绝对值。 */
const MOOD_FIELDS = [
  ['fog','col'], ['fogNear','num'], ['fogFar','num'],
  ['hemiSky','col'], ['hemiGround','col'],
  ['dirCol','col'],
  ['cloud','col'], ['cloudOpacity','num'],
  ['hill','col'], ['hillFar','col'],
  ['exposure','num']
];
function mixHex(a, b, k){
  const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
  const br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
  return (Math.round(ar+(br-ar)*k)<<16) | (Math.round(ag+(bg-ag)*k)<<8) | Math.round(ab+(bb-ab)*k);
}
/* 逐通道取小：天气只能在「这个时段本来就有的亮度」之内做文章。
   雾可以把天压白，但夜里的大雾不该亮成白天 —— 这个函数是那道闸。 */
function capHex(a, cap){
  const m = sh => Math.min((a>>sh)&255, (cap>>sh)&255);
  return (m(16)<<16) | (m(8)<<8) | m(0);
}
const hex6 = h => '#' + (((h>>>0) & 0xffffff).toString(16).padStart(6,'0'));
const skyHex = s => typeof s === 'number' ? s : parseInt(s.slice(1), 16);

function composeMood(tk, wk){
  const T = TIMES[tk] || TIMES.day, W = WEATHER[wk] || WEATHER.clear;
  const k = W.k || 0;
  const m = Object.assign({}, T);
  for (const f of MOOD_FIELDS){
    if (W[f[0]] === undefined) continue;
    m[f[0]] = f[1] === 'col'
      ? mixHex(T[f[0]], W[f[0]], k)
      : T[f[0]] + (W[f[0]] - T[f[0]])*k;
  }
  /* 阴天是把天**压平**，不是换一张天：云把原来的上下渐变冲淡了，
     顶上按满权重压、地平线那圈留一点（权重 1 → 0.55），
     不然会像贴了张灰纸。 */
  if (W.sky !== undefined){
    m.sky = W.skyFlat
      ? new Array(4).fill(W.sky)
      : T.sky.map((c,i) => mixHex(skyHex(c), W.sky, k*(1 - i*0.15)));
  }
  // ⚠️ 一定要先 skyHex 再 hex6：TIMES 里的 sky 是 '#rrggbb' 字符串，
  //    而 hex6 里那个 `h>>>0` 拿到字符串会走 Number('#rrggbb') = NaN，
  //    NaN>>>0 = 0 —— 结果晴天的天**整个变成纯黑**。这行少写一个函数名，
  //    天空就黑了，而其余 300 多条断言照样全过（它们查的是数值字段，不查天色）。
  m.sky = m.sky.map(c => hex6(skyHex(c)));   // canvas 的 addColorStop 只吃字符串
  // 阴雨天太阳挪高一点：让阴影落在车底下而不是拖成长长一条
  if (W.dirY !== undefined)
    m.dirPos = [T.dirPos[0], T.dirPos[1] + (W.dirY - T.dirPos[1])*k, T.dirPos[2]];
  /* 灯的强度：压暗 + 底光。dim 是「这份天气把太阳吃掉多少」，
     floor 是雾和雪自己反出来的那点光（雪地反光强，底光就高）。
     两个数都不是绝对值 —— 所以「夜晚 + 雪」是「很暗但比夜晚 + 雨亮」，
     而不会因为天气表写了 0.72 就变成白天。 */
  if (W.hemiDim !== undefined){
    m.hemiI = T.hemiI * (1 - W.hemiDim) + W.hemiFloor;
    m.dirI  = T.dirI  * (1 - W.dirDim);
  }
  /* 最后一道闸：所有颜色都跟该时段自己的颜色逐通道取小。
     雾可以把白天的天压成灰白，但夜里的大雾只能是夜色里的那点微光。 */
  for (const f of ['fog','hemiSky','hemiGround','dirCol','cloud','hill','hillFar'])
    m[f] = capHex(m[f], T[f]);
  m.sky = m.sky.map((c,i) => hex6(capHex(skyHex(c), skyHex(T.sky[i]))));
  m.tk = TIMES[tk] ? tk : 'day';
  m.wk = WEATHER[wk] ? wk : 'clear';
  m.label = TIMES[m.tk].label + ' · ' + WEATHER[m.wk].label;
  m.rain = W.rain || 0;  m.snow = W.snow || 0;  m.wet = W.wet || 0;
  m.groundTint = W.ground || 0;  m.groundK = W.groundK || 0;
  m.roadTint   = W.road   || 0;  m.roadK    = W.roadK    || 0;
  /* ⚠️ 这段必须排在 m.snow 赋值**之后**。曾经写在封顶那一坨的紧后面，
     那时 m.snow 还是 undefined —— `undefined > 0` 是 false，整段一次没跑，
     而雪夜的山照旧是黑的。判据「雪夜的雪山比晴夜亮」当场抓住的。 */
  /* 雪山例外：雪的反照率是 0.8，远处那片山会把路灯、车灯和星光全弹回来，
     所以雪夜的雪山恰恰是**最亮**的东西，不能跟着封顶一起压死。
     只抬山，天和雾仍然封顶 —— 夜里的雾还是夜的雾。 */
  if (m.snow > 0){
    m.hill    = mixHex(m.hill,    0xc8d6e2, m.snow*0.55);
    m.hillFar = mixHex(m.hillFar, 0xd2dee8, m.snow*0.65);
  }
  // 路面盖面：下雪盖白的、下雨盖暗的。两者可以同时出现（雪化的雨），
  // 所以是加不是二选一 —— 雪赢了颜色，湿赢了厚度。
  m.roadFxCol = m.snow > 0 ? 0xf6faff : 0x0d1218;
  m.roadFxK   = m.snow*0.62 + m.wet*0.34;
  m.groundFxK = m.snow*0.82;
  return m;
}
let MOOD = composeMood('day','clear');

/* ══════════════════ lights ══════════════════ */
const hemi = new THREE.HemisphereLight(0xa8d4f0, 0x5d6b2e, 0.55);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xfff3dc, 1.05);
dir.castShadow = true;
dir.shadow.mapSize.set(2048,2048);
// wide enough that roadside trees actually cast sweeping shadows across the road
dir.shadow.camera.left = -8; dir.shadow.camera.right = 8;
dir.shadow.camera.top  =  8; dir.shadow.camera.bottom = -8;
dir.shadow.camera.near = 1;  dir.shadow.camera.far = 40;
dir.shadow.bias = -0.0007;
dir.shadow.normalBias = 0.03;
scene.add(dir, dir.target);
const headLight = new THREE.PointLight(0xffeec2, 0, 5, 2);
scene.add(headLight);

/* ══════════════════ sky / clouds / stars ══════════════════ */
const skyMat = new THREE.MeshBasicMaterial({ side:THREE.BackSide, fog:false, depthWrite:false });
scene.add(new THREE.Mesh(new THREE.SphereGeometry(300, 24, 16), skyMat));

const starGeo = new THREE.BufferGeometry();
{
  const n = 1100, pos = new Float32Array(n*3);
  for (let i=0;i<n;i++){
    const a = rnd()*Math.PI*2, e = Math.acos(rnd()*0.98), r = 240;
    pos[i*3]   = Math.sin(e)*Math.cos(a)*r;
    pos[i*3+1] = Math.cos(e)*r*0.95 + 10;
    pos[i*3+2] = Math.sin(e)*Math.sin(a)*r;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
}
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  color:0xffffff, size:1.1, fog:false, transparent:true, opacity:0.9
}));
scene.add(stars);

/* ══════════════════ ground + road ══════════════════ */
// 地平面原来只有 z ±100，而远山带在 z 95~200 —— 雾一放远，那些山就会露在
// 地边之外，悬在半空。一起加宽到 ±230，贴图的 repeat 按同样的密度跟着放大，
// 不然草会被拉成条纹。
const GROUND_LEN = 420, GROUND_W = 460, ROAD_W = 3.9;

/* 提个名字出来：雪天要把它整个染白，雨天要压暗压灰，都是在 applyMood 里
   直接改 color —— 不然就得为了改个颜色去重新 new 一个材质，白扔一份贴图。 */
const groundMat = new THREE.MeshStandardMaterial({ map:grassTex, roughness:1 });
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(GROUND_LEN, GROUND_W),
  groundMat
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* The rider sits at z = 0. On a two-way carriageway with a dashed centre line,
   straddling that line is the wrong side of the road, so the tarmac — and every
   piece of street furniture laid out relative to it — is shifted a quarter of
   the road width over. That leaves the bike dead centre in the right-hand lane,
   a lane's width from both the centre dashes and the edge line. */
const LANE = ROAD_W/4;
// 沥青在 z 上的实际范围。路面整体往 -z 推了半个车道，所以左沿比右沿远得多，
// 转向的横向边界必须按这两个真实边界算，不能拿 ROAD_W/2 对称着来。
const T_MIN = -LANE - ROAD_W/2;
const T_MAX = -LANE + ROAD_W/2;
// 键盘能踩到的最高速。和面板上滑杆的 max 必须一致，
// 不然会出现「键盘能骑到 36，滑杆却拉不上去」这种割裂。
const V_MAX = 36;

const roadMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(GROUND_LEN, ROAD_W),
  new THREE.MeshStandardMaterial({ map:roadTex, roughnessMap:roughTex, roughness:0.92 })
);
roadMesh.rotation.x = -Math.PI/2;
roadMesh.position.y = 0.012;
roadMesh.position.z = -LANE;
roadMesh.receiveShadow = true;
scene.add(roadMesh);

/* A 420 m sheet of one flat green reads as a painted backdrop. Lay a second,
   very low-frequency layer of dry/damp patches over it: the big repeat keeps
   the tile from giving the tiling away, and it scrolls at a different rate
   from the grass so the two never line back up. */
const fieldTex = cvs(256,256,(g,w,h)=>{
  g.clearRect(0,0,w,h);
  for (let i=0;i<80;i++){
    g.fillStyle = rnd() < 0.45
      ? `rgba(154,152,88,${0.10+rnd()*0.22})`      // sun-bleached stubble
      : `rgba(34,70,38,${0.08+rnd()*0.18})`;       // damp hollow
    g.beginPath();
    g.ellipse(rnd()*w, rnd()*h, 16+rnd()*72, 11+rnd()*48, rnd()*3, 0, 7);
    g.fill();
  }
});
fieldTex.wrapS = fieldTex.wrapT = THREE.RepeatWrapping;
fieldTex.repeat.set(4, 4.6);     // 同上，别让大色块被拉长
const fieldOverlay = new THREE.Mesh(
  new THREE.PlaneGeometry(GROUND_LEN, GROUND_W),
  new THREE.MeshStandardMaterial({ map:fieldTex, roughness:1, transparent:true, depthWrite:false })
);
fieldOverlay.rotation.x = -Math.PI/2;
fieldOverlay.position.y = 0.004;
fieldOverlay.renderOrder = 1;
scene.add(fieldOverlay);

/* ══════════════════ 天气特效层 ══════════════════
   雨 = 竖着的短线段，雪 = 慢悠悠的点，雪盖/湿路 = 两张盖面。
   粒子都是**盒子里循环**的：落到地上就从顶上重新开始，掉到身后就从
   「前面很远、雾已经吃掉」的地方重新进来 —— 所以没有一处会当着你的面炸开。

   ⚠️ 为什么雪要单独盖一张面，而不是把材质 color 染白：
      材质的 color 是**乘**在贴图上的。绿草 × 白 = 还是绿草，只会发灰，
      永远不会变成雪。染色能做的只有「压暗」（雨），做不到「换成另一种材质」
      （雪）。地面本来就不滚动（这是很久以前定下的决定），所以盖面也不滚动，
      没有传送带问题。 */
const WX = 26, WY = 17, WZ = 15;

/* 雪面的底子：整体白，留些灰影做出起伏，不然盖上去是一张死白板 */
const frostTex = cvs(256,256,(g,w,h)=>{
  g.fillStyle = '#ffffff'; g.fillRect(0,0,w,h);
  for (let i=0;i<90;i++){
    g.fillStyle = `rgba(198,210,222,${0.10+rnd()*0.30})`;
    g.beginPath();
    g.ellipse(rnd()*w, rnd()*h, 20+rnd()*72, 14+rnd()*52, rnd()*3, 0, 7);
    g.fill();
  }
});
frostTex.wrapS = frostTex.wrapT = THREE.RepeatWrapping;
frostTex.repeat.set(9, 9.8);   // 大面拉长会看出条纹，密度跟着地面一起放大

const groundFx = new THREE.Mesh(
  new THREE.PlaneGeometry(GROUND_LEN, GROUND_W),
  new THREE.MeshStandardMaterial({
    map:frostTex, roughness:1, transparent:true, depthWrite:false, opacity:0,
    polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2
  })
);
groundFx.rotation.x = -Math.PI/2;
groundFx.position.y = 0.009;      // 压在草地叠层(0.004)之上、沥青(0.012)之下
groundFx.renderOrder = 2;
groundFx.visible = false;
scene.add(groundFx);

function makeRain(){
  const N = 1700;
  const base = new Float32Array(N*3);
  const spd  = new Float32Array(N);
  for (let i=0;i<N;i++){
    base[i*3]   = (rnd()-0.5)*2*WX;
    base[i*3+1] = rnd()*WY;
    base[i*3+2] = (rnd()-0.5)*2*WZ;
    spd[i] = 16 + rnd()*7;                   // 终端落速 16~23 m/s
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*6), 3));
  const mat = new THREE.LineBasicMaterial({
    color:0xc4d4e0, transparent:true, opacity:0, depthWrite:false, fog:true
  });
  const obj = new THREE.LineSegments(g, mat);
  obj.frustumCulled = false;                 // 顶点每帧重写，包围盒算不准
  obj.visible = false;
  scene.add(obj);
  return { obj, mat, g, base, spd, N, amount:0 };
}
const RAIN = makeRain();

function makeSnow(){
  const N = 2200;
  const base = new Float32Array(N*3);
  const spd  = new Float32Array(N);
  const ph   = new Float32Array(N);
  for (let i=0;i<N;i++){
    base[i*3]   = (rnd()-0.5)*2*WX;
    base[i*3+1] = rnd()*WY;
    base[i*3+2] = (rnd()-0.5)*2*WZ;
    spd[i] = 0.7 + rnd()*0.9;                // 雪比雨轻三个数量级
    ph[i]  = rnd()*6.283;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
  const mat = new THREE.PointsMaterial({
    color:0xffffff, size:0.12, sizeAttenuation:true,
    map:puffTex, transparent:true, opacity:0, depthWrite:false, fog:true
  });
  const obj = new THREE.Points(g, mat);
  obj.frustumCulled = false;
  obj.visible = false;
  scene.add(obj);
  return { obj, mat, g, base, spd, ph, N, amount:0 };
}
const SNOW = makeSnow();

/* 路面盖面：雨是盖一层暗的（湿沥青反光），雪是盖一层白的。
   同一个 mesh 两种脾气，所以颜色/透明度/金属度都从 mood 推，不写死。
   它盖在车道线上面（y 0.021 > 漆的 0.012），正好是漆被水泡着 / 被雪埋着的样子。 */
const roadFx = new THREE.Mesh(
  new THREE.PlaneGeometry(GROUND_LEN, ROAD_W),
  new THREE.MeshStandardMaterial({
    color:0x0d1218, roughness:0.10, metalness:0.55,
    transparent:true, opacity:0, depthWrite:false,
    polygonOffset:true, polygonOffsetFactor:-3, polygonOffsetUnits:-3
  })
);
roadFx.rotation.x = -Math.PI/2;
roadFx.position.set(0, 0.021, -LANE);
roadFx.renderOrder = 3;
roadFx.visible = false;
scene.add(roadFx);

/* 只有雨和雪真的在算的时候才进这里。晴天的开销是两次小数比较。 */
function updateWeather(dt, d){
  if (RAIN.amount > 0.01){
    const a = RAIN.g.attributes.position.array, B = RAIN.base;
    RAIN.obj.visible = true;
    RAIN.mat.opacity = 0.42 * RAIN.amount;
    for (let i=0;i<RAIN.N;i++){
      const k3 = i*3, k6 = i*6;
      let y = B[k3+1] - RAIN.spd[i]*dt;
      let x = B[k3]   - d;                   // 跟路边所有东西一样往后退
      if (y < 0)   y = WY;                   // 落地 → 从顶上重新开始
      if (x < -WX) x = WX;                   // 身后 → 从前面的雾里重新进来
      B[k3] = x; B[k3+1] = y;
      const L = 0.5 + RAIN.spd[i]*0.035;      // 落得越快，线拖得越长
      a[k6]=x; a[k6+1]=y+L; a[k6+2]=B[k3+2];
      a[k6+3]=x; a[k6+4]=y;  a[k6+5]=B[k3+2];
    }
    RAIN.g.attributes.position.needsUpdate = true;
  } else if (RAIN.obj.visible) RAIN.obj.visible = false;

  if (SNOW.amount > 0.01){
    const a = SNOW.g.attributes.position.array, B = SNOW.base, t = S.tSec;
    SNOW.obj.visible = true;
    SNOW.mat.opacity = 0.92 * SNOW.amount;
    SNOW.mat.size = 0.115 + 0.025*Math.sin(t*0.7);
    for (let i=0;i<SNOW.N;i++){
      const k3 = i*3, p = SNOW.ph[i];
      let y = B[k3+1] - SNOW.spd[i]*dt;
      let x = B[k3]   - d*0.35;              // 雪太轻，风推着它横向只漂一点
      if (y < 0)   y = WY;
      if (x < -WX) x = WX;
      B[k3] = x; B[k3+1] = y;
      a[k3]   = x + Math.sin(t*1.7 + p)*0.30;
      a[k3+1] = y;
      a[k3+2] = B[k3+2] + Math.cos(t*1.3 + p*1.7)*0.22;   // 飘，不是直着往下掉
    }
    SNOW.g.attributes.position.needsUpdate = true;
  } else if (SNOW.obj.visible) SNOW.obj.visible = false;
}

/* ── lane paint as recycled geometry ──
   The tarmac does not scroll — a tiling texture sliding past turns every
   10.5 m repeat into a visible conveyor belt. But paint frozen inside that
   same texture is just as wrong: ride for ten seconds and the centre line sits
   in exactly the same place, and the foreground reads as a freeze-frame.

   So the markings are real meshes travelling at exactly the speed the wheels
   are geared to. Each piece slides back until it is a full MARK_SPAN behind
   its own start, then snaps forward by MARK_SPAN. Because every piece shares
   one lattice offset and one wrap distance, the pattern stays seamless and
   stays locked to the same `d` as the props and the wheel rotation. */
const DASH_LEN = 3.0, DASH_GAP = 6.0;      // 3 m paint, 6 m gap
const DASH_PERIOD = DASH_LEN + DASH_GAP;
const MARK_SPAN  = DASH_PERIOD * 2;        // whole number of dash periods
const paintMat = new THREE.MeshStandardMaterial({
  color:0xe8eae0, roughness:0.72, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2
});
const markParts = [];
/* `span` MUST equal this piece's own lattice spacing. Wrapping a 9 m dash
   lattice on an 18 m cycle lets two dashes land on the same x while a gap
   opens elsewhere — the wrap distance and the spacing have to be the same
   number or the pattern is not periodic. */
function addMark(len, x, z, span){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len, 0.15), paintMat);
  m.rotation.x = -Math.PI/2;
  m.position.set(x, 0.017, z);
  m.receiveShadow = true;
  scene.add(m);
  markParts.push({ o: m, bx: x, span });
}
for (let k = -10; k < 16; k++) addMark(DASH_LEN, k*DASH_PERIOD, -LANE, DASH_PERIOD);
for (const s of [1, -1])
  for (let j = -5; j < 8; j++) addMark(MARK_SPAN, j*MARK_SPAN, -LANE + s*ROAD_W*0.5 - s*0.16, MARK_SPAN);

/* soft gravel shoulder so the tarmac does not meet grass as a hard seam */
const shoulderTex = cvs(64,64,(g,w,h)=>{
  g.fillStyle='rgba(178,160,124,1)'; g.fillRect(0,0,w,h);
  for(let i=0;i<1500;i++){ const v=150+rnd()*70|0; g.fillStyle=`rgba(${v},${v-14},${v-40},.5)`; g.fillRect(rnd()*w,rnd()*h,2,2); }
});
shoulderTex.wrapS = shoulderTex.wrapT = THREE.RepeatWrapping;
shoulderTex.repeat.set(60, 2);
const shoulderMat = new THREE.MeshStandardMaterial({ map:shoulderTex, roughness:1, transparent:true, opacity:0.95 });
for (const s of [1,-1]){
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(GROUND_LEN, 0.85), shoulderMat);
  sh.rotation.x = -Math.PI/2;
  sh.position.set(0, 0.008, s*(ROAD_W/2 + 0.42) - LANE);
  sh.receiveShadow = true;
  scene.add(sh);
  sh.userData.scroll = true;
}

/* ══════════════════ scenery, layered by depth ══════════════════ */
const M = {
  trunk:  new THREE.MeshStandardMaterial({ color:0x6b4a30, roughness:0.95, flatShading:true }),
  leafA:  new THREE.MeshStandardMaterial({ color:0x3f7a38, roughness:0.95, flatShading:true }),
  leafB:  new THREE.MeshStandardMaterial({ color:0x2f6230, roughness:0.95, flatShading:true }),
  leafC:  new THREE.MeshStandardMaterial({ color:0x4c8a3c, roughness:0.95, flatShading:true }),
  /* 树线原来整排只有三个绿，远看是一堵均质的绿墙。每棵树抽一套三色调，
     材质全共享，不多一个 draw call。 */
  leafD:  new THREE.MeshStandardMaterial({ color:0x35682f, roughness:0.95, flatShading:true }),
  leafE:  new THREE.MeshStandardMaterial({ color:0x6a9a3c, roughness:0.95, flatShading:true }),
  leafF:  new THREE.MeshStandardMaterial({ color:0x8aa845, roughness:0.95, flatShading:true }),
  bush:   new THREE.MeshStandardMaterial({ color:0x4d8a3c, roughness:1, flatShading:true }),
  bark:   new THREE.MeshStandardMaterial({ color:0x4a3524, roughness:0.98, flatShading:true }),
  conifer:new THREE.MeshStandardMaterial({ color:0x2b5a3a, roughness:0.96, flatShading:true }),
  willow: new THREE.MeshStandardMaterial({ color:0x6f9a3e, roughness:0.96, flatShading:true }),
  wire:   new THREE.MeshBasicMaterial({ color:0x3a4048, fog:true }),
  marker: new THREE.MeshStandardMaterial({ color:0xe8e2d2, roughness:0.9 }),
  post:   new THREE.MeshStandardMaterial({ color:0x2c2118, roughness:0.97, flatShading:true }),
  tuft:   new THREE.MeshStandardMaterial({ color:0x6aa334, roughness:1, flatShading:true }),
  rock:   new THREE.MeshStandardMaterial({ color:0x8a8f96, roughness:1, flatShading:true }),
  pole:   new THREE.MeshStandardMaterial({ color:0x2a3038, roughness:0.8 }),
  lampOn: new THREE.MeshStandardMaterial({ color:0x2a3038, roughness:0.7, emissive:0xffd27a, emissiveIntensity:0 }),
  hill:   new THREE.MeshStandardMaterial({ color:0x7f9c7a, roughness:1, flatShading:true, fog:true }),
  hillFar:new THREE.MeshStandardMaterial({ color:0x9db8a8, roughness:1, flatShading:true, fog:true }),
  cloud:  new THREE.MeshBasicMaterial({ map:puffTex, transparent:true, depthWrite:false, fog:false, opacity:0.92 }),
  /* ── 景片层 / 地标层专用 ── */
  kmStone: new THREE.MeshStandardMaterial({ color:0xe6e1d2, roughness:0.92, map:stoneTex }),
  plaster: new THREE.MeshStandardMaterial({ color:0xd8cdb8, roughness:0.94, map:wallTex }),
  barnRed: new THREE.MeshStandardMaterial({ color:0x9a4436, roughness:0.9,  map:plankTex }),
  roofSlate:new THREE.MeshStandardMaterial({ color:0x49505a, roughness:0.86, map:roofTex }),
  roofTile: new THREE.MeshStandardMaterial({ color:0x7b4137, roughness:0.88, map:roofTex }),
  silo:   new THREE.MeshStandardMaterial({ color:0xc0c6c2, roughness:0.58, metalness:0.22, map:siloTex }),
  metal:  new THREE.MeshStandardMaterial({ color:0x8d949c, roughness:0.52, metalness:0.42, map:metalTex }),
  rust:   new THREE.MeshStandardMaterial({ color:0x8a5a3c, roughness:0.92, map:metalTex }),
  plank:  new THREE.MeshStandardMaterial({ color:0x7d6142, roughness:0.95, map:plankTex }),
  dirt:   new THREE.MeshStandardMaterial({ color:0x8a7a5e, roughness:1, flatShading:true, map:wallTex }),
  stone:  new THREE.MeshStandardMaterial({ color:0x9a958a, roughness:0.98, flatShading:true, map:stoneTex }),
  water:  new THREE.MeshStandardMaterial({ color:0x4a7f96, roughness:0.16, metalness:0.55 }),
  reed:   new THREE.MeshStandardMaterial({ color:0x8f9a52, roughness:1, flatShading:true }),
  bale:   new THREE.MeshStandardMaterial({ color:0xc9ab63, roughness:1, map:baleTex }),
  cloth:  new THREE.MeshStandardMaterial({ color:0xd4c6aa, roughness:1, map:wallTex }),
  // 夜里才亮的两样：塔顶航空警示灯、道班房/塔身的窗
  beacon: new THREE.MeshStandardMaterial({ color:0x5a2622, roughness:0.5, emissive:0xff3b30, emissiveIntensity:0 }),
  glassLit:new THREE.MeshStandardMaterial({ color:0x2b2721, roughness:0.3, emissive:0xffc978, emissiveIntensity:0 }),
    frame:  new THREE.MeshStandardMaterial({ color:0xe9e3d4, roughness:0.88 }),
  frameD: new THREE.MeshStandardMaterial({ color:0x4a3f33, roughness:0.92 })
};

const world = [];      // { obj, span }
const lamps = [];      // declared before BANDS fills it (TDZ)

/* 雪会盖住东西。列一张要跟着染白的表，比例各不相同 ——
   屋顶能兜住厚厚一层，树冠挂不住多少，石墙和里程碑也就薄薄一层。
   ⚠️ 这些比例是我按「看起来该积多少」估的，不是调出来的。
   原色必须先记下来：染白是从原色算的，不记的话切两次天气就再也回不到晴天。 */
const SNOWY = [
  ['leafA',0.45],['leafB',0.45],['leafC',0.45],['leafD',0.45],['leafE',0.45],['leafF',0.45],
  ['bush',0.40],['tuft',0.35],['reed',0.30],['conifer',0.58],['willow',0.35],
  ['roofSlate',0.78],['roofTile',0.78],['plank',0.32],['stone',0.45],['plaster',0.40],
  ['kmStone',0.30],['cloth',0.45],['marker',0.35],['rock',0.30],['dirt',0.30]
];
for (const [k] of SNOWY) M[k].userData.baseCol = M[k].color.getHex();
function addRecycled(obj, span){ obj.userData.span = span; props.add(obj); world.push(obj); }
const props = new THREE.Group();
scene.add(props);
const clamp = (v,a,b) => v<a?a:v>b?b:v;

function setShadowDeep(o, on){ o.traverse(c => { if (c.isMesh) c.castShadow = on; }); }

/* Trees used to be a straight cylinder with three spheres on top, which reads
   as a lollipop. A tree reads as a tree when you can see (a) a trunk that
   changes direction and thickness, (b) limbs that leave the trunk, and (c)
   foliage clustered at the ends of those limbs. `detail` drops (b) and (c) for
   the far bands where they are sub-pixel anyway. */
function taperedTrunk(h, r0, r1, segs, lean){
  const g = new THREE.Group();
  let p = V((rnd()-0.5)*0.05, 0, (rnd()-0.5)*0.05);
  const dir = V((rnd()-0.5)*lean, 1, (rnd()-0.5)*lean).normalize();
  for (let i = 0; i < segs; i++){
    const t0 = i/segs, t1 = (i+1)/segs;
    const a = p.clone();
    const b = p.clone().addScaledVector(dir, h/segs);
    p = b;
    g.add(tubeTaper(a, b, r0 + (r1-r0)*t0, r0 + (r1-r0)*t1, M.bark, 6));
  }
  return { g, top: p, dir };
}
/* kindPick：不给就在四种里随机挑（0-1 宽叶 / 2 白杨 / 3 针叶）；
   给了就锁定那一路。「隧道树」要的是**冠幅** —— 针叶和白杨天生窄，
   混进隧道里就是几根光杆，隧道感全没了，所以那一路必须能指定。 */
function makeTree(scale, leafy, cast, detail = 2, kindPick = null){
  const kind = kindPick === null ? ((rnd()*4) | 0) : (kindPick | 0);
  // 0-1 broadleaf, 2 poplar, 3 conifer
  const g = new THREE.Group();

  if (kind === 3){                          // conifer: bare trunk + stacked skirts
    const h = (2.4 + rnd()*2.2) * scale;
    const t = taperedTrunk(h*0.92, 0.075*scale, 0.018*scale, 3, 0.05);
    g.add(t.g);
    const tiers = detail >= 1 ? 5 : 3;
    for (let i = 0; i < tiers; i++){
      const f = i/tiers;
      const r = (0.62 - f*0.46) * (0.8 + rnd()*0.4) * scale;
      const c = new THREE.Mesh(new THREE.ConeGeometry(r, h*0.30, detail >= 2 ? 7 : 5), M.conifer);
      c.position.set((rnd()-0.5)*0.10*scale, h*(0.24 + f*0.66), (rnd()-0.5)*0.10*scale);
      c.rotation.y = rnd()*3;
      g.add(c);
    }
    setShadowDeep(g, !!cast); return g;
  }

  if (kind === 2){                          // poplar: tall and narrow
    const h = (3.4 + rnd()*2.4) * scale;
    const t = taperedTrunk(h*0.80, 0.060*scale, 0.020*scale, 3, 0.03);
    g.add(t.g);
    const lobes = detail >= 1 ? 5 : 3;
    for (let i = 0; i < lobes; i++){
      const f = i/(lobes-1);
      const r = (0.30 + rnd()*0.16) * scale * (0.55 + f*0.75);
      const b = new THREE.Mesh(new THREE.IcosahedronGeometry(r, detail >= 2 ? 1 : 0),
        (i%2) ? M.willow : M.leafC);
      b.position.set((rnd()-0.5)*0.24*scale, h*(0.34 + f*0.56), (rnd()-0.5)*0.24*scale);
      b.scale.y = 1.25; g.add(b);
    }
    setShadowDeep(g, !!cast); return g;
  }

  // broadleaf: a real fork, with foliage sitting on the limbs
  const h = (2.0 + rnd()*1.8) * scale;
  const spread = kind === 0 ? 0.95 : 1.45;   // round crown vs spreading oak
  const t = taperedTrunk(h*0.52, 0.105*scale, 0.062*scale, 3, 0.10);
  g.add(t.g);

  /* 每棵树抽一套叶色。同一个调色板贯穿这棵树，所以远看是一棵一个色相，
     而不是一棵树里三种绿随机跳。 */
  const PAL3 = [[M.leafA,M.leafB,M.leafC], [M.leafB,M.leafC,M.leafD], [M.leafC,M.leafE,M.leafD], [M.leafE,M.leafF,M.leafC]];
  const pal0 = PAL3[(rnd()*PAL3.length)|0];
  const pal  = leafy ? pal0 : [pal0[0], pal0[1]];

  const limbs = detail >= 1 ? 4 : 3;
  const tips = [];
  for (let i = 0; i < limbs; i++){
    const a = (i/limbs)*Math.PI*2 + rnd()*0.8;
    const lean = spread * (0.42 + rnd()*0.34);
    const a0 = V(t.top.x, t.top.y - h*0.10*scale, t.top.z);
    const b0 = V(t.top.x + Math.cos(a)*h*lean, t.top.y + h*0.30*scale, t.top.z + Math.sin(a)*h*lean);
    g.add(tubeTaper(a0, b0, 0.050*scale, 0.020*scale, M.bark, 5));
    tips.push(b0);
    if (detail >= 2 && rnd() < 0.7){          // one secondary fork per limb
      const c0 = V(a0.x + (b0.x-a0.x)*0.5, a0.y + (b0.y-a0.y)*0.5, a0.z + (b0.z-a0.z)*0.5);
      const a2 = a + (rnd()-0.5)*1.3;
      const d0 = V(c0.x + Math.cos(a2)*h*lean*0.55, c0.y + h*0.20*scale, c0.z + Math.sin(a2)*h*lean*0.55);
      g.add(tubeTaper(c0, d0, 0.026*scale, 0.012*scale, M.bark, 4));
      tips.push(d0);
    }
  }
  for (const p of tips){
    const r = (0.44 + rnd()*0.34) * scale * (h/2.4);
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(r, detail >= 2 ? 1 : 0),
      pal[(rnd()*pal.length)|0]);
    b.position.set(p.x + (rnd()-0.5)*r*0.7, p.y + r*0.35, p.z + (rnd()-0.5)*r*0.7);
    b.scale.y = 0.86; g.add(b);
  }
  if (detail >= 1){                            // one crown blob to knit it together
    const c = new THREE.Mesh(new THREE.IcosahedronGeometry(0.58*scale*(h/2.4), detail >= 2 ? 1 : 0),
      pal0[(rnd()*pal0.length)|0]);
    c.position.set(t.top.x, t.top.y + h*0.26, t.top.z);
    c.scale.y = 0.82; g.add(c);
  }
  setShadowDeep(g, !!cast);
  return g;
}
function makeBush(){
  const g = new THREE.Group();
  for (let i=0;i<3;i++){
    const r = 0.20 + rnd()*0.22;
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(r,0), M.bush);
    b.position.set((rnd()-0.5)*0.4, r*0.7, (rnd()-0.5)*0.4);
    b.castShadow = true; g.add(b);
  }
  return g;
}
function makeTuft(){
  const c = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.32+rnd()*0.16, 5), M.tuft);
  c.position.y = 0.16;
  c.rotation.y = rnd()*3;
  c.castShadow = false;
  return c;
}
function makeFlower(){
  const cols = [0xfff4d6, 0xffd166, 0xf4a5c0, 0xe8f0ff];
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.045,0),
    new THREE.MeshStandardMaterial({ color:cols[(rnd()*cols.length)|0], roughness:0.85 }));
  m.position.y = 0.20 + rnd()*0.08;
  m.castShadow = false;
  const g = new THREE.Group(); g.add(m);
  const st = new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.2,4), M.tuft);
  st.position.y = 0.1; g.add(st);
  return g;
}
function makeRock(){
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.16+rnd()*0.22, 0), M.rock);
  m.scale.y = 0.62; m.rotation.set(rnd(), rnd(), rnd()); m.castShadow = true; return m;
}
/* ── roadside furniture. Evenly spaced verticals are the strongest speed cue
   there is: the eye measures the gap closing, not the scenery sliding past. ── */
function makeFencePost(gap){
  const g = new THREE.Group();
  // creosoted, slightly tapered and weathered — a pale box reads as cardboard
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.070, 1.04, 5), M.post);
  p.position.y = 0.52; p.rotation.z = (rnd()-0.5)*0.08; p.castShadow = true;
  g.add(p);
  for (const y of [0.44, 0.74]){
    const pts = [];
    for (let i = 0; i <= 8; i++){
      const t = i/8;
      pts.push((t-0.5)*gap, y - Math.sin(Math.PI*t)*gap*0.032, 0);
    }
    const wg = new THREE.BufferGeometry();
    wg.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
    g.add(new THREE.Line(wg, M.wire));
  }
  return g;
}
function makeTelegraph(gap){
  const g = new THREE.Group();
  const h = 6.4;
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.13, h, 6), M.post);
  p.position.y = h/2; p.castShadow = true; g.add(p);
  for (const y of [h-0.55, h-1.15]){
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 1.45), M.post);
    arm.position.y = y; g.add(arm);
    for (const s of [1,-1]){
      const pts = [];
      for (let i = 0; i <= 8; i++){
        const t = i/8;
        pts.push((t-0.5)*gap, y - Math.sin(Math.PI*t)*gap*0.05, s*0.6);
      }
      const wg = new THREE.BufferGeometry();
      wg.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
      g.add(new THREE.Line(wg, M.wire));
    }
  }
  return g;
}
function makeMarker(){
  const g = new THREE.Group();
  const slab = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.62, 0.07), M.marker);
  slab.position.y = 0.31; slab.rotation.z = 0.04; slab.castShadow = true;
  g.add(slab);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.115, 0.16, 4), M.marker);
  tip.position.y = 0.68; tip.rotation.y = Math.PI/4; g.add(tip);
  const band = new THREE.Mesh(new THREE.BoxGeometry(0.165, 0.10, 0.075), M.frameD);
  band.position.y = 0.44; g.add(band);
  return g;
}
function makeGrassPatch(){
  // a clump of blades, not a single cone — cones read as traffic bollards
  const g = new THREE.Group();
  const n = 4 + (rnd()*4|0);
  for (let i = 0; i < n; i++){
    const h = 0.16 + rnd()*0.30;
    const bl = new THREE.Mesh(new THREE.PlaneGeometry(0.055, h, 1, 2), M.tuft);
    bl.position.set((rnd()-0.5)*0.34, h/2, (rnd()-0.5)*0.34);
    bl.rotation.y = rnd()*3.14;
    bl.rotation.x = (rnd()-0.5)*0.5;
    g.add(bl);
  }
  return g;
}
function makeLamp(){
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.05,3.3,7), M.pole);
  pole.position.y = 1.65; pole.castShadow = true; g.add(pole);
  // the arm reaches along +Z, i.e. out over the carriageway, so the band can
  // stay unrotated without every lamp pointing down the road
  const elbow = new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.032,0.30,6), M.pole);
  elbow.position.set(0, 3.22, 0.13); elbow.rotation.x = 0.95; g.add(elbow);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.026,0.50,6), M.pole);
  arm.rotation.x = Math.PI/2; arm.position.set(0, 3.30, 0.33); g.add(arm);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.105,10,8), M.lampOn);
  head.position.set(0, 3.27, 0.56); g.add(head);
  const glow = new THREE.PointLight(0xffd27a, 0, 11, 2);
  glow.position.copy(head.position); g.add(glow);
  g.userData.lamp = { head, glow };
  return g;
}
function makeHill(far){
  const g = new THREE.Group();
  const n = 3 + (rnd()*4|0);
  const mat = far ? M.hillFar : M.hill;
  for (let i=0;i<n;i++){
    const r = 9 + rnd()*13;
    // flattened lumps, not cones — cones read as pointy snow peaks
    const c = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), mat);
    c.position.set((rnd()-0.5)*r*2.4, -r*0.28, (rnd()-0.5)*r*1.6);
    c.scale.set(1, 0.40 + rnd()*0.16, 1);
    c.rotation.y = rnd()*3;
    g.add(c);
  }
  return g;
}

/* depth bands: near bands cast shadows (their sweep across the tarmac is the
   strongest speed cue), far bands skip shadows to keep the frame budget sane

   tag 是给「旅程结构」用的：换路段时按标签调这一带的疏密（见 ROUTE 的 w）。
   没被任何路段列出来的标签一律按 1.0 处理，也就是全程不动的**节奏层**
   （栅栏/电线杆/白桩/路灯）—— 它们是速度感的主心骨，一根都不能少。 */
/* ── 沿路的房子：给「镇子」段用。
     谷仓那套 gableHouse 直接复用（它已经能出山墙、瓦顶、门和窗格），
     这里只负责"随机出一栋像样的民居"—— 红砖或灰白、瓦顶或石板、带门带窗。
     尺寸压到 4~6 m：镇子的房子是**路边的陪衬**，不是主角，
     真给成谷仓那么大，路就被压窄了。 */
function makeHouse(){
  const w = rr(4.2, 6.4), h = rr(2.5, 3.3), d = rr(3.8, 5.0);
  return gableHouse(w, h, d,
    rnd() < 0.5 ? M.barnRed : M.plaster,
    rnd() < 0.5 ? M.roofTile  : M.roofSlate,
    { door: rnd() < 0.7, bars: (rnd()*3)|0 });
}

/* ── 芦苇丛：给「河堤」段用。
     抄的是 vgPond 里那套（3 片竖着的 PlaneGeometry 拼一丛），
     差别只在丛数和高度：水边的苇子要密、要高，才看得出是水边不是草地。 */
function makeReedClump(){
  const g = new THREE.Group();
  const n = 5 + (rnd()*4|0);
  for (let i=0;i<n;i++){
    const h = rr(1.3, 2.4);
    const bl = new THREE.Mesh(new THREE.PlaneGeometry(0.08, h, 1, 2), M.reed);
    bl.position.set((rnd()-0.5)*0.34, h/2, (rnd()-0.5)*0.34);
    bl.rotation.y = rnd()*3.14;
    bl.rotation.x = (rnd()-0.5)*0.30;          // 稍微歪一点，成丛才不像一排栅栏
    bl.rotation.z = (rnd()-0.5)*0.22;
    g.add(bl);
  }
  return g;
}

/* ── 桥护栏：给「长桥」段用。
     和栅栏的区别是**横杆要接上**（桥上不能有缝，人会以为能钻出去），
     所以横杆长度就等于这一跨的间距，柱子只负责把横杆抬起来。 */
function makeRail(gap){
  const g = new THREE.Group();
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.050, 0.062, 0.94, 6), M.post);
  p.position.y = 0.47; p.castShadow = true; g.add(p);
  for (const y of [0.42, 0.80]){                       // 两道横杆，接满这一跨
    const r = new THREE.Mesh(new THREE.CylinderGeometry(0.020, 0.020, gap, 5), M.metal);
    r.rotation.z = Math.PI/2; r.position.y = y; g.add(r);
  }
  return g;
}

/* ── 坡上的碎石堆：给「长坡」段用。
     路面本身是平的（只有一层 sin 波的颠簸），做不出真坡度；
     那就用"路肩堆着碎石"来暗示这是爬坡段 —— 真正的长坡路上就是这样。 */
function makeBoulder(){
  const g = new THREE.Group();
  const n = 2 + (rnd()*3|0);
  for (let i=0;i<n;i++){
    const s = rr(0.24, 0.62);
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0),
      rnd() < 0.35 ? M.rock : M.stone);
    r.position.set((rnd()-0.5)*1.1, s*0.62, (rnd()-0.5)*1.1);
    r.rotation.set(rnd()*3, rnd()*3, rnd()*3);
    r.castShadow = true; g.add(r);
  }
  return g;
}

const BANDS = [
  { tag:'grass', n:52, z:[2.15, 2.80], span:110, build:() => makeGrassPatch() },

  { id:'fence', own:'fence', tag:'fence', n:44, z:[2.62, 2.62], span:96,  side:1,  noRot:true, build:function(){ return makeFencePost(96/44); } },
  { tag:'wire',  n:6,  z:[5.40, 5.40], span:250, side:-1, noRot:true, build:() => makeTelegraph(250/6) },
  { tag:'mark',  n:5,  z:[1.95, 1.95], span:150, side:1,  noRot:true, build:() => makeMarker() },

  { id:'treeNear', tag:'tree',  n:24, z:[3.05, 4.10], span:150, build:() => makeTree(1.0, false, true, 2) },
  /* 隧道树带：只给「林荫」段开，平时一律藏起来。
     几何是算出来的，不是"看着差不多" ——
       scale 2.2 → 展冠橡树高 (2.0~3.8)×2.2 = 4.4~8.4 m
       spread 1.45 → 冠半径 ≈ 高 × 1.45 × (0.42~0.76) ≈ 3.8~7.2 m

     这几行数是 2026-10-01 从 bbox 上**量**出来的，不是从代码里推的
     （AGENTS 里原来那组「冠半径 3.8~7.2 m」是拍的，已删）：
       路中心 z   = -ROAD_W/4 = -0.975
       树离路中心 = rr(4.30, 5.60) = 4.31 ~ 5.56 m
       冠伸出量   = 最小 0.18 / 中位 2.97 / 最大 9.22 m，44/44 棵全部成拱
     ⚠️ 别再拿 makeTree 里的公式去「算」余量：树高、lean、叶片团半径共用
     同一串 rnd，逐项独立取极值不等于实际的最坏值，何况树还随机转了

  { id:'tunnel',   tag:'tree',  n:44, z:[4.30, 5.60], span:130, build:() => makeTree(2.2, true, true, 1, 1) },

  { id:'house', own:'house', tag:'house', n:18, z:[9.5, 18], span:210, build:() => makeHouse() },

  { id:'reed',  own:'reed',  tag:'reed',  n:26, z:[5.2, 8.2],  span:150, build:() => makeReedClump() },

  { id:'rail',  own:'rail',  tag:'rail',  n:18, z:[3.05, 3.05], span:96,  side:1, noRot:true,

  { id:'boulder', own:'boulder', tag:'boulder', n:22, z:[3.20, 4.60], span:130, build:() => makeBoulder() },
  { tag:'bush',  n:26, z:[4.20, 6.60], span:170, build:() => makeBush() },
  { tag:'rock',  n:10, z:[3.20, 5.50], span:150, build:() => makeRock() },
  { id:'treeMid',  tag:'tree',  n:18, z:[7.50, 14.0], span:230, build:() => makeTree(1.5, true, true, 1) },

  { id:'treeSky',  tag:'tree',  n:8,  z:[130, 180],   span:600, build:() => makeTree(5.5, true, false, 0) },
  { tag:'hill',  n:9,  z:[95, 130],    span:560, build:() => makeHill(false) },
  { tag:'hill',  n:7,  z:[150, 200],   span:700, build:() => makeHill(true) }
];
for (const B of BANDS){
  const gap = B.span / B.n;
  B.objs = [];                       // 留个句柄：旅程结构要按 tag 调这一带的疏密
  for (let i=0;i<B.n;i++){
    const side = B.side || ((i % 2) ? 1 : -1);
    const o = B.build.call({ n:B.n, gap });
    o.position.set((i/B.n)*B.span - B.span*0.5, 0, side*rr(B.z[0], B.z[1]) - LANE);
    o.rotation.y = B.noRot ? 0 : rnd()*6.28;
    if (o.userData.lamp) lamps.push(o);
    B.objs.push(o);
    addRecycled(o, B.span);
  }
}

/* ══════════════════ bike geometry (metres) ══════════════════ */
const R_WHEEL = 0.34;
const HUB_R = new THREE.Vector3(-0.52, R_WHEEL, 0);
const HUB_F = new THREE.Vector3( 0.52, R_WHEEL, 0);
const BB    = new THREE.Vector3( 0.00, 0.28, 0);
const ST    = new THREE.Vector3(-0.15, 0.95, 0);
// The fork crown has to sit OUTSIDE the tyre plus the mudguard, or the guard
// has nothing to bolt to and the crown itself is inside the wheel. At
// (0.398, 0.755) the crown clears the 0.375 guard radius by ~58mm.
const HT_B  = new THREE.Vector3( 0.398,0.755, 0);
const HT_T  = new THREE.Vector3( 0.372,0.945, 0);
const CRANK_R = 0.17;
const GUARD_R = R_WHEEL + 0.036;      // mudguard radius

/* ══ steering axis ══════════════════════════════════════════
   Everything ahead of the head tube turns as one piece: front
   wheel, fork, guards, stem, bar. The pivot sits on the head
   tube so the front end sweeps round the steering column
   instead of the whole bike swinging from the ground contact.

   Two nested groups, and the inner one is offset by -pivot: net
   world position is zero, so every part below can keep using the
   same absolute coordinates it always used. Only the re-parenting
   changes, not a single coordinate in the bike model. */
const STEER_PIVOT = new THREE.Vector3(0.442, 1.05, 0);
const steerPivot = new THREE.Group();
steerPivot.position.copy(STEER_PIVOT);
bike.add(steerPivot);
const steerInner = new THREE.Group();
steerInner.position.copy(STEER_PIVOT).negate();
steerPivot.add(steerInner);

/* ── wheel: tyre, rim, hub, 20 laced spokes ── */
function makeWheel(){
  const g = new THREE.Group();
  g.add(mesh(new THREE.TorusGeometry(R_WHEEL-0.036, 0.036, 10, 40), Bm.tyre));
  g.add(mesh(new THREE.TorusGeometry(R_WHEEL-0.072, 0.013, 8, 36), Bm.rim));
  const hub = mesh(new THREE.CylinderGeometry(0.026,0.026,0.11,10), Bm.rim);
  hub.rotation.x = Math.PI/2; g.add(hub);
  const pts = [];
  const NS = 20, RIM = R_WHEEL-0.075, HUBR = 0.028;
  for (let i=0;i<NS;i++){
    const side = (i % 2) ? 1 : -1;
    const a  = i/NS*Math.PI*2;
    const a2 = a + side*0.10;                 // slight lacing angle
    pts.push(Math.cos(a)*HUBR,  Math.sin(a)*HUBR,  side*0.045);
    pts.push(Math.cos(a2)*RIM,  Math.sin(a2)*RIM,  0);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  g.add(new THREE.LineSegments(sg, new THREE.LineBasicMaterial({ color:0xb4bec9 })));
  return g;
}
const wheelR = makeWheel(); wheelR.position.copy(HUB_R); bike.add(wheelR);
const wheelF = makeWheel(); wheelF.position.copy(HUB_F); steerInner.add(wheelF);

/* ── mudguard: a real U-channel of sheet metal, with actual mounting ──
   The old guard was a 18mm torus, i.e. a bent wire floating in space. This
   sweeps a shallow channel cross-section along the arc and gives it wall
   thickness, so the silhouette edge reads as folded metal.                  */
function fenderGeo(R, a0, a1, halfW = GUARD_W, depth = 0.026, thick = 0.0035, steps = 30){
  const CS = [
    [-halfW,      -depth],
    [-halfW*0.74, -depth*0.30],
    [0,            0],
    [ halfW*0.74, -depth*0.30],
    [ halfW,      -depth]
  ];
  const P = (i, j, inner) => {
    const a = a0 + (a1 - a0) * i/steps;
    const r = R + CS[j][1] - (inner ? thick : 0);
    return [Math.cos(a)*r, Math.sin(a)*r, CS[j][0]];
  };
  const pos = [];
  const strip = (get, flip) => {
    for (let i = 0; i < steps; i++)
      for (let j = 0; j < CS.length-1; j++){
        const q = [get(i,j), get(i,j+1), get(i+1,j+1), get(i+1,j)];
        for (const k of (flip ? [0,2,1, 0,3,2] : [0,1,2, 0,2,3])) pos.push(...q[k]);
      }
  };
  strip((i,j) => P(i,j,0), false);      // outer skin
  strip((i,j) => P(i,j,1), true);       // inner skin
  for (let i = 0; i < steps; i++)        // folded side edges
    for (const j of [0, CS.length-1]){
      const q = j === 0
        ? [P(i,j,0), P(i,j,1), P(i+1,j,1), P(i,j,0), P(i+1,j,1), P(i+1,j,0)]
        : [P(i,j,0), P(i+1,j,1), P(i,j,1), P(i,j,0), P(i+1,j,0), P(i+1,j,1)];
      for (const v of q) pos.push(...v);
    }
  for (const [i, flip] of [[0,true],[steps,false]])   // end caps
    for (let j = 0; j < CS.length-1; j++){
      const q = flip
        ? [P(i,j,0), P(i,j+1,0), P(i,j,1), P(i,j+1,0), P(i,j+1,1), P(i,j,1)]
        : [P(i,j,0), P(i,j,1), P(i,j+1,0), P(i,j,1), P(i,j+1,1), P(i,j+1,0)];
      for (const v of q) pos.push(...v);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(new Float32Array(pos.length),3));
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}
/* a flat steel stay — the actual load path from the guard to the frame */
function stay(anchor, hub, angle, s, r = 0.0048){
  const edge = V(hub.x + Math.cos(angle)*GUARD_R, hub.y + Math.sin(angle)*GUARD_R, s*(GUARD_W - 0.005));
  return tube(anchor, edge, r, Bm.steel, 6);
}

/* ── frame: proper diamond + rear triangle + raked fork ── */
{
  // rear triangle in pairs — a single centre tube would pass through the tyre
  for (const s of [1,-1]){
    const cs = s*0.055, ss = s*0.046;
    bike.add(tube(V(BB.x, BB.y, cs), V(-0.30, 0.295, cs*0.92), 0.016, Bm.frameD));
    bike.add(tube(V(-0.30, 0.295, cs*0.92), V(HUB_R.x, HUB_R.y, ss), 0.015, Bm.frameD));
    bike.add(tube(V(ST.x, ST.y, ss), V(-0.30, 0.700, ss*0.94), 0.013, Bm.frameD));
    bike.add(tube(V(-0.30, 0.700, ss*0.94), V(HUB_R.x, HUB_R.y, ss), 0.012, Bm.frameD));
  }
  // seat-stay bridge — a real one is a flat strap, and it is what carries the guard
  const bridge = mesh(new THREE.BoxGeometry(0.030, 0.012, 0.104), Bm.steel);
  bridge.position.set(-0.30, 0.700, 0);
  bridge.rotation.z = 1.077;            // lies across the two seat stays
  bike.add(bridge);

  bike.add(tubeTaper(BB, ST, 0.025, 0.021, Bm.frame));         // seat tube
  bike.add(tubeTaper(BB, HT_B, 0.028, 0.022, Bm.frame));       // down tube

}

/* ── the guards themselves, plus everything that holds them up ── */
const D2R = Math.PI/180;
{
  /* ---- front: clamped under a bridge that arches over the tyre from fork
     leg to fork leg, then held by two stays per side ---- */
  const gF = mesh(fenderGeo(GUARD_R, 12*D2R, 176*D2R), Bm.frameD);
  gF.position.copy(HUB_F); steerInner.add(gF);

  const bx = 0.432;                                   // bridge plane, ahead of the crown
  const bridge = new THREE.CatmullRomCurve3([
    V(bx, 0.612,  FORK_Z),
    V(bx, 0.700,  FORK_Z*0.80),
    V(bx, 0.742,  FORK_Z*0.30),
    V(bx, 0.748,  0),
    V(bx, 0.742, -FORK_Z*0.30),
    V(bx, 0.700, -FORK_Z*0.80),
    V(bx, 0.612, -FORK_Z)
  ]);
  steerInner.add(mesh(new THREE.TubeGeometry(bridge, 22, 0.0062, 6), Bm.steel));
  // crown tab: ties the bridge back to the fork crown itself
  steerInner.add(tube(V(HT_B.x, HT_B.y - 0.014, 0), V(bx, 0.618, 0), 0.0068, Bm.steel, 6));

  for (const s of [1,-1]){
    const anchor = V(0.468, 0.520, s*(FORK_Z + 0.003));
    steerInner.add(stay(anchor, HUB_F,  76*D2R, s));   // forward stay
    steerInner.add(stay(anchor, HUB_F, 126*D2R, s));   // rear stay
  }

  /* ---- rear: clipped to the seat-stay bridge, then two stays per side ---- */
  const gR = mesh(fenderGeo(GUARD_R, 52*D2R, 200*D2R), Bm.frameD);
  gR.position.copy(HUB_R); bike.add(gR);

  const clipA = Math.atan2(0.700 - HUB_R.y, -0.300 - HUB_R.x);
  const clipP = V(-0.300, 0.700, 0);
  const clipQ = V(HUB_R.x + Math.cos(clipA)*GUARD_R, HUB_R.y + Math.sin(clipA)*GUARD_R, 0);
  bike.add(tube(clipP, clipQ, 0.0062, Bm.steel, 6));
  for (const s of [1,-1]){                          // the clip's two feet onto the shell
    bike.add(tube(V(clipP.x, clipP.y, s*0.050),
      V(clipQ.x, clipQ.y + 0.006, s*(GUARD_W - 0.010)), 0.0042, Bm.steel, 6));
  }

  for (const s of [1,-1]){
    bike.add(stay(V(-0.470, 0.338, s*0.052), HUB_R, 168*D2R, s));   // low stay
    bike.add(stay(V(-0.352, 0.612, s*0.048), HUB_R, 126*D2R, s));   // upper stay
  }
}

/* ── drivetrain: chainring, rear cog, real chain loop, cranks, pedals ── */
const CZ = 0.052;
