/* ══════════════════ main loop ══════════════════ */
const clock = new THREE.Clock();
let lastFov = -1;

/* ══════════════════ audio ══════════════════
   Everything is synthesised at runtime through the Web Audio API. No audio
   files, no CDN — the page stays a single offline file. The context is only
   created after a real user gesture, which is what the autoplay policy wants.
   The state object lives up here because applyMood() runs before this section
   and needs to reach the night bus. */
function audioInit(){
  if (AU.ctx) return AU.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  const ctx = AU.ctx = new AC();

  const master = AU.master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);

  // one 2-second white-noise loop feeds every noise-based voice
  const n = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
  const d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  AU.noise = n;

  // tyre roll — lowpassed noise, cutoff and level both ride on speed
  AU.road = ctx.createBufferSource(); AU.road.buffer = n; AU.road.loop = true;
  const rf = ctx.createBiquadFilter(); rf.type = 'lowpass'; rf.Q.value = 0.9;
  rf.frequency.value = 240;
  AU.roadF = rf;
  AU.roadG = ctx.createGain(); AU.roadG.gain.value = 0;
  AU.road.connect(rf).connect(AU.roadG).connect(master);
  AU.road.start();

  // wind — same noise a third of an octave up, rising with the square of speed
  AU.wind = ctx.createBufferSource(); AU.wind.buffer = n;
  AU.wind.loop = true; AU.wind.playbackRate.value = 0.83;
  const wf = ctx.createBiquadFilter(); wf.type = 'bandpass'; wf.Q.value = 0.7;
  wf.frequency.value = 560;
  AU.windF = wf;
  AU.windG = ctx.createGain(); AU.windG.gain.value = 0;
  AU.wind.connect(wf).connect(AU.windG).connect(master);
  AU.wind.start();

  // night insects get their own bus so the day/night switch can cross-fade them
  AU.nightG = ctx.createGain(); AU.nightG.gain.value = 0;
  AU.nightG.connect(master);

  /* 雨：一段宽带白噪。底下那层低通到 900 Hz 把「轰」切掉（雨没有低频，
     低频是风，风已经有 windG 了），上面 6.5 kHz 再切一次免得刺耳。
     音量不写死，交给 audioUpdate 按 MOOD.rain 推 —— 所以雨停是淡出的。 */
  AU.rain = ctx.createBufferSource(); AU.rain.buffer = n;
  AU.rain.loop = true; AU.rain.playbackRate.value = 1.0;
  const rnHp = ctx.createBiquadFilter(); rnHp.type = 'highpass'; rnHp.frequency.value = 900; rnHp.Q.value = 0.5;
  const rnLp = ctx.createBiquadFilter(); rnLp.type = 'lowpass';  rnLp.frequency.value = 6500; rnLp.Q.value = 0.7;
  AU.rainF = rnHp;
  AU.rainG = ctx.createGain(); AU.rainG.gain.value = 0;
  AU.rain.connect(rnHp).connect(rnLp).connect(AU.rainG).connect(master);
  AU.rain.start();

  // 背景音乐是内嵌的 4 首曲子，自己管音量，不占这里任何一根线 ——

/* A partridge does not say "two clean whistles" — it rasps a run of short
   harsh notes, the classic 咯咯咯, usually three to five of them with a hard
   attack and a slight downward slide, then silence. Every call varies the
   note count, the pitch, the spacing and the stereo position, because a
   repeated identical loop is the fastest way to make a bird sound like a toy.

   The note onsets are published so the renderer can hinge the bill open on
   exactly the notes you hear. */
function birdCall(){
  const { ctx, master, noise } = AU;
  const t0 = ctx.currentTime + 0.03;
  const pan = stereoPan(ctx, master, (Math.random()*2-1)*0.85);
  const base = 880 + Math.random()*300;            // 咯 sits around 900-1200 Hz
  const count = 1 + (Math.random()*5.7|0);         // 1-6, most often 3-5
  const notes = [];
  let t = t0;
  for (let i = 0; i < count; i++){
    const dur  = 0.085 + Math.random()*0.075;
    const f0   = base * (1 - i*0.045) * (1 + (Math.random()-0.5)*0.10);
    const peak = 0.085 * (0.7 + Math.random()*0.5);

    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0*1.16, t);
    o.frequency.exponentialRampToValueAtTime(f0*0.86, t + dur);

    // pleasant beep into something a bird would actually make
    const nz = ctx.createBufferSource(); nz.buffer = noise; nz.playbackRate.value = 1.4;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = f0*2.1; bp.Q.value = 1.8;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(peak*0.30, t + dur*0.25);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + dur*0.22);
    g.gain.exponentialRampToValueAtTime(peak*0.55, t + dur*0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    o.connect(g).connect(pan);
    nz.connect(bp).connect(ng).connect(pan);
    o.start(t);  o.stop(t + dur + 0.02);
    nz.start(t); nz.stop(t + dur + 0.02);

    notes.push({ t: t - t0, d: dur });
    t += dur + 0.05 + Math.random()*0.04;

/* 0..1 bill opening that tracks the notes, read straight off the audio clock so

  if (!AU.ready || !AU.callNotes) return 0;

  let m = 0, last = 0;
  for (const n of AU.callNotes){
    last = n.t + n.d;
    const u = (ct - n.t) / n.d;
    if (u > 0 && u < 1){
      const e = u < 0.16 ? u/0.16 : 1 - (u-0.16)/0.84;   // snap open, ease shut
      if (e > m) m = e;
    }

function birdHuff(){

/* 刮到旁边那辆车：金属短促的一声「铛」+ 一层闷响。

  if (!AU.ready || !AU.on) return;
  const { ctx, noise, master } = AU;

  const s = ctx.createBufferSource(); s.buffer = noise; s.playbackRate.value = 1.7;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 7;
  bp.frequency.setValueAtTime(2400 + force*1500, t);

  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);

/* ══════════════════ background music ══════════════════

              started:false, auto:false, autoT:0,

function b64url(b64){

/* ── 歌词时间轴 ───────────────────────────────────────────
   不手写时间戳 —— 那样 AI 把歌唱快一点就全错位了。
   量音频本身：解码 → 40ms 一格的能量包络 → 用迟滞阈值找出人声句子之间的
   空隙 → 每个段起点对应一行歌词。唱快唱慢都对得上。

   量不出来（解码失败、没有歌词）就退回「按歌曲总长平均分」，
   字幕照样有，只是没那么贴。 */
function lyricSegments(ab){
  const sr = ab.sampleRate, ch = ab.getChannelData(0);
  const win = Math.max(1, Math.round(sr*0.04));
  const n = Math.floor(ch.length/win);
  // 每格只抽 ~48 个点。起唱点检测要的是「这一格响不响」，不是精确 RMS；
  // 逐点累加的话一首三分钟的歌是 200k 格 × 1764 点 ≈ 3.5 亿次运算，
  // 会在主线程上卡住一两秒 —— 这是给「一直骑」用的东西，不能一按播放就掉帧。
  const step = Math.max(1, Math.floor(win/48));
  const env = new Float32Array(n);
  for (let i = 0; i < n; i++){
    let s = 0, c = 0;
    const o = i*win, e = o+win;
    for (let k = o; k < e; k += step){ const v = ch[k]; s += v*v; c++; }
    env[i] = Math.sqrt(s/c);
  }
  // 阈值跟着曲子本身走：用能量中位数当基准，所以响的慢的都量得出来。
  // 中位数只隔三个取一个来排 —— 200k 降到 ~70k，够稳，排序也快得多。
  const sub = [];
  for (let i = 0; i < n; i += 3) sub.push(env[i]);
  sub.sort((a,b) => a-b);
  const med = sub[Math.floor(sub.length*0.5)] || 1e-6;
  const HI = Math.max(med*3.0, 0.010);
  const LO = Math.max(med*1.5, 0.0045);
  const segs = [];
  let inSeg = false, segStart = 0, gap = 0;
  for (let i = 0; i < n; i++){
    if (!inSeg){
      if (env[i] > HI){ inSeg = true; segStart = i; gap = 0; }
    } else {
      if (env[i] < LO){
        if (++gap*0.04 > 0.40){ segs.push(segStart*0.04); inSeg = false; gap = 0; }
      } else gap = 0;
    }
  }
  if (inSeg) segs.push(segStart*0.04);
  return segs.filter((t,i) => i === 0 || t > 0.8);   // 跳过前奏
}
function analyseTrack(i){
  const tr = BGM_TRACKS[i];

  // file:// 双击打开时页面 origin 是 null，fetch('blob:null/...') 在部分浏览器
  // 会被拦掉，那样字幕就静默失效了 —— 而这恰恰是这个文件最主要的打开方式。
  // 源数据本来就在手上，没必要赌浏览器给不给 fetch blob。
  let bytes;

    bytes = new Uint8Array(bin.length);

    tr.times = null;
    return;

      const n = tr.lyrics.length;
      tr.segCount = segs.length;
      if (!segs.length) throw 0;
      if (segs.length === n){
        tr.times = segs;
      } else if (segs.length > n){
        // 检出的句数比歌词多：在实际起唱点里等距挑 n 个。
        // 这里步长 >= 1，取出来的下标严格递增，时间点也就不会重复。
        tr.times = Array.from({length:n}, (_,k) => segs[Math.round(k*(segs.length-1)/(n-1))]);

        // 这时候不能拿 segs 直接映射 —— 会把好几行挤到同一时刻，
        // 中间的行一闪就没。改成在首尾起唱点之间线性铺开，保证严格递增。

  BGM.cur += (target - BGM.cur) * Math.min(1, dt*3.0);
  BGM.el.volume = clamp(BGM.cur, 0, 1);

  // 歌词字幕：当前时刻落在哪一行，就显示哪一行。
  // lyrics.length 也要判 —— 空数组在 JS 里是真值，只判 !tr.lyrics 的话
  // 器乐曲会走进这个分支，取出 undefined，屏幕上冒出「undefined」三个字。
  const tr = BGM_TRACKS[BGM.i];
  let txt = '';
  if (tr.lyrics && tr.lyrics.length && tr.times && !BGM.el.paused){
    const t = BGM.el.currentTime;
    for (let k = tr.times.length-1; k >= 0; k--){
      if (t >= tr.times[k]){ txt = tr.lyrics[k]; break; }
    }
  }
  if (txt !== BGM.shown){
    BGM.shown = txt;
    $('lyric').textContent = txt;
    $('lyric').classList.toggle('on', txt !== '');
  }
}

/* 手动碰过播放器 = 这一段我自己的选曲说了算，换段时别抢
   ⚠️ 面板和电影模式浮条是**同一组操作的两个入口**，所以处理器必须只有一份。
     写两遍的话，改了面板忘了浮条（或者反过来），就会出现「一个能切歌另一个不能」，
     而这种不一致不会抛异常、也不会让任何检查变红。
     同理自动灯不再用 e.currentTarget 自己点亮 —— 从浮条点的话亮的就只有浮条，
     面板那边还灭着。统一交给 paintBgm() 画，两个出口一起更新。 */
const bgmPrev = () => { BGM.manual = true; bgmStep(-1); };
const bgmNext = () => { BGM.manual = true; bgmStep(1); };
const bgmToggle = () => {
  BGM.manual = true;
  // ⚠️ 判据是 **started**（真的在放）不是 want（想放）。
  //    初始 want=true / started=false，键上画的是 ▶；按 want 判就会走进
  //    bgmPause()，于是「点一下播放」什么也没发生 —— 按钮点了没反应。
  if (BGM.started) bgmPause(); else bgmPlay();
};
const bgmAuto = () => { BGM.manual = true; BGM.auto = !BGM.auto; BGM.autoT = 0; paintBgm(); };
$('bPrev').addEventListener('click', bgmPrev);
$('bNext').addEventListener('click', bgmNext);
$('bBgm').addEventListener('click',  bgmToggle);
$('cPrev').addEventListener('click', bgmPrev);
$('cNext').addEventListener('click', bgmNext);
$('cPlay').addEventListener('click', bgmToggle);
$('cAuto').addEventListener('click', bgmAuto);
$('rBgm').addEventListener('input', e => { BGM.manual = true; BGM.user = e.target.value/100; });
$('bAuto').addEventListener('click', bgmAuto);
bgmBuild();
paintBgm();

function audioUpdate(dt, dCrank){
  if (!AU.ready) return;
  const ctx = AU.ctx, t = ctx.currentTime;
  if (!AU.on) return;
  const v = S.speed/3.6;
  const roll = S.running ? clamp(v/9, 0, 1) : 0;
  const wet = MOOD.wet;
  // 湿沥青不吸声，胎噪跟着抬一点；频率反而压低，因为水膜把高频吃了
  AU.roadG.gain.setTargetAtTime(roll*0.17*(1 + wet*0.35), t, 0.12);
  AU.roadF.frequency.setTargetAtTime(230 + v*135 - wet*40, t, 0.15);
  AU.windG.gain.setTargetAtTime(roll*roll*0.09, t, 0.30);
  AU.windF.frequency.setTargetAtTime(540 + v*100, t, 0.35);
  AU.rainG.gain.setTargetAtTime(MOOD.rain*0.10, t, 1.2);   // 1.2 s：雨停要慢慢收

  // one chain click per pedal stroke = every half crank revolution
  if (dCrank > 0){
    AU.clickAcc += dCrank;
    while (AU.clickAcc >= Math.PI){
      AU.clickAcc -= Math.PI;
      chainClick(clamp(0.30 + v*0.075, 0.18, 1));
    }
  } else AU.clickAcc = 0;

  // 下雨下雪，鸟不叫、虫不鸣 —— 不是「音量为 0」，是真的不触发，
  // 所以雨停之后那一声鸟叫是重新计时的，不会攒一堆一起叫出来。
  const quiet = MOOD.rain > 0.2 || MOOD.snow > 0.5;

  AU.nextBird -= dt;
  if (AU.birds && !quiet && AU.nextBird <= 0){ birdCall(); AU.nextBird = 2.5 + Math.random()*12; }
  else if (!AU.birds || quiet) AU.nextBird = 0.8;     // 打开后约一秒内就会听见第一声

  AU.nextCricket -= dt;
  if (AU.nextCricket <= 0 && MOOD.lamps && !quiet){ cricketChirp(); AU.nextCricket = 0.7 + Math.random()*1.9; }
  else if (AU.nextCricket <= 0) AU.nextCricket = 0.8;

  AU.nextHuff -= dt;
  if (AU.nextHuff <= 0 && S.sweat > 0.25){
    birdHuff();
    AU.nextHuff = 1.1 - S.sweat*0.55 + Math.random()*0.5;
  } else if (AU.nextHuff <= 0) AU.nextHuff = 0.6;
}
function audioUnlock(){
  const ctx = audioInit();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  AU.master.gain.setTargetAtTime(AU.on ? 0.85 : 0, ctx.currentTime, 0.35);
  // 浏览器只在真实手势里放行音频，所以背景音乐也在这时候才建起来
  bgmBuild();
}

/* ══════════════════ 自动巡航的舵 ══════════════════
   两个小控制器叠在一起，都只输出一个 −1..+1 的「打方向」量，
   走的还是下面 steering 那条 steer → yaw → lat 的老路 ——
   也就是说自动和手动**共用同一套车辆物理**，不存在「自动版骑法」。

   ① 循线：横向偏差 + 车头偏差（阻尼项）
      符号：车辆链是 `yaw -= steer·k`，然后 `lat += -sin(yaw)·v·dt`。
      于是 **steer > 0 → yaw 减小 → lat 增加（往 +z，右）**。
      横向误差要往「有偏差的那边」掰，所以是 **+KP·(autoLat − lat)**。
      ⚠️ 车头误差那一项**也是正号**，不是负号。我第一版写成了减号，
         线性化之后特征值实部 +0.685 —— 系统直接发散，车一路歪出路去，
         屏幕上只表现为「开巡航就冲下路肩」，分不出是极性反了还是增益不对。
         推导很短：yaw 项要起阻尼，就必须让 steer 增大时 yaw 减小；
         而 yaw 是在**减** steer，所以 steer 得和 yaw **同号**。
         写成减号 → steer = -KD·yaw → yaw' = +0.884·KD·yaw，正反馈。
      两个都正比会一直绕圈；两个都反比会直接飞出去。

   ② 避让：谁挡在前面，就把**目标横向位置**让开，让完再回中线。
      让的目标位置慢慢挪（autoLat），不是硬切 —— 硬切会让车猛打一把。
      只看**同向**的：对向车固定在 z ≈ −1.95 的另一条道上，
      横向差 1.95 m，碰撞判据（±0.38）根本够不着，看它只会让车乱晃。 */

const LANE_HALF = ROAD_W/4;     // 右车道半宽 = 0.975，中线在 lat = 0
const AVOID_OFF = 0.62;         // 避让时让开多少米（0.62 < 0.975−0.15，还在道上）
const AVOID_HIT = 0.75;         // 「值得绕」的横向门槛（比碰撞半宽 0.38 宽一截）
const KP_LAT = 1.10;            // 横向偏差 → 打方向
const KD_YAW = 3.60;            // 车头偏差 → 打方向（阻尼项，**正号**）

/* 增益是扫出来的，不是拍出来的：25 组 (KP,KD) 用真 physics 跑
   lat0=0.8 的阶跃响应，量过零时间 / 超调 / 尾段极差 / 0.9m 起步收敛 /
   歪航向掰回。1.30/2.60 那组超调 21.6 cm —— 屏幕上是一条明显的甩尾 S，
   用户看到的正是「走不直」。1.10/3.60 超调 4.4 cm、尾段极差 0.00 cm、
   0.9 m 起步 1.10 s 收敛、歪 0.28 rad 航向 1 秒内掰正。
   再往上加阻尼（KD=4.2）能压到 0.4 cm，但 0.9 m 起步要 1.33 s，
   而且 10 秒都不过零 —— 从「甩」变成「赖」，不值。 */

function cruiseTick(dt){
  const spd = S.speed/3.6;
  let side = 0, blockX = 0;

  for (const r of RIDERS){
    const u = r.userData;
    if (u.dir <= 0) continue;                    // 对向在另一条道上
    const dx = r.position.x;
    if (dx < -1 || dx > 34) continue;            // 已经过去了 / 还太远
    if (Math.abs(r.position.z) > LANE_HALF) continue;   // 横向本来就够不着
    // 只在我们要追上去的时候才让。并排的不用管 —— 那是另一条车道的事。
    const closing = Math.max(0.6, spd - u.vr/3.6);
    if (dx > Math.max(9, closing*2.6)) continue; // 还来得及，现在不用动
    /* 挡没挡住？**参照系必须是固定的**：拿中线(0)和我要去的 autoLat 比，
       千万别拿「车现在在哪」比。
       拿当前位置比会踩一个很隐蔽的坑：我为了躲它已经让到 −0.62 了，
       于是 |r.z − S.lat| = 0.44+0.62 = 1.06 > AVOID_HIT+0.30 (1.05)
       刚好成立 → 判成「我已经离它够远，不用躲了」→ 放行；
       autoLat 往 0 走的路上这个差又掉回门槛以内 → 重新触发。
       边界上来回极限环，实测 12 秒抖出 16 次换边（_cruisediag D1）。
       参照系跟着自己动，判据就没有滞回可言。 */
    if (Math.abs(r.position.z) > AVOID_HIT &&
        Math.abs(r.position.z - S.autoLat) > AVOID_HIT) continue;
    // 往空的一边让：车道中心是 0，哪边余量大去哪边。
    // 这样选出来的方向天然贴着中线，不用另外给「靠右行驶」打补丁。
    const roomR = LANE_HALF - (r.position.z + 0.95);
    const roomL = (r.position.z - 0.95) + LANE_HALF;
    side = roomR >= roomL ? 1 : -1;
    blockX = dx;
    break;                                       // 只听最近的那一辆
  }

  // 目标横向位置平滑地挪过去，让完慢慢回中线
  const want = side * AVOID_OFF;
  S.autoLat += (want - S.autoLat) * (1 - Math.pow(0.05, dt));
  if (Math.abs(want) < 0.01 && Math.abs(S.autoLat) < 0.02) S.autoLat = 0;

  // 前方真的有个解不开的东西就收油，别顶上去。不收油的话避让一旦来不及，
  // 巡航就变成一台自动撞车机器 —— 避让失败时减速比撞上去合理。
  if (side && blockX < 4.5) S.target = Math.min(S.target, S.speed*0.55);

  // 换边的时候说一句，让「它为什么在躲」看得见
  if (side !== S.autoSide && side !== 0){
    S.autoSide = side;
    $('cap').innerHTML = side > 0
      ? '鹧鸪：前面那辆，我往<s>右</s>绕一下'
      : '鹧鸪：我从<s>左</s>边过去';
    S.capT = 2.2;
  } else if (!side) S.autoSide = 0;

  // 循线：偏了就往回掰，歪了就往回正。两项都是**正号**，理由见上面。
  return clamp(KP_LAT*(S.autoLat - S.lat) + KD_YAW*S.yaw, -1, 1);
}

/* ══════════════════ 鹧鸪的状态 ══════════════════
   四条量，全部由**已经发生过的事**推出来：速度、里程、碰撞、雨量、
   身边刚过去的车。**一个骰子都不掷。**

   这条纪律是硬要求。掷出来的情绪是噪声：观众看到鸟突然一惊，
   往前找不到原因，就只能理解成「随机动画」—— 看了三秒就麻木。
   而「刚才撞了一下，它炸了毛」「雨刚下起来，它缩了」，
   观众自己就能对上因果，反应本身就成了叙事的回报。

   四条量的性格刻意各不相同，混在一起才不像一个函数在动：
   ─────────────────────────────────────────────
   累    fatigue  里程的**饱和**函数 + 速度。攒得住，慢下来能歇回来。
   用力  sweat    只跟速度走，不留记忆 —— 慢下来立刻没了。
   惊吓  startle  撞车顶到 1，1.1 秒衰完。尖、短、跟碰撞严格同步。
   湿    wet      跟着雨量涨，雨停之后慢慢干。慢，黏。
   ─────────────────────────────────────────────
   另有两个一次性的：回头看（身边有车刚过去）、抖水（雨刚开始）。 */

const approach = (cur, want, k, dt) => cur + (want - cur) * (1 - Math.pow(k, dt));

function moodTick(dt){
  /* ① 累。里程是主项。**用饱和曲线不用线性** ——
     `1 - exp(-km/2.6)` 意味着骑到 2.6 km 就累掉六成、8 km 九成五，
     线性的话骑 5 km 会比骑 0.5 km 累十倍，那不是累，那是里程表。
     速度的那一项范围要拉开：慢慢蹭不累（0.35 封顶），真蹬起来才累
     （满项 1.0）。第一版写的是 (0.55 + 0.45*fast) —— 慢速骑到
     0.55，那「累了」的台词门槛永远够不着。 */
  const fast = clamp((S.speed - 17) / 15, 0, 1);
  const tiredWant = clamp((1 - Math.exp(-S.km / 2.6)) * (0.35 + 0.65*fast), 0, 1);
  S.fatigue = approach(S.fatigue, tiredWant, 0.25, dt);
  // 歇一歇：滑行或停车的时候掉得快一点，所以疲劳的回落比上升灵
  S.fatigue = clamp(S.fatigue - (S.speed < 8 ? dt*0.020 : 0), 0, 1);

  /* ② 惊吓。S.hitT 被设成 0.70 的那一帧顶满，之后按 1.1 秒衰完。
     判据用 `> 0.60` 而不是 `> 0`：碰撞有 0.70 秒冷却，那之后
     S.hitT 一路往下掉，只有开头 ~0.1 秒在这个窗口里 ——
     正好是「撞完猛地一抽」该有的宽度。 */
  if (S.hitT > 0.60) S.startle = 1;
  S.startle = Math.max(0, S.startle - dt / 1.1);

  /* ③ 湿。雨大就湿（快，约 0.35 秒到位），雨停慢慢干（约 20 秒）。
     两边的 k 差一个数量级，羽毛「吸进去」和「甩干」本来就不一样快。 */
  const rain = MOOD.rain || 0;
  S.wet = approach(S.wet, rain > 0.04 ? 1 : 0, rain > 0.04 ? 0.08 : 0.95, dt);

  /* ④ 回头看。一辆车刚刚从身边过去、还在半米以内的时候看一眼。
     不给随机：随机的转头只会让这鸟显得神经质。
     ⚠️ 边界方向别写反：这里要留的是 [-6.5, -0.5]（正在往后退的那段），
        所以 continue 的条件是 `> -0.5 || < -6.5`。
        第一版写成 `> -6.5 || < -0.5`，那个区间是**空的** ——
        回头看从头到尾一次都没触发过，是回归里抓出来的。 */
  S.lookT = Math.max(0, S.lookT - dt);
  if (S.lookT <= 0){
    for (const r of RIDERS){
      const dx = r.position.x;
      if (dx > -0.5 || dx < -6.5) continue;             // 正从身边往后退
      if (Math.abs(r.position.z - S.lat) > 1.5) continue;// 隔得远，够不着，不看
      S.lookT = 1.1;
      S.lookSide = (r.position.z > S.lat) ? 1 : -1;     // 它从哪边过去就往哪边看
      break;
    }
  }
  // 强度是个 0→1→0 的包络：一秒里抬头看完再低下去，不是「看一秒的定妆」
  S.lookAmt = S.lookT > 0 ? Math.sin((1 - S.lookT/1.1) * Math.PI) : 0;

  /* ⑤ 刚下雨 → 抖水。判的是**雨量的跳变**而不是雨量本身，
     不然雨一直下的时候它会每帧都抖。
     这也是唯一会因此说一句话的地方 —— 「刚淋着了」是有原因的。 */
  if (rain - S.rainPrev > 0.25) S.startle = Math.max(S.startle, 0.55);
  S.rainPrev = rain;

  /* ⑥ 累到某个程度说一句。只说一次（saidTired），否则会一直刷。 */
  if (!S.saidTired && S.fatigue > 0.55){
    S.saidTired = true;
    $('cap').innerHTML = '鹧鸪：腿有点<strong>酸</strong>了，歇会儿行不行';
    S.capT = 3.6;
  }
  if (S.fatigue < 0.32) S.saidTired = false;   // 歇回来了，才可能再说一次
}

function frame(){
  /* 这一行曾经被弄丢过：dt 是**自由变量**，全文件一次都没声明过，
     于是 frame() 第一行就 ReferenceError，每一帧都抛 —— 画面永远是黑的，
     而语法检查、作用域体检、六套 harness、交付自检**全部通过**。
     为什么全都抓不到：harness 每一套都自己 supply 一个 dt，
     检查器查的又只是「调用的函数有没有声明」，没人查「用到的变量有没有声明」。

     读数走 THREE.Clock：visibilitychange 那个处理器里特意调了一次
     clock.getDelta()，就是为了在切回前台时把冻结期间积压的那一大口丢掉，
     不然 dt 会是几分钟、整个模拟瞬移。这里再夹一道 0.05 秒上限兜底。
     ⚠️ dt 必须是 frame() 的函数作用域，不能塞进 if (S.running) 里 ——
        rig 段（眨眼、嘴、尾巴、setLeg）在那个 if 之外，也用 dt。 */
  const dt = Math.min(0.05, clock.getDelta());
  let dCrank = 0;
  requestAnimationFrame(frame);

  if (S.running){
    S.tSec += dt;

    /* ── throttle & brake ──────────────────────────────────────
       两条路：有巡航就跟着巡航曲线走，没有就直接踩踏板。
       刹车比给油狠得多（车停下来比冲出去快，这是真的），松手
       不掉速到零，只是慢慢滑 —— 滚阻加风阻。 */
    if (S.cruise){
      S.target = Math.max(6, Math.min(34, 18 + Math.sin(S.tSec*0.33)*11 + Math.sin(S.tSec*0.11)*5));
      S.speed += (S.target - S.speed) * (1 - Math.pow(0.0015, dt));
    } else {
      if (keys.up)      S.speed += 5.6 * dt;      // 踩
      if (keys.down)    S.speed -= 13.0 * dt;     // 刹
      if (!S.sliderHold) S.speed -= S.speed * dt * 0.045;   // 松手滑行（鼠标按着滑杆时不算）
      if (S.speed < 0) S.speed = 0;
      if (S.speed > V_MAX) S.speed = V_MAX;        // 和滑杆上限同一个数，别出现键盘能到、滑杆到不了的
    }
    S.target = S.speed;

    /* ── 自动巡航的舵 ──────────────────────────────────────
       原来巡航只是「自动给油」，**方向完全不归它管**：steerIn 只读键盘，
       松手就回 0。可 yaw 是一个**积分量** —— 按过方向之后它不会自己回零，
       于是车会沿着一个歪掉的航向一直斜着往前开，出了路面也没人拉回来。
       这就是「开着自动巡航总会偏离」的全部原因，跟避让一点关系都没有。 */
    S.steerIn = S.cruise ? cruiseTick(dt) : (keys.right ? 1 : 0) - (keys.left ? 1 : 0);

    /* ── steering ─────────────────────────────────────────────
       三个量：steerIn 是按键原始状态，steer 是打方向之后
       真正的把手角度（一阶平滑，手不会瞬间打死），yaw 是车头
       朝向。车头转了，车才真的横着走 —— 横向速度就是前进速度
       乘上航向角的正弦。

       朝向约定：车头朝 +x、头顶 +y，所以「右」= forward × up
       = +x × +y = **+z**。绕 Y 轴转正角是把 +x 扳向 -z，那是
       左 —— 所以往右打方向 yaw 必须是负的，整条链的符号都跟着反。 */
    // 归位/到位都要快：自行车打方向本来就是立刻生效的，车把不是车的转向角。
    // 留 0.25s 左右的过渡只是为了不生硬，不是为了模拟迟钝。
    S.steer  += (S.steerIn - S.steer) * Math.min(1, dt*11.0);
    // 越快打得越沉：真的车高速打死方向是要翻的，所以横摆率随速度衰减。
    // 这样低速灵活、高速稳当，而不是越快车头抽得越凶。
    const spd = S.speed / 3.6;
    // 静止时车头不能自己转。横摆率本质上是横向加速度除以车速，车速为 0
    // 这个式子就没定义了。以前只靠 clamp(speed/11) 挡，后来换成随速度
    // 衰减的写法把这个下限弄丢了，结果是「刹停后还按着方向键」会让车
    // 在原地无限转圈 —— 横移量是 0 没错，可 yaw 一直在累加，边界也就
    // 永远触发不了，没人去掰它。速度低到一定程度就打不动方向。
    const grip = clamp(S.speed/3.5, 0, 1);
    S.yaw -= S.steer * 1.45 * grip * dt / (1 + S.speed*0.032);

    // 横向位置：航向 θ 下的前进方向是 (cosθ, 0, -sinθ)，z 分量就是 -sinθ
    S.lat += -Math.sin(S.yaw) * spd * dt;

    // 路面边界。沥青整体被 LANE 推偏了，所以路面中心不在 0，两侧余量不等，
    // 照抄一个对称的 ROAD_W/2 会让车有一半时间骑在草上。
    // 沥青之外还留一点路肩可以压出去，再外面才真的拦住。
    //
    // 这里只掰 yaw，不掰 steer：之前还顺手把 steer 乘 0.3，结果是车顶在
    // 路肩上时你明明按着方向键，车把却一直往回弹成直的。顶着草皮本来就
    // 转不动，该松手回正是松手以后由 S.steer 自己归零的事。
    if (S.lat < T_MIN - 0.55){ S.lat = T_MIN - 0.55; S.yaw *= 0.55; }
    if (S.lat > T_MAX + 0.55){ S.lat = T_MAX + 0.55; S.yaw *= 0.55; }
    S.offRoad = (S.lat < T_MIN || S.lat > T_MAX)
      ? Math.min(1, S.offRoad + dt*5) : Math.max(0, S.offRoad - dt*3);
    /* 草的阻力必须**永远小于油门**，否则就是死锁。
       之前这里是常数 7.0/s，而油门只有 5.6/s —— 在草上速度只会往下掉，
       永远回不到 0 以上；停下之后 grip 归零、方向也打不动，人就这么
       钉在草地上，鼠标拖滑杆加多少都没用。

       改成随速度走：越快阻力越大（高速压进去会被狠狠拽慢，这是草该有
       的惩罚），但低速时只剩一点点，油门一定压得住。想逃随时逃得掉。
         0 km/h → 0.8/s  （油门 5.6 轻松压过）
        15 km/h → 3.2/s
        30 km/h → 5.6/s  （刚好和油门持平，草把速度封顶在 30 左右） */
    if (S.offRoad > 0){
      S.speed = Math.max(0, S.speed - S.offRoad * (0.8 + S.speed*0.16) * dt);
    }

    const v = S.speed / 3.6;
    S.km += v*dt/1000;
    /* 路段切换。km 一跨过段界就换景、换曲、喊一句。
       第一帧 S.seg 还是 -1，那只是「刚起步还没定」，静悄悄铺上就完事，
       不该张嘴也不该切歌。 */
    const seg = segAt(S.km);
    if (seg !== S.seg){
      const boot = (S.seg < 0);
      S.seg = seg;
      applyRoute(seg);
      if (!boot){
        const s = ROUTE[seg];
        $('cap').innerHTML = s.say;
        S.capT = 4.2;
        // 用户手动换过歌就不抢了：让那一首放完他选的那一段。
        // 抢在什么条件下才切：曲子已经响了 12 秒以上免得刚按完就又被拽走。
        if (!BGM.manual && s.trk !== BGM.i && BGM.ready &&
            BGM.el.currentTime > 12) bgmStepTo(s.trk);
        BGM.manual = false;
      }
    }
    /* 带子权重每帧跟着 km 走 —— 段专属带的渐变全靠它。
       ⚠️ **必须排在换段块之后**，不能放前面：
          applyRoute 内部也调了一次 applyBands（按段中央），那是给
          「直接跳到某一段」用的。放前面的话，跨段那一帧会被段中央
          的满权重覆盖掉，渐变在最该发生的那一帧被抹平 ——
          于是「唰一下全换」只是从 applyRoute 挪到了换段块里，没修掉。
       代价很小：全 BANDS 加起来三百来个 visible 开关，一帧不到 0.05 ms。 */
    applyBands(S.km);
    /* 段的光同样每帧跟 km 走，理由和上一行一样。排在 applyBands 后面：
       两者都读 km，谁都不该覆盖谁。 */
    applySegLight(S.km);
    /* 导演模式：到点切下一镜。**必须每帧查**，不能靠 setTimeout ——
       标签页一进后台，setTimeout 会被浏览器压着不放，切镜就停了；
       而每帧查的话，页面回来第一帧就补上。 */
    if (DIR.on){
      DIR.t += dt;
      if (DIR.t >= SHOTS[DIR.i].dur) dirShot((DIR.i + 1) % SHOTS.length);
    }
    const wheelRev = v / (2*Math.PI*R_WHEEL);
    S.wheel += wheelRev * Math.PI*2 * dt;
    S.crank += wheelRev * Math.PI*2 * dt;
    dCrank = wheelRev * Math.PI*2 * dt;      // handed to the audio engine for chain timing
    S.sweat = S.speed > 27 ? Math.min(1, S.sweat + dt*2) : Math.max(0, S.sweat - dt*2);

    // The ground plane does NOT scroll. The tarmac texture repeats every 10.5 m
    // and the verge every 2.8 m; at speed a scrolling offset turns those repeats
    // into a conveyor belt of identical tar cracks sliding under the wheels,
    // which reads as the road sliding rather than the bike riding. Leaving the
    // surface still also means the near ground never smears.
    //
    // All of the speed now comes from things that genuinely pass you: the
    // roadside props recycle in `world`, the wheels are geared to v/R, the dust
    // puffs off the rear tyre, and the camera shakes with the road surface.
    const d = v*dt;
    for (const o of world){
      o.position.x -= d;
      if (o.position.x < -o.userData.span*0.5){
        o.position.x += o.userData.span;
        // 有些东西是「每公里换一次内容」的（里程碑上的数字），
        // 回绕时得让它知道自己被搬到新位置了
        if (o.userData.onWrap) o.userData.onWrap(o);
      }
    }
    // 一整条路的东西都是死的，中间偏要有两样在转（风车、风机）、
    // 一盏在闪（塔顶航空警示灯），眼睛才会把那一处当成「地方」，
    // 而不是又一张背景贴图。
    for (const o of world){
      const sp = o.userData.spin;
      if (sp) for (const s of sp) s.o.rotation.z += dt * s.r;
    }
    if (MOOD.lamps){
      M.beacon.emissiveIntensity   = Math.sin(S.tSec*2.1) > 0.5 ? 2.6 : 0.12;
      M.glassLit.emissiveIntensity = 1.6;
    } else {
      M.beacon.emissiveIntensity   = 0;
      M.glassLit.emissiveIntensity = 0;
    }
    // lane paint travels at exactly the same d, wrapping one lattice step back
    for (const p of markParts){
      p.o.position.x -= d;
      if (p.o.position.x < p.bx - p.span) p.o.position.x += p.span;
    }
    // clouds drift slower than the road
    for (const c of clouds.children){
      c.position.x -= d * 0.14;
      if (c.position.x < -CLOUD_SPAN*0.5) c.position.x += CLOUD_SPAN;
    }
    stars.rotation.y += dt*0.004;
    // 雨和雪只在真在下的时候才进来算，平时就是两次小数比较
    updateWeather(dt, d);

    /* ---- 路上的其他骑行者 ----
       同向：相对速度 = 它的速度 − 你的速度。你比它快 → rel 为负，它往后退，
             你把它超过去；你比它慢 → rel 为正，它从前面追上来。
       对向：相对速度 = **它的速度 + 你的速度**（`-=` 出去，所以是迎面压过来）。
             这里原来只减了它自己那点、**漏掉了 -v**，迎面速度只剩真实值的
             一半（36 km/h 时 29%），一百米外看像在慢慢往后蹭。
       开到身后 45 m 才回收；超过可见距离就重新安排一辆。 */
    for (const r of RIDERS){
      const u = r.userData;
      if (u.dir > 0){
        const rel = u.vr/3.6 - v;
        r.position.x += rel * dt;
        if (r.position.x < -30 || r.position.x > 165) layoutRider(r, false);
      } else {
        /* 对向：相对速度 = 它的速度(负方向) − 你的速度。
           原来只写了 -(u.vr/3.6)，**漏掉了 -v**：迎面速度只有真实值的一半，
           你越快差得越多（36 km/h 时只到 29%）。后果是对向车是「爬」过来的，
           一百米外看根本不像在冲你，相对路面滑行反而像在倒车/倒退。 */
        r.position.x -= (u.vr/3.6 + v) * dt;
        if (r.position.x < -45 || r.position.x > 280) layoutRider(r, false);
      }

      // 蹬踏：曲柄转一圈 = 轮子转一圈，轮子转速就是它自己的速度 / 轮半径。
      // 原来这里写的是 |rel| > 0.15 才转 —— 你跟它同速时它的轮子会整个停住，
      // 看着像滑行。骑行者自己的蹬踏只该由自己的速度决定。
      const w = (u.vr/3.6) / u.bike.userData.R;
      u.phase += w * dt;
      for (const wh of u.bike.userData.wheels) wh.rotation.z = -u.phase;
      u.bike.userData.crank.rotation.z = -u.phase;
      // 腿用两骨 IK 跟踏车。原来只是两条腿整体跟着曲柄转，等于大腿绕着五通
      // 甩、而屁股不动 —— 看着像在蹬空气。IK 之后髋固定在鞍座、膝盖跟踏车。
      u.bike.userData.setLegs(u.phase);

      // 远处的不必每帧细算：80m 以外腿基本看不清，跳帧省开销
      if (r.position.x < 80 || r.position.x > -8){
        const bob = Math.sin(u.phase*2) * 0.012;
        u.bike.position.y = bob;
        u.bike.rotation.z = Math.sin(u.phase*2 + 0.6) * 0.04;
        const p = u.pet.userData.parts;
        p.head.position.y = (p.head.userData.baseY || (p.head.userData.baseY = p.head.position.y))
                          + Math.sin(u.phase*2 + 1.1) * 0.012;
        p.head.rotation.z = Math.sin(u.phase*2 + 0.4) * 0.05;
        if (p.tail) p.tail.rotation.z = (p.tail.userData.bz || (p.tail.userData.bz = p.tail.rotation.z))
                                       + Math.sin(u.phase*2.4) * 0.12;
      } else {
        r.visible = true;
      }
      // 太远的整组隐藏，连投影都不用提交。对向车要看得远一点 ——
      // 它们迎面冲过来，提前太远才出现会显得像突然冒出来的。
      r.visible = r.position.x > -25 && r.position.x < (u.dir < 0 ? 200 : 150);
    }

    /* ---- 碰撞 ----
       原来七辆车直接从你身上穿过去。现在按车身矩形判交：纵向 ±0.82 m、
       横向 ±0.38 m。撞上以后横向互推（你被顶得轻一点，谁让你是主动方）、
       掉一截速度、车头猛偏一下、镜头抖一下，再配一声闷响和一句嘴贫。
       0.7 秒冷却，否则贴着蹭的时候每帧都触发，车会原地抽搐。 */
    if (S.hitT > 0) S.hitT -= dt;
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt*1.9);
    if (S.hitT <= 0){
      for (const r of RIDERS){
        const dx = r.position.x;
        if (dx < -0.82 || dx > 0.82) continue;
        const dz = r.position.z - S.lat;
        if (dz < -0.38 || dz > 0.38) continue;
        const side = (dz >= 0) ? 1 : -1;
        const push = (0.38 - Math.abs(dz)) * 0.85 + 0.06;
        r.position.z += side * push;
        S.lat      -= side * push * 0.55;
        S.yaw      += side * 0.17;
        S.target    = Math.max(0, S.target - 4.5);
        S.shake     = 0.55;
        S.hitT      = 0.70;
        bumpSound(Math.min(1, push*2.4));
        hitQuip(side);
        break;
      }
    }
    // 碰撞把 lat 顶出去之后仍然要回到路面边界内，不然会被顶到草地上
    S.lat = Math.max(T_MIN - 0.55, Math.min(T_MAX + 0.55, S.lat));

    // dust off the rear wheel
    S.dustAcc += dt * (10 + S.speed*1.5);
    while (S.dustAcc >= 1){ S.dustAcc -= 1; spawnDust(v); }

    S.capT -= dt;
    if (S.capT <= 0) rotateCaption();

    $('hSpeed').innerHTML = S.speed.toFixed(1) + '<small>km/h</small>';
    $('hCad').innerHTML   = Math.round(wheelRev*60) + '<small>rpm</small>';
    $('hDist').innerHTML  = S.km.toFixed(2) + '<small>km</small>';
    $('vSpeed').textContent = S.speed.toFixed(1) + ' km/h';
    // 鼠标正按在滑杆上就别回写，否则会和拖拽打架
    if (!S.sliderHold) $('rSpeed').value = S.speed.toFixed(1);
    $('hLean').style.transform = `translateX(${(S.steer*11).toFixed(1)}px) rotate(${(S.steer*-11).toFixed(1)}deg)`;

    /* 鹧鸪的状态。**必须放在碰撞之后** —— moodTick 判惊吓看的就是
       S.hitT 刚被设成 0.70 的那一帧；放在前面的话它读到的是上一帧的旧值，
       惊吓会整整晚一帧，看着像「撞完先顿一下再炸」。 */
    moodTick(dt);
  }

  // speed pushes the FOV out for a rush effect
  const wantFov = 47 + clamp((S.speed-4)/32, 0, 1) * 15;
  if (Math.abs(wantFov - lastFov) > 0.05){
    camera.fov = wantFov; camera.updateProjectionMatrix(); lastFov = wantFov;
  }

  // camera
  // ⚠️ 自动环绕**必须**跟着 S.running 一起停。暂停时整个仿真冻住了，
  //    镜头却还在绕：实测暂停 3 秒 camAz 转了 0.96 rad（55°），
  //    而且 azT / idle 都是无上限累加的 —— 暂停 10 分钟就是绕 10 圈，
  //    等你回来镜头已经在一个完全随机的角度。画面里鸟看着就不在车上
  //    （正后方看腿和车架叠在一起，低角度看鸟像是飘在车旁边）。
  //    「暂停」要的是一张静止的画，不是镜头在背后偷跑。
  //    CAM.idle 照旧累加：恢复之后自动环绕立刻接上，符合直觉。
  if (!CAM.dragging) CAM.idle += dt;
  if (S.running && CAM.spin && CAM.idle > 2.0) CAM.azT += dt * 0.32;
  const k = 1 - Math.pow(0.0008, dt);
  // ⚠️ 这三行的平滑也必须跟着 S.running 一起停。自动环绕停了、插值没停：
  //    暂停时点面板上的「正面/背面/鸟特写」，setView 改了 azT/polT/distT，
  //    镜头当场就滑过去 —— 暂停要的是一张**完全静止**的画。
  //    恢复之后它会补滑到新机位，那是应该的：暂停时点的机位本来就该生效。
  if (S.running){
    CAM.az   += (CAM.azT - CAM.az) * k;
    CAM.pol  += (CAM.polT - CAM.pol) * k;
    CAM.dist += (CAM.distT - CAM.dist) * k;
  }
  // 横向移出去的时候镜头跟着挪一点，否则车直接走出画面。
  // 只跟一部分，留点偏移感，车才像在路中间而不是钉在屏幕中心。
  CAM.target.z += (S.lat*0.66 - CAM.target.z) * (1 - Math.pow(0.02, dt));
  const shake = (S.speed-18)/18 * 0.006 * (S.running ? 1 : 0)
              + S.shake * 0.022 * (S.running ? 1 : 0);   // 撞车时的高频抖动
  camera.position.set(
    CAM.target.x + CAM.dist*Math.sin(CAM.pol)*Math.cos(CAM.az) + Math.sin(S.tSec*23)*shake,
    CAM.target.y + CAM.dist*Math.cos(CAM.pol) + Math.sin(S.tSec*19)*shake,
    CAM.target.z + CAM.dist*Math.sin(CAM.pol)*Math.sin(CAM.az) + Math.sin(S.tSec*31)*shake
  );
  camera.lookAt(CAM.target);

  // ---- rig ----
  // micro-bounce over road texture
  const bump = Math.sin(S.wheel*0.5) * 0.006 + Math.sin(S.wheel*1.7) * 0.003;
  bike.position.y = bump;
  bike.position.z = S.lat;                    // 横向位置
  bike.rotation.y = S.yaw;                    // 车头朝向
  bike.rotation.x = S.steer * 0.16 * clamp(S.speed/12, 0, 1.1);  // 压弯侧倾
  bike.rotation.z = Math.sin(S.wheel*0.5 + 1) * 0.006;
  // 车把角度也随速度收窄。高速时把手打死在视觉上就是「要翻了」，
  // 收窄之后高速过弯看起来才像在骑，而不是在抽搐。
  steerPivot.rotation.y = -S.steer * (0.52 / (1 + S.speed*0.045));

  wheelR.rotation.z = -S.wheel;
  wheelF.rotation.z = -S.wheel;
  ring.rotation.z = -S.crank;
  ringPlate.rotation.z = -S.crank;
  cog.rotation.z = -S.wheel;
  // crank arm points along -Y at local rotation 0, so its world angle is
  // -90deg - S.crank. The wheels spin -Z (clockwise seen from +Z), so the
  // cranks must too: rotation.z = -S.crank, and the feet follow that same angle.
  crankR.rotation.z = -S.crank;
  crankL.rotation.z = Math.PI - S.crank;          // left crank stays 180deg opposed
  crankR.userData.pedal.rotation.z =  S.crank;    // cancel so platforms stay level
  crankL.userData.pedal.rotation.z =  S.crank;

  const bob = Math.sin(S.crank*2) * 0.012;
  const roll = Math.sin(S.crank*2 + 0.7) * 0.05;

  /* ── 身体围着胯动，脚必须留在脚踏上 ──────────────────────────
     ⚠️ 这是这一节唯一真正会做坏的地方。腿是 `bike.add(legR)` 的，
        胯点由 setLeg(legR, HIP_X, HIP_Y, …) 传进去 —— **HIP_Y 是常量**。
        所以身体一旦下沉，鸟会浮在腿上面，腿会一路拉长去够它。
        正确做法是：算出 hipY 之后，setLeg 传的是 hipY 而不是 HIP_Y。
        脚钉在脚踏上、身子在胯上起伏 —— 这也正是踩踏车该有的样子。 */
  const sit   = -S.fatigue * 0.030;                   // 累 → 身子沉下去
  const lift  =  S.sweat   * 0.022 + S.startle * 0.045; // 用力/受惊 → 抬起来
  const hipY  = HIP_Y + bob + sit + lift;
  bird.position.set(HIP_X, hipY, 0);
  bird.rotation.z = roll;

  /* 姿态的三项。正负号别凭感觉：
     绕 +Z 转 θ 时 (+r,0) → y 变大（**头抬起**），(−r,0) → y 变小（**落下**）。
     鹧鸪头朝 +x、尾朝 −x，所以：
       挺胸抬头 = 正   塌下去 = 负
     尾羽在 −x，所以尾的符号反过来：垂尾 = 正，翘尾 = 负。 */
  BIRD.rotation.z = Math.sin(S.crank*2 + 0.9) * 0.05 - roll
                  + S.sweat * 0.10 + S.startle * 0.18 - S.fatigue * 0.12;

  /* 羽毛的「炸 / 伏」是一条混合通道，三个来源：
     惊吓 → 炸毛（负值，雨天伏毛抵消一部分）
     又湿又累 → 塌下去贴着身体（负）
     只是累   → 微微蓬一点（正，冷/乏时的自我保暖） */
  const fluff = clamp(S.startle*0.9 - S.wet*0.55 + S.fatigue*0.25, -0.6, 1);
  BIRD.scale.set(1 + fluff*0.055, 1 - fluff*0.030, 1 + fluff*0.055);

  head.position.set(HEAD_C.x, HEAD_C.y - S.fatigue*0.012, HEAD_C.z);
  head.rotation.z = -0.30 + Math.sin(S.crank*2 + 1.6) * 0.10
                  - S.fatigue * 0.22 + S.sweat * 0.10 + S.startle * 0.30;
  /* 回头看：**绕 Y 轴**转，不是绕 Z。绕 Z 只是低头，抬头看后脑勺转不过去。
     头是绕自己中心转的，所以只给角度不给位移 —— 脖子转，脑袋跟着，
     身体不跟着（身体只加一点点侧的歪，藏在 rotation.z 里已经够了）。 */
  head.rotation.y = -S.lookAmt * S.lookSide * 1.15;
  head.rotation.x =  S.lookAmt * 0.10;

  // the bill opens on the notes you can actually hear, and the throat lifts a
  // touch with it so the call reads as coming from the bird rather than a jaw
  // snapping open on its own
  S.mouth += (mouthAmount() - S.mouth) * Math.min(1, dt*26) * (S.running ? 1 : 0);
  jaw.rotation.z = -S.mouth * 0.44;
  /* 翅膀：原来只有 sweat 一项。加三项 ——
     炸毛时支起来（惊）、湿了收得更贴（湿）、累的时候耷下来。 */
  const flare = S.sweat * 0.55 + 0.06;
  for (const w of wings)
    w.g.rotation.x = w.s * (0.10 + flare*0.5 + Math.sin(S.tSec*9)*S.sweat*0.25
                            + S.startle*0.26 - S.wet*0.14 + S.fatigue*0.10);
  // 尾：符号和身体相反（尾在 −x）。累 → 垂（正）；用力/受惊 → 翘（负）
  tail.rotation.z = 0.42 + Math.sin(S.crank*2 + 2.1) * 0.06
                  + S.fatigue*0.20 - S.sweat*0.14 - S.startle*0.22;

  /* 眨眼：暂停时**连计时一起停**。这里原来是无条件的，于是
     ① 暂停期间鸟还在隔几秒眨一次眼 —— 静止画面里唯一在动的就是它；
     ② 更糟的是，正好在眨眼的瞬间暂停，S.blink 冻在 0.12，
        眼睛**半睁着睁不开**，要等恢复才闭上。
     眼睛半睁是最显眼的「坏了」，所以进暂停时先把眼睛睁开
     （在 bPlay 的处理器里做，这里只负责不再往前走）。 */
  if (S.running){
    S.blinkT -= dt;
    // 累了眨得更勤：间隔从 2.2~5.8 秒缩到最短 1.1 秒，闭眼时长也变长。
    // 「他看起来有点乏了」这件事，全靠这个。
    if (S.blinkT <= 0){
      const tired = S.fatigue;
      S.blink = 0.12 + tired * 0.06;
      S.blinkT = (2.2 + Math.random()*3.6) * (1 - tired*0.62) + tired*0.2;
    }
    if (S.blink > 0) S.blink -= dt;
  }
  for (const e of eyes){ e.pup.scale.y = S.blink > 0 ? 0.12 : 1; e.iris.scale.y = S.blink > 0 ? 0.12 : 1; }

  // foot must sit exactly where the rendered pedal is. The hip is **hipY**,
  // not the HIP_Y constant — otherwise the body sinks and the legs stretch
  // after it instead of the feet staying welded to the pedals.
  const pA = -S.crank - Math.PI/2, pB = pA + Math.PI;
  setLeg(legR, HIP_X, hipY,  0.085, BB.x + Math.cos(pA)*CRANK_R, BB.y + Math.sin(pA)*CRANK_R);
  setLeg(legL, HIP_X, hipY, -0.085, BB.x + Math.cos(pB)*CRANK_R, BB.y + Math.sin(pB)*CRANK_R);

  // dust integration
  // ⚠️ 尘土也必须跟着 S.running 停。车轮扬起来的灰是**世界的一部分**，
  //    暂停时它还往下飘、慢慢淡出，静止画面上就剩最后一撮灰在动 ——
  //    和镜头偷跑是同一类毛病：「暂停」要的是一张完全静止的画。
  if (S.running){
    const arr = dustGeo.attributes.position.array;
    for (let i=0;i<DUST_N;i++){
      const d = dustPts[i];
      if (d.life > 0){
        d.life -= dt*0.85;
        d.x += d.vx*dt; d.y += d.vy*dt; d.z += d.vz*dt;
        d.vy -= 0.28*dt; d.vx -= 0.5*dt;
      }
      arr[i*3] = d.life > 0 ? d.x : 9999;
      arr[i*3+1] = d.life > 0 ? d.y : 9999;
      arr[i*3+2] = d.life > 0 ? d.z : 9999;
    }
    dustGeo.attributes.position.needsUpdate = true;
  }
  dust.material.opacity = 0.30;

  audioUpdate(dt, dCrank);
  bgmTick(dt);

  renderer.render(scene, camera);
  FRAMES++;
}

/* ── rAF 看门狗 ──────────────────────────────────────────────────
   标签页被切到后台时，Chromium 会**冻结** requestAnimationFrame：setTimeout
   照跑、画面一动不动。用户看到的就永远停在首帧的清屏色 —— 一片纯黑，
   而实际上程序完全正常（实测：#hint 的 7 秒定时器正常触发，DIST 一直是 0.00）。

   这里每秒查一次帧计数：一秒内一帧都没走，就说明 rAF 冻住了，于是自己补
   画一帧。**只 render，绝不调 frame()** —— frame() 开头就会再挂一条 rAF 链，
   在这里调等于凭空多出一条循环，切回前台会变成两倍速。 */
let FRAMES = 0, _lastF = 0;
setInterval(() => {
  if (FRAMES === _lastF && !document.hidden) renderer.render(scene, camera);
  _lastF = FRAMES;
}, 1000);

/* 切回前台时立刻补一帧，不用等下一秒的看门狗。 */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { clock.getDelta(); renderer.render(scene, camera); }
});

/* 启动。frame() 内部虽然会自己续下一帧，但**第一次**得有人叫它 ——
   这个启动调用曾经被误删过，删掉之后整个页面一片黑：不报错、面板和 HUD
   都正常，就是一帧都没画。删调试代码时务必确认它还在。 */
requestAnimationFrame(frame);






})();
</script>
</body>
