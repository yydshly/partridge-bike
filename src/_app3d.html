function makeCrank(){
  const g = new THREE.Group();
  const arm = mesh(new THREE.BoxGeometry(0.030, CRANK_R, 0.024), Bm.steel);
  arm.position.y = -CRANK_R/2; g.add(arm);
  const spindle = mesh(new THREE.CylinderGeometry(0.012,0.012,0.10,8), Bm.steel);
  spindle.rotation.x = Math.PI/2; g.add(spindle);
  const ped = new THREE.Group();
  const p = mesh(new THREE.BoxGeometry(0.105, 0.020, 0.068), Bm.grip);
  ped.add(p);
  const edge = mesh(new THREE.BoxGeometry(0.105, 0.024, 0.020), Bm.steel);
  edge.position.y = 0.004; ped.add(edge);
  ped.position.y = -CRANK_R;
  g.add(ped); g.userData.pedal = ped;
  g.position.copy(BB);
  return g;
}
const crankR = makeCrank(); crankR.position.z =  0.085; bike.add(crankR);
const crankL = makeCrank(); crankL.position.z = -0.085; crankL.rotation.z = Math.PI; bike.add(crankL);

/* ══════════════════ partridge ══════════════════
   Built as overlapping feather vanes rather than smooth solids: a sphere
   never reads as a bird, but a shingled feather shell does, because the
   silhouette itself breaks up. Proportions follow a francolin — small head,
   deep oval breast, short thick neck, short graduated tail.            */
const bird = new THREE.Group();
bird.scale.setScalar(BIRD_SCALE);
// 挂在 bike 上，不是 scene 上。下面所有坐标（HIP_X/HIP_Y/BB.x…）都是
// 车的局部坐标，原来车一直停在原点不动，所以挂在 scene 上看着也对 ——
// 一旦车能横移和转向，鹧鸪就会被甩在原地，腿还会一路拉长去够脚踏。
bike.add(bird);
const BIRD = new THREE.Group();
// the hip joint has to sit inside the belly, otherwise the leg root pokes out
// as a bare stump under the bird. Drop the whole bird until local y=0 lands
// in the lower third of the body, then the femur disappears into the plumage.
BIRD.position.set(0, -0.105, 0);
bird.add(BIRD);

/* one flat feather vane: base at origin, tip toward +X, width along ±Y,
   lying in the XY plane. Callers rotate from here.                     */
function vaneGeo(len, wid, curl = 0.15, stations = 9){
  const pos = [], uv = [];
  const L = [], R = [];
  for (let s = 0; s <= stations; s++){
    const t = s/stations;
    const w = Math.pow(Math.sin(Math.PI*Math.pow(t,0.85)), 0.6) * wid * 0.5;
    L.push([t*len,  w, -curl*len*t*t]);
    R.push([t*len, -w, -curl*len*t*t]);
  }
  for (let s = 0; s < stations; s++){
    const quad = [[0,0,0], L[s], L[s+1], R[s+1], R[s]];
    for (const k of [0,1,2, 0,2,3, 0,3,4]){
      const v = quad[k]; pos.push(v[0],v[1],v[2]); uv.push(0,0);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(new Float32Array(pos.length),3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uv,2));
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}

/* one mandible as a closed loft: root at the origin, tip toward +X, dorsal
   ridge on +Y and a flattened keel below, section narrowing along the length
   while the axis drops by `curl` so the tip reads as a gamebird's short hook.
   A real solid is what separates this from a flat vane at the head.      */
function mandibleGeo(len, h, w, curl = 0.20, stations = 8, ring = 9){
  const pos = [];
  const sec = [];
  for (let s = 0; s <= stations; s++){
    const t = s/stations;
    const k = Math.max(0.09, Math.pow(1 - Math.pow(t, 1.6), 0.5));
    const cy = -curl*len*t*t;
    const row = [];
    for (let j = 0; j < ring; j++){
      const a = (j/ring) * Math.PI*2;
      const sn = Math.sin(a), cs = Math.cos(a);
      row.push(new THREE.Vector3(t*len, cy + h*k*(sn >= 0 ? sn : sn*0.45), w*k*cs));
    }
    sec.push(row);
  }
  for (let s = 0; s < stations; s++)
    for (let j = 0; j < ring; j++){
      const j2 = (j+1) % ring;
      const a = sec[s][j], b = sec[s][j2], c = sec[s+1][j2], d = sec[s+1][j];
      for (const v of [a,b,c, a,c,d]) pos.push(v.x, v.y, v.z);
    }
  const cap = (row, flip) => {
    const ctr = new THREE.Vector3();
    row.forEach(v => ctr.add(v));
    ctr.multiplyScalar(1/row.length);
    for (let j = 0; j < ring; j++){
      const a = row[j], b = row[(j+1) % ring];
      for (const v of (flip ? [ctr,b,a] : [ctr,a,b])) pos.push(v.x, v.y, v.z);
    }
  };
  cap(sec[0], true); cap(sec[stations], false);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(new Float32Array(pos.length),3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(new Float32Array((pos.length/3)*2),2));
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}

/* shingle thousands of small vanes over an ellipsoid, all combed the same way */
const FLOW = new THREE.Vector3(-1, -0.55, 0).normalize();
function featherShell(count, ell, len, wid, opts = {}){
  const { flow = FLOW, curl = 0.30, stations = 7, offset = 0, skip = null, lengthVar = 0 } = opts;
  const pos = [], nor = [], uv = [];
  const GA = Math.PI * (3 - Math.sqrt(5));
  const F = flow.clone().normalize();
  for (let i = 0; i < count; i++){
    const yy = 1 - (i + 0.5)/count * 2;
    const rad = Math.sqrt(Math.max(0, 1 - yy*yy));
    const th = GA*i + offset;
    const nx = Math.cos(th)*rad, ny = yy, nz = Math.sin(th)*rad;
    if (skip && skip(nx,ny,nz)) continue;
    const p  = new THREE.Vector3(nx*ell[0], ny*ell[1], nz*ell[2]);
    const n  = new THREE.Vector3(nx/ell[0], ny/ell[1], nz/ell[2]).normalize();
    const d  = F.clone().addScaledVector(n, -F.dot(n));
    if (d.lengthSq() < 1e-8) continue;
    d.normalize();
    const b  = new THREE.Vector3().crossVectors(n, d).normalize();
    const L  = len * (1 + (lengthVar ? ((i*0.618033) % 1 - 0.5) * lengthVar : 0));
    const W  = wid;
    // lift toward the free tip only: sin(pi*u) peaks mid-vane and turns the
    // bird into a thistle. A ramped lift shingle reads as overlapping feathers.
    const P  = (u,v) => new THREE.Vector3()
      .copy(p).addScaledVector(d, u*L).addScaledVector(b, v*W)
      .addScaledVector(n, Math.pow(u, 2.2)*L*curl);
    const lft = [], rgt = [];
    for (let s = 0; s <= stations; s++){
      const t = s/stations;
      const w = Math.pow(Math.sin(Math.PI*Math.pow(t,0.85)), 0.6) * W * 0.5;
      lft.push(P(t*L, w)); rgt.push(P(t*L, -w));
    }
    // every vane of one feather shares its anchor normal, so the plumage shell
    // still samples the body map: v runs belly->mantle, u wraps around the bird
    const uu = 0.5 + Math.atan2(nz, nx) / (Math.PI*2);
    const vv = 0.5 + ny*0.5;
    const root = P(0,0);
    for (let s = 0; s < stations; s++){
      const q = [root, lft[s], lft[s+1], rgt[s+1], rgt[s]];
      for (const k of [0,1,2, 0,2,3, 0,3,4]){
        const v = q[k]; pos.push(v.x,v.y,v.z); nor.push(n.x,n.y,n.z); uv.push(uu, vv);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uv,2));
  g.computeBoundingSphere();
  return g;
}

const BODY_E = [0.163, 0.120, 0.100];
/* Warp the unit sphere into a teardrop: narrow the rear, lift the breast, drop
   the vent. Applied identically to the core and to the plumage shell so the
   feathers stay glued to the form instead of wrapping a plain ellipsoid.  */
function bodyWarp(x, y, z){
  const u = x;
  const k = 1 - 0.30*Math.pow(Math.max(0, -u), 1.3);
  return [x, y*k + 0.18*u, z*k];
}
function warpGeo(g, fn){
  const p = g.attributes.position.array;
  for (let i = 0; i < p.length; i += 3){
    const r = fn(p[i], p[i+1], p[i+2]);
    p[i] = r[0]; p[i+1] = r[1]; p[i+2] = r[2];
  }
  p.needsUpdate = true;
  g.computeBoundingSphere();
  return g;
}
{

  core.position.copy(BODY_C);

  // vanes are shingled well proud of the core (ellipsoid pushed out past it) and
  // curled hard, so the body reads as overlapping plumage instead of a smooth egg
  const shell = mesh(warpGeo(featherShell(300, [BODY_E[0]*1.02, BODY_E[1]*1.02, BODY_E[2]*1.02],
    0.080, 0.052, { curl:0.26, lengthVar:0.35 }), bodyWarp), PL.body);
  shell.position.copy(BODY_C);

  BIRD.add(shell);
}

function makeLeg(){
  const g = new THREE.Group();
  const th = mesh(new THREE.CylinderGeometry(0.030, 0.020, 1, 10), Bm.thigh);
  const ta = mesh(new THREE.CylinderGeometry(0.016, 0.013, 1, 10), Bm.tarsus);
  const knee = mesh(new THREE.SphereGeometry(0.024, 10, 8), Bm.tarsus);
  g.add(th, ta, knee);
  // scutes down the tarsus — they must be DARKER than the leg, not lighter,
  // or six pale rings turn the whole tarsus into a white pole
  const scales = new THREE.Group();
  for (let i = 0; i < 7; i++){
    const t = i/6;
    const s = mesh(new THREE.CylinderGeometry(0.0175 - t*0.0025, 0.0182 - t*0.0025, 0.005, 10), Bm.scute);
    s.position.y = -0.40 + i*0.133;
    s.scale.x = s.scale.z = 0.96 + (i%2)*0.08;
    scales.add(s);
  }
  ta.add(scales);

  const foot = new THREE.Group();
  foot.add(mesh(new THREE.BoxGeometry(0.095, 0.020, 0.055), Bm.tarsus));
  // 3 forward toes + 1 hind toe, each with a small claw
  for (let i = 0; i < 3; i++){
    const toe = new THREE.Group();
    const t = mesh(new THREE.CylinderGeometry(0.010, 0.008, 0.062, 6), Bm.tarsus);
    t.rotation.z = Math.PI/2; t.position.x = 0.031; toe.add(t);
    const claw = mesh(new THREE.ConeGeometry(0.006, 0.020, 6), Bm.beak);
    claw.rotation.z = -Math.PI/2; claw.position.set(0.066, -0.004, 0); toe.add(claw);
    toe.position.set(0.03, -0.004, (i-1)*0.022);
    foot.add(toe);
  }
  {
    const toe = new THREE.Group();
    const t = mesh(new THREE.CylinderGeometry(0.008, 0.006, 0.038, 6), Bm.tarsus);
    t.rotation.z = -Math.PI/2; t.position.x = -0.019; toe.add(t);
    const claw = mesh(new THREE.ConeGeometry(0.005, 0.016, 6), Bm.beak);
    claw.rotation.z = Math.PI/2; claw.position.set(-0.043, -0.004, 0); toe.add(claw);
    toe.position.set(-0.025, -0.004, 0);
    foot.add(toe);
  }
  g.add(foot);
  g.userData = { th, ta, knee, foot };
  return g;
}
// 同上：setLeg 吃的是 HIP_X/HIP_Y 和脚踏位置，全是车的局部坐标

function ik2(hx,hy,ax,ay,l1,l2,bend){
  let dx = ax-hx, dy = ay-hy, d = Math.hypot(dx,dy);
  d = Math.min(Math.max(d, Math.abs(l1-l2)+1e-4), l1+l2-1e-4);
  const base = Math.atan2(dy,dx);
  const cosA = (l1*l1 + d*d - l2*l2) / (2*l1*d);
  const a = Math.acos(Math.min(1, Math.max(-1, cosA)));
  const ang = base + a*bend;
  return { x: hx + Math.cos(ang)*l1, y: hy + Math.sin(ang)*l1 };
}
const _d = new THREE.Vector3();
function placeSeg(m, a, b){
  _d.subVectors(b,a);
  m.position.copy(a).addScaledVector(_d, 0.5);
  m.quaternion.setFromUnitVectors(V(0,1,0), _d.clone().normalize());
  m.scale.y = _d.length();
}
function setLeg(legObj, hipX, hipY, hipZ, px, py){
  const k = ik2(hipX, hipY, px, py, THIGH, SHIN, -1);
  // At the top of the stroke the 2-bone solve throws the hock up into the belly
  // and the tarsus then reads as a stick skewering the bird. Keep the hock at
  // or below the belly line: a bird's visible leg is the tarsus, and the kink
  // where it clears the belly feathers is exactly the backward-knee look.
  k.y = Math.min(k.y, hipY - 0.07);
  const u = legObj.userData;
  placeSeg(u.th, V(hipX,hipY,hipZ), V(k.x,k.y,hipZ));
  placeSeg(u.ta, V(k.x,k.y,hipZ), V(px,py,hipZ));
  u.knee.position.set(k.x, k.y, hipZ);
  u.foot.position.set(px, py + 0.018, hipZ);
}

/* ══════════════════ rear-wheel dust ══════════════════ */
const DUST_N = 90;

dustGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(DUST_N*3), 3));
const dustPts = [];
for (let i=0;i<DUST_N;i++) dustPts.push({ life:0, x:0, y:0, z:0, vx:0, vy:0, vz:0, s:0 });

}));

function spawnDust(v){
  const d = dustPts[dustCursor];
  dustCursor = (dustCursor+1) % DUST_N;
  d.life = 1;
  // 尘土是世界空间的粒子，不会跟着 bike 走，所以出生点要自己把车的
  // 横移和朝向算进去，不然车一拐弯，尘土就留在原地不跟车。
  const lx = HUB_R.x - 0.12;
  d.x = lx * Math.cos(S.yaw);
  d.y = 0.06 + rr(0,0.05);
  d.z = S.lat - lx * Math.sin(S.yaw) + rr(-0.10,0.10);
  d.vx = -v*0.30 - rr(0,0.6);
  d.vy = rr(0.15,0.5);
  d.vz = rr(-0.2,0.2);
  d.s = rr(0.5, 1.1);
}

/* ══════════════════ other riders ══════════════════
   路上的其他骑行者和鹧鸪一样朝 +x、头顶 +y，所以朝向约定和主车完全一致
   （右 = +z）。但它们**不是**回收道具：路边景物是被世界推着走的，
   而骑行者是自己在动 —— 相对速度 = 它的速度 − 你的速度。你比它快就
   把它超过去，你比它慢它就从前面追上来。

   动物和车都做成参数化的：物种决定体型比例和招牌轮廓（耳朵、尾巴、
   尖嘴），车型决定轮径、轴距、把形和附件。这样 6 个物种 × 5 种车
   就能拼出 30 种组合，每一辆都一眼认得出是谁在骑、骑的是什么。 */
const Amat = {};
function am(c, rough = 0.85){
  return Amat[c] || (Amat[c] = new THREE.MeshStandardMaterial({ color:c, roughness:rough }));
}

/* kind: 0 兔  1 狐狸  2 猫  3 刺猬  4 企鹅  5 松鼠 */
function makeAnimal(kind, fur, belly){
  const g = new THREE.Group();

    body.scale.set(0.17, 0.15, 0.15); g.add(body);

    tail.position.set(-0.17, 0.05, 0); g.add(tail); parts.tail = tail;
  }
  else if (kind === 1){                  // 狐狸：长身 + 尖嘴 + 大蓬尾
    body.scale.set(0.24, 0.125, 0.13); g.add(body);
    head.scale.set(0.085, 0.085, 0.085); head.position.set(0.21, 0.10, 0); g.add(head);
    const snout = mesh(new THREE.ConeGeometry(0.055, 0.17, 7), F);
    snout.rotation.z = -Math.PI/2; snout.position.set(0.32, 0.085, 0);
    snout.castShadow = true; g.add(snout);
    const nose = mesh(new THREE.SphereGeometry(0.024, 8, 6), am(0x1a1a1a, 0.5));
    nose.position.set(0.40, 0.085, 0); g.add(nose);
    for (const s of [1,-1]){
      const e = mesh(new THREE.ConeGeometry(0.052, 0.11, 4), F);
      e.position.set(0.195, 0.175, s*0.055); e.rotation.z = 0.2; e.rotation.x = s*0.2;
      e.castShadow = true; g.add(e); parts.ears.push(e);
    }
    // 尾巴是狐狸的招牌：粗、长、往上翘
    const t = new THREE.Group();
    for (let i = 0; i < 4; i++){
      const seg = mesh(new THREE.SphereGeometry(0.085 - i*0.012, 9, 7), i > 2 ? B : F);
      seg.position.set(-i*0.075, i*0.030, 0); seg.castShadow = true; t.add(seg);
    }
    t.position.set(-0.23, 0.06, 0); t.rotation.z = 0.35; g.add(t); parts.tail = t;
  }
  else if (kind === 2){                  // 猫：圆头 + 尖耳 + 长细尾上勾
    body.scale.set(0.19, 0.135, 0.135); g.add(body);
    head.scale.setScalar(0.10); head.position.set(0.17, 0.11, 0); g.add(head);
    for (const s of [1,-1]){
      const e = mesh(new THREE.ConeGeometry(0.042, 0.085, 3), F);
      e.position.set(0.155, 0.195, s*0.062); e.rotation.x = s*0.25;
      e.castShadow = true; g.add(e); parts.ears.push(e);
    }
    const t = new THREE.Group();
    for (let i = 0; i < 5; i++){
      const seg = mesh(new THREE.CylinderGeometry(0.026 - i*0.003, 0.030 - i*0.003, 0.085, 7), F);

      sp.lookAt(sp.position.clone().multiplyScalar(2));

    }
    head.scale.set(0.072, 0.062, 0.070); head.position.set(0.20, -0.015, 0); g.add(head);
    const nose = mesh(new THREE.ConeGeometry(0.028, 0.075, 6), am(0x2b2018, 0.7));
    nose.rotation.z = -Math.PI/2; nose.position.set(0.27, -0.015, 0); g.add(nose);
  }
  else if (kind === 4){                  // 企鹅：直立的蛋，没有腿，改用鳍
    body.scale.set(0.145, 0.235, 0.155); g.add(body);
    const front = mesh(new THREE.SphereGeometry(1, 12, 9), B);
    front.scale.set(0.115, 0.195, 0.125); front.position.set(0.045, -0.02, 0);
    front.castShadow = true; g.add(front);
    head.scale.set(0.095, 0.098, 0.095); head.position.set(0.055, 0.235, 0); g.add(head);
    const beak = mesh(new THREE.ConeGeometry(0.038, 0.14, 5), am(0xe8a33c, 0.6));
    beak.rotation.z = -Math.PI/2; beak.position.set(0.19, 0.225, 0);
    beak.castShadow = true; g.add(beak);
    for (const s of [1,-1]){
      const f = mesh(new THREE.SphereGeometry(1, 9, 7), am(0x22262c, 0.8));
      f.scale.set(0.10, 0.030, 0.042); f.position.set(0.0, 0.02, s*0.145);
      f.rotation.x = s*0.5; f.castShadow = true; g.add(f); parts.ears.push(f);
    }
    parts.flippers = true;
  }
  else {                                 // 松鼠：小小的身子，尾巴大到荒谬
    body.scale.set(0.135, 0.115, 0.11); g.add(body);
    head.scale.set(0.082, 0.080, 0.078); head.position.set(0.13, 0.11, 0); g.add(head);
    for (const s of [1,-1]){
      const e = mesh(new THREE.SphereGeometry(0.040, 8, 6), F);
      e.position.set(0.105, 0.175, s*0.050); e.castShadow = true; g.add(e); parts.ears.push(e);
    }
    const t = new THREE.Group();
    for (let i = 0; i < 5; i++){
      const seg = mesh(new THREE.SphereGeometry(0.075 - i*0.006, 9, 7), F);
      seg.position.set(-0.055 - i*0.030, 0.055 + Math.sin(i*0.8)*0.055, 0);
      seg.castShadow = true; t.add(seg);
    }
    t.position.set(-0.14, 0.06, 0); t.rotation.z = 0.9; g.add(t); parts.tail = t;
  }
  /* 每种动物放大到「像个角色」的尺度。原来它们按真实体型（约 0.35 m）站在
     一辆 0.33 m 轮径的成人车上，比例上根本不像骑车的人 —— 和主鹧鸪一样，
     这里宁可信「角色大一点」也不要「比例正确但看着像摆件」。 */
  const sc = [1.75, 1.85, 1.70, 1.95, 1.60, 1.80][kind];
  g.scale.setScalar(sc);

  /* 脖子 + 胸口。原来头就是一颗球直接怼在身上，球和球之间没有任何过渡，
     远看就是两个球摞在一起。加一段从肩胸连到头根的锥形肉，再加上胸口的
     浅色块，脖子和肩膀才分得开。 */
  const hs = Math.max(head.scale.x, head.scale.y, head.scale.z);
  const nA = V(body.scale.x*0.42, body.scale.y*0.30, 0);
  const nB = V(head.position.x - hs*0.22, head.position.y - hs*0.60, 0);
  const nDir = new THREE.Vector3().subVectors(nB, nA);
  const nL = nDir.length();
  if (nL > 0.012){
    nDir.divideScalar(nL);
    const neck = mesh(new THREE.CylinderGeometry(hs*0.66, hs*0.94, nL + hs*0.5, 10), F);
    neck.position.copy(nA).addScaledVector(nDir, nL/2);
    neck.quaternion.setFromUnitVectors(V(0,1,0), nDir);
    neck.castShadow = true; g.add(neck);
  }
  const chest = mesh(new THREE.SphereGeometry(1, 12, 9), B);
  chest.scale.set(body.scale.x*0.72, body.scale.y*0.66, body.scale.z*0.70);
  chest.position.set(body.scale.x*0.30, -body.scale.y*0.10, 0);
  chest.castShadow = true; g.add(chest);

  /* 眼睛。原来六只动物一只眼睛都没有 —— 不戴眼睛的球脑袋就是布娃娃。
     眼窝 + 虹膜 + 瞳孔 + 高光四层，少一层都还是假的。 */
  const eyes = [];
  const irisM = am(0x7a5426, 0.32);
  const pupM  = new THREE.MeshStandardMaterial({ color:0x0c0e11, roughness:0.12 });
  const glM   = new THREE.MeshBasicMaterial({ color:0xffffff });
  for (const s of [1,-1]){
    const dir = V(0.46, 0.30, s*0.66).normalize();
    const base = new THREE.Vector3(head.position.x, head.position.y, 0).addScaledVector(dir, hs*0.94);
    const sock = mesh(new THREE.SphereGeometry(hs*0.30, 10, 8), am(0x0a0a0c, 0.9));
    sock.position.copy(base); sock.scale.set(0.72, 1, 1); g.add(sock);
    const iris = mesh(new THREE.SphereGeometry(hs*0.225, 12, 9), irisM);
    iris.position.copy(base).addScaledVector(dir, hs*0.07); g.add(iris);
    const pup = mesh(new THREE.SphereGeometry(hs*0.115, 10, 8), pupM);
    pup.position.copy(base).addScaledVector(dir, hs*0.19); g.add(pup);
    const hi = new THREE.Mesh(new THREE.SphereGeometry(hs*0.060, 6, 5), glM);
    hi.position.copy(base).addScaledVector(dir, hs*0.23);
    hi.position.y += hs*0.09; g.add(hi);
    eyes.push({ iris, pup, hi, s, open:1 });
  }
  parts.eyes = eyes;

  /* 内耳。耳朵原来是一只和头同色的实体，从侧面看就是两坨同色的疙瘩 ——
     在耳朵自己的局部坐标里压一片腹色的薄壳，形状随耳朵走，不用按物种硬编。 */
  for (const e of parts.ears){
    const inner = new THREE.Mesh(e.geometry, B);
    inner.scale.set(0.60, 0.84, 0.60);
    inner.position.set(0, 0, 0.030);
    inner.castShadow = false;
    e.add(inner);
  }

  /* 胡须：猫和兔有。挂在 head 下面，跟着 head 的 scale 走，不用算世界坐标。 */
  if (kind === 0 || kind === 2){
    const wl = (kind === 0) ? 0.52 : 0.66;
    for (const s of [1,-1]) for (let i = 0; i < 3; i++){
      const wh = new THREE.Mesh(new THREE.CapsuleGeometry(0.016, wl, 2, 4), am(0xf2ecdc, 0.5));
      wh.scale.set(1, 1, 0.30);
      wh.rotation.z = -0.34 + i*0.30;
      wh.position.set(0.74, -0.12 + i*0.24, s*0.30);
      wh.castShadow = false;
      head.add(wh);
    }
  }

  // 坐姿用：身子底面离原点多远（算上放大）
  parts.rideY = body.scale.y * sc;
  parts.sc = sc;

  g.userData.parts = parts;
  return g;
}

/* 车型。差异必须看得出**轮廓**，不能只换个颜色：轮径、轴距、把形、
   有没有后货架/前筐/货箱，全都不一样，这样远远扫过去也知道是哪种车。
   0 通勤  1 公路  2 货运  3 山地  4 折叠

   精度对标主鹧鸪那辆车。原来这辆车「能骑」，但没有一样是「做出来」的：
   辐条 8 根还全摊在同一个平面上（侧看就是一只五角星，不是轮子）、没有轮毂、
   没有挡泥板、没有盘片和链条、没有踏车。少一样都还是「能骑的样子」。 */
const RST = {
  R:    [0.330, 0.345, 0.320, 0.355, 0.235],   // 轮半径
  WB:   [1.040, 1.000, 1.340, 1.090, 0.840],   // 轴距
  tubeR:[0.017, 0.014, 0.020, 0.022, 0.019],   // 车架管径
  CR:   [0.135, 0.150, 0.120, 0.145, 0.105],   // 曲柄长
  RING: [0.086, 0.098, 0.072, 0.092, 0.070],   // 盘片半径
  GRIP: [0.210, 0.190, 0.220, 0.245, 0.190],   // 把宽
  THIGH:[0.330, 0.340, 0.330, 0.330, 0.260],   // 大腿（+小腿要够长，
  SHIN: [0.350, 0.360, 0.350, 0.350, 0.280]    // 否则 IK 会被 clamp 成直腿）
};

/* 轮子：外胎 + 轮圈 + 轮毂 + 20 根带编织角的辐条。辐条要交替从花鼓两侧出，
   全部摊在一个平面上，从侧面看会变成一只五角星。 */
function makeRiderWheel(R, tyre, rim, steel, spokeMat){
  const w = new THREE.Group();
  w.add(mesh(new THREE.TorusGeometry(R-0.026, 0.026, 8, 30), tyre));
  w.add(mesh(new THREE.TorusGeometry(R-0.056, 0.010, 6, 26), rim));
  const hub = mesh(new THREE.CylinderGeometry(0.023, 0.023, 0.086, 10), rim);
  hub.rotation.x = Math.PI/2; w.add(hub);
  const pts = [], NS = 20, RIMR = R - 0.058, HUBR = 0.025;
  for (let i = 0; i < NS; i++){
    const side = (i % 2) ? 1 : -1;
    const a  = i/NS*Math.PI*2;
    const a2 = a + side*0.115;                 // 编织角
    pts.push(Math.cos(a)*HUBR,  Math.sin(a)*HUBR,  side*0.040,
             Math.cos(a2)*RIMR, Math.sin(a2)*RIMR, 0);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  w.add(new THREE.LineSegments(sg, spokeMat));
  return w;
}

/* 挡泥板：扫出来的一段薄壳，有宽度也有弧度。拿圆环截面压扁只会得到一根
   贴在轮子上的线，看不出是块板。 */
function arcShell(R, a0, a1, halfW, mat, steps){
  steps = steps || 16;
  const pos = [], r = R + 0.022;
  const P = (a, z) => [Math.cos(a)*r, Math.sin(a)*r, z];
  for (let i = 0; i < steps; i++){
    const a  = a0 + (a1 - a0)*i/steps;
    const a2 = a0 + (a1 - a0)*(i + 1)/steps;
    const q = [P(a,-halfW), P(a,halfW), P(a2,halfW), P(a,-halfW), P(a2,halfW), P(a2,-halfW)];
    for (const v of q) pos.push(...v);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

function makeRiderBike(style, frameCol, furCol){
  const g = new THREE.Group();
  const R     = RST.R[style],   WB    = RST.WB[style],  tubeR = RST.tubeR[style];
  const CR    = RST.CR[style],  RING  = RST.RING[style], GRIP  = RST.GRIP[style];
  const THIGH = RST.THIGH[style], SHIN = RST.SHIN[style];

  const F  = am(frameCol, 0.34);
  const Fd = new THREE.MeshStandardMaterial({ color:frameCol, roughness:0.42, metalness:0.4 });
  const tyre = new THREE.MeshStandardMaterial({ color:0x1c1f23, roughness:0.95 });
  const rim  = new THREE.MeshStandardMaterial({ color:0xc2ccd6, roughness:0.3,  metalness:0.7 });
  const steel= new THREE.MeshStandardMaterial({ color:0x97a2ae, roughness:0.35, metalness:0.8 });
  const chainM = new THREE.MeshStandardMaterial({ color:0x6e747c, roughness:0.55, metalness:0.6 });
  const fend  = new THREE.MeshStandardMaterial({ color:0x8f979f, roughness:0.45, metalness:0.35, side:THREE.DoubleSide });
  const spokeM= new THREE.LineBasicMaterial({ color:0xaeb8c4 });
  const dark  = am(0x22252b, 0.82);

  const hubR = V(-WB/2, R, 0), hubF = V(WB/2, R, 0);
  const bb   = V(-WB*0.06, R + 0.13, 0);                      // 五通
  const seat = V(-WB*0.30, R + (style === 4 ? 0.42 : 0.52), 0);
  const headT= V( WB*0.40, R + 0.50, 0), headB = V(WB*0.36, R + 0.30, 0);

  const wheels = [makeRiderWheel(R, tyre, rim, steel, spokeM),
                  makeRiderWheel(R, tyre, rim, steel, spokeM)];
  wheels[0].position.copy(hubR); wheels[1].position.copy(hubF);
  g.add(wheels[0], wheels[1]);

  // 挡泥板 + 支杆
  const fR = arcShell(R, -0.10*Math.PI, 1.10*Math.PI, 0.044, fend, 18);
  fR.position.copy(hubR); g.add(fR);
  const fF = arcShell(R,  0.02*Math.PI, 0.98*Math.PI, 0.040, fend, 16);
  fF.position.copy(hubF); g.add(fF);
  for (const h of [hubR, hubF]){
    const rr = R + 0.022;
    g.add(tube(V(h.x, h.y, 0.030), V(h.x + Math.cos(0.08*Math.PI)*rr, h.y + Math.sin(0.08*Math.PI)*rr, 0.030), 0.004, steel, 4));
    g.add(tube(V(h.x, h.y, -0.030), V(h.x + Math.cos(1.0*Math.PI)*rr, h.y + Math.sin(1.0*Math.PI)*rr, -0.030), 0.004, steel, 4));
  }

  // 车架：上管、下管、座管、后上叉、后下叉、前叉、头管
  g.add(tube(seat, bb, tubeR, Fd));
  g.add(tube(bb, headB, tubeR, F));
  if (style !== 4) g.add(tube(seat, headT, tubeR*0.9, F));
  g.add(tube(seat, hubR, tubeR*0.75, F));
  for (const s of [1,-1]) g.add(tube(bb, V(hubR.x, hubR.y, s*0.055), tubeR*0.7, F));
  g.add(tube(headT, hubF, tubeR*0.8, F));
  g.add(tube(headT, headB, tubeR*1.25, Fd));
  const clamp = mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.028, 10), steel);
  clamp.position.set(seat.x, seat.y - 0.012, 0); g.add(clamp);

  /* 链传动：盘片 + 后飞轮 + 上下两条直链段 + 链罩。链条是斜跨在链叉上的，
     只画一段贴着后轮的线，一眼就看出没有传动。 */
  const COG = 0.040, CHZ = 0.052;
  const ring = mesh(new THREE.CylinderGeometry(RING, RING, 0.007, 22), steel);
  ring.rotation.x = Math.PI/2; ring.position.set(bb.x, bb.y, CHZ); g.add(ring);
  const cog = mesh(new THREE.CylinderGeometry(COG, COG, 0.011, 14), steel);
  cog.rotation.x = Math.PI/2; cog.position.set(hubR.x, hubR.y, CHZ); g.add(cog);
  g.add(tube(V(bb.x, bb.y + RING, CHZ), V(hubR.x, hubR.y + COG, CHZ), 0.005, chainM, 5));
  g.add(tube(V(bb.x, bb.y - RING, CHZ), V(hubR.x, hubR.y - COG, CHZ), 0.005, chainM, 5));
  const gd = Math.hypot(hubR.x - bb.x, hubR.y - bb.y);
  const guard = mesh(new THREE.BoxGeometry(gd + RING*0.8, 0.026, 0.013), Fd);
  guard.position.set((bb.x + hubR.x)/2, (bb.y + hubR.y)/2 - 0.004, CHZ + 0.015);
  guard.rotation.z = Math.atan2(hubR.y - bb.y, hubR.x - bb.x);
  g.add(guard);

  // 曲柄 + 踏车（踏面始终水平）
  const crank = new THREE.Group();
  crank.position.copy(bb); g.add(crank);
  const pedals = [];
  for (const s of [1,-1]){
    const arm = new THREE.Group();
    arm.rotation.z = s > 0 ? 0 : Math.PI;
    const a = mesh(new THREE.BoxGeometry(0.020, CR, 0.016), steel);
    a.position.y = -CR/2; arm.add(a);
    const ax = mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.034, 8), steel);
    ax.rotation.x = Math.PI/2; arm.add(ax);
    const ped = new THREE.Group();
    ped.position.y = -CR;
    ped.add(mesh(new THREE.BoxGeometry(0.074, 0.014, 0.046), dark));
    ped.add(tube(V(0, 0.002, -0.028), V(0, 0.002, 0.028), 0.006, steel, 5));
    arm.add(ped); crank.add(arm);
    pedals.push({ g: ped, armRot: arm.rotation.z });
  }

  // 车把 —— 五种把形，剪影完全不同
  const bar = new THREE.Group();
  const barY = headT.y + 0.07;
  if (style === 1){                                        // 公路：弯把
    for (const s of [1,-1]){
      const drop = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.012, 6, 12,
        Math.PI*0.62, Math.PI*0.76), am(0x1a1c20, 0.8));
      drop.position.set(-0.055, barY - 0.075, s*0.165); drop.rotation.y = Math.PI/2;
      bar.add(drop);
    }
    bar.add(tube(V(0,barY,0), V(0,barY,GRIP/2), 0.012, am(0x1a1c20, 0.8)));
  } else if (style === 0){                                 // 通勤：直把 + 后架 + 前筐
    bar.add(tube(V(0,barY,0), V(0,barY+0.01,GRIP/2), 0.013, steel));
    const rack = mesh(new THREE.BoxGeometry(0.30, 0.012, 0.15), steel);
    rack.position.set(seat.x-0.16, seat.y+0.20, 0); bar.add(rack);
    for (const s of [1,-1]) bar.add(tube(V(seat.x-0.16,seat.y+0.20,0), V(hubR.x,hubR.y,s*0.05), 0.007, steel));
    const basket = wickerBasket(0.19, 0.15, 0.26);
    basket.position.set(0.11, barY+0.05, 0); bar.add(basket);
    for (const s of [1,-1])                              // 筐的支架
      bar.add(tube(V(0.11, barY+0.03, 0), V(0.02, barY-0.06, s*0.10), 0.006, steel));
  } else if (style === 2){                                 // 货运：长前叉 + 大货箱
    bar.add(tube(V(0,barY,0), V(0,barY+0.015,GRIP/2), 0.015, steel));
    const box = cargoCrate(0.50, 0.34, 0.42);
    box.position.set(0.34, R+0.30, 0); bar.add(box);
    for (const s of [1,-1])                              // 货台
      bar.add(tube(V(0.34, R+0.14, s*0.10), V(0.08, R+0.02, s*0.12), 0.008, steel));
  } else if (style === 3){                                 // 山地：宽扁把
    bar.add(tube(V(0,barY,0), V(0,barY,GRIP/2), 0.017, am(0x2b2f36,0.8)));
  } else {                                                 // 折叠：短把 + 折痕
    bar.add(tube(V(0,barY,0), V(0,barY,GRIP/2), 0.015, steel));
    bar.add(tube(V(seat.x,seat.y,0), V(seat.x+0.10, seat.y-0.10, 0), 0.012, steel));
  }
  // 握把 + 刹把（公路车是弯把，不加）
  for (const s of [1,-1]){
    if (style === 1) continue;
    const gm = mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.078, 8), am(0x1a1c20, 0.9));
    gm.rotation.x = Math.PI/2;
    gm.position.set(0, barY, s*(GRIP/2 - 0.036));
    bar.add(gm);
    const lev = mesh(new THREE.BoxGeometry(0.011, 0.072, 0.013), am(0xb8bec6, 0.4));
    lev.position.set(0.022, barY - 0.044, s*(GRIP/2 - 0.008));
    lev.rotation.x = s*0.45;
    bar.add(lev);
  }
  bar.add(tube(V(headT.x, headT.y, 0), V(headT.x, barY, 0), 0.014, steel));  // 把立
  bar.position.x = headT.x; g.add(bar);

  // 车座：壳 + 鼻头，不然就是一颗压扁的球
  const sad = new THREE.Group();
  const shell = mesh(new THREE.SphereGeometry(0.072, 12, 8), dark);
  shell.scale.set(1.30, 0.34, 0.86); sad.add(shell);
  const nose = mesh(new THREE.ConeGeometry(0.030, 0.11, 8), dark);
  nose.rotation.z = -Math.PI/2; nose.position.set(0.105, -0.004, 0); sad.add(nose);
  sad.position.copy(seat); sad.position.y += 0.030;
  g.add(sad);

  /* 腿：两骨 IK 跟踏车。腿挂在**车身**上而不是曲柄上 —— 曲柄转不等于大腿转，
     髋关节是固定的，膝盖要跟着踏车走，那才叫踩。 */
  const FUR = furM(furCol, 0.92);
  const HIPX = seat.x + 0.01, HIPY = seat.y + 0.06;
  const legs = [];
  for (const s of [1,-1]){
    const leg = new THREE.Group();
    const th = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.026, 1, 8), FUR);
    const sh = new THREE.Mesh(new THREE.CylinderGeometry(0.021, 0.017, 1, 8), FUR);
    th.geometry.translate(0, 0.5, 0); sh.geometry.translate(0, 0.5, 0);
    const knee = mesh(new THREE.SphereGeometry(0.024, 8, 6), FUR);
    const foot = new THREE.Group();
    foot.add(mesh(new THREE.BoxGeometry(0.090, 0.022, 0.052), am(0x2a2d33, 0.85)));
    leg.add(th, sh, knee, foot);
    leg.position.z = s*0.062;
    g.add(leg);
    legs.push({ g: leg, th, sh, knee, foot, s });
  }
  const segTo = (m, x0, y0, x1, y1) => {
    m.position.set(x0, y0, 0);
    m.rotation.z = Math.atan2(y1 - y0, x1 - x0) - Math.PI/2;
    m.scale.y = Math.hypot(x1 - x0, y1 - y0);
  };
  const setLegs = ang => {
    for (let i = 0; i < legs.length; i++){
      const L = legs[i];
      /* 脚必须精确落在**真正画出来的那个踏车**上，不能自己另算一个相位。
         曲柄每帧转 -ang，踏车挂在曲柄臂（初始 rotation.z = armRot）末端，
         所以踏车在车身上的角是 (armRot - ang) —— 随 ang 增大走顺时针。
         这里原来写的是 (ang + s*PI)，随 ang 增大走**逆时针**，和曲柄正好相反：
         脚绕着五通倒着走，从侧面看就是在反向蹬。左右腿相差 180° 由
         armRot ∈ {0, PI} 自然带出来，不用再乘一次 s。 */
      const th = pedals[i].armRot - ang;
      const px = bb.x + Math.sin(th)*CR, py = bb.y - Math.cos(th)*CR;
      const k  = ik2(HIPX, HIPY, px, py, THIGH, SHIN, -1);
      segTo(L.th, HIPX, HIPY, k.x, k.y);
      segTo(L.sh, k.x, k.y, px, py);
      L.knee.position.set(k.x, k.y, 0);
      L.foot.position.set(px + 0.014, py + 0.016, 0);
    }
    /* 踏面始终水平：曲柄转 -ang、臂本身 armRot、这里补 +(ang - armRot)，
       三段 z 旋转加起来正好是 0。**这个 +ang 是对的，别看成反号去「修」它。 */
    for (const p of pedals) p.g.rotation.z = ang - p.armRot;
  };
  setLegs(0);

  g.userData = { wheels, crank, pedals, legs, setLegs, R, seat, bb, headT, style,
                 grip: V(headT.x, barY, 0), hip: V(HIPX, HIPY, 0) };
  return g;
}


/* 物种表：毛色/腹色/车色。名字只是给自己看的，界面上不显示。 */
const KINDS = [
  { sp:0, fur:0xc3b49b, belly:0xe8ddc9, bike:0x2f6f8f, bs:1, v:[9, 13]  },  // 兔 · 通勤车
  { sp:1, fur:0xc4682c, belly:0xf0e2cf, bike:0x1f7a4d, bs:0, v:[15, 21] },  // 狐狸 · 公路车
  { sp:2, fur:0x4b4f57, belly:0xd6d9de, bike:0xb04a3c, bs:3, v:[12, 18] },  // 猫 · 山地车
  { sp:3, fur:0x8a6a45, belly:0xc9a97a, bike:0x6b5a2e, bs:2, v:[8, 12]   },  // 刺猬 · 货运车
  { sp:4, fur:0x22262c, belly:0xf2f4f6, bike:0xe0a92e, bs:4, v:[10, 15] },  // 企鹅 · 折叠车
  { sp:5, fur:0xa9682f, belly:0xe0c79a, bike:0x5a4a8f, bs:0, v:[11, 16] }   // 松鼠 · 通勤车
];

/* 前爪扶把。原来这里只有一句「前爪搭在把手上」的注释，代码里根本没有手臂 ——
   骑手两只手垂在身侧，看起来是被人搬到车上的，不是自己骑的。

   手臂是肩→肘→掌的两骨 IK。长度按「够到就行」反推：五种车的把高、把前伸
   差得很远（折叠车把矮而近、货运车把远），写死一个角度总有几种够不着或者
   反关节。手臂挂在**骑手组**上而不是宠物身上 —— 宠物自己带 1.6~2 倍放大，
   挂进去手臂会跟着缩，细成一根线。 */
function addRiderArms(rider, pet, bike, K){
  const u  = bike.userData;
  const sc = pet.userData.parts.sc;
  const FUR = furM(K.fur, 0.92);
  const gripHalf = (u.style === 1 ? 0.165 : RST.GRIP[u.style]/2 - 0.026);
  const seg3 = (m, a, b) => {
    m.position.copy(a);
    const dv = new THREE.Vector3().subVectors(b, a);
    m.quaternion.setFromUnitVectors(V(0,1,0), dv.clone().normalize());
    m.scale.y = Math.max(1e-4, dv.length());
  };
  for (const s of [1,-1]){
    const sh = V(pet.position.x + 0.06*sc, pet.position.y + 0.10*sc, s*0.085*sc);
    const gr = V(u.grip.x, u.grip.y, s*gripHalf);
    const d  = Math.hypot(gr.x - sh.x, gr.y - sh.y);
    /* 两骨之和必须**明显大于** d。写成 0.54+0.46=1.00 时 IK 正好伸直，
       手臂会变成一根笔直的木板 —— 肩到把之间连个肘弯都看不出来。 */
    const L1 = d*0.575, L2 = d*0.575;               // 和 = 1.15d，肘外抛约 0.28d
    const th = Math.max(0.016, d*0.062);            // 粗细跟着跨度走
    const k  = ik2(sh.x, sh.y, gr.x, gr.y, L1, L2, -1);
    const el = V(k.x, k.y, (sh.z + gr.z)*0.5);
    const arm = new THREE.Group();
    const up = new THREE.Mesh(new THREE.CylinderGeometry(th*1.15, th*0.92, 1, 8), FUR);
    const fo = new THREE.Mesh(new THREE.CylinderGeometry(th*0.88, th*0.72, 1, 8), FUR);
    up.geometry.translate(0, 0.5, 0); fo.geometry.translate(0, 0.5, 0);
    const elbow = mesh(new THREE.SphereGeometry(th*1.05, 8, 6), FUR);
    const paw = new THREE.Group();
    const pm = mesh(new THREE.SphereGeometry(th*1.45, 10, 8), FUR);
    pm.scale.set(1.2, 0.82, 0.95); paw.add(pm);
    for (let f = -1; f <= 1; f++){                 // 三根短指扣在把上
      const fg = mesh(new THREE.CapsuleGeometry(th*0.24, th*0.85, 3, 6), FUR);
      fg.position.set(th*0.55, f*th*0.55, 0);
      fg.rotation.z = -0.9;
      paw.add(fg);
    }
    arm.add(up, fo, elbow, paw);
    rider.add(arm);
    seg3(up, sh, el);
    seg3(fo, el, gr);
    elbow.position.copy(el);
    paw.position.copy(gr);
    paw.rotation.z = -0.5;                          // 掌心朝下扣住把
    paw.userData.isPaw = 1;                         // 标一下，自检脚本好认爪子
  }
}

function makeRider(seed){
  const K = KINDS[seed % KINDS.length];
  const g = new THREE.Group();
  const bike = makeRiderBike(K.bs, K.bike, K.fur);
  g.add(bike);
  const pet = makeAnimal(K.sp, K.fur, K.belly);
  const u = bike.userData;
  // 坐姿：屁股落在鞍座上。原来是硬 +0.02，动物一放大就整只陷进鞍座里
  pet.position.set(u.seat.x + 0.02, u.seat.y + 0.02 + pet.userData.parts.rideY*0.58, 0);
  g.add(pet);
  addRiderArms(g, pet, bike, K);
  g.userData = { bike, pet, kind:K, phase:rr(0, 6.28), vr:rr(K.v[0], K.v[1]) };
  return g;
}

const traffic = new THREE.Group();
scene.add(traffic);
const RIDERS = [];
/* 车道。右侧通行：自己走右道（lat≈0），对向车走左道（lat≈-1.95）。
   路面 lat ∈ [T_MIN, T_MAX] = [-2.925, 0.975]，正好两条 1.95 m 的道。
   之前七辆车全在同向，而且 lat 在整个路面范围里乱窜 —— 又是穿模又是没有对向。 */
const LANE_R = 0, LANE_L = T_MIN + ROAD_W/4;
const N_SAME = 5, N_ONCOM = 4;
for (let i = 0; i < N_SAME + N_ONCOM; i++){
  const r = makeRider(i);
  r.userData.dir = (i < N_SAME) ? 1 : -1;
  if (r.userData.dir < 0) r.rotation.y = Math.PI;   // 整个模型翻过来，车头朝 -x
  r.position.set(30 + i*17 + rr(-6, 6), 0, 0);
  traffic.add(r); RIDERS.push(r);
}
function layoutRider(r, first){
  const u = r.userData;
  if (u.dir > 0){                              // 同向：贴右道
    r.position.z = LANE_R + rr(-0.44, 0.44);
    if (!first) r.position.x = rr(70, 165);
  } else {                                     // 对向：贴左道，放近一点才来得及迎面
    r.position.z = LANE_L + rr(-0.36, 0.36);
    if (!first) r.position.x = rr(90, 190);
  }
}
for (const r of RIDERS) layoutRider(r, true);

/* ══════════════════ 路边风景：从「散落」到「有布置」 ══════════════════
   原来每一类景物都是一条独立带子、等距铺满整条路：栅栏 44 根、树 24 棵、
   石头 10 块。各自都很密，但没有任何一处是「地方」—— 走多远都是同一段，
   看久了只剩一条绿色的流在动。

   现在分三层，密度是刻意反着来的：
     ① 节奏层（原有带子）栅栏 / 电线杆 / 路灯 / 白桩 —— 继续等距，它们是
        速度感的主心骨，一根都不能少
     ② 景片层  每 90 m 一小段「有内容的场景」：农舍、水塘、风车、道班房
     ③ 地标层  200 m 一座大东西，隔着雾先看见轮廓，逼近了才看清是什么

   ②③ 都不是固定内容：每个槽位在回绕时换一次（rerollOn），所以绕三圈
   也不会背下来。内容朝 -z（朝路）建，放到哪一侧再整体翻过来。 */
const L = (a,b,t) => a + (b-a)*t;

/* 远处的景片一律不进阴影贴图：阴影相机只有 ±8 m，z>5 的东西本来就在视锥
   外，挂着 castShadow 只会每帧白跑一遍 traverse。 */
function noShadow(g){
  g.traverse(c => { if (c.isMesh){ c.castShadow = false; c.receiveShadow = false; } });
  return g;
}
/* 撒点：一件东西孤零零摆在地上不像「地方」，周围得有料 */
function dress(g, r, n){
  for (let i=0;i<n;i++){
    const a = rr(0, 6.283), d = r*0.40 + rnd()*r*0.60;
    const p = rnd();
    const o = p < 0.40 ? makeBush() : p < 0.74 ? makeRock() : p < 0.90 ? makeGrassPatch() : makeFlower();
    o.position.set(Math.cos(a)*d, 0, Math.sin(a)*d);
    o.rotation.y = rr(0, 6.283);
    noShadow(o); g.add(o);
  }
  return g;
}
/* 窗。原点在**墙面**上、z 朝屋外。玻璃用 M.glassLit，夜里统一点亮，
   不用给每扇窗单独配材质。 */
function windowPane(w, h, bars){
  const g = new THREE.Group();
  const t = Math.max(0.032, Math.min(w, h)*0.14), dp = 0.10;
  const bar = (bw, bh, x, y, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, dp), M.frame);
    m.position.set(x, y, z); g.add(m);
  };
  bar(w, t, 0,  h/2 - t/2, dp*0.35);
  bar(w, t, 0, -h/2 + t/2, dp*0.35);
  bar(t, h - t*2, -w/2 + t/2, 0, dp*0.35);
  bar(t, h - t*2,  w/2 - t/2, 0, dp*0.35);
  const sill = new THREE.Mesh(new THREE.BoxGeometry(w + t*2.6, t*0.62, dp*1.9), M.frame);
  sill.position.set(0, -h/2 - t*0.25, dp*0.5); g.add(sill);
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(w - t*1.5, h - t*1.5), M.glassLit);
  gl.position.z = 0.014; g.add(gl);
  const n = bars || 2;
  for (let i=1;i<n;i++){
    const v = new THREE.Mesh(new THREE.BoxGeometry(t*0.5, h - t*2, t*0.5), M.frame);
    v.position.set(-w/2 + t + (w - t*2)*i/n, 0, dp*0.28); g.add(v);
  }
  if (n > 2){
    const hz = new THREE.Mesh(new THREE.BoxGeometry(w - t*2, t*0.5, t*0.5), M.frame);
    hz.position.set(0, 0, dp*0.28); g.add(hz);
  }
  return g;
}
/* 门套：两根门柱 + 一道门楣。门板由调用方自己放。 */
function doorFrame(w, h){
  const g = new THREE.Group();
  const t = 0.055, dp = 0.13;
  const bar = (bw, bh, x, y) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, dp), M.frameD);
    m.position.set(x, y, dp*0.3); g.add(m);
  };
  bar(t, h, -w/2 - t/2, 0);
  bar(t, h,  w/2 + t/2, 0);
  bar(w + t*2, t, 0, h/2 + t/2);
  return g;
}

/* 坡顶房。山墙用三角挤出来，正好堵上两片斜屋顶之间的缝 —— 光放斜板的话
   从侧面能直接看穿屋里。
   opt = { door:开正门, chim:烟囱, bars:窗棂数 } */
function gableHouse(w, h, d, wall, roof, opt){
  opt = opt || {};
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wall);
  body.position.y = h/2; g.add(body);
  const sh = new THREE.Shape();
  sh.moveTo(-w*0.5, 0); sh.lineTo(w*0.5, 0); sh.lineTo(0, h*0.44); sh.closePath();
  for (const s of [1,-1]){
    const gm = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth:0.09, bevelEnabled:false }), wall);
    gm.position.set(0, h, s > 0 ? d*0.5 - 0.09 : -d*0.5);
    g.add(gm);
  }
  const pitch = Math.atan2(h*0.44, w*0.5), rl = Math.hypot(w*0.5, h*0.44);
  for (const s of [1,-1]){
    const p = new THREE.Mesh(new THREE.BoxGeometry(rl, 0.10, d + 0.34), roof);
    p.position.set(s*w*0.25, h*1.22, 0);
    p.rotation.z = -s*pitch;
    g.add(p);
    const fas = new THREE.Mesh(new THREE.BoxGeometry(rl, 0.075, 0.07), M.frameD);  // 檐口封板
    fas.position.set(s*(w*0.5 + 0.14), h - 0.03, (d + 0.34)/2);
    fas.rotation.z = -s*pitch;
    g.add(fas);
  }
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.13, d + 0.40), roof);   // 屋脊
  ridge.position.set(0, h + h*0.44 + 0.03, 0);
  g.add(ridge);
  if (opt.chim){
    const c = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.86, 0.30), M.stone);
    c.position.set(w*0.28, h + h*0.30, -d*0.18); g.add(c);
    const cc = new THREE.Mesh(new THREE.BoxGeometry(0.40, 0.09, 0.40), M.stone);
    cc.position.set(w*0.28, h + h*0.30 + 0.47, -d*0.18); g.add(cc);
  }
  /* 窗：前后两面各开 nWin 扇（马路就是从 z 方向看过去的，这两面最常被看见），
     两侧再各开一扇小的。开正门的地方让给门。 */
  const dw = Math.min(0.90, w*0.20), dh = Math.min(1.05, h*0.40);
  const nWin = Math.max(1, Math.round(w/2.7));
  for (let i=0;i<nWin;i++){
    const x = (nWin === 1) ? 0 : (-w*0.5 + w*(i + 0.5)/nWin);
    if (opt.door && Math.abs(x) < dw*1.1) continue;
    for (const s of [1,-1]){
      const win = windowPane(dw, dh, opt.bars);
      win.position.set(x, h*0.54, s*(d*0.5 + 0.015));
      win.rotation.y = s > 0 ? 0 : Math.PI;
      g.add(win);
    }
  }
  for (const s of [1,-1]){
    const win = windowPane(dw*0.60, dh*0.70, 1);
    win.position.set(s*(w*0.5 + 0.015), h*0.56, 0);
    win.rotation.y = s*Math.PI/2;
    g.add(win);
  }
  if (opt.door){
    const dr = doorFrame(Math.min(1.5, w*0.30), h*0.70);
    dr.position.set(0, h*0.35, d*0.5 + 0.015);
    g.add(dr);
  }
  return g;
}

/* ── 景片 ① 农舍 ── */
function vgFarm(){
  const g = new THREE.Group();
  const barn = gableHouse(7.6, 3.3, 5.2, M.barnRed, M.roofSlate, { door:true, bars:2 });
  barn.position.set(-3.4, 0, 0); barn.rotation.y = 0.10; g.add(barn);
  const door = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.5, 0.14), M.plank);
  door.position.set(-3.4, 1.25, 2.62); g.add(door);
  const beam = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.17, 0.18), M.plank);
  beam.position.set(-3.4, 2.64, 2.66); g.add(beam);
  const silo = new THREE.Group();
  const sb = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.35, 6.6, 14), M.silo);
  sb.position.y = 3.3; silo.add(sb);
  const st = new THREE.Mesh(new THREE.SphereGeometry(1.36, 14, 8, 0, 6.283, 0, 1.571), M.rust);
  st.position.y = 6.6; silo.add(st);
  silo.position.set(2.4, 0, -1.6); g.add(silo);
  for (let i=0;i<5;i++){                                  // 躺着的圆草捆
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.60, 0.60, 1.05, 10), M.bale);
    b.rotation.z = Math.PI/2; b.rotation.y = rr(0, 3.14);
    b.position.set(rr(-7, 5), 0.60, 4.4 + (i % 3)*1.15);
    g.add(b);
  }
  const t = makeTree(1.15, true, false, 1);
  t.position.set(6.8, 0, 0.8); noShadow(t); g.add(t);
  return dress(g, 11, 6);
}
/* ── 景片 ② 水塘 ── */
function vgPond(){
  const g = new THREE.Group();
  const w = new THREE.Mesh(new THREE.CircleGeometry(5.4, 22), M.water);
  w.rotation.x = -Math.PI/2; w.position.y = 0.05; g.add(w);
  const rim = new THREE.Mesh(new THREE.RingGeometry(5.2, 6.5, 22), M.rock);
  rim.rotation.x = -Math.PI/2; rim.position.y = 0.045; g.add(rim);
  for (let i=0;i<18;i++){                                 // 沿边芦苇
    const a = rr(0, 6.283), d = 5.0 + rnd()*1.8;
    const c = new THREE.Group();
    for (let k=0;k<3;k++){
      const h = rr(0.85, 1.55);
      const bl = new THREE.Mesh(new THREE.PlaneGeometry(0.07, h, 1, 2), M.reed);
      bl.position.set((rnd()-0.5)*0.2, h/2, (rnd()-0.5)*0.2);
      bl.rotation.y = rnd()*3.14; bl.rotation.x = (rnd()-0.5)*0.35;
      c.add(bl);
    }
    c.position.set(Math.cos(a)*d, 0, Math.sin(a)*d);
    g.add(c);
  }
  const j = new THREE.Group();                           // 木栈桥探进水里
  for (let i=0;i<8;i++){
    const pl = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.07, 0.30), M.plank);
    pl.position.set(0, 0.44, i*0.33); j.add(pl);
  }
  for (const s of [1,-1]) for (const i of [0,4,7]){
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.52, 5), M.plank);
    p.position.set(s*0.42, 0.23, i*0.33); j.add(p);
  }
  j.position.set(1.4, 0, 3.4); j.rotation.y = 2.5; g.add(j);
  const t = makeTree(1.2, true, false, 1);
  t.position.set(-6.4, 0, 1.0); noShadow(t); g.add(t);
  return dress(g, 10, 5);
}
/* ── 景片 ③ 水塔 ── */
function vgTower(){
  const g = new THREE.Group();
  const H = 7.4, R0 = 2.5, R1 = 1.5;
  for (let i=0;i<4;i++){
    const a  = Math.PI/4 + i*Math.PI/2;
    const a2 = Math.PI/4 + ((i+1)%4)*Math.PI/2;
    const ft = V(Math.cos(a)*R0, 0, Math.sin(a)*R0), tp = V(Math.cos(a)*R1, H, Math.sin(a)*R1);
    const f2 = V(Math.cos(a2)*R0, 0, Math.sin(a2)*R0), t2 = V(Math.cos(a2)*R1, H, Math.sin(a2)*R1);
    g.add(tubeTaper(ft, tp, 0.12, 0.075, M.metal, 5));
    for (const f of [0.30, 0.62, 0.92]){
      g.add(tubeTaper(V(L(f2.x,ft.x,f), H*f, L(f2.z,ft.z,f)),
                      V(L(t2.x,tp.x,f), H*f, L(t2.z,tp.z,f)), 0.045, 0.045, M.metal, 4));
    }
  }
  const tank = new THREE.Mesh(new THREE.CylinderGeometry(1.95, 1.95, 2.8, 16), M.silo);
  tank.position.y = H + 1.4; g.add(tank);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(1.99, 1.99, 0.14, 16), M.rust);
  band.position.y = H + 0.35; g.add(band);

/* ── 公里里程碑 ──
   数字现画进 canvas，不引外部字体或图片，file:// 双击也能跑。

   回收规则要求 span === n×格距。取 n=2 / span=1000 → 每块相隔 500 m。
   每块回绕时被搬到 x=+500，还要再走 500 m 才从车边经过，正好 0.5 km，
   所以回绕那一刻要画的不是「现在的公里」而是 round1(S.km + 0.5) ——
   它下次露脸时所在的位置。差这半公里的话，碑上的数字会一直慢 HUD 一拍。 */
const round1 = x => (Math.round(x*10)/10).toFixed(1);
function makeKmStone(first){
  const g = new THREE.Group();
  const cv = document.createElement('canvas'); cv.width = 96; cv.height = 160;
  const cx = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.30, 1.15, 0.17), M.kmStone);
  body.position.y = 0.575; body.castShadow = true; g.add(body);
  const foot = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.10, 0.32), M.kmStone);
  foot.position.y = 0.05; foot.castShadow = true; g.add(foot);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.15, 0.20, 4), M.kmStone);
  cap.position.y = 1.25; cap.rotation.y = Math.PI/4; cap.castShadow = true; g.add(cap);
  const band = new THREE.Mesh(new THREE.BoxGeometry(0.31, 0.11, 0.18), M.marker);
  band.position.y = 0.36; g.add(band);
  // 两面都贴牌面。默认镜头就在这一侧，只画 -z 的话迎面是一块空白白板，
  // 像个不知道干什么的方柱子；两面都有号，从任何角度看过去都认得出是里程碑。
  for (const s of [1,-1]){
    const face = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.44),
      new THREE.MeshStandardMaterial({ map:tex, roughness:0.9 }));
    face.position.set(0, 0.88, s*0.086);
    if (s > 0) face.rotation.y = Math.PI;
    g.add(face);
  }
  g.userData.paint = (km, name) => {
    cx.fillStyle = '#ece7d7'; cx.fillRect(0, 0, 96, 160);
    cx.fillStyle = '#1f2430'; cx.fillRect(0, 0, 96, 48);
    cx.fillStyle = '#ece7d7';
    cx.font = 'bold 22px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('国 道', 48, 15);
    // 路段名压在公里数上面。光有数字的话，这块碑只会告诉你「走了多远」，
    // 不会告诉你「走到了哪儿」—— 而后者才是这条路唯一该有的信息。
    cx.font = 'bold 21px sans-serif';
    cx.fillText(name || '', 48, 37);
    cx.fillStyle = '#141414';
    cx.font = '900 62px sans-serif'; cx.fillText(km, 48, 101);
    cx.font = 'bold 26px sans-serif'; cx.fillText('km', 48, 144);
    tex.needsUpdate = true;
  };
  g.userData.km0 = first;
  // 碑面现在要打路段名，而 ROUTE 在碑造出来之后才定义（它引用了景片函数），
  // 所以首次上色推到 applyRoute() 里统一刷，这里只登记。
  KM_STONES.push(g);
  // 回绕时它会被搬到前方 0.5 km 处，碑面画的是**它下次露脸时**所在的路段
  g.userData.onWrap = o => {
    const k = S.km + 0.5;
    o.userData.paint(round1(k), routeName(k));
  };
  return g;
}


/* ── 回绕时换内容 ──
   span 内的 n 个槽位在一个周期里各换一次，序号都 +1，所以每一圈看到的
   排列都不一样；同一圈内 n 个槽位换的是 n 种不同的类型，不会撞车。
   只 dispose 几何体 —— 材质全是 M 里共用的，dispose 掉会连带把别的景物
   一起弄没。 */
function rerollOn(slot, i, makers){
  const set = g => {
    for (const c of [...slot.children]){
      slot.remove(c);
      c.traverse(m => { if (m.isMesh && m.geometry) m.geometry.dispose(); });
    }
    slot.add(g);
    slot.userData.spin = g.userData.spin || null;
  };
  set(makers[i % makers.length]());
  slot.userData.cycle = 0;
  slot.userData.set = set;         // 换路段时要重掷槽位，得能再调一次
  // 注意 makers **不**在这里捕获：回绕时要从 VIG_MAKERS 现取，
  // 那样换路段之后新绕回来的景才是新路段的。
  slot.userData.onWrap = o => {
    o.userData.cycle++;
    set(VIG_MAKERS[(o.userData.cycle + i) % VIG_MAKERS.length]());
  };
}


/* ── 铺景片层：每 90 m 一处「地方」 ──
   span 必须等于 n×格距，否则回绕距离和阵列间距对不上，图案就不是周期性的。 */
const VIGNETTES = [vgFarm, vgPond, vgTower, vgMill, vgHay, vgShelter, vgBridge, vgMast];
const VIG_SPAN = 720, VIG_N = VIGNETTES.length;
const VIG_SLOTS = [];                  // 换路段时要重掷「身前」那些槽位
let VIG_MAKERS = VIGNETTES;            // rerollOn 回绕时从这里现取
const KM_STONES = [];                  // 碑面要打路段名，首次上色推到 applyRoute 统一刷
for (let i=0;i<VIG_N;i++){
  const side = (i % 2) ? 1 : -1;
  const slot = new THREE.Group();
  slot.rotation.y = (side > 0 ? 0 : Math.PI) + rr(-0.35, 0.35);
  slot.position.set((i/VIG_N)*VIG_SPAN - VIG_SPAN*0.5, 0, side*rr(11, 26) - LANE);
  rerollOn(slot, i, VIGNETTES);
  addRecycled(slot, VIG_SPAN);
  VIG_SLOTS.push(slot);
}

/* ══════════════════ 旅程结构：这条路是有「地方」的 ══════════════════
   原来 S.km 只干一件事 —— 驱动里程碑上的数字。里程再多，风景还是那条
   风景：景片每 720 m 一轮回绕、地标每 1000 m 一轮，每一轮换的还是同一批
   类型。于是骑 5 km 和骑 500 m 看到的东西没有本质区别，「一直往前」往前
   是个空词，8 首歌也只是随机播放、和画面没关系。

   现在把路切成 6 段，每段有自己的名字、长度、风景词汇、疏密和配乐。
   一共 5.0 km：15 km/h 骑一趟 20 分钟，36 km/h 8 分半 —— 刚好是你坐得住、
   又不至于看完就腻的长度。

   换段时**只重掷身后的景（x > 0 那些还在前面）**：身后的保留上一段的样
   子，那是你刚离开的地方；身前的立刻换成新一段。于是边界是「走过去」，
   不是「啪一下全换」—— 眼睛看不到景物凭空跳一下。

   改路线就是改这张表：名字 / 长度 / 哪几样景 / 哪几个标签多密 / 第几首歌 /
   进段台词，全是数据。 */
const ROUTE = [
  { name:'村口', km:0.9, trk:0,
    vig:[vgFarm, vgHay, vgShelter, vgMast],
    fence:true,
    w:{ tree:0.80, bush:1.15, rock:0.55, flower:1.30, hill:1.00 },
    say:'鹧鸪：出了<strong>村口</strong>，前面是<strong>河堤</strong>' },
  { name:'河堤', km:0.8, trk:4,
    vig:[vgPond, vgBridge, vgShelter, vgMast],
    reed:true,
    /* 石头从 1.25 压到 0.55：原来的权重让河堤是六段里石头最多的，
       看着像采石场。堤上应该是水草多、石头少。 */
    w:{ tree:0.45, bush:0.70, rock:0.55, flower:0.80, grass:1.25, hill:0.75 },
    say:'鹧鸪：上了<strong>河堤</strong>，水边<strong>风大</strong>，慢点' },
  { name:'林荫', km:0.7, trk:5,
    vig:[vgHay, vgMast, vgShelter, vgFarm],
    tunnel:true,
    /* tag 的 tree:1.00 留给远处的几带（treeFar/treeLine/treeSky），那是"隧道尽头还有林子"。
       近树和树墙按 id 单独压：treeNear 矮、站在隧道树前面会把路挡成一道绿墙；
       treeMid 在隧道后面再排一列，纵深就没了 —— 隧道必须是最后面才收口的那一排。
       灌木留一半（林下本来就有丛），花压到三成（树冠底下花长不开）。 */
    w:{ tree:1.00, treeNear:0.10, treeMid:0.15,
        bush:0.55, rock:0.35, flower:0.30, grass:0.60, hill:1.00 },
    say:'鹧鸪：进<strong>林荫</strong>了，树一棵一棵往后退' },
  { name:'长坡', km:1.2, trk:1,
    vig:[vgMill, vgTower, vgMast, vgShelter],
    boulder:true,
    w:{ tree:0.35, bush:0.50, rock:1.35, flower:0.45, hill:1.45 },
    say:'鹧鸪：<strong>长坡</strong>！这段得攒点劲' },
  { name:'镇子', km:0.5, trk:6,
    vig:[vgFarm, vgTower, vgShelter, vgMast],
    house:true,
    /* 树从 0.55 压到 0.40：镇子里树比屋少，屋才是主角；
       lamp 没写就是默认 1.0，五盏路灯本来就全开，镇子该有的。 */
    w:{ tree:0.40, bush:0.70, rock:0.40, flower:1.00, hill:0.70 },
    say:'鹧鸪：进<strong>镇子</strong>了，慢下来，别撞着人' },
  { name:'长桥', km:0.9, trk:7,
    vig:[vgBridge, vgPond, vgMast, vgMill],
    rail:true,
    w:{ tree:0.40, bush:0.60, rock:0.95, flower:0.70, grass:0.85, hill:0.85 },
    say:'鹧鸪：上<strong>长桥</strong>了，一直往前吧' }
];
let ROUTE_LEN = 0;
for (const s of ROUTE){ s.at = ROUTE_LEN; ROUTE_LEN += s.km; }

/* km（可为负、可以任意大）→ 段号。跑完一圈回到第 0 段，km 继续往上加。 */
function segAt(km){
  let k = km % ROUTE_LEN; if (k < 0) k += ROUTE_LEN;
  let i = 0;
  while (i < ROUTE.length - 1 && k >= ROUTE[i].at + ROUTE[i].km) i++;
  return i;
}
function routeName(km){ return ROUTE[segAt(km)].name; }

/* 段专属带（own）的**连续**权重。
   这些东西以前是硬开关：applyRoute 一被调用，44 根篱笆在同一帧从可见变成
   不可见、26 丛芦苇从不可见变成可见。物件差异做得越干净，这个「唰」一下
   越扎眼 —— 远看就像路边立了一堵看不见的墙，然后墙又没了。
   所以改成按「离段界还有多远」连续变化：进场 0→1，出场 1→0，
   骑过去是「走进一片芦苇」，不是「芦苇出现了」。

   d 的算法要说清楚，不然下一个改这里的人会踩同一个坑：
   ROUTE 是**绕圈**的（跑完 5 km 回到第 0 段，km 继续往上加），所以
   (km - seg.at) 必须先归一化到 ±ROUTE_LEN/2，取**最近的那一次**。
   不归一化的话，骑到第 6 公里时 d 会是 5000，权重恒等于 0，
   表现为「绕一圈之后所有段专属物件再也不出现了」。 */
const SEG_BLEND = 0.15;                        // km：进出各 150 m 渐变
/* 第 i 段在 km 处「有多少」。段内为 1，出了段界在 SEG_BLEND 内降到 0。
   抽成按**段号**取，是因为现在有两样东西都要它：段专属物件的权重，
   以及六段各自的光。共用一个函数才不会出现「物件渐变了、光没渐变」。 */
function segAmt(i, km){
  const seg = ROUTE[i];
  let d = (km - seg.at) % ROUTE_LEN;
  if (d < 0) d += ROUTE_LEN;
  if (d > ROUTE_LEN/2) d -= ROUTE_LEN;
  if (d < 0)      return clamp(1 + d/SEG_BLEND, 0, 1);             // 段前：-0.15→0，0→1
  if (d > seg.km) return clamp(1 - (d - seg.km)/SEG_BLEND, 0, 1);  // 段后：末→1，+0.15→0
  return 1;
}
function ownW(own, km){
  for (let i = 0; i < ROUTE.length; i++) if (ROUTE[i][own]) return segAmt(i, km);
  return 0;                                   // 没有任何一段开它 → 永远不出现
}

/* 带子权重 —— **每帧**跟着 km 走，段专属带才有那圈渐变。
   权重解析，优先级从高到低：
     ① B.own —— **段专属**的带：只有该段开了同名开关才出现，权重是连续的。
        own:'tunnel' 就看 s.tunnel（经 ownW 变成 0~1），own:'fence' 同理。
        它不能靠 tag 顺带被打开 —— tag 可能和别的带重名（tree 就有五条），
        不显式关掉的话，另外几段都会莫名其妙长出同一排东西。
     ② s.w[B.id] —— 按**带**调。id 优先于 tag 之后，「林荫」才能把
        44 棵隧道树拉满的同时，单独把同 tag 的近树带压掉；
        只按 tag 调的话，五条 tag:'tree' 会一起变，想压谁都压不住。
     ③ s.w[B.tag] —— 老行为，一段里所有同 tag 的带一起调。
     ④ 都没有就是 1。
   ⚠️ ②里 B.id 可能是 undefined（_routeharness 有一条没有 id 的替身带子），
      s.w[undefined] 求值成 undefined，于是自然落到 ③ —— 旧 harness 不受影响。 */
function applyBands(km){
  const s = ROUTE[segAt(km)];
  for (const B of BANDS){
    let w;
    if (B.own)                              w = ownW(B.own, km);
    else if (s.w && s.w[B.id] !== undefined) w = s.w[B.id];
    else                                    w = (s.w && s.w[B.tag] !== undefined) ? s.w[B.tag] : 1;
    const n = B.objs.length;
    /* ceil 不是 floor：原来的 (k/n) < w 在 n*w 落在两个整数中间时
       （n=10、w=0.55）会留 6 个，floor 给 5 个 —— 那是把既有行为悄悄改掉，
       而权重表里这种小数多的是。ceil 才和 (k/n)<w 逐项等价。 */
    const lim = Math.min(n, Math.ceil(clamp(w, 0, 1) * n));
    for (let k = 0; k < n; k++) B.objs[k].visible = k < lim;
  }
}

/* 换段：重掷身前的景片 + 刷新碑面。
   带子权重不再在这里算 —— 它归 applyBands，那东西每帧都跑。
   这里仍按**段中央**调一次，免得刚进段的那一帧权重还停在上一段上。 */
function applyRoute(i){
  const s = ROUTE[i];
  applyBands(s.at + s.km*0.5);
  VIG_MAKERS = s.vig;
  let c = 0;
  for (const slot of VIG_SLOTS){
    if (slot.position.x <= 0) continue;   // 身后的别动，那是你刚离开的地方
    slot.userData.set(s.vig[(slot.userData.cycle + c) % s.vig.length]());
    c++;
  }
  for (const g of KM_STONES) g.userData.paint(round1(g.userData.km0), routeName(g.userData.km0));
}

/* ══════════════════ 六段各有各的光 ══════════════════
   时段×天气是**全局**的：白天/黄昏/夜晚 × 晴/雨/雪/雾，composeMood 算出一整套，
   applyMood 一次落到场景上。那张表一个字都不动 —— 段不是去改它，
   是在它算完之后叠一层**修正**。理由有两个：
     ① 动了它，450 项 mood 回归就全在盯着一个「六段各自的天时」，
        而那不是这套表该管的事；
     ② 段的光要跟天气正交：下雨的林荫该是「暗」而不是「另一个雨天」。

   每段只改四样，不碰天空贴图（每帧重画一张 canvas 贴图太贵）：
     dir  —— 直射光倍率。林荫压到 0.42 是这里最大的一件：树冠把太阳挡掉大半，
             不压这一项，「隧道」就只是两排树，看不出头顶有东西。
     hemi —— 半球光倍率。开阔的地方（河堤/长桥）天空贡献更多。
     warm/cool —— 色偏。镇子偏暖（墙是土黄 + 瓦），林荫偏冷偏绿。
     fogFar —— 雾的远端。开敞的长桥看得远，隧道里看得近。
     exp  —— 曝光。林荫压暗之后要补一点，不然整段发闷。 */
const SEGLIGHT = [
  { dir:1.04, hemi:1.02, warm:0.10, cool:0.00, fogFar:1.00, exp:1.00 },  // 村口
  { dir:1.10, hemi:1.08, warm:0.02, cool:0.07, fogFar:1.08, exp:1.03 },  // 河堤：水边开阔
  { dir:0.42, hemi:0.90, warm:0.00, cool:0.12, fogFar:0.90, exp:0.94 },  // 林荫：头顶有东西
  { dir:1.02, hemi:1.00, warm:0.06, cool:0.00, fogFar:1.02, exp:1.00 },  // 长坡
  { dir:0.86, hemi:1.05, warm:0.17, cool:0.00, fogFar:0.96, exp:1.00 },  // 镇子：土墙瓦顶
  { dir:1.08, hemi:1.10, warm:0.00, cool:0.04, fogFar:1.12, exp:1.04 }   // 长桥：最开阔
];

/* 把六段的光按「此刻各占多少」叠回场景。
   ⚠️ 权重是**按存在度加权的平均**，不是累加 —— 不加权的话骑在段界上
   两侧各 0.5，光会double 成一片死白。而且加权平均保证：
   只有一段存在度为 1 时，结果精确等于那一段的档案值（判据就靠这个）。 */
function applySegLight(km){
  if (!MOOD) return;
  const m = MOOD;
  let dK=0, hK=0, warm=0, cool=0, fK=0, eK=0, w=0;
  for (let i = 0; i < ROUTE.length; i++){
    const a = segAmt(i, km), p = SEGLIGHT[i];
    if (!p || a <= 0) continue;
    dK += p.dir*a;  hK += p.hemi*a;
    warm += p.warm*a; cool += p.cool*a;
    fK += p.fogFar*a; eK += p.exp*a;
    w += a;
  }
  if (w <= 0) return;                      // 离所有段都很远：保持全局那张表
  dK/=w; hK/=w; warm/=w; cool/=w; fK/=w; eK/=w;
  dir.intensity = m.dirI * dK;
  hemi.intensity = m.hemiI * hK;
  /* 色偏走两步：先按 cool 往青绿推，再按 warm 往琥珀推。
     顺序有意义 —— 林荫是「树冠滤过的光」（偏绿）再叠一点暖边，
     反过来就成了傍晚的树林。 */
  dir.color.setHex(mixHex(mixHex(m.dirCol, 0xbfe0cf, cool), 0xffd9a0, warm));
  hemi.color.setHex(mixHex(mixHex(m.hemiSky, 0xc8e2d2, cool), 0xffe6bd, warm));
  hemi.groundColor.setHex(mixHex(mixHex(m.hemiGround, 0x9fb894, cool), 0xd8bd8e, warm));
  if (scene.fog){
    scene.fog.far = m.fogFar * fK;
    scene.fog.color.setHex(mixHex(mixHex(m.fog, 0xc2ddd2, cool), 0xe8d6b4, warm));
  }
  renderer.toneMappingExposure = m.exposure * eK;
}

/* ── 铺地标层：压进雾里当远方 ──
   z 放在 76~94：必须躲开 z 34~84 的树线。远树最高 24 m，在 z=70 处从 3 m 高的
   视角看过去张角 16°；地标放到 z 85 以外、再做到 32~57 m 高（张角 22° 以上），
   才能真的从树顶冒出来 —— 摆在树线里侧就是白建。
   fogFar 同时放到 420：200 m 外雾还剩一半，轮廓才留得住。 */
const LANDMARKS = [lmPagoda, lmTower, lmSilo, lmWind, lmViaduct];
const LM_SPAN = 1000, LM_N = LANDMARKS.length;
for (let i=0;i<LM_N;i++){
  const side = (i % 2) ? -1 : 1;
  const slot = new THREE.Group();
  slot.rotation.y = (side > 0 ? 0 : Math.PI) + rr(-0.3, 0.3);
  slot.position.set((i/LM_N)*LM_SPAN - LM_SPAN*0.5, 0, side*rr(76, 94) - LANE);
  rerollOn(slot, i, LANDMARKS);
  addRecycled(slot, LM_SPAN);
}
/* ── 里程碑：每 500 m 一块，数字跟着回绕往前跳 ── */
{
  const n = 2, span = 1000;
  for (let i=0;i<n;i++){
    const x0 = (i/n)*span - span*0.5;
    const o = makeKmStone(round1((x0 < 0 ? x0 + span : x0)/1000));
    o.position.set(x0, 0, 2.45 - LANE);
    addRecycled(o, span);
  }
}

/* ══════════════════ state ══════════════════ */
const S = {
  running:true, cruise:false, speed:15, target:15,
  km:0, wheel:0, crank:0, tSec:0, blinkT:2, blink:0, sweat:0, capT:0, dustAcc:0,
  seg:-1,                         // 当前路段（ROUTE 的下标）。-1 = 还没定，第一帧统一补上
  mouth:0,
  // driving: steer is the smoothed command (-1 left … +1 right), steerIn the raw
  // key state, yaw the heading, lat the lateral offset from the lane centre
  steer:0, steerIn:0, yaw:0, lat:0, offRoad:0, sliderHold:false,
  // 碰撞：hitT 冷却（秒），shake 镜头抖动强度（1→0）
  hitT:0, shake:0,
  // 自动巡航的舵：cruiseTick 的输出（S.steerIn 直接吃它），
  // autoLat 是它想去的那条横向位置，autoSide 是上一次让开的边（-1 左 / +1 右）
  steerCmd:0, autoLat:0, autoSide:0,
  // 鹧鸪的状态（moodTick 写，rig 段读）。全部 0..1 或秒，见那节的说明。
  fatigue:0,        // 累 —— 里程的饱和函数 + 速度。慢下来会回一点
  startle:0,        // 惊吓 —— 撞车那一下顶到 1，1.1 秒衰完
  wet:0,            // 湿 —— 跟着雨量涨，雨停之后慢慢干
  lookT:0, lookSide:0,   // 回头看：剩余秒数 + 往哪边看
  lookAmt:0,        // 回头看的强度（0→1→0 的包络，给头用）
  rainPrev:0,       // 上一次的雨量，用来判「刚刚开始下雨」
  saidTired:false   // 累到某个程度时说过一句没有（只说一次）
};

/* 深链：?km=1.8 直接从那一公里开始。
   要看某一段长什么样，不用先骑两公里过去 —— 打开就是那一段。
   ⚠️ 必须放在 S0 快照**之前**，不是之后。
      原来它写在 S0 后面，注释还写着「于是『重置』也回到这个起点」——
      那句推理是**反的**：写在之后的话 S.km=1.8 而 S0.km=0，
      resetRide() 拿 S0 填回去，里程就跳回 0 了，正是注释想避免的那个。
      深链的整个用法就是「打开就是那一段」，一按重置就丢，等于没有。
      （_uistate.html?km=2.0 实测 S.km=2 / S0.km=0 抓到的。）
   seg 保持 -1，主循环第一帧就会按 S.km 切段、播进段台词（5043 那段逻辑）。 */
try{
  const q0 = new URLSearchParams(location.search).get('km');
  const km0 = parseFloat(q0);
  if (Number.isFinite(km0) && q0 !== null) S.km = km0;   // parseFloat(null) 是 NaN，但显式挡一层更清楚
}catch(_){ /* file:// 下个别环境没有 URLSearchParams，忽略即可 */ }

/* 初值只有这一处。**初始状态**和「重置之后」必须由同一个来源产出，
   否则两者迟早对不上 —— 面板上有一盏灯跟状态对不上时，
   根因往往是「初值写了两遍」。重置直接拿 S0 填回去。
   ⚠️ S 是 const（frame() 每帧闭包引用它），所以只能逐字段写回。
   ⚠️ 快照点在深链**之后**：所以 S0.km 记的是「?km= 指定的起点」，
      按重置回到的是那个起点而不是 0。 */
const S0 = {};
for (const k in S) S0[k] = S[k];

/* 重置 = 回到初始状态，**并且面板上的每一盏灯都跟上**。
   第一版只清了 9 个字段，于是骑了 3 km 之后按重置：鸟还是累的、
   「腿有点酸」那句因为 saidTired=true 再也不说、压草的减速还挂着、
   碰撞冷却还剩半秒、眼睛可能冻在半睁、巡航还在自己跑而灯也没灭。
   seg 归 -1 是故意的：下一帧会重新进第 0 段，顺带把进段台词再说一遍。 */
function resetRide(){
  for (const k in S0) S[k] = S0[k];
  $('bCruise').classList.remove('on');
  $('rSpeed').value = S0.speed;
  // toFixed(1)，和每帧写 vSpeed 的那行同一个格式 —— 写 toFixed(0) 的话，
  // 暂停中按重置会看到「15 km/h」，一恢复又变「15.0 km/h」，自己跟自己打架
  $('vSpeed').textContent = S0.speed.toFixed(1) + ' km/h';
}

/* ── driving keys ───────────────────────────────────────────
   记的是「按住」，不是「按一下」。油门和刹车得能一直踩住，速度才能连续地
   加加减减；方向同理，一直按住就一直转。 */
const keys = { up:false, down:false, left:false, right:false };
const KEYMAP = {
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right'
};
// 半路接手：按住行驶键 = 你在开，巡航自动让位
function takeOver(){
  if (S.cruise){ S.cruise = false; $('bCruise').classList.remove('on'); }
}
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k){ keys[k] = true; takeOver(); e.preventDefault(); }
});
addEventListener('keyup',   e => { const k = KEYMAP[e.code]; if (k){ keys[k] = false; e.preventDefault(); } });
// 切出窗口时松手，否则回来发现车还在自己拐
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ══════════════════ orbit camera ══════════════════ */
const CAM = {
  az: 1.05, pol: 1.33, dist: 3.9,
  azT: 1.05, polT: 1.33, distT: 3.9,
  target: new THREE.Vector3(0, 0.62, 0),
  spin: true, idle: 0, dragging:false, panning:false, lastX:0, lastY:0
};
const polarOK = p => Math.min(1.50, Math.max(0.12, p));

/* 触屏手势。
   在这之前相机只有两件事：「一根指针拖 = 环绕」和「滚轮 = 缩放」。可触屏上：
     e.button 恒为 0   → 「右键平移」那条分支永远进不去；
     没有 wheel 事件   → 根本没有缩放；
     没有任何 pinch     → 双指什么也干不了。
   也就是说提示语里那三样，手机上一样都不成立。这里补上双指捏合缩放 + 双指平移，
   并且保证「屏幕上只有一根指针时，行为与原来逐字节一致」，桌面端零回归。 */
const PTR = new Map();     // pointerId -> {x,y}
let pinch = null;          // 两指当前的间距和中点
function ptrJoin(e){
  PTR.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (PTR.size >= 2){
    const v = [...PTR.values()];
    pinch = { d: Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y) || 1,
              x:(v[0].x+v[1].x)/2, y:(v[0].y+v[1].y)/2 };
  } else {
    pinch = null;
    CAM.panning = (e.button === 2 || e.shiftKey);
    CAM.lastX = e.clientX; CAM.lastY = e.clientY;
  }
}
function camPan(dx, dy){
  const s = CAM.dist * 0.0016;
  CAM.target.addScaledVector(V(Math.cos(CAM.az), 0, -Math.sin(CAM.az)), -dx*s);
  CAM.target.y = Math.min(2.4, Math.max(0.10, CAM.target.y + dy*s));
}
cv.addEventListener('pointerdown', e => {
  CAM.dragging = true;
  cv.classList.add('dragging');
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  ptrJoin(e);
  CAM.idle = 0;
});
cv.addEventListener('pointermove', e => {
  if (!CAM.dragging || !PTR.has(e.pointerId)) return;
  if (PTR.size >= 2){
    const prev = pinch;
    PTR.set(e.pointerId, { x:e.clientX, y:e.clientY });
    const v = [...PTR.values()];
    const d = Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y) || 1;
    const mx = (v[0].x+v[1].x)/2, my = (v[0].y+v[1].y)/2;
    if (prev){
      CAM.distT = Math.min(16, Math.max(1.0, CAM.distT * (prev.d / d)));   // 张开 = 拉近
      camPan(mx - prev.x, my - prev.y);                                   // 中点位移 = 平移
    }
    pinch = { d, x:mx, y:my };
  } else {
    const dx = e.clientX - CAM.lastX, dy = e.clientY - CAM.lastY;
    CAM.lastX = e.clientX; CAM.lastY = e.clientY;
    if (CAM.panning) camPan(dx, dy);
    else {
      CAM.azT  -= dx * 0.0072;
      CAM.polT  = polarOK(CAM.polT - dy * 0.0060);
    }
  }
  CAM.idle = 0;
  camPresetOff();
});
function endDrag(e){
  PTR.delete(e.pointerId);
  if (PTR.size < 2) pinch = null;
  if (PTR.size === 1){
    /* 两指回到一指：必须重新播种。否则下一帧的 dx 是「从抬手前的位置到手指当前位置」
       的一大跳，镜头会猛地甩一下 —— 这是双指手势最常见的坑。 */
    const rest = [...PTR.values()][0];
    CAM.lastX = rest.x; CAM.lastY = rest.y; CAM.panning = false;
  }
  if (PTR.size === 0){
    CAM.dragging = false; CAM.panning = false;
    cv.classList.remove('dragging');
  }
  try { cv.releasePointerCapture(e.pointerId); } catch(_){}
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => {
  e.preventDefault();
  CAM.distT = Math.min(16, Math.max(1.0, CAM.distT * (1 + Math.sign(e.deltaY)*0.10)));
  CAM.idle = 0;
  camPresetOff();                     // 缩放同样离开了那个机位
}, { passive:false });

/* ══════════════════ mood ══════════════════ */
const AU = {
  ctx:null, ready:false, on:true, master:null, noise:null,
  clickAcc:0, nextBird:1.5, nextCricket:0, nextHuff:0,
  callAt:0, callNotes:null, birds:false   // 鸟鸣单独一根线，默认关
};
function applyMood(tk, wk){
  const m = MOOD = composeMood(tk, wk);
  if (skyMat.map) skyMat.map.dispose();
  skyMat.map = skyTexture(m.sky[0], m.sky[1], m.sky[2]);
  skyMat.needsUpdate = true;
  scene.fog = new THREE.Fog(m.fog, m.fogNear, m.fogFar);
  renderer.toneMappingExposure = m.exposure;
  hemi.color.setHex(m.hemiSky); hemi.groundColor.setHex(m.hemiGround); hemi.intensity = m.hemiI;
  dir.color.setHex(m.dirCol); dir.intensity = m.dirI; dir.position.set(...m.dirPos);
  stars.visible = m.stars;
  M.hill.color.setHex(m.hill); M.hillFar.color.setHex(m.hillFar);
  M.cloud.color.setHex(m.cloud); M.cloud.opacity = m.cloudOpacity;
  clouds.children.forEach(c => c.children.forEach(s => { s.material.opacity = m.cloudOpacity; }));
  headLight.intensity = m.bikeLight * 1.25;
  headLight.position.set(0.52, 0.95, 0);
  applyWeather(m);
  lamps.forEach(l => {
    l.userData.lamp.head.material.emissiveIntensity = m.lamps ? 1.8 : 0;
    l.userData.lamp.glow.intensity = m.lamps ? 11 : 0;
  });
  // crickets only exist after dark — cross-fade them with the sky
  if (AU.ready) AU.nightG.gain.setTargetAtTime(m.lamps ? 1 : 0, AU.ctx.currentTime, 1.4);
  // 背景音乐在夜色里自动退后一点（由 bgmTick 每帧推进，渐变而非跳变）
}

/* 天气只管「地湿不湿、雪盖没盖、粒子下不下」这三件事。
   太阳、星星、路灯全是时段的活儿 —— 所以这函数里一根灯的线都没有，
   也就不会出现「切了下雨，路灯跟着灭掉」这种越界。 */
function applyWeather(m){
  // 贴图还在，染的是它前面那层 color。k=0 时算出来正好是纯白 = 原样。
  // 染色只干「压暗」这一件事（雨/雾），「盖雪」交给下面两张盖面。
  groundMat.color.setHex(mixHex(0xffffff, m.groundTint, m.groundK));
  fieldOverlay.material.color.setHex(mixHex(0xffffff, m.groundTint, m.groundK*0.6));
  roadMesh.material.color.setHex(mixHex(0xffffff, m.roadTint, m.roadK*0.45));
  // 雪盖：一张半透明的白面压住整片草地
  groundFx.visible = m.groundFxK > 0.02;
  groundFx.material.opacity = m.groundFxK;
  // 路面盖面：雨是暗的（湿沥青反光），雪是白的（雪盖住漆）
  roadFx.visible = m.roadFxK > 0.02;
  roadFx.material.color.setHex(m.roadFxCol);
  roadFx.material.opacity = m.roadFxK;
  roadFx.material.roughness = m.snow > 0 ? 0.85 : 0.10;
  roadFx.material.metalness = m.snow > 0 ? 0.0  : 0.55;
  // 树冠、屋顶、石墙一起挂雪。每项都从**原色**算，所以来回切天气不会越切越白。
  for (const [k, f] of SNOWY)
    M[k].color.setHex(mixHex(M[k].userData.baseCol, 0xeaf1f8, m.snow*f));
  RAIN.amount = m.rain;  SNOW.amount = m.snow;
  // 面板上的按钮必须跟真正生效的那一档一致，不然会点亮了错的灯
  for (const k in TIMES)    $('t_'+k).classList.toggle('on', k === m.tk);
  for (const k in WEATHER) $('w_'+k).classList.toggle('on', k === m.wk);
  // 鸟鸣按钮的说明也跟着天气走：雨雪天它开着但不叫，得说清楚为什么
  paintBirdBtn();
}

/* ══════════════════ UI ══════════════════ */
const $ = id => document.getElementById(id);
$('bPlay').addEventListener('click', e => {
  S.running = !S.running;
  e.currentTarget.textContent = S.running ? '⏸' : '▶';
  // 暂停时把眼睛睁开：眨眼是 0.12 秒的动画，正好卡在中间暂停的话，
  // 鸟会半睁着眼睛一直冻到恢复 —— 静止画面里最显眼的「坏了」。
  if (!S.running) S.blink = 0;
});
$('bReset').addEventListener('click', () => resetRide());
$('rSpeed').addEventListener('input', e => {
  // 滑块直接给速度，不再是「目标值」—— 键盘在踩的时候它就是个读数
  S.speed = parseFloat(e.target.value); S.cruise = false; $('bCruise').classList.remove('on');
});
// 鼠标拖着滑杆的时候，它就是油门：按住就别再被每帧的读数回写覆盖，
// 滑行阻力也先不算 —— 不然「拖上去 → 立刻被拽下来」，手感像推不动。
$('rSpeed').addEventListener('pointerdown', () => { S.sliderHold = true; });
for (const ev of ['pointerup','pointercancel','pointerleave'])
  addEventListener(ev, e => { if (e.target === $('rSpeed')) S.sliderHold = false; });
$('rSpeed').addEventListener('dblclick', () => { S.speed = 0; $('rSpeed').value = 0; });
$('bCruise').addEventListener('click', e => { S.cruise = !S.cruise; e.currentTarget.classList.toggle('on', S.cruise); });
function setView(az, pol, dist, ty = 0.62){ CAM.azT = az; CAM.polT = polarOK(pol); CAM.distT = dist; CAM.target.y = ty; CAM.idle = 0; }
// the highlighted camera button has to follow the actual mode, otherwise 自动环绕
// keeps its lit state after you switch to a fixed view
function setCamMode(id, spin){
  CAM.spin = spin;
  for (const b of ['bSpin','bFollow','bFront','bBack','bBird','bBike']) $(b).classList.toggle('on', b === id);
}
/* 机位预设是**一个位置**，不是开关。手一动镜头它就不成立了，灯必须灭 ——
   「正面」还亮着而 azT 已经偏了 1.15 rad，就是在骗人。
   ⚠️ 自动环绕不在这个名单里：它是**行为**，拖一下只是让 CAM.idle 归零、
   两秒后接着转，灯是对的。
   ⚠️ 挂在 pointermove / wheel 上而不是 pointerdown：原地点一下不动镜头，
      预设仍然成立，不该平白灭掉。 */
function camPresetOff(){
  for (const b of ['bFollow','bFront','bBack','bBird','bBike']) $(b).classList.remove('on');
}
/* 机位预设表。**按钮和导演模式必须读同一张** ——
   同一个机位有两个出处的话，早晚有一个会改而另一个不改，
   然后「导演模式的鸟瞰」和「面板的鸟瞰」差半个身位，没人会发现。 */
const CAMS = {
  bFollow:{ az:'keep', pol:1.20, dist:2.55, ty:0.62 },
  bFront: { az:0.0,      pol:1.32, dist:2.95, ty:0.62 },
  bBack:  { az:Math.PI,  pol:1.32, dist:2.95, ty:0.62 },
  bBird:  { az:0.92,     pol:1.34, dist:0.86, ty:1.20 },
  bBike:  { az:1.16,     pol:1.30, dist:1.55, ty:0.66 }
};
function camGo(id){
  const c = CAMS[id];
  setCamMode(id, false);
  setView(c.az === 'keep' ? CAM.azT : c.az, c.pol, c.dist, c.ty);
}
$('bSpin').addEventListener('click',   () => { setCamMode('bSpin', true); CAM.idle = 99; });
$('bFollow').addEventListener('click', () => camGo('bFollow'));
$('bFront').addEventListener('click',  () => camGo('bFront'));
$('bBack').addEventListener('click',   () => camGo('bBack'));
$('bBird').addEventListener('click',   () => camGo('bBird'));
$('bBike').addEventListener('click',   () => camGo('bBike'));
setCamMode('bSpin', true);   // single source of truth for the initial mode too

/* ══════════════ 电影模式 ══════════════
   全屏 + 藏起面板，只留画面；动一下鼠标/手指界面淡回来，2.6 秒没人理它再淡出。
   「全屏」和「藏界面」是**两件独立的事**，必须解耦：
   浏览器规定 requestFullscreen 只能在用户手势那一拍同步调用，
   而 iframe（harness 就跑在里面）除非带 allow="fullscreen" 永远进不去全屏。
   所以全屏失败时电影模式照样要能用，否则一进 iframe 整个功能就废了。 */
const CIN = { on:false, timer:0, wasFs:false, bare:false };
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function cinWake(){
  document.documentElement.classList.add('over');
  if (CIN.timer) clearTimeout(CIN.timer);
  CIN.timer = setTimeout(() => document.documentElement.classList.remove('over'), 2600);
}
/* 「纯画面」：连浮条和侧边框一起藏，只剩 3D 和鹧鸪的台词。
   为什么单独再给一个状态：浮条已经会跟着 .over 自己淡出（不动就藏），
   但那是**暂时的** —— 每次动一下鼠标它又冒出来，而有人就是想要一直干干净净。
   状态记在 CIN.bare 里（而不是只读 class），这样退出电影模式时能一并复位。 */
function setBare(on){
  CIN.bare = on;
  document.documentElement.classList.toggle('bare', on);
  if (!on) cinWake();
}
function exitCinema(){
  CIN.on = false;
  CIN.bare = false;
  if (CIN.timer) { clearTimeout(CIN.timer); CIN.timer = 0; }
  document.documentElement.classList.remove('cin', 'over', 'bare');
  if (fsOn()){ try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch(e){} }
}
function enterCinema(){
  CIN.on = true;
  CIN.wasFs = false;
  CIN.bare = false;
  document.documentElement.classList.remove('bare');
  document.documentElement.classList.add('cin');
  // ⚠️ 必须在**这一拍里同步调用**。前面只要有任何 await / Promise，
  //    用户手势的 activation 就过期了，浏览器直接拒绝 ——
  //    而拒绝是静默的，表现为「点了没反应」。
  const el = $('wrap');
  if (!fsOn()){
    try {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch(e){}   // 没交互 / 策略不允许 / iframe 没放行 —— 都不致命
  }
  cinWake();
}
$('bCinema').addEventListener('click', () => { CIN.on ? exitCinema() : enterCinema(); });
$('cBare').addEventListener('click', () => { if (CIN.on) setBare(!CIN.bare); });

/* ══════════════════ 导演模式 ══════════════════
   一张**分镜表**：每镜自己配公里数、时段、天气、机位、时长、台词。
   它不是「自动巡航」换个名字 —— 巡航是沿着路一直往前，这是**跳切**：
   一镜一个地方、一套光，导演说了算。

   走完 8 镜刚好把能演示的都过了一遍：
     六段各自的风光 · 白天/黄昏/夜晚 · 晴/雨/雾/雪 · 电影模式 · 四种机位。
   加镜头只要往 SHOTS 里加一行，不用改任何逻辑。 */
const SHOTS = [
  { km:0.30, tk:'day',   wk:'clear', cam:'bSpin',   spd:10, dur:18, cin:false,
    cap:'<b>一条路，六个地方。</b>　导演模式按分镜表走，按 <b>Esc</b> 随时退出' },
  { km:1.20, tk:'day',   wk:'clear', cam:'bFollow', spd:14, dur:16, cin:false,
    cap:'<b>河堤</b>　水边开阔，天空给的光更多 —— 六段各有各的光' },
  { km:2.00, tk:'day',   wk:'clear', cam:'bFollow', spd:13, dur:16, cin:false,
    cap:'<b>林荫</b>　44 棵隧道树。树冠把太阳挡掉大半，所以这一段的直射光只有别处的四成' },
  { km:3.00, tk:'day',   wk:'rain',  cam:'bFollow', spd:12, dur:16, cin:false,
    cap:'<b>长坡</b>　<b>雨</b>　路面湿了反光就上来；时段和天气是全局的，段的光叠在上面' },
  { km:3.80, tk:'dusk',  wk:'rain',  cam:'bFollow', spd:11, dur:16, cin:false,
    cap:'<b>镇子</b>　<b>黄昏 + 雨</b>　土墙瓦顶，所以光是暖的' },
  { km:4.50, tk:'night', wk:'fog',   cam:'bFollow', spd:11, dur:18, cin:true,
    cap:'<b>长桥</b>　<b>夜 + 雾</b>　桥上最开阔，看得最远' },
  { km:2.00, tk:'night', wk:'snow',  cam:'bBike',   spd:12, dur:16, cin:true,
    cap:'<b>雪夜的林荫</b>　同一个地方，换一套时段和天气，还是那六段自己的光' },
  { km:0.30, tk:'day',   wk:'clear', cam:'bBird',   spd:14, dur:16, cin:false,
    cap:'<b>回到村口</b>　一轮走完，自动从头再放' }
];
const DIR = { on:false, i:0, t:0, putCinema:false };

/* 切到某一镜。km 是**跳**过去的 —— 骑过去要两三分钟，那不叫分镜叫赶路。
   跳的时候顺手把 S.seg 也设成当前段，主循环的 `seg !== S.seg` 就不会触发，
   进段台词也就不会把这镜的说明盖掉。 */
function dirShot(i){
  const s = SHOTS[i];
  DIR.i = i; DIR.t = 0;
  S.km = s.km; S.seg = segAt(s.km);
  applyRoute(S.seg);
  applyBands(S.km);
  applySegLight(s.km);
  if (MOOD.tk !== s.tk || MOOD.wk !== s.wk) applyMood(s.tk, s.wk);
  S.speed = s.spd; S.target = s.spd;
  if (!S.cruise){ S.cruise = true; $('bCruise').classList.add('on'); }
  if (s.cam === 'bSpin'){ setCamMode('bSpin', true); CAM.idle = 99; }
  else camGo(s.cam);
  if (s.cin && !CIN.on){ enterCinema(); DIR.putCinema = true; }
  if (!s.cin && CIN.on && DIR.putCinema){ exitCinema(); DIR.putCinema = false; }
  $('cap').innerHTML = s.cap;
  S.capT = s.dur;
}
function dirStop(){
  DIR.on = false;
  DIR.t = 0;
  $('bDir').classList.remove('on');
  /* 只退出**自己进的**电影模式。用户本来就在电影模式里看，不该被导演带走。 */
  if (DIR.putCinema && CIN.on) exitCinema();
  /* ⚠️ 这个标志**必须无条件复位**。
     原来这里写成 `if (!DIR.on) return;` 提前返回，于是 DIR.on 已经是 false
     而 putCinema 还挂着 true 的时候，dirStop 什么都不做 —— 脏值就一直留在
     上。下一轮 dirShot 看到「不是电影镜头 + 电影模式开着 + putCinema」，
     就把**用户自己进的**电影模式退了。
     （_uistate 抓到的：进电影模式后点导演，第一镜就把用户的全屏收了。）
     顺带一提：dirStop 现在是幂等的，提前返回本来就没必要。 */
  DIR.putCinema = false;
}
function dirStart(){
  if (DIR.on){ dirStop(); return; }
  DIR.on = true;

/* ══════════════════ 录一段 ══════════════════
   canvas.captureStream() + MediaRecorder，纯浏览器自带，file:// 下就能用，
   不需要 ffmpeg/Node（本机两样都没有）。三件事必须写对：

   ① 切到后台标签页时 **rAF 被 Chromium 冻结**，画面不再更新。
      captureStream 抓的是画布的合成结果，没有新帧就等于录了一段静止画面，
      而且**它不会报错** —— 出来的是个能正常播放的坏文件。
      所以这里监听 visibilitychange：一切走就立刻收尾，宁可短也不交废片。

   ② 暂停时录出来是静止的。所以暂停中按录制要挡回去并说清楚，
      绝不悄悄把 S.running 改掉 —— 那是替用户决定他的状态。

   ③ 音乐录不进来，这是**故意**的：BGM 走 8 个 <audio> 元素、音量直接设在
      元素上，和 Web Audio 那条音效总线（AU.master）是两套。
      为了导出把 <audio> 改道进 Web Audio，会动到用户还没签收的音频通路。
      要带声音的片子是另一件单独的活。界面上写明，别让人以为是坏了。 */
const REC_SECS = 10, REC_FPS = 30;
let REC = null;

function recStop(){
  if (!REC) return;
  const r = REC; REC = null;
  clearInterval(r.iv);
  $('bRec').classList.remove('on');
  $('bRec').textContent = '● 录 ' + REC_SECS + ' 秒';
  try { r.rec.stop(); } catch(e){}
}
$('bRec').addEventListener('click', () => {
  if (REC){ recStop(); return; }
  if (!S.running){
    $('cap').innerHTML = '鹧鸪：现在是<strong>暂停</strong>，先按空格让它跑起来再录';
    S.capT = 3.2;
    return;
  }
  if (!window.MediaRecorder || !cv.captureStream){
    $('cap').innerHTML = '鹧鸪：这个浏览器不认录像，换个 Chromium 系的试试';
    S.capT = 3.2;
    return;
  }
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t));
  if (!mime){
    $('cap').innerHTML = '鹧鸪：找不到能用的 WebM 编码器';
    S.capT = 3.2;
    return;
  }
  const chunks = [];
  let rec;
  try {
    rec = new MediaRecorder(cv.captureStream(REC_FPS), { mimeType: mime, videoBitsPerSecond: 9e6 });
  } catch(e){
    $('cap').innerHTML = '鹧鸪：开不了录像器（' + e.message + '）';
    S.capT = 3.2;
    return;
  }
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    if (!blob.size){
      $('cap').innerHTML = '鹧鸪：一帧也没抓到，试试把窗口放到前台再录';
      S.capT = 3.5;
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.download = `partridge-${MOOD.tk}-${MOOD.wk}-${REC_SECS}s.webm`;
    a.href = url;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    $('cap').innerHTML = '鹧鸪：拍好了，<strong>' + (blob.size/1048576).toFixed(1)
      + ' MB</strong>，在下载里（<strong>没有声音</strong>）';
    S.capT = 4.5;
  };
  rec.start(200);
  const t0 = performance.now();
  const iv = setInterval(() => {
    const left = REC_SECS - (performance.now() - t0)/1000;
    if (left <= 0){ recStop(); return; }
    $('bRec').textContent = '■ 停 ' + left.toFixed(1) + 's';
  }, 100);
  REC = { rec, iv };
  $('bRec').classList.add('on');
  $('bRec').textContent = '■ 停 ' + REC_SECS.toFixed(1) + 's';
  $('cap').innerHTML = '鹧鸪：录着呢，<strong>别切走这个标签页</strong>（切走了画面就冻住了）';
  S.capT = 3.2;
});
/* ⚠️ 这里原来是**顶层裸写** addEventListener(...) —— 那个 `this` 是 window，

   本文件下面第 5389 行监听的是**同一个事件**，挂的却是 document ——
   同一件事两种写法，其中一份要么是冗余的，要么是收不到的。
   改成绑 document 不需要先搞清「它到底冒不冒泡」：
   caniuse 的兼容性注记说 Safari 14 之前不冒泡（那时 window 上收不到），
   而 MDN 新页面又标 Bubbles: Yes —— 两边对不上，本机也没法实测
   （这个事件只在真实切标签时触发，工具链切不回上一个标签页）。
   **绑到事件的 target 上，在所有浏览器所有版本上都成立**，
   跟冒泡语义无关。所以这是消除不一致 + 兼容老 Safari，
   不是「修了 Chrome 上的 bug」——Chrome 上原来那行大概率是能收到的。 */

function rotateCaption(){

    const s = S.lat < 0 ? ['鹧鸪：<s>右边</s>才是路！','鹧鸪：偏了偏了，往<s>右</s>回']
                        : ['鹧鸪：<s>左边</s>才是路！','鹧鸪：偏了偏了，往<s>左</s>回'];
    $('cap').innerHTML = s[(Math.random()*s.length)|0];
