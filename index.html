<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹧鸪骑单车 · Partridge on Wheels</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#141922; --panel2:#1b222d; --line:#28303d;
    --fg:#e9eef6; --dim:#8a97a9; --accent:#ffc857; --accent2:#4ecdc4;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; padding:16px;
    background:radial-gradient(1100px 640px at 50% -12%, #1c2733, #080a0e 72%);
    color:var(--fg);
    font:14px/1.5 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #wrap{ width:100%; }
  .stage{
    position:relative; margin:0 auto;
    width:min(1280px, 100%, calc((100vh - 218px) * 16 / 9));
    aspect-ratio:16/9; border-radius:16px; overflow:hidden;
    background:#0b0e12; border:1px solid var(--line);
    box-shadow:0 28px 70px -24px #000c, 0 0 0 1px #ffffff0a inset;
  }
  canvas{display:block; width:100%; height:100%; background:#0b0e12}

  /* ---------- HUD ---------- */
  .hud{
    position:absolute; top:12px; right:12px; display:flex; gap:8px;
    padding:8px 10px; border-radius:11px;
    background:#0b0f16a8; border:1px solid #ffffff1f;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    font-variant-numeric:tabular-nums; pointer-events:none;
  }
  .hud .it{min-width:62px; text-align:right}
  .hud .k{display:block; font-size:10px; color:#9fb0c6; letter-spacing:.14em}
  .hud .v{display:block; font-size:17px; font-weight:700; line-height:1.25}
  .hud .v small{font-size:10px; font-weight:500; color:#8a97a9; margin-left:2px}

  /* ---------- subtitle ---------- */
  .cap{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    max-width:86%; padding:7px 18px; border-radius:999px;
    background:#0b0f16b0; border:1px solid #ffffff1a;
    font-size:clamp(12px, 1.35vw, 17px); font-weight:700; letter-spacing:.02em;
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-shadow:0 2px 6px #000a; pointer-events:none;
  }
  .cap b{color:var(--accent)}
  .cap s{color:var(--accent2); text-decoration:none}

  /* ---------- controls ---------- */
  .panel{
    width:min(1280px, 100%); margin:12px auto 0; padding:12px 14px;
    background:linear-gradient(180deg, var(--panel), var(--panel2));
    border:1px solid var(--line); border-radius:14px;
    display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center;
  }
  .grp{display:flex; align-items:center; gap:8px}
  .grp > label{color:var(--dim); font-size:12px; letter-spacing:.06em; white-space:nowrap}
  button{
    font:inherit; font-weight:600; color:var(--fg); cursor:pointer;
    background:#232c39; border:1px solid #33404f; border-radius:9px;
    padding:7px 13px; transition:.14s;
  }
  button:hover{background:#2c3746; border-color:#46566a}
  button.on{background:linear-gradient(180deg,#ffd98a,#f5b942); color:#2a1e05; border-color:#f0bd55}
  button.icon{min-width:44px; font-size:15px; line-height:1}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:170px; height:4px; border-radius:99px;
    background:linear-gradient(90deg,var(--accent2),var(--accent)); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#fff; border:3px solid #223040; cursor:pointer; box-shadow:0 2px 6px #0008;
  }
  input[type=range]::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%; background:#fff; border:3px solid #223040; cursor:pointer;
  }
  .val{color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; min-width:56px; font-size:13px}
  .spacer{flex:1}
  .tip{color:#6d7a8c; font-size:12px; white-space:nowrap}
  kbd{
    background:#232c39; border:1px solid #3a4757; border-bottom-width:2px; border-radius:5px;
    padding:1px 6px; font:600 11px/1.6 ui-monospace,Consolas,monospace; color:#b9c6d6;
  }
</style>
</head>
<body>
<div id="wrap">
  <div class="stage" id="stage">
    <canvas id="scene"></canvas>
    <div class="hud">
      <div class="it"><span class="k">SPEED</span><span class="v" id="hSpeed">15<small>km/h</small></span></div>
      <div class="it"><span class="k">CADENCE</span><span class="v" id="hCad">0<small>rpm</small></span></div>
      <div class="it"><span class="k">DIST</span><span class="v" id="hDist">0.00<small>km</small></span></div>
    </div>
    <div class="cap" id="cap">鹧鸪：今天也是<strong>慢慢骑</strong>的一天</div>
  </div>

  <div class="panel">
    <div class="grp">
      <button class="icon" id="bPlay" title="空格">⏸</button>
      <button id="bReset">重置</button>
    </div>
    <div class="grp">
      <label>速度</label>
      <input type="range" id="rSpeed" min="4" max="36" step="0.5" value="15" />
      <span class="val" id="vSpeed">15 km/h</span>
    </div>
    <div class="grp">
      <button id="bCruise">自动巡航</button>
    </div>
    <div class="grp">
      <label>视角</label>
      <button class="on" id="bWide">全景</button>
      <button id="bClose">跟拍</button>
    </div>
    <div class="grp">
      <label>氛围</label>
      <button class="on" id="bDay">白天</button>
      <button id="bNight">夜晚</button>
    </div>
    <div class="spacer"></div>
    <button id="bShot">保存当前帧 PNG</button>
    <span class="tip"><kbd>空格</kbd> 播放/暂停 · <kbd>←</kbd><kbd>→</kbd> 调速</span>
  </div>
</div>

<script>
(() => {
'use strict';

/* ═══════════════════════ canvas / camera ═══════════════════════ */
const stage = document.getElementById('stage');
const cv    = document.getElementById('scene');
const ctx   = cv.getContext('2d', { alpha:false });

const W = 1280, H = 720;            // logical stage size
let view = { s:1, ox:0, oy:0 };

function fit(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = stage.getBoundingClientRect();
  cv.width  = Math.max(2, Math.round(r.width  * dpr));
  cv.height = Math.max(2, Math.round(r.height * dpr));
  view.s  = Math.min(cv.width / W, cv.height / H);
  view.ox = (cv.width  - W * view.s) / 2;
  view.oy = (cv.height - H * view.s) / 2;
}
new ResizeObserver(fit).observe(stage);
fit();

/* ═══════════════════════ palette ═══════════════════════ */
const THEMES = {
  day: {
    sky:[[0,'#1c6aad'],[0.30,'#5fa8dd'],[0.60,'#a9d6ee'],[0.82,'#dcefef'],[1,'#ffe6bb']],
    orb:'#fff8dc', orbCore:'#fffdf0', orbGlow:'rgba(255,205,125,0.42)', orbX:1120, orbY:138, orbR:44,
    cloud:'#ffffff', cloudSh:'#dbe7f2', cloudA:0.95,
    hillFar:'#a9c5ba', hillNear:'#84ad8d',
    tree:'#4d8a48', treeHi:'#6aa85e', trunk:'#6b4a30',
    bush:'#5f9c46', bushHi:'#79b458',
    grass:'#88ba41', grassHi:'#abd266',
    road:'#4c525a', roadHi:'#5d646d', roadLo:'#373c42', line:'#f6f8f3',
    verge:'#8ec04e', vergeLo:'#6ea33a', dirt:'#c9a96c',
    frame:'#13a2b3', frameLo:'#0a7684', frameHi:'#46d5e3', seat:'#282c33',
    tyre:'#212429', tyreHi:'#3c4149', rim:'#d4dbe3', spoke:'#a9b3c0',
    night:false, vignette:0.18
  },
  night: {
    sky:[[0,'#05091c'],[0.32,'#0e1a3a'],[0.62,'#243257'],[0.85,'#3d3c5c'],[1,'#5a4658']],
    orb:'#f7f2dd', orbCore:'#ffffff', orbGlow:'rgba(190,210,255,0.22)', orbX:1120, orbY:120, orbR:32,
    cloud:'#37456b', cloudSh:'#26304d', cloudA:0.55,
    hillFar:'#1d2941', hillNear:'#16202f',
    tree:'#0f261a', treeHi:'#1a3826', trunk:'#2a2018',
    bush:'#16301f', bushHi:'#20402a',
    grass:'#1d3d29', grassHi:'#2a5437',
    road:'#20242b', roadHi:'#2b3038', roadLo:'#15181d', line:'#c9d2c0',
    verge:'#22422b', vergeLo:'#173320', dirt:'#3a3327',
    frame:'#18c2c6', frameLo:'#0d7f88', frameHi:'#66f2f0', seat:'#15181d',
    tyre:'#0c0e11', tyreHi:'#22262c', rim:'#8e9aa8', spoke:'#69737f',
    night:true, vignette:0.42
  }
};
let P = THEMES.day;

/* ═══════════════════════ scenery generation ═══════════════════════ */
function rng(seed){
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const TREE_SPAN = 64 * 300;
const trees = Array.from({length:64}, (_,i) => {
  const r = rng(i*7919 + 13);
  return { x:i*300 + r()*110 - 55, s:0.65 + r()*0.8, k:Math.floor(r()*3), t:r() };
});
const CLOUD_SPAN = 16 * 900;
const clouds = Array.from({length:16}, (_,i) => {
  const r = rng(i*104729 + 977);
  return { x:i*900 + r()*420, y:56 + r()*180, s:0.55 + r()*0.9, layer:r() < 0.45 ? 0 : 1, puffs:3 + Math.floor(r()*3) };
});
const LAMP_SPAN = 20 * 640;
const lamps = Array.from({length:20}, (_,i) => ({ x:i*640 + (i%2 ? 90 : 0), s:0.9 + rng(i*3571)*0.25 }));
const GRS_SPAN  = 130 * 44;   // grass tufts
const POST_SPAN = 130 * 150;  // fence posts

/* ═══════════════════════ world constants ═══════════════════════ */
const ROAD_Y   = 580;          // surface line
const HORIZON  = 468;
const PPM      = 182;          // pixels per metre
const R_WHEEL  = 62;
const BB       = { x:572, y:518 };          // bottom bracket
const HUB_R    = { x:432, y:518 };
const HUB_F    = { x:756, y:518 };
const HIP      = { x:540, y:396 };          // partridge hip joint, on the saddle
const CRANK_L  = 26;
const THIGH    = 82, SHIN = 80;
const GEAR     = 1.0;
const BIRD_HIP_LOCAL = 0;

/* ═══════════════════════ state ═══════════════════════ */
const S = {
  running:true, cruise:false, speed:15, target:15,
  km:0, scroll:0, wheel:0, crank:0,
  blinkT:2.2, blink:0, last:0, tSec:0,
  camZ:1, camZ_t:1, camX:640, camX_t:640, camY:360, camY_t:360,
  capI:0, capT:0, dust:[], sweat:0, hillPhase:0
};

/* ═══════════════════════ helpers ═══════════════════════ */
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a+(b-a)*t;
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrap(x,span){ return ((x % span) + span) % span; }
function line(x1,y1,x2,y2,w,col,cap='round'){
  ctx.beginPath(); ctx.lineWidth=w; ctx.strokeStyle=col; ctx.lineCap=cap;
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function fillRR(x,y,w,h,r,col){ rr(x,y,w,h,r); ctx.fillStyle=col; ctx.fill(); }

/* two-bone IK; bend=+1 puts the joint forward, -1 behind */
function ik(hx,hy,ax,ay,l1,l2,bend){
  let dx=ax-hx, dy=ay-hy, d=Math.hypot(dx,dy);
  d = clamp(d, Math.abs(l1-l2)+0.01, l1+l2-0.01);
  const base = Math.atan2(dy,dx);
  const cosA = (l1*l1 + d*d - l2*l2) / (2*l1*d);
  const a = Math.acos(clamp(cosA,-1,1));
  const ang = base + a*bend;
  return { x:hx+Math.cos(ang)*l1, y:hy+Math.sin(ang)*l1 };
}

const pedalAt = a => ({ x:BB.x + Math.cos(a)*CRANK_L, y:BB.y + Math.sin(a)*CRANK_L });

/* ═══════════════════════ update ═══════════════════════ */
function update(dt){
  S.tSec += dt;

  if (S.cruise && S.running){
    S.target = clamp(18 + Math.sin(S.tSec*0.33)*11 + Math.sin(S.tSec*0.11)*5, 6, 34);
    document.getElementById('rSpeed').value = S.target.toFixed(1);
  }
  S.speed = lerp(S.speed, S.target, 1 - Math.pow(0.0015, dt));
  document.getElementById('vSpeed').textContent = S.speed.toFixed(1) + ' km/h';

  const v = S.speed / 3.6;                 // m/s
  S.km   += (v*dt) / 1000;
  S.scroll += v*PPM*dt;

  const wheelRev = v / (2*Math.PI*0.34);
  S.wheel += wheelRev * Math.PI*2 * dt;
  S.crank += wheelRev * GEAR * Math.PI*2 * dt;

  // blink
  S.blinkT -= dt;
  if (S.blinkT <= 0){ S.blink = 0.13; S.blinkT = 2.2 + Math.random()*3.6; }
  if (S.blink > 0) S.blink -= dt;

  // camera
  const zl = 1 - Math.pow(0.002, dt);
  S.camZ = lerp(S.camZ, S.camZ_t, zl);
  S.camX = lerp(S.camX, S.camX_t, zl);
  S.camY = lerp(S.camY, S.camY_t, zl);

  // dust puffs off the rear wheel
  if (S.running && S.speed > 5 && Math.random() < dt*26*S.speed/15){
    S.dust.push({ x:HUB_R.x - 30 + Math.random()*20, y:ROAD_Y-4 - Math.random()*8,
                  r:5+Math.random()*9, life:1, vx:-(30+Math.random()*60), vy:-(8+Math.random()*22) });
  }
  for (let i=S.dust.length-1;i>=0;i--){
    const d=S.dust[i];
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.vy+=26*dt; d.r+=22*dt; d.life-=dt*1.15;
    if (d.life<=0) S.dust.splice(i,1);
  }
  S.sweat = S.speed > 27 ? Math.min(1, S.sweat + dt*2) : Math.max(0, S.sweat - dt*2);

  // caption rotation
  S.capT -= dt;
  if (S.capT <= 0){
    const k = S.speed < 10 ? 0 : S.speed < 20 ? 1 : S.speed < 29 ? 2 : 3;
    const pools = [
      ['鹧鸪：今天也是<strong>慢慢骑</strong>的一天','鹧鸪：不着急，<strong>踏板会带我到</strong>','鹧鸪：今天风有点<s>好</s>，适合发呆'],
      ['鹧鸪：踏板一踩，<strong>风就来了</strong>','鹧鸪：稳住，<strong>稳住</strong>……稳不住了','鹧鸪：<strong>蹬</strong>！<s>蹬</s>！蹬！'],
      ['鹧鸪：这速度，<strong>起飞了</strong>','鹧鸪：翅膀只是<strong>以防万一</strong>','鹧鸪：让一让，我<s>要超车</s>了'],
      ['鹧鸪：我不是在骑，我是在<s>飞</s>','鹧鸪：鹧鸪牌动力，<strong>血脉觉醒</strong>','鹧鸪：这个踏板，我<strong>承包了</strong>']
    ];
    const arr = pools[k];
    document.getElementById('cap').innerHTML = arr[(Math.random()*arr.length)|0];
    S.capT = 3.4 + Math.random()*2.6;
  }

  document.getElementById('hSpeed').innerHTML = S.speed.toFixed(1) + '<small>km/h</small>';
  document.getElementById('hCad').innerHTML   = Math.round(wheelRev*GEAR*60) + '<small>rpm</small>';
  document.getElementById('hDist').innerHTML  = S.km.toFixed(2) + '<small>km</small>';
}

/* ═══════════════════════ sky / ground ═══════════════════════ */
function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,HORIZON+40);
  P.sky.forEach(([p,c]) => g.addColorStop(p,c));
  ctx.fillStyle = g; ctx.fillRect(-200,-200, W+400, HORIZON+240);
}

function drawStars(){
  const r = rng(4242);
  ctx.save();
  for (let i=0;i<130;i++){
    const x = wrap(r()*W*1.6 - S.scroll*0.02, W*1.6) - W*0.3;
    const y = r()*HORIZON*0.92;
    const tw = 0.45 + 0.55*Math.abs(Math.sin(S.tSec*(0.6+r()*2) + i));
    ctx.globalAlpha = tw * (0.35 + r()*0.65);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, y, r()<0.12 ? 2.4 : 1.5, r()<0.12 ? 2.4 : 1.5);
  }
  ctx.restore();
}

function drawOrb(){
  const g = ctx.createRadialGradient(P.orbX,P.orbY,P.orbR*0.4, P.orbX,P.orbY,P.orbR*5.2);
  g.addColorStop(0, P.orbGlow); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(P.orbX,P.orbY,P.orbR*5.2,0,7); ctx.fill();
  ctx.fillStyle=P.orb; ctx.beginPath(); ctx.arc(P.orbX,P.orbY,P.orbR,0,7); ctx.fill();
  if (P.night){ // craters
    ctx.fillStyle='rgba(0,0,0,0.09)';
    [[-9,-6,7],[7,5,5],[-2,10,4]].forEach(([a,b,c])=>{
      ctx.beginPath(); ctx.arc(P.orbX+a,P.orbY+b,c,0,7); ctx.fill();
    });
  } else {
    ctx.fillStyle=P.orbCore; ctx.beginPath(); ctx.arc(P.orbX-6,P.orbY-7,P.orbR*0.55,0,7); ctx.fill();
  }
}

function drawCloud(o, x){
  const s = o.s, p = o.layer ? 0.10 : 0.045;
  const bx = wrap(o.x - S.scroll*p, CLOUD_SPAN) - 300;
  if (bx < -360 || bx > W+360) return;
  const cx = bx + 90*s, cy = o.y;
  const n = o.puffs;
  ctx.save();
  ctx.globalAlpha = P.cloudA * (o.layer ? 0.80 : 1);
  // soft under-shadow
  ctx.fillStyle = P.cloudSh;
  ctx.beginPath();
  for (let i=0;i<n;i++){
    const a = (i/(n-1) - 0.5) * 1.9;
    const px = cx + Math.cos(a)*40*s + 3*s, py = cy + Math.sin(a)*8*s + 9*s;
    ctx.moveTo(px + 24*s, py);
    ctx.arc(px, py, (14 + (1-Math.abs(a))*18)*s + 3*s, 0, 7);
  }
  rr(cx - 50*s, cy + 8*s, 100*s, 20*s, 10*s); ctx.fill();
  // body
  ctx.fillStyle = P.cloud;
  ctx.beginPath();
  for (let i=0;i<n;i++){
    const a = (i/(n-1) - 0.5) * 1.9;
    const px = cx + Math.cos(a)*40*s, py = cy + Math.sin(a)*8*s;
    ctx.moveTo(px + (14 + (1-Math.abs(a))*18)*s, py);
    ctx.arc(px, py, (14 + (1-Math.abs(a))*18)*s, 0, 7);
  }
  rr(cx - 48*s, cy + 4*s, 96*s, 18*s, 9*s); ctx.fill();
  ctx.restore();
}

function hillTop(x, p, base, amp, f, ph){
  const u = x - S.scroll*p;
  return base - Math.sin(u*f + ph)*amp - Math.sin(u*f*2.31 + ph*1.7)*amp*0.38;
}
function drawHills(){
  const layers = [
    {p:0.14, base:HORIZON+2, amp:26, f:0.0032, ph:0.4, col:P.hillFar, y0:HORIZON+70},
    {p:0.26, base:HORIZON+26, amp:34, f:0.0047, ph:2.1, col:P.hillNear, y0:HORIZON+110}
  ];
  for (const L of layers){
    ctx.beginPath(); ctx.moveTo(-200, L.y0);
    for (let x=-200;x<=W+200;x+=10) ctx.lineTo(x, hillTop(x,L.p,L.base,L.amp,L.f,L.ph));
    ctx.lineTo(W+200, L.y0); ctx.closePath();
    ctx.fillStyle = L.col; ctx.fill();
  }
}

function drawTree(o, x, y){
  const s = o.s, base = HORIZON + 34;
  ctx.save();
  ctx.translate(x, base + y*8); ctx.scale(s, s);
  if (o.k === 0){                                     // round
    line(0, 4, 0, -30, 9, P.trunk);
    ctx.fillStyle = P.tree;
    [[0,-52,30],[22,-40,20],[-21,-40,21],[7,-68,20]].forEach(([a,b,c])=>{
      ctx.beginPath(); ctx.arc(a,b,c,0,7); ctx.fill();
    });
    ctx.fillStyle = P.treeHi;
    ctx.beginPath(); ctx.arc(-8,-62,15,0,7); ctx.fill();
  } else if (o.k === 1){                              // conifer
    ctx.fillStyle = P.tree;
    for (let i=0;i<4;i++){
      const w = 36 - i*7, top = -22 - i*22;
      ctx.beginPath(); ctx.moveTo(0, top-30); ctx.lineTo(w, top+10); ctx.lineTo(-w, top+10); ctx.closePath(); ctx.fill();

}

function drawWheel(cx, cy, rot, blur){
  const R = R_WHEEL;
  if (blur > 0.02){
    for (let i=1;i<=3;i++){
      ctx.beginPath(); ctx.lineWidth = 9;
      ctx.strokeStyle = `rgba(33,36,41,${0.10*blur/i})`;
      ctx.arc(cx,cy,R,0,7); ctx.stroke();
    }
  }
  // tyre
  ctx.beginPath(); ctx.lineWidth=10; ctx.strokeStyle=P.tyre;
  ctx.arc(cx,cy,R,0,7); ctx.stroke();
  ctx.beginPath(); ctx.lineWidth=3.5; ctx.strokeStyle=P.tyreHi;
  ctx.arc(cx,cy,R-3.4,0,7); ctx.stroke();
  // tread ticks
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth=2.6;
  for (let i=0;i<16;i++){
    const a = i/16*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*(R-4.5), Math.sin(a)*(R-4.5));
    ctx.lineTo(Math.cos(a)*(R+4.5), Math.sin(a)*(R+4.5));
    ctx.stroke();
  }
  // rim + spokes
  ctx.beginPath(); ctx.lineWidth=4.5; ctx.strokeStyle=P.rim; ctx.arc(0,0,R-9,0,7); ctx.stroke();
  ctx.lineWidth = 1.8; ctx.strokeStyle = P.spoke;
  for (let i=0;i<12;i++){
    const a = i/12*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a)*(R-10), Math.sin(a)*(R-10)); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0,0,7,0,7); ctx.fillStyle=P.rim; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,3,0,7); ctx.fillStyle='#1b1e23'; ctx.fill();
  ctx.restore();
}

function drawBikeFrame(){
  const ST = {x:524, y:402}, HT = {x:706, y:392}, HB = {x:718, y:440};
  const tube = (a,b,w,col) => line(a.x,a.y,b.x,b.y,w,col);

  // shadow of frame
  ctx.save(); ctx.globalAlpha=.18; ctx.lineWidth=13; ctx.strokeStyle='#000';
  [ [HUB_R,BB],[ST,HUB_R],[BB,ST],[BB,HT],[ST,HT],[HT,HB],[HB,HUB_F] ].forEach(([a,b])=>{
    ctx.beginPath(); ctx.moveTo(a.x,a.y+3); ctx.lineTo(b.x,b.y+3); ctx.stroke();
  });
  ctx.restore();

  // tyres drawn first
  const blur = clamp(S.speed/26, 0, 1);
  drawWheel(HUB_R.x, HUB_R.y, -S.wheel, blur);
  drawWheel(HUB_F.x, HUB_F.y, -S.wheel, blur);

  // rear mudguard + fender
  ctx.beginPath(); ctx.lineWidth=6; ctx.strokeStyle=P.frameLo;
  ctx.arc(HUB_R.x,HUB_R.y,R_WHEEL+9, -Math.PI*0.86, -Math.PI*0.16); ctx.stroke();

  // frame
  tube(HUB_R, BB, 8, P.frameLo);
  tube(ST,  HUB_R, 7, P.frameLo);
  tube(BB,  ST,  9, P.frame);
  tube(BB,  HT, 10, P.frame);
  tube(ST,  HT, 8, P.frame);
  tube(HT,  HB, 11, P.frame);
  // highlight
  ctx.globalAlpha=.55;
  tube(BB,  ST, 3, P.frameHi);
  tube(BB,  HT, 3.5, P.frameHi);
  tube(ST,  HT, 2.5, P.frameHi);
  ctx.globalAlpha=1;

  // fork
  tube(HB, HUB_F, 8, P.frameLo);
  ctx.globalAlpha=.5; tube(HB, HUB_F, 2.5, P.frameHi); ctx.globalAlpha=1;

  // stem + bars
  line(HT.x, HT.y, HT.x+6, HT.y-24, 8, P.frameLo);
  ctx.beginPath();
  ctx.moveTo(HT.x-16, HT.y-30);
  ctx.quadraticCurveTo(HT.x+8, HT.y-40, HT.x+30, HT.y-30);
  ctx.lineWidth=8; ctx.strokeStyle=P.frame; ctx.lineCap='round'; ctx.stroke();
  line(HT.x+30, HT.y-30, HT.x+38, HT.y-18, 7, P.seat);   // grip

  // seat post + saddle
  line(ST.x+2, ST.y+2, ST.x-4, ST.y-24, 7, P.frameLo);
  ctx.beginPath();
  ctx.moveTo(ST.x-30, ST.y-24);
  ctx.quadraticCurveTo(ST.x-4, ST.y-36, ST.x+22, ST.y-24);
  ctx.quadraticCurveTo(ST.x+2, ST.y-18, ST.x-30, ST.y-24);
  ctx.closePath(); ctx.fillStyle=P.seat; ctx.fill();

  // chain
  ctx.save();
  ctx.lineWidth=3.4; ctx.strokeStyle='#5c6672';
  ctx.beginPath();
  ctx.moveTo(BB.x, BB.y-16); ctx.lineTo(HUB_R.x, HUB_R.y-6);
  ctx.moveTo(BB.x, BB.y+16); ctx.lineTo(HUB_R.x, HUB_R.y+6);
  ctx.stroke();
  ctx.setLineDash([5,7]); ctx.lineWidth=2.4; ctx.strokeStyle='#8b95a1';
  ctx.beginPath(); ctx.moveTo(BB.x, BB.y-16); ctx.lineTo(HUB_R.x, HUB_R.y-6); ctx.stroke();
  ctx.restore();

  // chainring
  ctx.save(); ctx.translate(BB.x, BB.y); ctx.rotate(S.crank);
  ctx.beginPath(); ctx.arc(0,0,16,0,7); ctx.fillStyle='#39424e'; ctx.fill();
  ctx.strokeStyle=P.frameHi; ctx.lineWidth=2.5;
  for (let i=0;i<4;i++){ const a=i/4*Math.PI*2; ctx.beginPath(); ctx.arc(0,0,10,a,a+1.1); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(0,0,4.5,0,7); ctx.fillStyle=P.frameHi; ctx.fill();
  ctx.restore();
}

function drawCrank(ang, tone){

function drawNeckHead(t){
  const S0 = {x:34, y:-62};                 // shoulder
  const H  = {x:74, y:-126};                // head centre
  const dx = H.x-S0.x, dy = H.y-S0.y, L = Math.hypot(dx,dy);
  const ux = dx/L, uy = dy/L, px = -uy, py = ux;
  const rot = -0.10;

  // neck: tapered, not a uniform tube
  const perp = Math.atan2(dy,dx) + Math.PI/2;
  const c = Math.cos(perp), s = Math.sin(perp);
  const w1 = 48, w2 = 34;
  ctx.beginPath();
  ctx.moveTo(S0.x + c*w1/2, S0.y + s*w1/2);
  ctx.lineTo(H.x  + c*w2/2, H.y  + s*w2/2);
  ctx.lineTo(H.x  - c*w2/2, H.y  - s*w2/2);
  ctx.lineTo(S0.x - c*w1/2, S0.y - s*w1/2);
  ctx.closePath();
  const ng = ctx.createLinearGradient(S0.x, S0.y, H.x, H.y);
  ng.addColorStop(0, '#6d3c15'); ng.addColorStop(1, '#8e5522');
  ctx.fillStyle = ng; ctx.fill();

  // pale throat band with the partridge's black barring
  const bx = S0.x + ux*9, by = S0.y + uy*9, ex = S0.x + ux*50, ey = S0.y + uy*50;
  ctx.lineCap='round';
  line(bx,by, ex,ey, 25, '#ecdcb9');
  for (let i=0;i<3;i++){
    const d = 16 + i*13;
    const cx2 = S0.x + ux*d, cy2 = S0.y + uy*d;
    line(cx2 - px*12, cy2 - py*12, cx2 + px*12, cy2 + py*12, 5, '#2a1808');
  }

  ctx.save();
  ctx.translate(H.x, H.y); ctx.rotate(rot);

  // skull
  ctx.beginPath(); ctx.ellipse(0,0, 36, 30, 0, 0, 7);
  const hg = ctx.createRadialGradient(-10,-14, 4, 0,0, 40);
  hg.addColorStop(0, '#b8702f'); hg.addColorStop(1, '#7b4517');
  ctx.fillStyle = hg; ctx.fill();

  // chestnut crown + slight forward crest
  ctx.beginPath();
  ctx.moveTo(-35,-4);
  ctx.bezierCurveTo(-38,-26, -14,-33, 8,-29);
  ctx.bezierCurveTo(24,-27, 32,-19, 33,-10);
  ctx.bezierCurveTo(17,-17, -14,-15, -35,-4);
  ctx.closePath(); ctx.fillStyle='#68380f'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(20,-21); ctx.quadraticCurveTo(42,-31, 36,-15);
  ctx.quadraticCurveTo(31,-11, 23,-12); ctx.closePath();
  ctx.fillStyle='#5a2f0d'; ctx.fill();

  // throat / cheek patch
  ctx.beginPath(); ctx.ellipse(13, 11, 19, 12, -0.18, 0, 7);
  ctx.fillStyle='#eddcc0'; ctx.fill();
  // malar stripe
  line(27, 0, 17, 20, 4.2, 'rgba(38,20,8,0.55)');

  // eye — blink aware
  const b = clamp(S.blink/0.13, 0, 1);
  const ry = lerp(11, 1.4, b*b*(3-2*b));
  ctx.beginPath(); ctx.ellipse(14,-7, 11.5, ry, 0, 0, 7); ctx.fillStyle='#e8542f'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(14,-7, 7, Math.max(1.3, ry*0.6), 0, 0, 7); ctx.fillStyle='#170c04'; ctx.fill();
  if (b < .6){
    ctx.beginPath(); ctx.arc(11.4,-9.6, 2.3, 0, 7); ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.fill();
  }
  ctx.beginPath(); ctx.ellipse(14,-7, 11.5, ry, 0, 0, 7);
  ctx.lineWidth=2; ctx.strokeStyle='rgba(58,30,10,0.45)'; ctx.stroke();

  // beak — short, slightly hooked
  ctx.beginPath();
  ctx.moveTo(24,-4);
  ctx.quadraticCurveTo(42,0, 51,4);
  ctx.quadraticCurveTo(45,7, 40,11);
  ctx.quadraticCurveTo(33,11, 25,7);
  ctx.closePath();
  const bg = ctx.createLinearGradient(24,-5, 51, 11);
  bg.addColorStop(0,'#96a0ac'); bg.addColorStop(1,'#4a535e');
  ctx.fillStyle = bg; ctx.fill();
  line(26,4, 46,6, 1.8, 'rgba(28,34,42,0.7)');
  ctx.beginPath(); ctx.arc(32,0, 1.8, 0, 7); ctx.fillStyle='rgba(28,34,42,0.55)'; ctx.fill();

  ctx.restore();
}

function taper(x1,y1,x2,y2,w1,w2,col){
  const a = Math.atan2(y2-y1, x2-x1) + Math.PI/2;
  const c = Math.cos(a), s = Math.sin(a);
  ctx.beginPath();
  ctx.moveTo(x1 + c*w1/2, y1 + s*w1/2);
  ctx.lineTo(x2 + c*w2/2, y2 + s*w2/2);
  ctx.lineTo(x2 - c*w2/2, y2 - s*w2/2);
  ctx.lineTo(x1 - c*w1/2, y1 - s*w1/2);
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}

function drawLeg(hip, foot, tone, alpha){
  const knee = ik(hip.x, hip.y, foot.x, foot.y, THIGH, SHIN, -1);
  const near = tone === 'near';
  ctx.save();
  ctx.globalAlpha = alpha;
  // feathered thigh, tapering into the bare tarsus
  taper(hip.x, hip.y, knee.x, knee.y, 25, 14, near ? '#7a4419' : '#4a2710');
  // scaly tarsus
  taper(knee.x, knee.y, foot.x, foot.y, 12, 8.5, near ? '#c9a58c' : '#8a7160');
  // scale ticks
  ctx.strokeStyle = 'rgba(96,66,48,0.45)'; ctx.lineWidth = 1.5; ctx.lineCap='butt';
  ctx.beginPath();
  for (let i=1;i<6;i++){
    const t=i/6, mx=lerp(knee.x,foot.x,t), my=lerp(knee.y,foot.y,t);
    const px=-(foot.y-knee.y), py=(foot.x-knee.x), L=Math.hypot(px,py)||1;
    const hw=(12 + (8.5-12)*t)/2;
    ctx.moveTo(mx + px/L*hw, my + py/L*hw);
    ctx.lineTo(mx - px/L*hw, my - py/L*hw);
  }
  ctx.stroke();
  // foot gripping the pedal
  ctx.strokeStyle = near ? '#c9a58c' : '#8a7160';
  ctx.lineWidth = 4.4; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(foot.x, foot.y);        ctx.lineTo(foot.x-11, foot.y+4);
  ctx.moveTo(foot.x, foot.y);        ctx.lineTo(foot.x-1,  foot.y+7);
  ctx.moveTo(foot.x, foot.y);        ctx.lineTo(foot.x+9,  foot.y+6);
  ctx.moveTo(foot.x, foot.y);        ctx.lineTo(foot.x+11, foot.y+1);
  ctx.moveTo(foot.x, foot.y);        ctx.lineTo(foot.x-8,  foot.y-4);
  ctx.stroke();
  ctx.restore();
}

function drawBird(){
  const bob  = Math.sin(S.crank*2) * 2.6;
  const roll = Math.sin(S.crank*2 + 0.7) * 0.030;
  const hip  = { x:HIP.x, y:HIP.y + bob };

  // ground shadow
  ctx.save();
  ctx.globalAlpha = .22 - Math.abs(bob)*0.012;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(594, ROAD_Y+6, 168 - Math.abs(bob)*6, 17, 0, 0, 7); ctx.fill();
  ctx.restore();

  // far leg
  const farPedal = drawCrank(S.crank + Math.PI, 'far');
  drawLeg(hip, farPedal, 'far', 0.78);

  // dust
  for (const d of S.dust){
    ctx.save();
    ctx.globalAlpha = clamp(d.life,0,1) * 0.30;
    ctx.fillStyle = P.night ? '#6b7480' : '#d9c9a4';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(hip.x, hip.y);
  ctx.rotate(roll);

  drawFarWing();
  drawTail();

  // body
  bodyPath();
  const bg = ctx.createRadialGradient(16,-72, 8, -4,-40, 92);
  bg.addColorStop(0, '#c07a34'); bg.addColorStop(0.55, '#9a5a22'); bg.addColorStop(1, '#6a3a14');
  ctx.fillStyle = bg; ctx.fill();
  // warm top light
  ctx.save(); bodyPath(); ctx.clip();
  const lg = ctx.createLinearGradient(0,-115, 0, 30);
  lg.addColorStop(0,'rgba(255,224,170,0.30)'); lg.addColorStop(1,'rgba(255,224,170,0)');
  ctx.fillStyle = lg; ctx.fillRect(-80,-120, 170, 160);
  ctx.restore();
  // outline
  bodyPath(); ctx.lineWidth=2.2; ctx.strokeStyle='rgba(46,24,8,0.45)'; ctx.stroke();

  drawFlankMarks();
  drawWing();
  drawNeckHead();

  // sweat when sprinting
  if (S.sweat > 0.05){
    ctx.save();
    ctx.globalAlpha = S.sweat * (0.5 + 0.5*Math.sin(S.tSec*7));
    const sx = HIP.x + 78, sy = HIP.y - 150 - ((S.tSec*40) % 16);
    ctx.beginPath();
    ctx.moveTo(sx, sy-7);
    ctx.bezierCurveTo(sx+6, sy, sx+5, sy+7, sx, sy+7);
    ctx.bezierCurveTo(sx-5, sy+7, sx-6, sy, sx, sy-7);
    ctx.fillStyle='rgba(150,215,255,0.92)'; ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // near leg on top
  const nearPedal = drawCrank(S.crank, 'near');
  drawLeg(hip, nearPedal, 'near', 1);

  // wing flutter hint
  const fl = Math.sin(S.crank*2)*0.03 + (S.sweat>0.4 ? Math.sin(S.tSec*11)*0.07 : 0);
  if (Math.abs(fl) > 0.001){ /* subtle body roll already conveys it */ }
}

/* ═══════════════════════ speed FX ═══════════════════════ */
function drawSpeedFX(){
  const k = clamp((S.speed-17)/19, 0, 1);
  if (k <= 0.01) return;
  ctx.save();
  ctx.lineCap='round';
  const r = rng(9090);
  for (let i=0;i<16;i++){
    const y = 90 + r()*500, L = 60 + r()*180, x = wrap(r()*W - S.scroll*1.9, W+300) - 150;
    ctx.globalAlpha = k * (0.05 + r()*0.16);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4 + r()*2.2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - L, y); ctx.stroke();
  }
  ctx.restore();
  if (k > 0.55){
    ctx.save();
    ctx.globalAlpha = (k-0.55)/0.45 * 0.5;
    const g = ctx.createLinearGradient(0,0,W*0.5,0);
    g.addColorStop(0,'rgba(255,255,255,0.5)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W*0.42,H);
    ctx.restore();
  }
}

function drawVignette(){
  const g = ctx.createRadialGradient(W/2, H/2, H*0.34, W/2, H/2, H*0.92);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${P.vignette})`);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}

/* ═══════════════════════ frame ═══════════════════════ */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = P.night ? '#05070f' : '#bfe3f2';
  ctx.fillRect(0,0,cv.width,cv.height);

  // world point (camX, camY) sits at the centre of the canvas; any small
  // aspect mismatch is absorbed symmetrically instead of shifting the scene.
  const s = view.s * S.camZ;
  ctx.setTransform(s, 0, 0, s, cv.width/2 - S.camX*s, cv.height/2 - S.camY*s);
  ctx.beginPath(); ctx.rect(-300,-300, W+600, H+600); ctx.clip();

  drawSky();
  if (P.night) drawStars();
  drawOrb();
  for (let i=0;i<clouds.length;i++) drawCloud(clouds[i], 0);
  drawHills();
  drawTrees();
  drawLamps();
  drawGround();
  drawBikeFrame();
  drawBird();
  drawSpeedFX();
  drawVignette();
}

function loop(ts){
  const dt = Math.min((ts - S.last)/1000 || 0, 0.05);
  S.last = ts;
  if (S.running) update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ═══════════════════════ UI ═══════════════════════ */
const $ = id => document.getElementById(id);
function bindToggle(id, get, set){
  const b = $(id);
  b.addEventListener('click', () => { set(!get()); b.classList.toggle('on', get()); });
  b.classList.toggle('on', get());
}
$('bPlay').addEventListener('click', e => {
  S.running = !S.running;
  e.currentTarget.textContent = S.running ? '⏸' : '▶';
  e.currentTarget.classList.toggle('on', !S.running);
});
$('bReset').addEventListener('click', () => {
  S.km=0; S.scroll=0; S.wheel=0; S.crank=0; S.dust.length=0; S.tSec=0;
});
$('rSpeed').addEventListener('input', e => {
  S.target = parseFloat(e.target.value);
  S.cruise = false; $('bCruise').classList.remove('on');
});
$('bCruise').addEventListener('click', e => {
  S.cruise = !S.cruise; e.currentTarget.classList.toggle('on', S.cruise);
});
bindToggle('bWide',  () => S.camZ_t === 1,    () => { S.camZ_t=1;    S.camX_t=640; S.camY_t=360; });
bindToggle('bClose', () => S.camZ_t > 1.2,   () => { S.camZ_t=1.52; S.camX_t=560; S.camY_t=430; });
bindToggle('bDay',   () => !P.night,          () => { P = THEMES.day;   });
bindToggle('bNight', () => P.night,           () => { P = THEMES.night; });
$('bShot').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = `partridge-${S.speed.toFixed(0)}kmh.png`;
  a.href = cv.toDataURL('image/png');
  a.click();
});

addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); $('bPlay').click(); }
  if (e.code === 'ArrowRight' || e.code === 'ArrowUp'){
    S.target = clamp(S.target+1, 4, 36); S.cruise=false; $('bCruise').classList.remove('on');
    $('rSpeed').value = S.target;
  }
  if (e.code === 'ArrowLeft' || e.code === 'ArrowDown'){
    S.target = clamp(S.target-1, 4, 36); S.cruise=false; $('bCruise').classList.remove('on');
    $('rSpeed').value = S.target;
  }
});

/* start */
S.camZ = 1; S.camZ_t = 1;
S.camX = 640; S.camX_t = 640;
S.camY = 360; S.camY_t = 360;
requestAnimationFrame(loop);

// expose a little for automated checks
window.__partridge = S;
})();
</script>
</body>
