<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171310">
<meta name="description" content="一只鹧鸪骑着复古单车穿过黄昏草场的 3D 互动场景：可拖拽环绕、变速骑行、跳跃，并切换昼夜。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171310'/%3E%3Ccircle cx='19' cy='40' r='12' fill='none' stroke='%23f6bd80' stroke-width='3'/%3E%3Ccircle cx='47' cy='40' r='12' fill='none' stroke='%23f6bd80' stroke-width='3'/%3E%3Cpath d='M19 40l8-15h12l8 15M27 25h16M39 25l8 15' fill='none' stroke='%23f6bd80' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='34' cy='15' r='6' fill='%23f6bd80'/%3E%3C/svg%3E">
<title>鹧鸪骑单车 · 3D 互动</title>
<style>
:root {
  --ink: #fff4e6;
  --muted: rgba(255, 240, 222, 0.62);
  --accent: #f6bd80;
  --accent-deep: #e2894d;
  --line: rgba(255, 236, 210, 0.14);
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
  --glass: linear-gradient(165deg, rgba(45, 33, 26, 0.72), rgba(20, 15, 12, 0.78));
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #171310;
  color: var(--ink);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: rgba(246, 189, 128, 0.3); }

#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #171310;
}

#scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
  outline: none;
}

body.grabbing #scene { cursor: grabbing; }

.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(125% 95% at 50% 44%, transparent 38%, rgba(16, 11, 8, 0.18) 72%, rgba(13, 9, 7, 0.5) 100%),
    linear-gradient(180deg, rgba(13, 9, 7, 0.42), transparent 22%, transparent 68%, rgba(13, 9, 7, 0.46) 100%);
}

/* ------------------------------- title ---------------------------------- */
.hero {
  position: absolute;
  top: clamp(18px, 4vw, 44px);
  left: clamp(18px, 4vw, 48px);
  max-width: min(540px, 64vw);
  pointer-events: none;
  user-select: none;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-size: 10.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255, 236, 212, 0.7);
}

.pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 0 rgba(246, 189, 128, 0.7);
  animation: pulse 2.6s ease-out infinite;
}

.hero h1 {
  margin: 13px 0 7px;
  font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
  font-weight: 600;
  font-size: clamp(38px, 5.5vw, 72px);
  line-height: 1.02;
  letter-spacing: 0.055em;
  background: linear-gradient(168deg, #fffaf0 8%, #f5d9b7 66%, #e8b384 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 12px 34px rgba(0, 0, 0, 0.4));
}

.sub {
  margin: 0;
  font-size: 9.5px;
  letter-spacing: 0.42em;
  color: rgba(255, 238, 215, 0.48);
  padding-left: 2px;
}

/* ------------------------------- stats ---------------------------------- */
.stats {
  position: absolute;
  top: clamp(18px, 3.4vw, 40px);
  right: clamp(18px, 3.4vw, 42px);
  width: 186px;
  padding: 15px 17px 13px;
  border-radius: 18px;
  background: var(--glass);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  backdrop-filter: blur(18px) saturate(1.2);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  pointer-events: none;
  user-select: none;
}

.stat-main {
  display: flex;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(255, 236, 210, 0.1);
  margin-bottom: 9px;
}

.stat-label {
  width: 100%;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--muted);
}

.stat-big {
  font-size: 34px;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.stat-unit { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }

.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
}

.stat-row b {
  font-weight: 500;
  color: rgba(255, 244, 230, 0.9);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}

.stat-row i { font-style: normal; }

.stat-mode {
  margin-top: 11px;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: rgba(246, 189, 128, 0.85);
}

/* -------------------------------- hint ---------------------------------- */
.hint {
  position: absolute;
  left: clamp(18px, 4vw, 48px);
  bottom: clamp(98px, 7.6vw, 124px);
  display: flex;
  gap: 13px;
  flex-wrap: wrap;
  max-width: 460px;
  font-size: 10.5px;
  line-height: 1.6;
  color: rgba(255, 240, 222, 0.52);
  letter-spacing: 0.04em;
  pointer-events: none;
  user-select: none;
}

.hint span { display: inline-flex; align-items: center; gap: 5px; }

kbd {
  font-family: inherit;
  font-size: 9.5px;
  padding: 2px 5px;
  border-radius: 5px;
  border: 1px solid rgba(255, 236, 210, 0.18);
  background: rgba(255, 255, 255, 0.05);
  color: rgba(255, 244, 230, 0.82);
  line-height: 1.25;
}

/* -------------------------------- dock ---------------------------------- */
.dock {
  position: absolute;
  left: 50%;
  bottom: clamp(14px, 2.6vw, 26px);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  border-radius: 18px;
  background: var(--glass);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(22px) saturate(1.15);
  backdrop-filter: blur(22px) saturate(1.15);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.07);
  max-width: calc(100vw - 24px);
  z-index: 4;
}

.btn {
  font-family: inherit;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.btn:focus-visible,
.chip:focus-visible,
.pad-btn:focus-visible {
  outline: 2px solid rgba(255, 214, 164, 0.9);
  outline-offset: 2px;
}

.btn.play {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: linear-gradient(160deg, #f8c78f, #e28f52);
  color: #2a1a10;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(226, 143, 82, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  flex: 0 0 auto;
  transition: filter 0.2s, transform 0.12s;
}

.btn.play:hover { filter: brightness(1.06); }
.btn.play:active { transform: scale(0.96); }

.btn.play .icon { width: 18px; height: 18px; fill: currentColor; }
.btn.play .icon-play { display: none; margin-left: 2px; }
.btn.play.is-paused .icon-pause { display: none; }
.btn.play.is-paused .icon-play { display: block; }

.speed-control {
  width: 178px;
  padding: 0 4px;
  flex: 0 1 auto;
}

.speed-head {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--muted);
  margin-bottom: 7px;
}

.speed-head b {
  font-size: 14px;
  letter-spacing: 0;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.speed-head em {
  font-style: normal;
  font-size: 9px;
  color: rgba(255, 236, 210, 0.4);
  letter-spacing: 0.06em;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 16px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 99px;
  background: linear-gradient(
    90deg,
    var(--accent) 0%,
    var(--accent-deep) calc(var(--fill, 35) * 1%),
    rgba(255, 240, 220, 0.16) calc(var(--fill, 35) * 1%),
    rgba(255, 240, 220, 0.16) 100%
  );
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  margin-top: -4.5px;
  border-radius: 50%;
  background: #fff6e8;
  border: 2px solid var(--accent-deep);
  box-shadow: 0 0 0 4px rgba(246, 189, 128, 0.13);
}

input[type="range"]::-moz-range-track {
  height: 4px;
  border-radius: 99px;
  background: rgba(255, 240, 220, 0.16);
}

input[type="range"]::-moz-range-progress {
  height: 4px;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent), var(--accent-deep));
}

input[type="range"]::-moz-range-thumb {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #fff6e8;
  border: 2px solid var(--accent-deep);
}

.divider {
  width: 1px;
  height: 26px;
  background: rgba(255, 236, 210, 0.12);
  margin: 0 1px;
  flex: 0 0 auto;
}

.view-group {
  display: flex;
  gap: 3px;
  padding: 3px;
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.18);
  border: 1px solid rgba(255, 236, 210, 0.06);
}

.chip {
  font-family: inherit;
  border: 0;
  background: transparent;
  color: rgba(255, 240, 222, 0.62);
  font-size: 11.5px;
  padding: 6px 9px;
  border-radius: 9px;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: background 0.18s, color 0.18s;
  -webkit-tap-highlight-color: transparent;
}

.chip:hover { color: #fff; }

.chip.active {
  background: linear-gradient(160deg, rgba(248, 199, 143, 0.96), rgba(228, 150, 88, 0.92));
  color: #2b1b10;
  font-weight: 600;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
}

.btn.ghost {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 36px;
  padding: 0 11px;
  border-radius: 11px;
  background: rgba(255, 240, 220, 0.055);
  border: 1px solid rgba(255, 236, 210, 0.1);
  color: rgba(255, 244, 230, 0.82);
  font-size: 11.5px;
  letter-spacing: 0.04em;
  white-space: nowrap;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
  flex: 0 0 auto;
}

.btn.ghost:hover {
  background: rgba(255, 240, 220, 0.1);
  border-color: rgba(255, 236, 210, 0.2);
}

.btn.ghost.active {
  background: rgba(246, 189, 128, 0.16);
  border-color: rgba(246, 189, 128, 0.45);
  color: #ffd9a8;
  box-shadow: inset 0 0 0 1px rgba(246, 189, 128, 0.14);
}

.icon {
  width: 15px;
  height: 15px;
  display: block;
  flex: 0 0 auto;
}

.btn.ghost .icon { fill: none; stroke: currentColor; stroke-width: 1.7; }
.time-label { min-width: 2em; }
#timeBtn[data-mode="night"] { color: #cfdaff; }
#timeBtn[data-mode="day"] { color: #ffe9ae; }

/* ------------------------------ touch pad ------------------------------- */
.ridepad {
  position: absolute;
  right: 16px;
  bottom: calc(190px + env(safe-area-inset-bottom));
  display: none;
  gap: 9px;
  z-index: 5;
}

.pad-btn {
  width: 46px;
  height: 46px;
  padding: 0;
  border-radius: 50%;
  background: rgba(32, 24, 19, 0.7);
  border: 1px solid rgba(255, 236, 210, 0.18);
  color: #ffe9cc;
  font-family: inherit;
  font-size: 13px;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
  cursor: pointer;
  touch-action: none;
  user-select: none;
}

.pad-btn.hop {
  width: 52px;
  height: 52px;
  background: linear-gradient(160deg, #f8c78f, #e28f52);
  color: #2a1a10;
  font-weight: 600;
  border: none;
  font-size: 14px;
}

.pad-btn.held { transform: scale(0.94); background: rgba(246, 189, 128, 0.32); }
.pad-btn.hop.held { background: linear-gradient(160deg, #ffd9a9, #eb9c5f); }

@media (hover: none), (max-width: 820px) {
  .ridepad { display: flex; }
}

/* ------------------------------- loader --------------------------------- */
.loader {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 18px;
  background: radial-gradient(circle at 50% 45%, #2a1f18, #14100d 72%);
  transition: opacity 0.8s ease, visibility 0.8s;
}

.loader.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader-wheel {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 2.5px solid rgba(255, 236, 210, 0.18);
  border-top-color: #f6bd80;
  animation: spin 1.05s linear infinite;
  position: relative;
}

.loader-wheel::after {
  content: "";
  position: absolute;
  inset: 11px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 236, 210, 0.35);
}

.loader-text {
  font-size: 11px;
  letter-spacing: 0.22em;
  color: rgba(255, 240, 222, 0.6);
}

.fatal {
  position: absolute;
  inset: 0;
  z-index: 200;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 8px;
  padding: 30px;
  text-align: center;
  background: radial-gradient(circle at 50% 45%, #2a1f18, #14100d 72%);
}

.fatal[hidden] { display: none; }

.fatal strong { font-size: 18px; letter-spacing: 0.08em; }
.fatal p { margin: 0; font-size: 12px; color: var(--muted); max-width: 420px; line-height: 1.7; }
.fatal .fatal-tip { color: rgba(255, 240, 222, 0.35); }

/* ------------------------------ responsive ------------------------------ */
@media (max-width: 1180px) {
  .hint { display: none; }
  .speed-control { width: 156px; }
}

@media (max-width: 940px) {
  .stats { width: 162px; padding: 12px 14px; }
  .stat-big { font-size: 29px; }
  .speed-control { width: 142px; }
  .dock { gap: 7px; }
  .btn.ghost span { display: none; }
  .btn.ghost { padding: 0 9px; }
}

@media (max-width: 720px) {
  .hero { left: 16px; top: calc(14px + env(safe-area-inset-top)); max-width: 72vw; }
  .hero h1 { font-size: clamp(31px, 9vw, 44px); margin-top: 10px; }
  .eyebrow { font-size: 9px; letter-spacing: 0.16em; }
  .sub { font-size: 7.5px; letter-spacing: 0.3em; }

  .stats {
    top: calc(14px + env(safe-area-inset-top));
    right: 14px;
    width: auto;
    min-width: 108px;
    padding: 10px 12px;
    border-radius: 14px;
  }
  .stat-main { border: 0; margin: 0; padding: 0; display: block; }
  .stat-label { font-size: 9px; }
  .stat-big { font-size: 26px; }
  .stat-unit { display: block; font-size: 9px; margin-top: 2px; }
  .stat-row, .stat-mode { display: none; }

  .dock {
    left: 10px;
    right: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom));
    transform: none;
    max-width: none;
    padding: 9px;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    border-radius: 16px;
  }

  .btn.play { width: 42px; height: 42px; border-radius: 12px; }
  .speed-control { order: 2; flex: 1 1 130px; width: auto; min-width: 120px; }
  .view-group { order: 3; flex: 1 1 100%; justify-content: center; }
  .chip { flex: 1 1 0; padding: 7px 4px; }
  .btn.ghost { order: 4; height: 34px; }
  .btn.ghost span { display: inline; }
  .divider { display: none; }
  .ridepad { bottom: calc(206px + env(safe-area-inset-bottom)); }
}

@media (max-width: 400px) {
  .btn.ghost span { display: none; }
  #timeBtn span { display: inline; }
  .ridepad { bottom: calc(194px + env(safe-area-inset-bottom)); }
  .stat-unit { display: inline; }
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(246, 189, 128, 0.55); }
  70% { box-shadow: 0 0 0 8px rgba(246, 189, 128, 0); }
  100% { box-shadow: 0 0 0 0 rgba(246, 189, 128, 0); }
}

@media (prefers-reduced-motion: reduce) {
  .pulse { animation: none; }
  .loader-wheel { animation-duration: 2.4s; }
}

</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" aria-label="3D 鹧鸪骑单车场景"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="hero">
    <div class="eyebrow"><span class="pulse"></span>3D · 实时演算 · 低多边形</div>
    <h1>鹧鸪骑单车</h1>
    <p class="sub">A PARTRIDGE ON A BICYCLE</p>
  </header>

  <aside class="stats" aria-label="骑行数据">
    <div class="stat-main">
      <span class="stat-label">时速</span>
      <span class="stat-big" id="statSpeed">15.1</span>
      <span class="stat-unit">km/h</span>
    </div>
    <div class="stat-row"><span>踏频</span><b><i id="statCadence">0</i> rpm</b></div>
    <div class="stat-row"><span>里程</span><b id="statDist">0 m</b></div>
    <div class="stat-mode" id="statMode">黄昏 · 巡航</div>
  </aside>

  <div class="hint" aria-hidden="true">
    <span><kbd>拖拽</kbd>旋转</span>
    <span><kbd>滚轮</kbd>缩放</span>
    <span><kbd>W</kbd><kbd>S</kbd>加减速</span>
    <span><kbd>A</kbd><kbd>D</kbd>转向</span>
    <span><kbd>空格</kbd>跳跃</span>
    <span><kbd>P</kbd>暂停</span>
    <span><kbd>C</kbd>视角</span>
    <span><kbd>N</kbd>昼夜</span>
  </div>

  <div class="ridepad" aria-label="触屏骑行控制">
    <button class="pad-btn" data-hold="KeyA" aria-label="向左转">◀</button>
    <button class="pad-btn hop" id="hopBtn" aria-label="跳跃">跳</button>
    <button class="pad-btn" data-hold="KeyD" aria-label="向右转">▶</button>
  </div>

  <div class="dock" role="toolbar" aria-label="控制面板">
    <button id="pauseBtn" class="btn play" aria-label="暂停骑行" aria-pressed="false">
      <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.4"/><rect x="14" y="4.5" width="4" height="15" rx="1.4"/></svg>
      <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.8c0-1.2 1.3-1.9 2.3-1.3l10 6.6c1 .6 1 2 0 2.6l-10 6.6c-1 .6-2.3-.1-2.3-1.3V4.8z"/></svg>
    </button>

    <div class="speed-control">
      <div class="speed-head"><span>骑行速度</span><b id="speedVal">4.2</b><em>m/s</em></div>
      <input id="speedRange" type="range" min="0" max="12" step="0.1" value="4.2" aria-label="骑行速度">
    </div>

    <div class="divider"></div>

    <div class="view-group" role="group" aria-label="相机视角">
      <button class="chip active" data-view="orbit" aria-pressed="true">环绕</button>
      <button class="chip" data-view="side" aria-pressed="false">侧视</button>
      <button class="chip" data-view="front" aria-pressed="false">前视</button>
      <button class="chip" data-view="follow" aria-pressed="false">跟随</button>
    </div>

    <div class="divider"></div>

    <button id="autoBtn" class="btn ghost" aria-pressed="false" aria-label="自动环绕镜头">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 0 6.3 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M18.6 3.6v5.2h-5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>自动环绕</span>

        let c = mixc(grassA, grassB, n1);
        c = mixc(c, grassC, clamp((n2 - 0.72) * 1.6, 0, 0.7));
        if (n2 > 0.9) c = mixc(c, dry, 0.55);
        const r = Math.hypot(cx, cz);
        // subtle trail-ring of worn grass around the paddock edge
        const ring = Math.exp(-Math.pow((r - 15.4) / 1.4, 2)) * 0.35;
        c = mixc(c, dry, ring);
        for (const tri of [[p00, p11, p10], [p00, p01, p11]]) {
          const a = tri[0], b = tri[1], cc = tri[2];
          const fn = PB.cross([b[0] - a[0], b[1] - a[1], b[2] - a[2]], [cc[0] - a[0], cc[1] - a[1], cc[2] - a[2]]);
          const l = Math.hypot(fn[0], fn[1], fn[2]);
          if (l < 1e-8) continue;
          const nx = fn[0] / l, ny = fn[1] / l, nz = fn[2] / l;
          const tint = jitter(c, 0.05, mesh.rnd);
          for (const p of tri) {
            pos.push(p[0], p[1], p[2]);
            nor.push(nx, ny, nz);
            col.push(tint[0], tint[1], tint[2]);
          }
        }
      }
    }
    return { pos: new Float32Array(pos), nor: new Float32Array(nor), col: new Float32Array(col), count: pos.length / 3 };
  }

  /* ------------------------------- grass tufts ------------------------------ */
  function blade(mesh, x, y, z, h, lean, angle, color) {
    const dx = Math.cos(angle) * lean, dz = Math.sin(angle) * lean;
    const w = 0.03 + mesh.rnd() * 0.018;
    const ax = x - Math.sin(angle) * w, az = z + Math.cos(angle) * w;
    const bx = x + Math.sin(angle) * w, bz = z - Math.cos(angle) * w;
    const tip = [x + dx, y + h, z + dz];
    const c = jitter(color, 0.12, mesh.rnd);
    const n = [0.2, 1, 0.1];
    for (const p of [[ax, y, az], [bx, y, bz], tip]) {
      mesh.pos.push(p[0], p[1], p[2]);
      mesh.nor.push(n[0], n[1], n[2]);
      mesh.col.push(c[0], c[1], c[2]);
    }
  }

  function buildGrass(rnd) {
    const mesh = new Mesh(9);
    const c1 = hex('#648b4d'), c2 = hex('#527a43'), c3 = hex('#93aa5d');
    for (let i = 0; i < 3200; i++) {
      const a = rnd() * TAU, r = 2 + Math.sqrt(rnd()) * 30;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (Math.hypot(x, z) < 1.2) continue;
      const y = groundHeight(x, z);
      const col = mixc(c1, rnd() > 0.6 ? c3 : c2, rnd());
      const count = 3 + (rnd() * 3 | 0);
      for (let k = 0; k < count; k++) {
        blade(mesh, x + (rnd() - 0.5) * 0.24, y, z + (rnd() - 0.5) * 0.24,
          0.10 + rnd() * 0.18, 0.04 + rnd() * 0.11, rnd() * TAU, col);
      }
    }
    return mesh.build();
  }

  /* -------------------------------- flowers -------------------------------- */
  function buildFlowers(rnd) {
    const mesh = new Mesh(14);
    const stem = hex('#4f7a3f');
    const petals = [hex('#f4e6c4'), hex('#f0c657'), hex('#d9a7c7'), hex('#f7f2e4')];
    for (let i = 0; i < 190; i++) {
      const a = rnd() * TAU, r = 2.4 + Math.sqrt(rnd()) * 27;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (Math.hypot(x, z) < 2.2) continue;
      const y = groundHeight(x, z);
      const h = 0.11 + rnd() * 0.14;
      mesh.addSegment([x, y, z], [x + (rnd() - 0.5) * 0.03, y + h, z + (rnd() - 0.5) * 0.03], 0.008, 0.006, stem, { seg: 4, jitter: 0.08 });
      const pc = petals[(rnd() * petals.length) | 0];
      const top = [x, y + h, z];
      const rot = rnd() * TAU;
      for (let p = 0; p < 4; p++) {
        const ang = rot + (p / 4) * TAU;
        const px = top[0] + Math.cos(ang) * 0.032, pz = top[2] + Math.sin(ang) * 0.032;
        const m = compose(m4(), px, top[1] + 0.005, pz, -Math.PI / 2 + 0.25, 0, 0, 0.035, 0.035, 1);
        mesh.add(GEOS.disc16, m, pc, { jitter: 0.07 });
      }
      const m2 = compose(m4(), top[0], top[1] + 0.012, top[2], -Math.PI / 2, 0, 0, 0.016, 0.016, 0.016);
      mesh.add(GEOS.sphere8, m2, hex('#e3a63f'), { jitter: 0.05 });
    }
    return mesh.build();
  }

  /* --------------------------------- trees --------------------------------- */
  function buildTree(mesh, x, z, scale, kind, rnd) {
    const y = groundHeight(x, z);
    const trunkC = hex('#6b4c37'), trunkD = hex('#5b3f2e');
    const green = [hex('#4d7a45'), hex('#5d8a4c'), hex('#3f6b43'), hex('#6e9550')];
    if (kind === 'pine') {
      mesh.addSegment([x, y, z], [x, y + 1.2 * scale, z], 0.15 * scale, 0.1 * scale, trunkC, { seg: 6, jitter: 0.04 });
      for (let i = 0; i < 3; i++) {
        const cy = y + (0.9 + i * 0.55) * scale;
        const rr = (0.75 - i * 0.19) * scale;
        const m = compose(m4(), x, cy, z, 0, rnd() * TAU, 0, rr, 1, rr);
        mesh.add(geo.cone(1, 0.85 * scale, 8), m, green[(i + 1) % green.length], { jitter: 0.07 });
      }
    } else {
      mesh.addSegment([x, y, z], [x, y + 1.1 * scale, z], 0.16 * scale, 0.11 * scale, trunkC, { seg: 6, jitter: 0.04 });
      // two little branches
      mesh.addSegment([x, y + 1.0 * scale, z], [x + 0.45 * scale, y + 1.35 * scale, z + 0.2 * scale], 0.06 * scale, 0.03 * scale, trunkD, { seg: 4, jitter: 0.04 });
      const blobs = 3 + (rnd() * 3 | 0);
      for (let i = 0; i < blobs; i++) {
        const ang = rnd() * TAU, rr = rnd() * 0.55 * scale;
        const bx = x + Math.cos(ang) * rr, bz = z + Math.sin(ang) * rr;
        const by = y + (1.65 + rnd() * 0.9) * scale;
        const s = (0.55 + rnd() * 0.45) * scale;
        const m = compose(m4(), bx, by, bz, 0, rnd() * TAU, 0, s, s * (0.75 + rnd() * 0.4), s);
        mesh.add(GEOS.sphere12, m, green[(rnd() * green.length) | 0], { jitter: 0.09 });
      }
    }
  }

  /* --------------------------------- fence --------------------------------- */
  function buildFence(rnd) {
    const mesh = new Mesh(21);
    const wood = hex('#8b6a4a'), woodD = hex('#75563c');
    const R = 19.2, posts = 60;
    for (let i = 0; i < posts; i++) {
      const a = (i / posts) * TAU;
      const x = Math.cos(a) * R, z = Math.sin(a) * R;
      const y = groundHeight(x, z);
      const h = 1.02 + (rnd() - 0.5) * 0.1;
      mesh.add(geo.box(0.13, h, 0.13), compose(m4(), x, y + h / 2, z, 0, -a, 0, 1, 1, 1), woodD, { jitter: 0.05 });
      // cap
      mesh.add(geo.cone(0.11, 0.12, 4), compose(m4(), x, y + h + 0.06, z, 0, -a, 0, 1, 1, 1), wood, { jitter: 0.04 });
    }
    for (let i = 0; i < posts; i++) {
      const a0 = (i / posts) * TAU, a1 = ((i + 1) / posts) * TAU;
      const p0 = [Math.cos(a0) * R, groundHeight(Math.cos(a0) * R, Math.sin(a0) * R), Math.sin(a0) * R];
      const p1 = [Math.cos(a1) * R, groundHeight(Math.cos(a1) * R, Math.sin(a1) * R), Math.sin(a1) * R];
      for (const hh of [0.38, 0.72]) {
        mesh.addSegment([p0[0], p0[1] + hh + (rnd() - 0.5) * 0.03, p0[2]],
          [p1[0], p1[1] + hh + (rnd() - 0.5) * 0.03, p1[2]], 0.035, 0.035, wood, { seg: 4, caps: false, jitter: 0.05 });
      }
    }
    return mesh.build();
  }

  /* -------------------------------- mountains ------------------------------- */
  function buildMountains(rnd) {
    const mesh = new Mesh(33);
    const cols = [hex('#6d6d86'), hex('#7a748c'), hex('#5f6579'), hex('#777287')];
    // soft, overlapping ridges instead of hard pyramids
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * TAU + (rnd() - 0.5) * 0.16;
      const r = 115 + rnd() * 45;
      const w = 30 + rnd() * 30;
      const h = 6 + rnd() * 9;
      const d = 20 + rnd() * 26;
      const m = compose(m4(), Math.cos(a) * r, -3 + h * 0.3, Math.sin(a) * r, 0, rnd() * TAU, 0, w, h, d);
      const base = cols[(rnd() * cols.length) | 0];
      mesh.add(GEOS.sphere12, m, base, {
        jitter: 0.035,
        colorFn: (x, y, z, idx, c) => mixc(c, hex('#a49aab'), clamp(y + 0.45, 0, 1) * 0.25),
      });
    }
    return mesh.build();
  }

  /* ---------------------------------- flock --------------------------------- */
  function buildFlock() {
    const mesh = new Mesh(909);
    const dark = hex('#3b2b23'), wingC = hex('#4a3529');
    const formation = [[0, 0], [-1.5, 0.85], [1.5, 0.85], [-3.0, 1.7], [3.0, 1.7], [-4.5, 2.55]];
    const heading = 0.55;
    const cs = Math.cos(heading), sn = Math.sin(heading);
    for (const [fx, fz] of formation) {
      const bx = fx * cs - fz * sn, bz = fx * sn + fz * cs;
      const P = (lx, ly, lz) => [bx + lx * cs - lz * sn, ly, bz + lx * sn + lz * cs];
      mesh.add(GEOS.sphere8, compose(m4(), bx, 0, bz, 0, -heading, 0, 0.26, 0.075, 0.075), dark, { jitter: 0.02 });
      const hp = P(0.25, 0.01, 0);
      mesh.add(GEOS.sphere8, compose(m4(), hp[0], 0.012, hp[2], 0, -heading, 0, 0.07, 0.06, 0.06), dark, { jitter: 0.02 });
      mesh.addTri(P(0.14, 0.01, 0.02), P(-0.5, 0.12, 0.72), P(0.10, 0.01, 0.24), wingC, 0.02);
      mesh.addTri(P(0.14, 0.01, -0.02), P(0.10, 0.01, -0.24), P(-0.5, 0.12, -0.72), wingC, 0.02);
    }
    return mesh.build();
  }

  function buildWorld() {
    const rnd = mulberry32(20261018);
    const terrain = buildTerrain();
    const grass = buildGrass(rnd);
    const flowers = buildFlowers(rnd);
    const treeMesh = new Mesh(77);
    const treeList = [];
    // ring of trees outside the paddock, denser in the distance
    for (let i = 0; i < 52; i++) {
      const a = rnd() * TAU;
      const r = 22.5 + Math.pow(rnd(), 0.75) * 36;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      const s = 0.8 + rnd() * 0.9;
      const kind = rnd() > 0.55 ? 'pine' : 'round';
      buildTree(treeMesh, x, z, s, kind, rnd);
      if (r < 42) treeList.push({ x, z, s, kind });
    }
    // a few close bushes just outside the fence
    for (let i = 0; i < 14; i++) {
      const a = rnd() * TAU, r = 20.4 + rnd() * 2.2;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      const s = 0.35 + rnd() * 0.3;
      const y = groundHeight(x, z);
      for (let k = 0; k < 3; k++) {
        treeMesh.add(GEOS.sphere8, compose(m4(), x + (rnd() - 0.5) * 0.5, y + 0.3 + rnd() * 0.25, z + (rnd() - 0.5) * 0.5,
          0, rnd() * TAU, 0, s * (0.8 + rnd() * 0.5), s * 0.75, s * (0.8 + rnd() * 0.5)),
          hex('#4c7744'), { jitter: 0.1 });
      }
    }
    const fence = buildFence(rnd);
    const mountains = buildMountains(rnd);
    const flock = buildFlock();

    // static soft shadows under trees
    const sh = new ShadowMesh();
    for (const t of treeList) {
      const y = groundHeight(t.x, t.z) + 0.045;
      sh.addQuad([t.x + 0.35, y, t.z + 0.35], 1.4 * t.s, 1.5 * t.s, 0.30, rnd() * TAU);
    }
    const treeShadows = sh.build();

    return {
      terrain, grass, flowers, trees: treeMesh.build(), fence, mountains, treeShadows, flock,
      flockCenter: [-41, 10.6, -56],
      groundHeight,
    };
  }

  /* ======================================================================== */
  /*                                  RIDER                                   */
  /* ======================================================================== */
  const DIMS = {
    wheelR: 0.46,
    wheelX: [-0.62, 0.62],
    bb: [0.0, 0.34],
    crankR: 0.14,
    pedalZ: 0.10,
    seat: [-0.30, 0.99],
    headTop: [0.45, 0.92],
    body: [-0.16, 1.40, 0],
    bodyTilt: -0.14,
    bodyRadii: [0.34, 0.29, 0.25],
    hip: [-0.08, 1.14, 0.11],
    legL1: 0.47,
    legL2: 0.47,
    grips: [[0.52, 1.06, 0.205], [0.52, 1.06, -0.205]],
    headLocal: [0.15, 0.31, 0],
  };

  const COL = {
    frame: hex('#3e8f83'),
    frameD: hex('#2f746a'),
    cream: hex('#eee1c4'),
    tire: hex('#2b2724'),
    rim: hex('#e9dcc0'),
    spoke: hex('#cbbfa8'),
    metal: hex('#b9b2a3'),
    saddle: hex('#6c4a34'),
    saddleD: hex('#583b29'),
    wicker: hex('#b98b57'),
    beak: hex('#e3a03f'),
    leg: hex('#d98a4f'),
    body: hex('#8d6c50'),
    bodyD: hex('#70543e'),
    belly: hex('#d8bd97'),
    crown: hex('#6a4a35'),
    face: hex('#e8d7bb'),
    eyeRing: hex('#c05a41'),
    tail: hex('#7c5a42'),
    creamF: hex('#e3d1b1'),
  };

  function buildWheel() {
    const m = new Mesh(201);
    const R = DIMS.wheelR;
    m.add(geo.torus(R - 0.055, 0.055, 34, 8), m4(), COL.tire, { jitter: 0.03 });
    m.add(geo.torus(R - 0.115, 0.016, 34, 6), m4(), COL.rim, { jitter: 0.02 });
    const hub = compose(m4(), 0, 0, 0, Math.PI / 2, 0, 0, 1, 1, 1);
    m.add(geo.cylinder(0.045, 0.045, 0.13, 10, true, true), hub, COL.metal, { jitter: 0.03 });
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * TAU;
      m.addSegment([0.04 * Math.cos(a), 0.04 * Math.sin(a), 0.035],
        [(R - 0.13) * Math.cos(a), (R - 0.13) * Math.sin(a), 0.035],
        0.0065, 0.0065, COL.spoke, { seg: 4, caps: false, jitter: 0.02 });
    }
    // coloured spoke-bead so the spin reads clearly
    const ang = 0.9;
    m.add(GEOS.sphere8, compose(m4(), (R - 0.095) * Math.cos(ang), (R - 0.095) * Math.sin(ang), 0.043, 0, 0, 0, 0.03, 0.03, 0.012),
      hex('#d8653c'), { jitter: 0.02 });
    return m.build();
  }

  function chainPath() {
    const [cx, cy] = DIMS.bb;
    const r1 = 0.115, r2 = 0.055;
    const c2 = [DIMS.wheelX[0], DIMS.wheelR];
    const pts = [];
    pts.push([c2[0], c2[1] + r2]);
    pts.push([cx, cy + r1]);
    for (let i = 1; i <= 8; i++) {
      const a = Math.PI / 2 - (i / 8) * Math.PI;
      pts.push([cx + Math.cos(a) * r1, cy + Math.sin(a) * r1]);
    }
    pts.push([c2[0], c2[1] - r2]);
    for (let i = 1; i <= 8; i++) {
      const a = -Math.PI / 2 - (i / 8) * Math.PI;
      pts.push([c2[0] + Math.cos(a) * r2, c2[1] + Math.sin(a) * r2]);
    }
    return pts;
  }

  function buildFrame() {
    const m = new Mesh(301);
    const R = DIMS.wheelR;
    const bb = DIMS.bb, seat = DIMS.seat, headTop = DIMS.headTop;
    const headBot = [0.50, 0.735];
    const rearDrop = [DIMS.wheelX[0], R], frontDrop = [DIMS.wheelX[1], R];
    const j = { jitter: 0.025 };

    // frame tubes
    m.addSegment([bb[0], bb[1], 0], [seat[0], seat[1], 0], 0.036, 0.032, COL.frame, { seg: 8, ...j });
    m.addSegment([bb[0], bb[1], 0], [headBot[0], headBot[1], 0], 0.038, 0.03, COL.frame, { seg: 8, ...j });
    m.addSegment([seat[0], seat[1] - 0.02, 0], [headTop[0], headTop[1] - 0.03, 0], 0.03, 0.028, COL.frame, { seg: 8, ...j });
    m.addSegment([headBot[0], headBot[1], 0], [headTop[0], headTop[1], 0], 0.045, 0.045, COL.cream, { seg: 10, ...j });
    // stays
    for (const z of [-0.055, 0.055]) {
      m.addSegment([rearDrop[0], rearDrop[1], z * 2.1], [bb[0], bb[1], z], 0.019, 0.019, COL.frameD, { seg: 6, ...j });
      m.addSegment([rearDrop[0], rearDrop[1], z * 1.6], [seat[0], seat[1] - 0.05, z * 1.3], 0.016, 0.016, COL.frameD, { seg: 6, ...j });
    }
    // fork
    for (const z of [-0.055, 0.055]) {
      m.addSegment([headTop[0] - 0.02, headTop[1] - 0.03, z * 1.2], [frontDrop[0], frontDrop[1], z * 1.6], 0.022, 0.017, COL.cream, { seg: 6, ...j });
    }
    // seat post + saddle
    m.addSegment([seat[0], seat[1] - 0.02, 0], [-0.315, 1.10, 0], 0.023, 0.023, COL.metal, { seg: 6, ...j });
    m.add(GEOS.sphere12, compose(m4(), -0.30, 1.115, 0, 0.04, 0, -0.06, 0.205, 0.055, 0.135), COL.saddle, { jitter: 0.03 });
    m.add(GEOS.sphere12, compose(m4(), -0.135, 1.125, 0, 0, 0, -0.06, 0.11, 0.038, 0.07), COL.saddleD, { jitter: 0.03 });
    // stem + handlebar
    m.addSegment([headTop[0], headTop[1], 0], [0.505, 1.045, 0], 0.026, 0.024, COL.metal, { seg: 6, ...j });
    const barPts = [[0.505, 1.045, -0.245], [0.535, 1.07, -0.10], [0.535, 1.07, 0.10], [0.505, 1.045, 0.245]];
    for (let i = 0; i < barPts.length - 1; i++) {
      m.addSegment(barPts[i], barPts[i + 1], 0.017, 0.017, COL.metal, { seg: 6, ...j });
    }
    // grips
    for (const z of [-1, 1]) {
      m.addSegment([0.515, 1.05, z * 0.15], [0.50, 1.043, z * 0.255], 0.027, 0.026, COL.saddle, { seg: 8, ...j });
    }
    // bell
    m.add(GEOS.sphere8, compose(m4(), 0.52, 1.085, 0.10, 0, 0, 0, 0.032, 0.024, 0.032), hex('#d9a84a'), { jitter: 0.02 });
    // headlamp
    m.add(geo.cylinder(0.05, 0.055, 0.07, 12, true, true), compose(m4(), 0.505, 0.94, 0, 0, 0, Math.PI / 2, 1, 1, 1), COL.metal, { jitter: 0.02 });
    m.add(GEOS.disc16, compose(m4(), 0.541, 0.94, 0, 0, Math.PI / 2, 0, 0.045, 0.045, 1), hex('#f6e6b8'), { jitter: 0.01 });

    // fenders
    for (const wx of DIMS.wheelX) {
      m.add(geo.torus(0.505, 0.024, 22, 5, Math.PI * 0.13, Math.PI * 0.87),
        compose(m4(), wx, R, 0, 0, 0, 0, 1, 1, 1), COL.cream, { jitter: 0.02 });
      // fender stays
      m.addSegment([wx - 0.18, R + 0.28, 0.03], [wx, R - 0.20, 0.06], 0.007, 0.007, COL.metal, { seg: 4, caps: false, ...j });
    }

    // chain
    const cpts = chainPath();
    for (let i = 0; i < cpts.length - 1; i++) {
      m.addSegment([cpts[i][0], cpts[i][1], 0.078], [cpts[i + 1][0], cpts[i + 1][1], 0.078], 0.009, 0.009, hex('#5a544a'), { seg: 4, caps: false, jitter: 0.02 });
    }
    // rear sprocket
    m.add(geo.disc(0.058, 12), compose(m4(), DIMS.wheelX[0], R, 0.078, 0, 0, 0, 1, 1, 1), hex('#8a8377'), { jitter: 0.02 });

    /* basket, woven */
    const bx = 0.735, by = 1.005, bz = 0, bw = 0.24, bh = 0.19, bd = 0.30;
    const wick = COL.wicker;
    const wall = 0.018;
    m.add(geo.box(bw, wall, bd), compose(m4(), bx, by - bh / 2, bz, 0, 0, 0, 1, 1, 1), scalec(wick, 0.85), { jitter: 0.04 });
    for (const s of [-1, 1]) {
      m.add(geo.box(wall, bh, bd), compose(m4(), bx + s * bw / 2, by, bz, 0, 0, 0, 1, 1, 1), wick, { jitter: 0.04 });
      m.add(geo.box(bw, bh, wall), compose(m4(), bx, by, bz + s * bd / 2, 0, 0, 0, 1, 1, 1), wick, { jitter: 0.04 });
    }
    for (let i = 0; i < 7; i++) {
      const t = (i / 6 - 0.5) * (bw - 0.03);
      m.add(geo.box(0.012, bh + 0.012, 0.012), compose(m4(), bx + t, by, bz + bd / 2 + 0.002, 0, 0, 0, 1, 1, 1), scalec(wick, 1.08), { jitter: 0.05 });
    }
    for (let i = 0; i < 2; i++) {
      const yy = by - bh / 2 + 0.045 + i * 0.08;
      m.add(geo.box(bw + 0.01, 0.012, bd + 0.01), compose(m4(), bx, yy, bz, 0, 0, 0, 1, 1, 1), scalec(wick, 0.9), { jitter: 0.04 });
    }
    // top rim
    m.add(geo.box(bw + 0.025, 0.026, bd + 0.025), compose(m4(), bx, by + bh / 2 + 0.01, bz, 0, 0, 0, 1, 1, 1), scalec(wick, 0.78), { jitter: 0.04 });
    // flowers in the basket
    const fcol = [hex('#f2d06b'), hex('#f7f0df'), hex('#e59ac0')];
    for (let i = 0; i < 3; i++) {
      const fx = bx + (i - 1) * 0.05, fz = bz + (i === 1 ? 0.045 : -0.045);
      const fh = 0.15 + i * 0.025;
      m.addSegment([fx, by + 0.02, fz], [fx + 0.015, by + fh, fz], 0.007, 0.005, hex('#4d7a3f'), { seg: 4, jitter: 0.03 });
      const hx = fx + 0.015, hy = by + fh, hz = fz;
      for (let p = 0; p < 5; p++) {
        const a = (p / 5) * TAU;
        m.add(GEOS.sphere8, compose(m4(), hx + Math.cos(a) * 0.026, hy + 0.006, hz + Math.sin(a) * 0.026, 0, 0, 0, 0.03, 0.012, 0.03), fcol[i], { jitter: 0.04 });
      }
      m.add(GEOS.sphere8, compose(m4(), hx, hy + 0.014, hz, 0, 0, 0, 0.018, 0.014, 0.018), hex('#d99a36'), { jitter: 0.03 });
    }

    /* kickstand? no. tiny rear reflector */
    m.add(geo.box(0.04, 0.05, 0.01), compose(m4(), -0.63, 0.55, 0.04, 0, 0, 0.3, 1, 1, 1), hex('#d05a3a'), { jitter: 0.02 });

    return m.build();
  }

  function buildCrank() {
    const m = new Mesh(401);
    const zc = 0.085;
    m.add(geo.torus(0.108, 0.012, 24, 5), compose(m4(), 0, 0, zc, 0, 0, 0, 1, 1, 1), COL.metal, { jitter: 0.02 });
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU;
      m.addSegment([0, 0, zc], [Math.cos(a) * 0.10, Math.sin(a) * 0.10, zc], 0.012, 0.008, COL.metal, { seg: 4, caps: false, jitter: 0.02 });
    }
    m.add(geo.cylinder(0.026, 0.026, 0.06, 8, true, true), compose(m4(), 0, 0, zc, Math.PI / 2, 0, 0, 1, 1, 1), COL.metal, { jitter: 0.02 });
    m.addSegment([0, 0, 0.10], [DIMS.crankR, 0, 0.10], 0.018, 0.016, COL.metal, { seg: 6, ...{ jitter: 0.02 } });
    m.addSegment([0, 0, -0.10], [-DIMS.crankR, 0, -0.10], 0.018, 0.016, COL.metal, { seg: 6, ...{ jitter: 0.02 } });
    return m.build();
  }

  function buildPedal() {
    const m = new Mesh(402);
    m.add(geo.box(0.13, 0.022, 0.085), compose(m4(), 0, 0, 0, 0, 0, 0, 1, 1, 1), hex('#4a423a'), { jitter: 0.03 });
    m.add(geo.box(0.105, 0.008, 0.06), compose(m4(), 0, 0.015, 0, 0, 0, 0, 1, 1, 1), hex('#8b7f6c'), { jitter: 0.02 });
    m.add(geo.cylinder(0.014, 0.014, 0.12, 6, true, true), compose(m4(), 0, 0, 0, Math.PI / 2, 0, 0, 1, 1, 1), COL.metal, { jitter: 0.02 });
    return m.build();
  }

  function buildBody() {
    const m = new Mesh(501);
    const [rx, ry, rz] = DIMS.bodyRadii;

    // speckled body — colour by height & flank, dots layered on top
    const base = COL.body, dark = COL.bodyD, belly = COL.belly;
    m.add(GEOS.unitSphere, compose(m4(), 0, 0, 0, 0, 0, 0, rx, ry, rz), base, {
      jitter: 0.022,
      colorFn: (x, y, z) => {
        let out = mixc(dark, base, clamp(0.45 + y * 1.7, 0, 1));
        const low = smoothstep(-0.15, -0.95, y);
        const front = smoothstep(0.0, 0.85, x) * (1 - smoothstep(0.15, 0.8, y));
        return mixc(out, belly, clamp(low * 0.5 + front * 0.5, 0, 0.72));
      },
    });
    // neck
    m.addSegment([0.10, 0.16, 0], [0.145, 0.31, 0], 0.12, 0.095, mixc(base, belly, 0.35), { seg: 10, jitter: 0.05 });
    // speckles on flanks
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 13; i++) {
        const u = (i / 13) * TAU + side * 0.4;
        const px = Math.cos(u) * (0.18 + (i % 3) * 0.045);
        const py = Math.sin(u * 1.7) * 0.12 + 0.02;
        const t = 1 - (px * px) / (rx * rx) - (py * py) / (ry * ry);
        if (t <= 0) continue;
        const pz = side * rz * Math.sqrt(t) * 0.985;
        const big = i % 4 === 0;
        m.add(GEOS.sphere8, compose(m4(), px, py, pz, 0, 0, 0, big ? 0.028 : 0.018, big ? 0.02 : 0.014, 0.012),
          i % 3 === 0 ? hex('#e6d5b8') : hex('#45352a'), { jitter: 0.03 });
      }
    }
    // a few speckles on the pale breast
    for (let i = 0; i < 7; i++) {
      const px = 0.14 + (i / 7) * 0.14;
      const py = 0.03 - (i % 3) * 0.065;
      const t = 1 - (px * px) / (rx * rx) - (py * py) / (ry * ry);
      if (t <= 0) continue;
      const pz = ((i % 2) ? 1 : -1) * rz * Math.sqrt(t) * 0.96;
      m.add(GEOS.sphere8, compose(m4(), px, py, pz, 0, 0, 0, 0.018, 0.014, 0.011), hex('#8a6a50'), { jitter: 0.03 });
    }
    // little dark necklace
    for (let i = 0; i < 7; i++) {
      const a = (i / 6 - 0.5) * 1.4;
      m.add(GEOS.sphere8, compose(m4(), 0.13 + Math.cos(a) * 0.05, 0.20 + Math.sin(a) * 0.02, Math.sin(a) * 0.095, 0, 0, 0, 0.022, 0.014, 0.012), hex('#4b3529'), { jitter: 0.03 });
    }
    return m.build();
  }

  function buildHead() {
    const m = new Mesh(502);
    m.add(GEOS.unitSphere, compose(m4(), 0, 0, 0, 0, 0, 0, 0.155, 0.15, 0.148), COL.crown, {
      jitter: 0.022,
      colorFn: (x, y, z) => {
        const crown = smoothstep(-0.1, 0.6, y);
        const face = smoothstep(-0.05, 0.55, x) * (1 - smoothstep(0.1, 0.75, y));
        let out = mixc(COL.face, COL.crown, crown);
        out = mixc(out, COL.face, face * 0.55);
        return out;
      },
    });
    // eyes
    for (const s of [-1, 1]) {
      m.add(GEOS.disc16, compose(m4(), 0.076, 0.032, s * 0.129, 0, s > 0 ? 0 : Math.PI, 0, 0.049, 0.049, 1), COL.eyeRing, { jitter: 0.02 });
      m.add(GEOS.sphere8, compose(m4(), 0.078, 0.03, s * 0.137, 0, 0, 0, 0.034, 0.035, 0.022), hex('#1b1512'), { jitter: 0.01 });
      m.add(GEOS.sphere8, compose(m4(), 0.09, 0.043, s * 0.154, 0, 0, 0, 0.011, 0.011, 0.008), hex('#fffaf0'), { jitter: 0.0 });
    }
    // beak
    m.add(geo.cone(0.052, 0.15, 8), compose(m4(), 0.198, 0.012, 0, 0, 0, -Math.PI / 2, 1, 1, 1), COL.beak, { jitter: 0.03 });
    m.add(geo.cone(0.034, 0.10, 8), compose(m4(), 0.175, -0.024, 0, 0, 0, -Math.PI / 2 - 0.06, 1, 1, 1), scalec(COL.beak, 0.82), { jitter: 0.03 });
    // crest
    for (let i = 0; i < 3; i++) {
      m.addSegment([-0.015 + i * 0.025, 0.135, (i - 1) * 0.028], [-0.06 + i * 0.035, 0.20, (i - 1) * 0.045], 0.011, 0.004, COL.crown, { seg: 4, jitter: 0.03 });
    }
    return m.build();
  }

  function buildTail() {
    const m = new Mesh(503);
    // compact fan of tail feathers, springing back and up from the tail root
    for (let i = -3; i <= 3; i++) {
      const spread = i * 0.14;
      const baseM = compose(m4(), 0, 0.015 + Math.abs(i) * 0.004, 0, 0, spread, -0.30 - Math.abs(i) * 0.025, 1, 1, 1);
      const local = compose(m4(), -0.16, 0, 0, 0, 0, 0, 0.17, 0.02, 0.05);
      m.add(GEOS.sphere8, m4mul(m4(), baseM, local), COL.tail, {
        jitter: 0.03,
        colorFn: (x) => x < -0.55 ? COL.creamF : COL.tail,
      });
      const tip = compose(m4(), -0.30, -0.002, 0, 0, 0, 0, 0.045, 0.015, 0.036);
      m.add(GEOS.sphere8, m4mul(m4(), baseM, tip), hex('#d6c09c'), { jitter: 0.025 });
    }
    // coverts hiding the feather roots
    m.add(GEOS.sphere8, compose(m4(), -0.03, 0.03, 0, 0, 0, 0, 0.09, 0.07, 0.10), mixc(COL.body, COL.tail, 0.5), { jitter: 0.04 });
    return m.build();
  }

  function buildWing() {
    const m = new Mesh(504);
    m.add(GEOS.sphere8, compose(m4(), 0, 0, 0, 0, 0, 0, 0.085, 0.075, 0.05), mixc(COL.body, COL.bodyD, 0.3), { jitter: 0.05 });
    const segs = [
      [0.13, -0.01, 0.15, 0.075, 0.028],
      [0.27, -0.02, 0.14, 0.064, 0.025],
      [0.41, -0.03, 0.12, 0.055, 0.023],
    ];
    for (const [x, y, lx, ly, lz2] of segs) {
      m.add(GEOS.sphere12, compose(m4(), x, y, 0, 0, 0, 0, lx, ly, lz2), COL.body, {
        jitter: 0.04,
        colorFn: (xx, yy) => yy > 0.03 ? mixc(COL.body, COL.bodyD, 0.35) : COL.body,
      });
    }
    // wing bars
    m.add(GEOS.sphere8, compose(m4(), 0.21, -0.015, 0, 0, 0, 0, 0.016, 0.062, 0.030), COL.creamF, { jitter: 0.03 });
    m.add(GEOS.sphere8, compose(m4(), 0.34, -0.03, 0, 0, 0, 0, 0.015, 0.052, 0.027), COL.creamF, { jitter: 0.03 });
    // primary feathers near the grip
    for (let i = 0; i < 4; i++) {
      m.add(GEOS.sphere8, compose(m4(), 0.55 + i * 0.022, -0.03 - i * 0.024, (i - 1.5) * 0.005,
        0, (i - 1.5) * 0.07, -0.12 - i * 0.05, 0.105, 0.019, 0.017),
        mixc(COL.bodyD, COL.tail, 0.45), {
        jitter: 0.035,
        colorFn: (x) => x > 0.5 ? COL.creamF : mixc(COL.bodyD, COL.tail, 0.45),
      });
    }
    // trailing secondaries
    for (let i = 0; i < 3; i++) {
      m.add(GEOS.sphere8, compose(m4(), 0.36 - i * 0.03, -0.085 - i * 0.01, 0.006,
        0, 0, -0.65 - i * 0.06, 0.085, 0.014, 0.02), mixc(COL.bodyD, COL.tail, 0.5), { jitter: 0.03 });
    }
    return m.build();
  }

  function buildLegs() {
    const L1 = DIMS.legL1, L2 = DIMS.legL2;
    const thigh = new Mesh(505);
    thigh.add(geo.cylinder(0.052, 0.078, L1, 10, true, true), compose(m4(), 0, L1 / 2, 0, 0, 0, 0, 1, 1, 1), COL.leg, { jitter: 0.04 });
    // feathered drumstick
    thigh.add(GEOS.sphere12, compose(m4(), 0, 0.085, 0, 0, 0, 0, 0.095, 0.125, 0.085), mixc(COL.bodyD, COL.leg, 0.35), {
      jitter: 0.06,
      colorFn: (x, y) => y < -0.25 ? mixc(COL.bodyD, COL.leg, 0.2) : mixc(COL.body, COL.bodyD, 0.3),
    });
    thigh.add(GEOS.sphere8, compose(m4(), 0, L1, 0, 0, 0, 0, 0.052, 0.052, 0.052), COL.leg, { jitter: 0.03 });

    const shin = new Mesh(506);
    shin.add(geo.cylinder(0.03, 0.045, L2, 8, true, true), compose(m4(), 0, L2 / 2, 0, 0, 0, 0, 1, 1, 1), COL.leg, { jitter: 0.04 });
    shin.add(GEOS.sphere8, compose(m4(), 0, L2 - 0.015, 0, 0, 0, 0, 0.042, 0.038, 0.042), COL.leg, { jitter: 0.03 });
    // scaly rings
    for (let i = 0; i < 4; i++) {
      shin.add(geo.torus(0.035, 0.004, 8, 4), compose(m4(), 0, 0.09 + i * 0.075, 0, Math.PI / 2, 0, 0, 1, 1, 1), scalec(COL.leg, 0.8), { jitter: 0.02 });
    }

    const foot = new Mesh(507);
    foot.add(GEOS.sphere8, compose(m4(), 0.025, 0.005, 0, 0, 0, 0, 0.085, 0.03, 0.055), COL.leg, { jitter: 0.03 });
    for (let i = -1; i <= 1; i++) {
      const a = i * 0.45;
      const ex = 0.025 + Math.cos(a) * 0.135, ez = Math.sin(a) * 0.135;
      foot.addSegment([0.03, 0.0, 0], [ex, -0.004, ez], 0.016, 0.007, COL.leg, { seg: 4, jitter: 0.03 });
      foot.add(geo.cone(0.009, 0.04, 5), compose(m4(), ex + 0.012, -0.006, ez, 0, 0, -Math.PI / 2, 1, 1, 1), hex('#c9a06a'), { jitter: 0.02 });
    }
    // back toe
    foot.addSegment([0.0, 0.0, 0], [-0.075, -0.004, 0], 0.014, 0.006, COL.leg, { seg: 4, jitter: 0.03 });
    return { thigh: thigh.build(), shin: shin.build(), foot: foot.build() };
  }

  function buildRider() {
    const wheel = buildWheel();
    const frame = buildFrame();
    const crank = buildCrank();
    const pedal = buildPedal();
    const body = buildBody();
    const head = buildHead();
    const tail = buildTail();
    const wing = buildWing();
    const legs = buildLegs();
    return {
      meshes: { wheel, frame, crank, pedal, body, head, tail, wing, thigh: legs.thigh, shin: legs.shin, foot: legs.foot },
      dims: DIMS,
      colors: COL,
    };
  }

  global.PB.buildWorld = buildWorld;
  global.PB.buildRider = buildRider;
  global.PB.groundHeight = groundHeight;
})(window);

      cam.pinch = d;

  /* ---------------------------------- views -------------------------------- */

  /* ------------------------------ pose helpers ----------------------------- */
  const M = {
    bike: m4(), body: m4(), head: m4(), tail: m4(),
    wheelF: m4(), wheelR: m4(), crank: m4(),
    pedalR: m4(), pedalL: m4(),
    wingR: m4(), wingL: m4(),
    thighR: m4(), thighL: m4(), shinR: m4(), shinL: m4(), footR: m4(), footL: m4(),
  };
  const T1 = m4(), T2 = m4(), T3 = m4(), V1 = [0, 0, 0], V2 = [0, 0, 0];

  function solveKnee(hip, ankle, l1, l2, pole) {
    let dx = ankle[0] - hip[0], dy = ankle[1] - hip[1], dz = ankle[2] - hip[2];
    let d = Math.hypot(dx, dy, dz);
    if (d < 1e-5) d = 1e-5;
    const ux = dx / d, uy = dy / d, uz = dz / d;
    const dd = clamp(d, Math.abs(l1 - l2) + 0.002, l1 + l2 - 0.002);
    const h = (l1 * l1 - l2 * l2 + dd * dd) / (2 * dd);
    const r = Math.sqrt(Math.max(0, l1 * l1 - h * h));
    const dot = pole[0] * ux + pole[1] * uy + pole[2] * uz;
    let px = pole[0] - ux * dot, py = pole[1] - uy * dot, pz = pole[2] - uz * dot;
    let pl = Math.hypot(px, py, pz);
    if (pl < 1e-4) { px = 0; py = 0; pz = 1; pl = 1; }
    px /= pl; py /= pl; pz /= pl;
    return [hip[0] + ux * h + px * r, hip[1] + uy * h + py * r, hip[2] + uz * h + pz * r];
  }

  function spawnDust(x, y, z, power, spread) {
    const rnd = Math.random;
    const a = rnd() * Math.PI * 2;
    dust.spawn({
      x: x + (rnd() - 0.5) * 0.25, y: y + rnd() * 0.12, z: z + (rnd() - 0.5) * 0.25,
      vx: Math.cos(a) * spread * rnd(), vy: 0.5 + rnd() * 0.9 * power, vz: Math.sin(a) * spread * rnd(),
      life: 0.55 + rnd() * 0.65, maxLife: 1.1,
      size: 0.24 + rnd() * 0.4, alpha: 0.35 + rnd() * 0.3, grow: true,
      r: 0.84, g: 0.75, b: 0.6,
    });
  }

  function burst(x, z) {
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2, s = 0.6 + Math.random() * 1.6;
      dust.spawn({
        x: x + Math.cos(a) * 0.3, y: 0.05, z: z + Math.sin(a) * 0.3,
        vx: Math.cos(a) * s, vy: 0.6 + Math.random() * 1.3, vz: Math.sin(a) * s,
        life: 0.5 + Math.random() * 0.6, maxLife: 1.1,
        size: 0.18 + Math.random() * 0.35, alpha: 0.28, grow: true,
        r: 0.82, g: 0.73, b: 0.58,
      });
    }
  }

  /* -------------------------------- physics -------------------------------- */
  function updateRide(dt) {
    if (dt <= 0) return;
    let cruise = ride.cruise;
    if (keys.has('KeyW') || keys.has('ArrowUp')) cruise += 3.0 * dt;
    if (keys.has('KeyS') || keys.has('ArrowDown')) cruise -= 5.0 * dt;
    cruise = clamp(cruise, 0, 12);
    if (cruise !== ride.cruise) {
      ride.cruise = cruise;
      speedRange.value = cruise.toFixed(1);
      speedVal.textContent = cruise.toFixed(1);
      updateSliderFill();
    }
    const target = ride.cruise;
    const rate = target > ride.speed ? 3.4 : 6.0;
    const dv = clamp(target - ride.speed, -rate * dt, rate * dt);
    ride.speed += dv;
    if (Math.abs(target - ride.speed) < 0.005) ride.speed = target;

    let steerTarget = 0;
    if (keys.has('KeyD') || keys.has('ArrowRight')) steerTarget += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) steerTarget -= 1;
    ride.steer = damp(ride.steer, steerTarget, 8, dt);

    if (ride.speed > 0.2) {
      const eff = clamp(ride.speed / 5, 0.18, 1);
      ride.heading += ride.steer * 1.45 * eff * dt;
    }

    const fwdX = Math.cos(ride.heading), fwdZ = Math.sin(ride.heading);
    ride.x += fwdX * ride.speed * dt;
    ride.z += fwdZ * ride.speed * dt;
    ride.distance += ride.speed * dt;

    const r = Math.hypot(ride.x, ride.z);
    if (r > PADDOCK_R) {
      const radial = Math.atan2(ride.z, ride.x);
      let tangent = radial + Math.PI / 2;
      if (Math.cos(tangent - ride.heading) < 0) tangent += Math.PI;
      const k = 1 - Math.exp(-2.4 * dt);
      ride.heading = angleLerp(ride.heading, tangent, k);
      ride.speed = Math.min(ride.speed, 5.4);
      const pull = (r - PADDOCK_R) * 0.9 * dt;
      ride.x -= Math.cos(radial) * pull;
      ride.z -= Math.sin(radial) * pull;
    }

    const leanTarget = ride.steer * clamp(ride.speed / 6, 0, 1) * 0.30;
    ride.lean = damp(ride.lean, leanTarget, 6, dt);

    if (hopRequest) {
      hopRequest = false;
      if (!ride.airborne) {
        ride.airborne = true;
        ride.hopV = 3.3;
      }
    }
    if (ride.airborne) {
      ride.hopY += ride.hopV * dt;
      ride.hopV -= 10.0 * dt;
      if (ride.hopY <= 0) {
        ride.hopY = 0;
        ride.hopV = 0;
        ride.airborne = false;
        burst(ride.x, ride.z);
      }
    }

    const wheelSpeed = ride.speed / D.wheelR;
    ride.wheelAngle -= wheelSpeed * dt;
    ride.crankAngle -= (wheelSpeed / 1.7) * dt;
    ride.cadence = (wheelSpeed / 1.7) / (Math.PI * 2) * 60;

    ride.bob = Math.sin(ride.crankAngle * 2) * 0.013 * clamp(ride.speed / 2, 0, 1) + Math.sin(simTime * 1.6) * 0.004;

    if (ride.speed > 0.8) {
      ride.dustAcc += dt * ride.speed * 3.4;
      while (ride.dustAcc > 1) {
        ride.dustAcc -= 1;
        const bx = ride.x - Math.cos(ride.heading) * 0.55 + (Math.random() - 0.5) * 0.18;
        const bz = ride.z - Math.sin(ride.heading) * 0.55 + (Math.random() - 0.5) * 0.18;
        spawnDust(bx, 0.04, bz, 0.8, 0.55);
      }
    } else {
      ride.dustAcc = 0;
    }
    dust.update(dt, 1.1);
  }

  /* --------------------------------- camera -------------------------------- */
  const _target = [0, 0, 0];
  function updateCamera(dt) {
    const aspectNow = canvas.clientWidth / Math.max(1, canvas.clientHeight);
    const lead = aspectNow < 0.9 ? 0.35 : 0.2;
    const wishX = ride.x + Math.cos(ride.heading) * lead;
    const wishZ = ride.z + Math.sin(ride.heading) * lead;
    const wantY = 0.95 + ride.hopY * 0.55;
    const k = 1 - Math.exp(-9 * dt);
    cam.target[0] = lerp(cam.target[0], wishX, k);
    cam.target[1] = lerp(cam.target[1], wantY, k);
    cam.target[2] = lerp(cam.target[2], wishZ, k);

    if (cam.follow) cam.wantYaw = -ride.heading - Math.PI / 2;
    else if (cam.track === 'side') cam.wantYaw = -ride.heading;
    else if (cam.track === 'front') cam.wantYaw = Math.PI / 2 - ride.heading;
    if (cam.auto && !cam.dragging) cam.wantYaw += 0.13 * dt;

    const kc = 1 - Math.exp(-9 * dt);
    cam.yaw = angleLerp(cam.yaw, cam.wantYaw, kc);
    cam.pitch = lerp(cam.pitch, cam.wantPitch, kc);
    cam.dist = lerp(cam.dist, cam.wantDist, kc);

    if (cam.dist < 3.4) cam.pitch = Math.max(cam.pitch, 0.08);

    const portraitBias = aspectNow < 0.9 ? 1.6 : 1;
    const dist = cam.dist * portraitBias;
    const cp = Math.cos(cam.pitch);
    const eye = [
      cam.target[0] + Math.sin(cam.yaw) * cp * dist,
      cam.target[1] + Math.sin(cam.pitch) * dist,
      cam.target[2] + Math.cos(cam.yaw) * cp * dist,
    ];
    if (eye[1] < 0.28) eye[1] = 0.28;
    return eye;
  }

  /* -------------------------------- animation ------------------------------ */
  function poseRider(t) {
    const bikeM = compose(M.bike, ride.x, ride.hopY, ride.z, ride.lean, -ride.heading, 0, 1, 1, 1);
    const hop = ride.hopY;
    const bob = ride.bob;
    const [bbX, bbY] = D.bb;
    const cR = Math.cos(ride.crankAngle), sR = Math.sin(ride.crankAngle);
    const pR = [bbX + cR * D.crankR, bbY + sR * D.crankR, D.pedalZ];
    const pL = [bbX - cR * D.crankR, bbY - sR * D.crankR, -D.pedalZ];

    m4mul(M.wheelR, bikeM, compose(T1, D.wheelX[0], D.wheelR, 0, 0, 0, ride.wheelAngle, 1, 1, 1));
    m4mul(M.wheelF, bikeM, compose(T1, D.wheelX[1], D.wheelR, 0, 0, 0, ride.wheelAngle, 1, 1, 1));
    m4mul(M.crank, bikeM, compose(T1, bbX, bbY, 0, 0, 0, ride.crankAngle, 1, 1, 1));
    m4mul(M.pedalR, bikeM, compose(T1, pR[0], pR[1], pR[2], 0, 0, 0, 1, 1, 1));
    m4mul(M.pedalL, bikeM, compose(T1, pL[0], pL[1], pL[2], 0, 0, 0, 1, 1, 1));

    const sway = -ride.lean * 0.32 + Math.sin(ride.crankAngle * 2) * 0.018;
    const bodyPitch = D.bodyTilt + Math.sin(ride.crankAngle * 2 + 1) * 0.012;
    m4mul(M.body, bikeM, compose(T1, D.body[0], D.body[1] + bob, D.body[2], sway, 0, bodyPitch, 1, 1, 1));

    const nod = Math.sin(ride.crankAngle * 2 + 0.8) * 0.028 + Math.sin(t * 1.25) * 0.016;
    const headTurn = Math.sin(ride.crankAngle) * 0.05 + Math.sin(t * 0.7) * 0.045;
    m4mul(M.head, M.body, compose(T1, D.headLocal[0], D.headLocal[1], D.headLocal[2], nod * 0.6, headTurn, nod, 1, 1, 1));

    m4mul(M.tail, M.body, compose(T1, -0.33, 0.02, 0,
      Math.sin(ride.crankAngle * 2) * 0.04,
      Math.sin(ride.crankAngle * 2 + 0.7) * 0.11 + Math.sin(t * 0.8) * 0.05,
      -0.18 + Math.sin(ride.crankAngle * 2 + 2) * 0.05, 1, 1, 1));

    const flutter = Math.sin(t * 6.4) * 0.022 + (ride.airborne ? 0.28 + Math.sin(t * 21) * 0.30 : 0) + clamp(ride.speed / 12, 0, 0.15) * Math.sin(t * 9);
    for (const side of [1, -1]) {
      const shoulder = xformPoint(V1, M.body, [-0.02, 0.06, side * 0.20]);
      const gi = side > 0 ? 0 : 1;
      const grip = [D.grips[gi][0], D.grips[gi][1], D.grips[gi][2]];
      m4fromX(T1, shoulder, [grip[0] - shoulder[0], grip[1] - shoulder[1], grip[2] - shoulder[2]], [0, 1, 0]);
      m4rotZ(T1, flutter);
      m4mul(side > 0 ? M.wingR : M.wingL, bikeM, T1);
    }

    const hipBase = D.hip[1];
    for (const side of [1, -1]) {
      const pedal = side > 0 ? pR : pL;
      const hip = [D.hip[0], hipBase + bob * 0.45, side * D.hip[2]];
      const ankle = [pedal[0], pedal[1] + 0.062, pedal[2]];
      const knee = solveKnee(hip, ankle, D.legL1, D.legL2, [1, 0, 0]);
      m4fromY(T1, hip, [knee[0] - hip[0], knee[1] - hip[1], knee[2] - hip[2]], [0, 0, 1]);
      m4mul(side > 0 ? M.thighR : M.thighL, bikeM, T1);
      m4fromY(T2, knee, [ankle[0] - knee[0], ankle[1] - knee[1], ankle[2] - knee[2]], [0, 0, 1]);
      m4mul(side > 0 ? M.shinR : M.shinL, bikeM, T2);
      m4mul(side > 0 ? M.footR : M.footL, bikeM, compose(T3, pedal[0], pedal[1] + 0.032, pedal[2], 0, 0, 0, 1, 1, 1));
    }

    return { bikeM };
  }

  /* --------------------------------- render -------------------------------- */
  const proj = m4();
  const view = m4();
  const ident = m4identity(m4());
  const scene = {
    proj, view, right: [0, 0, 0], up: [0, 0, 0], fwd: [0, 0, 0],
    tanX: 1, tanY: 1, sunDir: [0, 0, -1], sunColor: [1, 1, 1], skyColor: [0, 0, 0],
    groundColor: [0, 0, 0], fogColor: [0, 0, 0], fogNear: 20, fogFar: 120,
    tint: [1, 1, 1], shadowColor: [0, 0, 0],
  };

  function buildMoteData(t) {
    const count = motes.length;
    const data = new Float32Array(count * 8);
    const night = palette.firefly;
    for (let i = 0; i < count; i++) {
      const m = motes[i], o = i * 8;
      const x = m.x + Math.sin(t * m.sp + m.ph) * m.amp;
      const y = m.y + Math.sin(t * m.sp * 1.6 + m.ph * 1.7) * 0.22;
      const z = m.z + Math.cos(t * m.sp * 0.8 + m.ph) * m.amp;
      const blink = 0.55 + 0.45 * Math.sin(t * (m.firefly ? 2.3 : 1.1) + m.ph * 3);
      let alpha = palette.moteAlpha * (m.firefly ? 1 : 0.7) * blink;
      if (m.firefly) alpha += night * 0.9 * blink;
      data[o] = x; data[o + 1] = y; data[o + 2] = z;
      if (m.firefly && night > 0.2) {
        data[o + 3] = 1.0; data[o + 4] = 0.88; data[o + 5] = 0.5;
      } else {
        data[o + 3] = 1.0; data[o + 4] = 0.92; data[o + 5] = 0.72;
      }
      data[o + 6] = m.size * (m.firefly ? 1.8 : 1);
      data[o + 7] = clamp(alpha, 0, 1);
    }
    return { data, count };
  }

  function render(t, dt) {
    const aspect = renderer.resize();
    const eye = updateCamera(dt);
    const target = cam.target;
    const fov = 45 * Math.PI / 180;
    m4perspective(proj, fov, aspect, 0.26, 280);
    m4lookAt(view, eye, target, [0, 1, 0]);

    const fwd = PB.norm([target[0] - eye[0], target[1] - eye[1], target[2] - eye[2]]);
    const right = PB.norm(PB.cross(fwd, [0, 1, 0]));
    const up = PB.cross(right, fwd);
    const tanY = Math.tan(fov / 2), tanX = tanY * aspect;

    scene.sunDir = palette.sunDir;
    scene.sunColor = palette.lightSun;
    scene.skyColor = palette.skyAmb;
    scene.groundColor = palette.groundAmb;
    scene.fogColor = palette.fog;
    scene.fogNear = palette.fogNear;
    scene.fogFar = palette.fogFar;
    scene.shadowColor = palette.shadow;
    scene.tint = palette.tint;
    scene.right = right; scene.up = up; scene.fwd = fwd;
    scene.tanX = tanX; scene.tanY = tanY;

    renderer.setScene(scene);
    renderer.begin();
    renderer.drawSky(palette);

    renderer.draw(W.terrain, ident);
    renderer.draw(W.grass, ident, { doubleSided: true });
    renderer.draw(W.flowers, ident, { doubleSided: true });
    renderer.draw(W.trees, ident);
    renderer.draw(W.fence, ident);
    renderer.draw(W.mountains, ident);

    const flockM = compose(T1,
      world.flockCenter[0] + Math.sin(t * 0.03) * 7,
      world.flockCenter[1] + Math.sin(t * 0.21) * 0.4,
      world.flockCenter[2] + Math.cos(t * 0.03) * 7,
      0, Math.sin(t * 0.02) * 0.18, 0, 1, 1, 1);
    renderer.draw(W.flock, flockM, { unlit: true, doubleSided: true });

    poseRider(t);
    renderer.draw(G.frame, M.bike);
    renderer.draw(G.wheel, M.wheelR);
    renderer.draw(G.wheel, M.wheelF);
    renderer.draw(G.crank, M.crank);
    renderer.draw(G.pedal, M.pedalR);
    renderer.draw(G.pedal, M.pedalL);
    renderer.draw(G.body, M.body);
    renderer.draw(G.tail, M.tail);
    renderer.draw(G.head, M.head);
    renderer.draw(G.wing, M.wingR, { doubleSided: true });
    renderer.draw(G.wing, M.wingL, { doubleSided: true });
    renderer.draw(G.thigh, M.thighR);
    renderer.draw(G.thigh, M.thighL);
    renderer.draw(G.shin, M.shinR);
    renderer.draw(G.shin, M.shinL);
    renderer.draw(G.foot, M.footR);
    renderer.draw(G.foot, M.footL);

    // ambient contact shadows
    renderer.drawShadow(W.treeShadows, ident, 0.8);
    const bikeShadowScale = 1 / (1 + ride.hopY * 0.7);
    const shadowColor = shadowDebug ? [1, 0.08, 0.08] : undefined;
    renderer.drawShadow(shadowUnit,
      compose(T1, ride.x, 0.04, ride.z, 0, -ride.heading, 0, 2.05 * bikeShadowScale, 1, 0.92 * bikeShadowScale),
      shadowDebug ? 1 : 0.72 * (1 - ride.hopY * 0.22), shadowColor);
    const bm = M.body;
    renderer.drawShadow(shadowUnit,
      compose(T1, bm[12], 0.045, bm[14], 0, -ride.heading, 0, 0.60 * bikeShadowScale, 1, 0.62 * bikeShadowScale),
      shadowDebug ? 1 : 0.46 * (1 - ride.hopY * 0.3), shadowColor);

    // dust & motes
    renderer.drawPoints(dust.build(1, 1 - palette.firefly * 0.65), 1.0, false);
    renderer.drawPoints(buildMoteData(t), 1.0, true);

    statsTimer += dt;
    if (statsTimer > 0.12) {
      statsTimer = 0;
      statSpeed.textContent = (ride.speed * 3.6).toFixed(1);
      statCadence.textContent = Math.round(ride.cadence * Math.sign(ride.speed || 0));
      statDist.textContent = ride.distance < 1000 ? Math.round(ride.distance) + ' m' : (ride.distance / 1000).toFixed(2) + ' km';
      statMode.textContent = paletteTarget.label + (paused ? ' · 暂停' : ride.airborne ? ' · 腾空' : '');
    }
  }

  /* ---------------------------------- loop --------------------------------- */
  function frame(now) {
    let dt = (now - lastFrame) / 1000;
    lastFrame = now;
    if (dt > 0.06) dt = 0.06;
    if (dt < 0) dt = 0;
    pageTime += dt;
    const simDt = paused ? 0 : dt;
    simTime += simDt;
    lerpPalette(dt);
    updateRide(simDt);
    render(simTime, dt);
    if (loader && !loader.classList.contains('hidden')) {
      setTimeout(() => loader.classList.add('hidden'), 120);
    }
    requestAnimationFrame(frame);
  }

  // count-in: subtle camera push-in at start
  document.addEventListener('visibilitychange', () => { lastFrame = performance.now(); });
  requestAnimationFrame(frame);

  // expose a tiny debug handle for the curious (and for automated checks)
  window.__partridge = {
    get state() { return { ...ride, paused }; },
    setView, cycleTime, togglePause, resetRide,
    setPose(p) { Object.assign(ride, p); cam.target = [ride.x, 0.95, ride.z]; },
    setShadowDebug(v) { shadowDebug = !!v; },
    get palette() { return paletteTarget.key; },
    camera: cam,
    renderer,
  };
})();


</script>
</body>
</html>
