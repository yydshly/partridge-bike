<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171310">
<meta name="description" content="一只鹧鸪骑着复古单车穿过黄昏草场的 3D 互动场景：可拖拽环绕、变速骑行、跳跃，并切换昼夜。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171310'/%3E%3Ccircle cx='19' cy='40' r='12' fill='none' stroke='%23f6bd80' stroke-width='3'/%3E%3Ccircle cx='47' cy='40' r='12' fill='none' stroke='%23f6bd80' stroke-width='3'/%3E%3Cpath d='M19 40l8-15h12l8 15M27 25h16M39 25l8 15' fill='none' stroke='%23f6bd80' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='34' cy='15' r='6' fill='%23f6bd80'/%3E%3C/svg%3E">
<title>鹧鸪骑单车 · 3D 互动</title>
<style>
/*__STYLE__*/
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" aria-label="3D 鹧鸪骑单车场景"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="hero">
    <div class="eyebrow"><span class="pulse"></span>3D · 实时演算 · 低多边形</div>
    <h1>鹧鸪骑单车</h1>
    <p class="sub">A PARTRIDGE ON A BICYCLE</p>
  </header>

  <aside class="stats" aria-label="骑行数据">
    <div class="stat-main">
      <span class="stat-label">时速</span>
      <span class="stat-big" id="statSpeed">15.1</span>
      <span class="stat-unit">km/h</span>
    </div>
    <div class="stat-row"><span>踏频</span><b><i id="statCadence">0</i> rpm</b></div>
    <div class="stat-row"><span>里程</span><b id="statDist">0 m</b></div>
    <div class="stat-mode" id="statMode">黄昏 · 巡航</div>
  </aside>

  <div class="hint" aria-hidden="true">
    <span><kbd>拖拽</kbd>旋转</span>
    <span><kbd>滚轮</kbd>缩放</span>
    <span><kbd>W</kbd><kbd>S</kbd>加减速</span>
    <span><kbd>A</kbd><kbd>D</kbd>转向</span>
    <span><kbd>空格</kbd>跳跃</span>
    <span><kbd>P</kbd>暂停</span>
    <span><kbd>C</kbd>视角</span>
    <span><kbd>N</kbd>昼夜</span>
  </div>

  <div class="ridepad" aria-label="触屏骑行控制">
    <button class="pad-btn" data-hold="KeyA" aria-label="向左转">◀</button>
    <button class="pad-btn hop" id="hopBtn" aria-label="跳跃">跳</button>
    <button class="pad-btn" data-hold="KeyD" aria-label="向右转">▶</button>
  </div>

  <div class="dock" role="toolbar" aria-label="控制面板">
    <button id="pauseBtn" class="btn play" aria-label="暂停骑行" aria-pressed="false">
      <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.4"/><rect x="14" y="4.5" width="4" height="15" rx="1.4"/></svg>
      <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.8c0-1.2 1.3-1.9 2.3-1.3l10 6.6c1 .6 1 2 0 2.6l-10 6.6c-1 .6-2.3-.1-2.3-1.3V4.8z"/></svg>
    </button>

    <div class="speed-control">
      <div class="speed-head"><span>骑行速度</span><b id="speedVal">4.2</b><em>m/s</em></div>
      <input id="speedRange" type="range" min="0" max="12" step="0.1" value="4.2" aria-label="骑行速度">
    </div>

    <div class="divider"></div>

    <div class="view-group" role="group" aria-label="相机视角">
      <button class="chip active" data-view="orbit" aria-pressed="true">环绕</button>
      <button class="chip" data-view="side" aria-pressed="false">侧视</button>
      <button class="chip" data-view="front" aria-pressed="false">前视</button>
      <button class="chip" data-view="follow" aria-pressed="false">跟随</button>
    </div>

    <div class="divider"></div>

    <button id="autoBtn" class="btn ghost" aria-pressed="false" aria-label="自动环绕镜头">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 0 6.3 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M18.6 3.6v5.2h-5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>自动环绕</span>
    </button>

    <button id="timeBtn" class="btn ghost" data-mode="sunset" aria-label="切换时间：黄昏">
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="time-label">黄昏</span>
    </button>

    <button id="resetBtn" class="btn ghost" aria-label="复位">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 4.6v5.1h5.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>复位</span>
    </button>
  </div>

  <div class="fatal" id="fatal" hidden>
    <strong>场景加载失败</strong>
    <p class="fatal-msg"></p>
    <p class="fatal-tip">请确认浏览器已启用 WebGL / 硬件加速。</p>
  </div>

  <div class="loader" id="loader">
    <div class="loader-wheel" aria-hidden="true"></div>
    <div class="loader-text">正在给单车上链条…</div>
  </div>
</div>
<script>
/*__SCRIPT__*/
</script>
</body>
</html>
