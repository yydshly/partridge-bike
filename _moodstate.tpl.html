<!DOCTYPE html><html><head><meta charset="utf-8"><title>mood state harness</title>
<style>body{background:#0b0e13;color:#e9eef6;font:13px/1.6 Consolas,monospace;padding:14px;white-space:pre}
.ok{color:#4ecdc4}.bad{color:#ff6b6b}h3{color:#ffd166;margin:14px 0 4px}</style></head><body><div id="o">running…</div>
<script>
/* 替身：moodTick 只碰 S / MOOD / RIDERS / clamp / $，所以只要这几个。 */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const S = {
  speed:15, km:0, tSec:0, hitT:0, offRoad:0, lat:0, capT:0,
  sweat:0, fatigue:0, startle:0, wet:0,
  lookT:0, lookSide:0, lookAmt:0, rainPrev:0, saidTired:false
};
const MOOD = { rain:0 };
let RIDERS = [];
function mkRider(dir, z, x, vr){ return { userData:{ dir, vr }, position:{ x, z } }; }
let CAP = '';
const $ = () => ({ set innerHTML(v){ CAP = v; } });
/*__APPROACH__*/
/*__MOODTICK__*/

const L = [];
const ok = (c, n, d) => L.push([!!c, n, d === undefined ? '' : String(d)]);
const near = (a, b, e) => Math.abs(a - b) <= (e === undefined ? 1e-9 : e);
function reset(o){
  S.speed = 15; S.km = 0; S.tSec = 0; S.hitT = 0; S.offRoad = 0; S.lat = 0; S.capT = 0;
  S.sweat = 0; S.fatigue = 0; S.startle = 0; S.wet = 0;
  S.lookT = 0; S.lookSide = 0; S.lookAmt = 0; S.rainPrev = 0; S.saidTired = false;
  MOOD.rain = 0; RIDERS = []; CAP = '';
  if (o) for (const k in o) S[k] = o[k];
}
/* 一帧 = 推时间 + 让碰撞冷却走掉 + 跑 moodTick，顺序照 app 的 frame()。
   ⚠️ hitT 的衰减在 app 的碰撞块里（frame 里 S.hitT -= dt），
     不在 moodTick 里；这个替身不跑碰撞块，就必须自己替它减。
   ⚠️ 这件事踩过两次：第一次是 run() 忘了减，看着像「惊吓不会衰」；
     第二次是 run() 减了、但手写的 while 循环直接调 moodTick 绕过了 run()，
     hitT 永远停在 0.70 > 0.60，每一帧都把 startle 重新顶回 1，
     量出来的「按住 1.00 秒」量的是这个洞，不是产品的尖峰宽度。 */
function step(dt){
  S.tSec += dt;
  if (S.hitT > 0) S.hitT -= dt;
  moodTick(dt);
}
function run(secs, dt = 1/60, onFrame){
  const N = Math.round(secs/dt);
  for (let i = 0; i < N; i++){
    if (onFrame) onFrame(i, i*dt);
    step(dt);
  }
}

/* ═══ 1. 形状：全部落在 0..1，参数合法 ═══ */
reset();
ok(S.fatigue === 0 && S.startle === 0 && S.wet === 0, '起手全是 0');
ok(S.saidTired === false, '「累到说过一句」起手是 false');
{
  let bad = [];
  for (const spd of [0, 6, 15, 27, 36]){
    for (const km of [0, 0.2, 1, 3, 8, 40]){
      reset({ speed: spd, km: km }); MOOD.rain = km % 2 ? 0.6 : 0;
      S.hitT = 0.5;                                  // 顺便把惊吓也顶起来
      run(3);
      for (const k of ['fatigue','startle','wet','lookAmt']){
        if (!(S[k] >= 0 && S[k] <= 1)) bad.push(k + '=' + S[k] + '@' + spd + '/' + km);
      }
    }
  }
  ok(bad.length === 0, '120 组参数下 fatigue/startle/wet/lookAmt 全在 0..1', bad.slice(0,3).join('; '));
}

/* ═══ 2. 累：是里程的饱和函数，不是里程表 ═══ */
{
  // 线性的话 5 km 应该是 0.5 km 的十倍；饱和曲线应该只高一点点。
  // ⚠️ km 必须**真的设进去**：第一版两段都忘了设，第一段 km=0 → fatigue=0，
  // 除出来 49 万倍，看着像「饱和曲线根本没生效」。
  reset({ speed: 15, km: 0.5 }); run(20);
  const f05 = S.fatigue;
  reset({ speed: 15, km: 5 }); run(20);
  const f5 = S.fatigue;
  ok(f5 > f05, '骑得远更累', '0.5 km → ' + f05.toFixed(3) + '   5 km → ' + f5.toFixed(3));
  // 线性正好是 10 倍。实测 4.9 倍 —— 确实远不到，但也不是「差一点点」。
  ok(f5 / Math.max(f05, 1e-6) < 8, '远不到十倍（饱和，不是里程表）',
     (f5/Math.max(f05,1e-6)).toFixed(2) + '×（线性正好 10×）');
  ok(f5 < 1.001, '而且会趋近 1 而不是无限涨', f5.toFixed(3));
}
{ // 慢下来能歇回来。⚠️ 第一段也必须设 km：忘了设就 km=0 → fatigue=0，
  // 后面 `S.fatigue < before` 变成 0.395 < 0，看着像「歇不下来」。
  reset({ speed: 30, km: 3.0 }); run(20);
  const before = S.fatigue;
  // 用同一个疲劳值起手，只改速度，看它会不会掉
  reset(); S.fatigue = before; S.km = 3.0; S.speed = 5;
  run(12);
  ok(S.fatigue < before, '慢下来会歇回来（累是能恢复的，不是只涨不回）',
     before.toFixed(3) + ' → ' + S.fatigue.toFixed(3));
  ok(S.fatigue > 0, '但不会掉到零（它确实骑了 3 km）', S.fatigue.toFixed(3));
}
{ // 速度是次项：同样的里程，快一点更累
  reset(); S.km = 2.0; S.speed = 12; run(25); const slow = S.fatigue;
  reset(); S.km = 2.0; S.speed = 33; run(25); const fast = S.fatigue;
  ok(fast > slow, '同样里程，快一点更累', '12 km/h → ' + slow.toFixed(3) + '   33 km/h → ' + fast.toFixed(3));
}

/* ═══ 3. 惊吓：跟碰撞严格同步，且是尖的 ═══ */
{
  reset({ speed: 20 });
  run(2);
  ok(S.startle === 0, '没撞 → 惊吓一直是 0', S.startle.toFixed(4));
  S.hitT = 0.70;                                   // 碰撞判定刚跑完的那一帧
  moodTick(1/60);
  // 顶满和衰减在**同一帧**发生（先置 1 再减 dt/1.1），所以第一帧读到 0.985
  // 而不是 1.0。这是设计如此，视觉上分辨不出来，判据照这个写。
  ok(S.startle > 0.95, '撞的那一下顶到满值', S.startle.toFixed(3));
  // ⚠️ 尖峰的**总时长**是个窗口，不是某个时刻。碰撞冷却 0.70 秒里
  // hitT 一直在 0.60 以上，所以开头有 ~0.1 秒被按在满值上，
  // 衰减是从那之后才开始的 —— 拿「1.1 秒后该归零」去卡会差这 0.1 秒。
  // ⚠️ 这两个 while 必须走 step()：hitT 得一路掉下去才出得了衰减段。
  //   直接调 moodTick 的话 hitT 永远停在 0.70 > 0.60，每帧都重新顶满，
  //   hold 会一路顶到上限 1.00 秒，量出来的是那个洞、不是尖峰的宽度。
  let hold = 0;
  while (S.startle > 0.9 && hold < 1){ hold += 1/60; step(1/60); }
  let decay = 0;
  while (S.startle > 0.02 && decay < 3){ decay += 1/60; step(1/60); }
  ok(hold < 0.25, '被按在满值上的时间很短（就是碰撞冷却那 0.1 秒）', hold.toFixed(2) + ' s');
  ok(hold + decay < 1.5 && hold + decay > 0.5, '整个尖峰 0.5~1.5 秒（尖、短、一眼能对上）',
     (hold + decay).toFixed(2) + ' s（按住 ' + hold.toFixed(2) + ' + 衰减 ' + decay.toFixed(2) + '）');
  run(3);
  ok(S.startle === 0, '再等就归零，不会自己冒出来', S.startle.toFixed(4));
}
{ // 没有碰撞就永远不会自己惊 —— 这是「不掷骰子」的硬判据
  let maxStartle = 0;
  reset();
  for (let i = 0; i < 60*120; i++){
    S.tSec += 1/60;
    S.speed = 10 + (i % 600) / 600 * 26;            // 速度乱变
    S.km += 1/60 * S.speed/3.6/1000;
    MOOD.rain = (i % 1200) / 1200 * 0.8;            // 雨量也乱变
    moodTick(1/60);
    if (S.startle > maxStartle) maxStartle = S.startle;
  }
  ok(maxStartle === 0, '两分钟里速度和雨都在乱变，从没碰撞 → 惊吓一次都没冒出来',
     maxStartle.toFixed(4));
}

/* ═══ 4. 湿：跟着雨涨，雨停慢慢干（两边速度差一个量级） ═══ */
{
  reset(); MOOD.rain = 0.9;
  run(1.0);
  ok(S.wet > 0.85, '雨很大 → 1 秒就湿透（吸得快）', S.wet.toFixed(3));
  const wetAtStop = S.wet;
  MOOD.rain = 0;
  run(1.0);
  ok(S.wet > wetAtStop*0.6, '雨停 1 秒还湿着（干得慢）', wetAtStop.toFixed(3) + ' → ' + S.wet.toFixed(3));
  run(30);
  ok(S.wet < 0.25, '三十秒之后才干', S.wet.toFixed(3));
}
{ // 雨停之后不抖：抖水只在**跳变**那一刻
  reset(); MOOD.rain = 0.9; run(2);
  MOOD.rain = 0; run(0.5);
  const a = S.startle;
  run(5);
  ok(S.startle <= a, '雨一直下 / 雨停了，都不会每帧抖', S.startle.toFixed(4));
}
{ // 刚下雨 → 抖一下
  reset(); MOOD.rain = 0; run(2);
  ok(S.startle === 0, '没下雨 → 没抖', S.startle.toFixed(4));
  MOOD.rain = 0.7; moodTick(1/60);
  ok(S.startle > 0.4, '雨量跳上去的那一刻抖一下', S.startle.toFixed(3));
}

/* ═══ 5. 回头看：只在有车从身边过去时，且有 0→1→0 的包络 ═══ */
{
  reset({ speed: 20 });
  run(2);
  ok(S.lookT === 0, '身边没车 → 从不回头', S.lookT.toFixed(3));
  RIDERS = [mkRider(1, 0.2, -3, 14)];              // 刚被超过，正在往后退
  moodTick(1/60);
  ok(S.lookT > 0, '有车从身边过去 → 回头', S.lookT.toFixed(3) + 's');
  // 它在 z=+0.2、鸟在 z=0，也就是**从右边**过去的 → 往右边看 = +1。
  // （第一版这里写成了 -1，判据自己搞反了方向。）
  ok(S.lookSide === 1, '它从右边过去就往右边看', S.lookSide);
  // 包络。⚠️ 车必须**真的开走**（app 里相对速度 8 m/s，0.7 秒就出窗口了）。
  //   第一版把它静止在 dx=-3，于是每 1.1 秒重新触发一次，量出「有多峰」——
  //   那是测试造出来的，不是产品的毛病。
  const r = RIDERS[0];
  let peak = 0, prev = 0, rising = true, mono = true, steps = 0;
  for (let i = 0; i < 120; i++){
    r.position.x -= 8 * (1/60);                    // 往后退，退出窗口
    step(1/60);
    steps++;
    if (S.lookAmt > peak) peak = S.lookAmt;
    if (rising && S.lookAmt < prev - 1e-9) rising = false;
    if (!rising && S.lookAmt > prev + 1e-9) mono = false;
    prev = S.lookAmt;
  }
  ok(peak > 0.7, '回头有明确的强度峰值', peak.toFixed(3));
  ok(mono, '强度是「起来再落下去」的单峰包络，不是忽高忽低', mono ? '单峰' : '有多峰');
  ok(S.lookT === 0 && S.lookAmt === 0, '车开走之后收干净', S.lookT.toFixed(3));
}
{ // 冷却：车还在窗口里时，一次抬头看完之前不重新触发
  reset({ speed: 20 }); run(1);
  RIDERS = [mkRider(1, 0.2, -3, 14)];
  moodTick(1/60);
  const first = S.lookT;
  // ⚠️ lookT 是**倒计时**，每帧无条件减 dt。所以跑 0.5 秒之后它本来就该是
  //   first - 0.5 —— 第一版写 `S.lookT > first - 0.01`，量的是「还剩多少」，
  //   而它就是会一路减到 0，看着像「冷却根本不生效」。
  //   判「有没有重新触发」只能看**有没有跳回满值**。
  let jumps = 0, prev = first;
  run(1.0, 1/60, () => {                            // 1.0 秒 < 1.1 秒冷却，还没到期
    RIDERS[0].position.x = -3;                      // 车一直贴着不走
    if (S.lookT > prev + 1e-6) jumps++;
    prev = S.lookT;
  });
  ok(jumps === 0, '车一直贴着，冷却没到（1.0 < 1.1 秒）不重新抬头',
     'lookT ' + first.toFixed(2) + ' → ' + S.lookT.toFixed(2) + '，跳回 ' + jumps + ' 次');
  ok(near(S.lookT, first - 1.0, 0.02), '而且是纯倒计时（一路减下来，没跳回去）', S.lookT.toFixed(3));
  // ⚠️ 反向：冷却过了**必须**会重新抬头。少了这条，上面两条就成了恒过的假绿 ——
  //   「永远不触发」也能过。判据跟实现反着走的时候，必须两头都量。
  let reTrig = 0; prev = S.lookT;
  run(0.5, 1/60, () => {
    RIDERS[0].position.x = -3;
    if (S.lookT > prev + 1e-6) reTrig++;
    prev = S.lookT;
  });
  ok(reTrig > 0, '冷却过了（1.5 > 1.1 秒）就重新抬头 —— 证明上面两条抓得住东西',
     '又触发 ' + reTrig + ' 次，lookT ' + S.lookT.toFixed(2));
  ok(reTrig === 1, '而且 1.5 秒里**正好**一次（不是每帧都触发，也不是永远不触发）',
     '触发 ' + reTrig + ' 次');
}
{ // 隔得远的不看
  reset({ speed: 20 }); run(1);
  RIDERS = [mkRider(1, 1.8, -3, 14)];              // 横向差 1.8 m，隔得远
  moodTick(1/60);
  ok(S.lookT === 0, '隔 1.8 m 的车过去不回头（够不着）', S.lookT.toFixed(3));
}

/* ═══ 6. 只说一次 ═══ */
{
  // 用**巡航速度**（26 km/h）而不是 15：疲劳的速度项范围刚拉大过
  // （慢速 0.35 封顶），15 km/h 根本到不了门槛。
  reset({ speed: 26, km: 4 });
  run(30);
  ok(S.saidTired === true, '累到一定程度会说过一句', S.fatigue.toFixed(3));
  const said = CAP;
  CAP = '';
  run(30);
  ok(CAP === '', '接着一直累也不会一直刷屏', CAP || '(空)');
  // 歇回来了才可能再说
  reset(); S.fatigue = 0.8; S.km = 4; S.saidTired = true; S.speed = 4;
  run(20);
  ok(S.fatigue < 0.32 && S.saidTired === false, '歇回来了才可能再说一次',
     'fatigue=' + S.fatigue.toFixed(3) + ' saidTired=' + S.saidTired);
  ok(said.length > 0, '而且确实说了点东西', said);
}

/* ---- 反查：判据抓得住它该抓的吗 ---- */
{
  // (a) 把惊吓那一行注掉，判据必须翻
  const src = document.querySelector('script').textContent;
  ok(src.indexOf('if (S.hitT > 0.60) S.startle = 1;') >= 0, '反查 a：判据锚在真实的碰撞判定那一行上');
  // (b) 疲劳必须是饱和而不是线性
  const lin = (km) => Math.min(1, km * 0.4);
  const sat = (km) => 1 - Math.exp(-km/2.6);
  ok(sat(5) - sat(0.5) < lin(5) - lin(0.5), '反查 b：饱和曲线比线性涨得慢（判据能分辨）',
     '饱和 ' + (sat(5)-sat(0.5)).toFixed(3) + '  线性 ' + (lin(5)-lin(0.5)).toFixed(3));
  // (c) 湿的干得快还是慢：k<1 且 k 大 = 干得慢
  const wetK = 0.08;
  const dryK = 0.95;
  ok(dryK > wetK, '反查 c：干得比湿得慢（k 大 = 慢）', wetK + ' → ' + dryK);
  // (d) 回头看那几条冷却判据会不会恒过。
  //     恒过的写法是「不重新触发」—— 把重新触发整个删掉它照样过，
  //     第一版写的正是这种（量的是「还剩多少」，而 lookT 本来就在一路减）。
  //     所以判据落成「1.5 秒里**正好**一次」，这里拿一份「冷却提前触发」的替身
  //     （把 t <= 0 写成 t < 0.6）用同一套量法去量，必须量出 ≠ 1。
  //     ⚠️ 第一版的替身写的是「完全去掉 if (t <= 0)」，结果是 0 次 ——
  //     因为 1.0 秒窗口里 lookT 只从 1.1 减到 0.1，够不到 0，压根没触发点。
  //     量了个寂寞却看不出来，因为它照样恒过。
  {
    const meas = (guard) => {                       // guard(t)：这一帧要不要重新触发
      let t = 1.1, prev = 1.1, trig = 0;
      for (let i = 0; i < 90; i++){                 // 1.5 秒
        t = Math.max(0, t - 1/60);
        if (guard(t)) t = 1.1;
        if (t > prev + 1e-6) trig++;
        prev = t;
      }
      return trig;
    };
    const good = meas(t => t <= 0);
    const bad  = meas(t => t < 0.6);                // 冷却提前 0.5 秒
    ok(good === 1 && bad !== 1,
       '反查 d：冷却提前触发的替身会被「正好一次」判成 FAIL（所以这条不是恒过的）',
       '正常 ' + good + ' 次 / 提前触发 ' + bad + ' 次');
  }
  // (e) 惊吓尖峰的「按住很短」也一样会恒过：不衰减 hitT 的替身必须量出 1 秒。
  //     这正是这一版栽过的洞 —— 判据自己把 hitT 冻住，量的是洞不是尖峰。
  {
    const hitT = 0.70;                                 // ⚠️ 故意**不**减
    let sv = 1 - (1/60)/1.1, hv = 0;
    while (sv > 0.9 && hv < 1){
      hv += 1/60;
      if (hitT > 0.60) sv = 1;                         // 每帧都被重新顶回满值
      sv = Math.max(0, sv - (1/60)/1.1);
    }
    ok(hv > 0.9, '反查 e：hitT 不衰减的替身会被量出「按住 1 秒」（所以 hold < 0.25 不是恒过的）',
       '按住 ' + hv.toFixed(2) + ' s');
  }
}

/* ---- 输出 ---- */
const bad = L.filter(x => !x[0]);
let h = '<h3>' + (L.length - bad.length) + ' / ' + L.length + ' 通过</h3>';
if (bad.length){
  h += '<div style="color:#ff6b6b;margin:6px 0 10px">下面 ' + bad.length + ' 条没过：</div>';
  for (const [c, n, d] of bad) h += '<div class="bad">FAIL  ' + n + (d ? '   [' + d + ']' : '') + '</div>';
  h += '<hr>';
}
for (const [c, n, d] of L)
  h += '<div class="' + (c ? 'ok' : 'bad') + '">' + (c ? 'PASS  ' : 'FAIL  ') + n + (d ? '   [' + d + ']' : '') + '</div>';
document.getElementById('o').innerHTML = h;
document.title = (bad.length ? 'FAIL ' : 'PASS ') + (L.length - bad.length) + '/' + L.length;
</script></body></html>
