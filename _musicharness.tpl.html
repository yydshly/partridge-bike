<!DOCTYPE html><html><head><meta charset="utf-8"><title>music harness</title>
<style>body{background:#0b0e13;color:#e9eef6;font:13px/1.5 Consolas,monospace;padding:14px;white-space:pre}
.ok{color:#4ecdc4}.bad{color:#ff6b6b}</style></head><body><div id="o">running…</div>
<script>
/* ---- a Web Audio stub: same surface, no sound. Every voice below is the REAL
   one from the app, so a bad AudioParam or a negative time throws right here. ---- */
function P(v){ this.value = v; }
P.prototype.setValueAtTime       = function(){ return this; };
P.prototype.linearRampToValueAtTime = function(v,t){ if(!(v>=0)) throw new Error('linearRamp '+v); return this; };
P.prototype.exponentialRampToValueAtTime = function(v,t){ if(!(v>0)) throw new Error('exponentialRamp '+v); return this; };
P.prototype.setTargetAtTime      = function(v){ if(!(v>=0)) throw new Error('target '+v); return this; };
function Node(){ this.gain=new P(1); this.frequency=new P(440); this.detune=new P(0);
                 this.Q=new P(1); this.pan=new P(0); this.playbackRate=new P(1);
                 this.delayTime=new P(0); this.buffer=null; this.type='sine'; }
Node.prototype.connect = function(){ return arguments[0]; };
Node.prototype.start = function(t){ if(!(t>=0)) throw new Error('start '+t); };
Node.prototype.stop  = function(){};
const CTX = { currentTime:0,
  createGain:()=>new Node(), createOscillator:()=>new Node(), createBiquadFilter:()=>new Node(),
  createDelay:()=>new Node(), createStereoPanner:()=>new Node(), createBufferSource:()=>new Node() };

const AU = { ctx:CTX, ready:true, on:true, master:new Node(), noise:null,
             musicBus:new Node(), musicIn:new Node(), musicBpm:92, musicLevel:0.95,
             musicNight:false, musicNext:0, musicStep:0 };

/* ---- the real music code, verbatim ---- */
/*__MUSIC__*/

/* ---- record what the melody actually does ---- */
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const nm = m => NAMES[m%12] + (Math.floor(m/12)-1);
const rec = [];
const realVoice = voice;
voice = function(t, midi, dur, level, vFrom, vTo, vibCents, prev){
  rec.push({t:t, n:midi, d:dur, v:level, vf:vFrom, vt:vTo, vb:vibCents, hi: prev === null});
  return realVoice(t, midi, dur, level, vFrom, vTo, vibCents, prev);
};

let err = null, t = 0;
try{
  for (let i = 0; i < BARS*STEPS_PER_BAR*2; i++){ musicStep(t, i); t += (60/AU.musicBpm)*0.25; }
}catch(e){ err = e.message; }

const first = rec.filter(r => r.t < 60/AU.musicBpm*4*32);
const L = [];
L.push('总调度步数 : ' + BARS*STEPS_PER_BAR*2 + '  (' + BARS + ' 小节 x 2 遍)');
L.push('整曲时长   : ' + (BARS*4*(60/92)).toFixed(1) + ' 秒 / 遍');
L.push('人声音总数 : ' + first.length + ' （含晚霞低八度和声 ' + first.filter(r=>r.hi).length + '）');
L.push('异常       : ' + (err ? '<<< ' + err + ' >>>' : '无'));
L.push('');
L.push('  小节.拍   音高    时值(s)  力度   嘴形    揉弦   段落');
let perSec = [0,0,0,0], minM=999, maxM=0, vs = {};
first.forEach(r => {
  const beat = r.t/(60/92), bar = Math.floor(beat/4)+1, be = (beat%4)+1;
  const sec = secOf(bar-1); perSec[sec]++;
  minM = Math.min(minM, r.n); maxM = Math.max(maxM, r.n);
  vs[r.vf + '>' + r.vt] = (vs[r.vf + '>' + r.vt] || 0) + 1;
  L.push('  ' + String(bar).padStart(3) + '.' + be.toFixed(2).padStart(5) +
        '   ' + nm(r.n).padEnd(5) + r.n.toString().padStart(3) +
        '   ' + r.d.toFixed(2).padStart(5) + '  ' + r.v.toFixed(3) +
        '   ' + (r.vf + '>' + r.vt).padEnd(7) + r.vb.toFixed(0).padStart(2) + '音分  ' +
        ['启程','旅途','晚霞','远行'][sec] + (r.hi ? ' +8va' : ''));
});
L.push('');
L.push('各段人声音数 : 启程 ' + perSec[0] + ' / 旅途 ' + perSec[1] + ' / 晚霞 ' + perSec[2] + ' / 远行 ' + perSec[3]);
L.push('人声音域     : ' + nm(minM) + ' .. ' + nm(maxM) + '   (爬升 ' + (maxM-minM) + ' 个半音)');
L.push('嘴形分布     : ' + Object.keys(vs).map(k => k + '×' + vs[k]).join('  '));
document.getElementById('o').textContent = L.join('\n');
</script></body></html>
